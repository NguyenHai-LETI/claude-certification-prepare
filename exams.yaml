      D3: { name: "Claude Code", weight: 3.1 }
      D4: { name: "Eval, Testing, and Debugging", weight: 2.6 }
      D5: { name: "Model Selection and Optimization", weight: 16.8 }
      D6: { name: "Prompt and Context Engineering", weight: 11.0 }
      D7: { name: "Security and Safety", weight: 8.1 }
      D8: { name: "Tools and MCPs", weight: 10.6 }
  CCAO-F:
    name: "Claude Certified Associate – Foundations"
    short: "Associate – Foundations"
    questions: 60
    minutes: 120
    pass: 720
    domains:
      D1: { name: "Prompting and Task Execution", weight: 14 }
      D2: { name: "Output Evaluation and Validation", weight: 21 }
      D3: { name: "Product and Model Selection", weight: 12 }
      D4: { name: "Workflow Integration and Solution Design", weight: 16 }
      D5: { name: "Configuration and Knowledge Management", weight: 12 }
      D6: { name: "Governance, Risk, and Responsible Use", weight: 15 }
