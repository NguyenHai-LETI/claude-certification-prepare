# Bốn kỳ thi chứng chỉ Claude (Anthropic, Claude Partner Network, thi qua Pearson VUE).
# Theo Exam Guide v1.0 (bản áp dụng tới khi đề đổi ngày 07/12/2026). Kiểm lại với PDF chính thức: notes/exams/<CODE>.md.
# questions = số câu đề thật; minutes = thời gian làm bài; pass = điểm đạt trên thang 100–1000.
# domains: id → tên (tiếng Anh như đề) + weight (% số câu). Mỗi câu trong bank gắn `exams: {CODE: Dn}`.
version: "v1.0"
exams:
  CCAR-F:
    name: "Claude Certified Architect – Foundations"
    short: "Architect – Foundations"
    questions: 60
    minutes: 120
    pass: 720
    domains:
      D1: { name: "Agentic Architecture & Orchestration", weight: 27 }
      D2: { name: "Tool Design & MCP Integration", weight: 18 }
      D3: { name: "Claude Code Configuration & Workflows", weight: 20 }
      D4: { name: "Prompt Engineering & Structured Output", weight: 20 }
      D5: { name: "Context Management & Reliability", weight: 15 }
    # Đề thật bốc ngẫu nhiên `scenario_pick` tình huống; câu gắn tình huống bằng trường `scenario`.
    scenario_pick: 4
    scenarios:
      S1: "Customer Support Resolution Agent"
      S2: "Code Generation with Claude Code"
      S3: "Multi-Agent Research System"
      S4: "Developer Productivity with Claude"
      S5: "Claude Code for Continuous Integration"
      S6: "Structured Data Extraction"
  CCDV-F:
    name: "Claude Certified Developer – Foundations"
    short: "Developer – Foundations"
