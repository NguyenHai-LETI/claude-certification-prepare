    reviewed: 2026-11-18

  # ── CCAO-F (3 câu, guide §8) ──────────────────────────────────────────────
  - id: OF-CCAOF-01
    exams: { CCAO-F: D2 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542847%2FClaude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "An associate asks Claude to summarize a new regulation, and Claude produces a confident summary citing a specific subsection number. Before sending the summary to the compliance team, what is the most appropriate action?"
    options:
      - "Send it as-is, since Claude expressed high confidence."
      - "Verify the cited subsection against the official regulation text before sharing."
      - "Ask Claude to rate its own confidence and send it if the rating is high."
      - "Reword the summary to sound more formal, then send it."
    answer: [B]
    explanation: |-
      **Đúng: đối chiếu số điều khoản được trích với văn bản quy định chính thức trước khi chia sẻ.** Model có thể bịa chi tiết trông rất cụ thể như số điều khoản (hallucination); Anthropic khuyên luôn kiểm chứng thông tin quan trọng, nhất là cho quyết định có hệ quả lớn. Bản tóm tắt gửi đội compliance cần trích dẫn khớp nguồn gốc.
      - **Gửi nguyên văn vì Claude tỏ ra rất tự tin:** giọng tự tin không phải bằng chứng đúng; nội dung bịa thường nghe rất chắc chắn.
      - **Nhờ Claude tự chấm độ tự tin, cao thì gửi:** điểm do model tự chấm không đối chiếu gì với nguồn gốc, nên không phải tín hiệu chính xác đáng tin.
      - **Viết lại cho trang trọng rồi gửi:** chỉ đổi hình thức, không kiểm tra tính đúng của trích dẫn.
      Nguồn: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
    ref: exams/CCAO-F.md#d2--output-evaluation-and-validation-21
    tags: [hallucination, verification]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCAOF-02
    exams: { CCAO-F: D3 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542847%2FClaude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "An associate needs to generate a high volume of short customer-reply drafts where speed and cost matter more than deep reasoning. Which choice best fits the task?"
    options:
      - "Use the most capable, highest-cost model for every reply to maximize quality."
      - "Use a faster, lower-cost model suited to straightforward, high-volume tasks."
      - "Disable all product features to reduce cost."
      - "Switch to a different AI platform."
    answer: [B]
    explanation: |-
      **Đúng: dùng model nhanh hơn, chi phí thấp hơn, hợp với việc đơn giản khối lượng lớn.** Chọn model theo yêu cầu việc: nhiều bản nháp ngắn, ưu tiên tốc độ và chi phí → model nhanh, rẻ (vd. Haiku, được Anthropic mô tả là dành cho tác vụ khối lượng lớn, nhạy độ trễ); để model mạnh hơn cho suy luận phức tạp.
      - **Dùng model mạnh nhất, đắt nhất cho mọi thư trả lời:** lãng phí chi phí và độ trễ cho việc không cần suy luận sâu — ngược với ưu tiên đề bài nêu.
      - **Tắt hết tính năng sản phẩm để giảm chi phí:** không liên quan tới việc chọn model phù hợp, lại có thể mất chức năng cần dùng.
      - **Chuyển sang nền tảng AI khác:** không giải quyết tradeoff chất lượng – tốc độ – chi phí; chính dòng model Claude đã có lựa chọn phù hợp.
      Nguồn: https://platform.claude.com/docs/en/about-claude/models/overview
    ref: exams/CCAO-F.md#d3--product-and-model-selection-12
    tags: [model-selection]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCAOF-03
    exams: { CCAO-F: D6 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542847%2FClaude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "A project manager wants to upload a spreadsheet containing customer names and account numbers so Claude can analyze trends. Organizational policy restricts sharing regulated personal data. What is the most appropriate action?"
    options:
      - "Upload the file as-is, since the analysis is internal."
      - "Remove or anonymize the personal identifiers before uploading, consistent with policy."
      - "Upload the file but instruct Claude not to retain it."
      - "Skip the analysis entirely."
    answer: [B]
    explanation: |-
      **Đúng: xoá hoặc ẩn danh các định danh cá nhân trước khi tải lên, đúng theo chính sách.** Chính sách hạn chế chia sẻ dữ liệu cá nhân bị quản lý; phân tích xu hướng không cần tên hay số tài khoản, nên loại bỏ/ẩn danh *trước khi* tải lên vừa tuân thủ vừa giữ được giá trị phân tích.
      - **Tải nguyên file vì phân tích chỉ dùng nội bộ:** "dùng nội bộ" không miễn trừ chính sách; tải lên là đã chia sẻ dữ liệu bị hạn chế.
      - **Tải lên nhưng dặn Claude đừng lưu:** lời dặn model không phải biện pháp kiểm soát thoả chính sách — dữ liệu đã bị chia sẻ ngay lúc tải lên, và lời dặn không thay đổi cách hệ thống lưu trữ dữ liệu.
      - **Bỏ hẳn việc phân tích:** không cần thiết khi ẩn danh hoá cho phép làm tiếp một cách an toàn.
    ref: exams/CCAO-F.md#d6--governance-risk-and-responsible-use-15
