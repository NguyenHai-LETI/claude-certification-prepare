questions:
  # ── CCAR-F (12 câu, guide §9) ─────────────────────────────────────────────
  - id: OF-CCARF-01
    exams: { CCAR-F: D1 }
    scenario: S1
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "Production data shows that in 12% of cases, your agent skips get_customer entirely and calls lookup_order using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds. What change would most effectively address this reliability issue?"
    options:
      - "Add a programmatic prerequisite that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID."
      - "Enhance the system prompt to state that customer verification via get_customer is mandatory before any order operations."
      - "Add few-shot examples showing the agent always calling get_customer first, even when customers volunteer order details."
      - "Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type."
    answer: [A]
    explanation: |-
      **Đúng: thêm điều kiện tiên quyết bằng code, chặn `lookup_order` và `process_refund` cho tới khi `get_customer` trả về customer ID đã xác minh.** Thứ tự gọi tool ở đây là logic nghiệp vụ có hậu quả tài chính (hoàn tiền nhầm tài khoản). Khi một trình tự là *bắt buộc*, cần chặn bằng code (prerequisite gate, vd. hook `PreToolUse` trả `deny`) thay vì trông vào việc model tự tuân thủ — đó là bảo đảm tất định. Tài liệu Claude Code cũng khuyên: quy tắc phải đúng *mọi lần* thì đưa vào hook, vì chỉ dẫn dạng văn bản chỉ là context, không phải cấu hình được cưỡng chế.
      - **Ghi vào system prompt rằng xác minh qua `get_customer` là bắt buộc:** vẫn chỉ là tuân thủ xác suất; 12% ca bỏ qua hiện nay cho thấy chỉ dẫn bằng lời có tỉ lệ thất bại khác 0.
      - **Thêm few-shot luôn gọi `get_customer` trước:** cũng chỉ tăng xác suất làm đúng, không bảo đảm; không đủ khi sai sót gây mất tiền.
      - **Classifier định tuyến chỉ bật tập tool phù hợp:** quyết định *tool nào có mặt*, không quyết định *thứ tự gọi*; tra đơn và hoàn tiền vẫn phải có mặt nên agent vẫn có thể bỏ qua bước xác minh.
      Nguồn: https://code.claude.com/docs/en/agent-sdk/hooks · https://code.claude.com/docs/en/skills
    ref: exams/CCAR-F.md#14-workflow-nhiều-bước-enforcement-và-handoff
    tags: [prerequisite-gate, hooks, enforcement]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-02
    exams: { CCAR-F: D2 }
    scenario: S1
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "Production logs show the agent frequently calls get_customer when users ask about orders (e.g., \"check my order #12345\"), instead of calling lookup_order. Both tools have minimal descriptions (\"Retrieves customer information\" / \"Retrieves order details\") and accept similar identifier formats. What's the most effective first step to improve tool selection reliability?"
    options:
      - "Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5-8 examples showing order-related queries routing to lookup_order."
      - "Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools."
      - "Implement a routing layer that parses user input before each turn and pre-selects the appropriate tool based on detected keywords and identifier patterns."
      - "Consolidate both tools into a single lookup_entity tool that accepts any identifier and internally determines which backend to query."
    answer: [B]
    explanation: |-
      **Đúng: viết lại mô tả của từng tool (định dạng input, ví dụ truy vấn, edge case, ranh giới khi nào dùng tool này thay vì tool kia).** Model chọn tool dựa vào mô tả; tài liệu Anthropic gọi mô tả thật chi tiết là yếu tố quan trọng nhất với hiệu năng tool, cần nêu tool làm gì, khi nào nên và không nên dùng, và khuyên ít nhất 3–4 câu mỗi mô tả. Hai mô tả một dòng với input giống nhau không cho model căn cứ phân biệt → sửa mô tả là sửa đúng nguyên nhân gốc với công sức nhỏ, đúng nghĩa "bước đầu tiên".
      - **Thêm 5–8 few-shot định tuyến câu hỏi về đơn hàng sang `lookup_order`:** tốn thêm token mỗi request mà không sửa gốc (mô tả tool vẫn sơ sài), và chỉ phủ những mẫu đã đưa.
      - **Lớp routing phân tích keyword và định dạng ID để chọn sẵn tool:** over-engineering, thêm hạ tầng phải bảo trì và bỏ qua khả năng hiểu ngôn ngữ của model; định dạng ID lại giống nhau nên luật keyword dễ sai.
      - **Gộp thành một tool `lookup_entity` tự quyết backend:** là lựa chọn kiến trúc hợp lệ (tài liệu có khuyên gộp các thao tác liên quan) nhưng tốn công thiết kế lại hơn mức cần cho bước đầu, khi vấn đề trước mắt chỉ là mô tả kém.
      Nguồn: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools
    ref: exams/CCAR-F.md#21-thiết-kế-tool-interface
    tags: [tool-description, tool-selection]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-03
    exams: { CCAR-F: D5 }
    scenario: S1
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions. What's the most effective way to improve escalation calibration?"
    options:
      - "Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously."
      - "Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold."
      - "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing."
      - "Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold."
    answer: [A]
    explanation: |-
      **Đúng: đưa tiêu chí escalate tường minh vào system prompt, kèm few-shot minh hoạ khi nào escalate, khi nào tự giải quyết.** Agent escalate ca dễ (thay hàng hỏng có ảnh làm bằng chứng) nhưng lại tự xử ca cần ngoại lệ chính sách → nguyên nhân gốc là ranh giới quyết định chưa rõ. Tiêu chí tường minh cộng ví dụ ngay tại ranh giới là phản ứng đầu tiên tương xứng, rẻ, trước khi thêm hạ tầng.
      - **Agent tự báo điểm tự tin 1–10 rồi chuyển người khi dưới ngưỡng:** điểm tự tin do LLM tự chấm hiệu chỉnh kém — agent hiện đã tự tin sai ở chính các ca khó.
      - **Classifier riêng huấn luyện trên ticket cũ để dự đoán ca cần escalate:** cần dữ liệu gán nhãn và hạ tầng ML, quá tay khi chưa thử sửa prompt.
      - **Phân tích cảm xúc, escalate khi khách bực vượt ngưỡng:** giải bài toán khác; mức bực bội của khách không phản ánh độ phức tạp của ca hay việc có cần ngoại lệ chính sách.
    ref: exams/CCAR-F.md#52-escalation-và-xử-lý-mơ-hồ
    tags: [escalation, few-shot]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-04
    exams: { CCAR-F: D3 }
    scenario: S2
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "You want to create a custom /review slash command that runs your team's standard code review checklist. This command should be available to every developer when they clone or pull the repository. Where should you create this command file?"
    options:
      - "In the .claude/commands/ directory in the project repository"
      - "In ~/.claude/commands/ in each developer's home directory"
      - "In the CLAUDE.md file at the project root"
      - "In a .claude/config.json file with a commands array"
    answer: [A]
    explanation: |-
      **Đúng: tạo file trong thư mục `.claude/commands/` của repo.** Command cấp project nằm trong repo nên được version control; ai clone/pull cũng có. (Claude Code hiện gộp custom command vào skill: dạng mới là `.claude/skills/<tên>/SKILL.md`, còn file trong `.claude/commands/` là định dạng cũ vẫn hoạt động — cả hai đều chia sẻ cho team bằng cách commit vào repo.)
      - **`~/.claude/commands/` trong home của từng developer:** đó là phạm vi **cá nhân**, chỉ có trên máy người đó và không đi theo git; bắt từng người tự chép là không đạt yêu cầu.
      - **Viết vào CLAUDE.md ở gốc project:** CLAUDE.md chứa chỉ dẫn và context dự án được nạp mỗi phiên, không phải nơi định nghĩa slash command.
      - **File `.claude/config.json` với mảng `commands`:** Claude Code không có cơ chế này — phương án bịa.
      Nguồn: https://code.claude.com/docs/en/slash-commands
    ref: exams/CCAR-F.md#32-custom-slash-command-và-skill
    tags: [slash-commands, scope]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-05
    exams: { CCAR-F: D3 }
    scenario: S2
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "You've been assigned to restructure the team's monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies. Which approach should you take?"
    options:
      - "Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes."
      - "Start with direct execution and make changes incrementally, letting the implementation reveal the natural service boundaries."
      - "Use direct execution with comprehensive upfront instructions detailing exactly how each service should be structured."
      - "Begin in direct execution mode and only switch to plan mode if you encounter unexpected complexity during implementation."
    answer: [A]
    explanation: |-
      **Đúng: vào plan mode để khám phá codebase, hiểu phụ thuộc và thiết kế cách làm trước khi sửa.** Tách monolith thành microservice đụng hàng chục file và cần quyết định kiến trúc (ranh giới service, phụ thuộc module) — đúng loại việc nên lên kế hoạch trước. Ở plan mode, Claude đọc file và đề xuất kế hoạch nhưng không sửa gì cho tới khi bạn duyệt.
      - **Thực thi trực tiếp, sửa dần để code tự lộ ranh giới service:** phát hiện phụ thuộc muộn dễ phải làm lại tốn kém trên hàng chục file.
      - **Thực thi trực tiếp kèm chỉ dẫn chi tiết từ đầu cho từng service:** giả định đã biết cấu trúc đúng trong khi chưa khám phá code và phụ thuộc thực tế.
      - **Bắt đầu thực thi trực tiếp, chỉ chuyển plan mode khi gặp phức tạp bất ngờ:** độ phức tạp đã được nêu sẵn trong yêu cầu, không phải thứ "có thể xuất hiện" về sau.
      Nguồn: https://code.claude.com/docs/en/common-workflows
    ref: exams/CCAR-F.md#34-plan-mode-vs-direct-execution
    tags: [plan-mode]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-06
    exams: { CCAR-F: D3 }
    scenario: S2
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "Your codebase has distinct areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow a repository pattern. Test files are spread throughout the codebase alongside the code they test (e.g., Button.test.tsx next to Button.tsx), and you want all tests to follow the same conventions regardless of location. What's the most maintainable way to ensure Claude automatically applies the correct conventions when generating code?"
    options:
      - "Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths"
      - "Consolidate all conventions in the root CLAUDE.md file under headers for each area, relying on Claude to infer which section applies"
      - "Create skills in .claude/skills/ for each code type that include the relevant conventions in their SKILL.md files"
      - "Place a separate CLAUDE.md file in each subdirectory containing that area's specific conventions"
    answer: [A]
    explanation: |-
      **Đúng: tạo file rule trong `.claude/rules/` có frontmatter YAML chứa glob để áp quy ước theo đường dẫn file.** Rule có trường `paths` (vd. `**/*.test.tsx`) chỉ được nạp khi Claude làm việc với file khớp mẫu, bất kể file nằm ở thư mục nào — đúng nhu cầu khi file test nằm rải khắp codebase; mỗi khu vực (component, API handler, model) có rule riêng, dễ bảo trì.
      - **Dồn mọi quy ước vào CLAUDE.md gốc theo từng mục, để Claude tự suy ra mục nào áp dụng:** dựa vào suy luận chứ không khớp tường minh; mọi quy ước luôn nằm trong context gây nhiễu, kém tin cậy.
      - **Tạo skill trong `.claude/skills/` cho từng loại code:** skill dành cho quy trình/tác vụ; mặc định chỉ phần mô tả được nạp, nội dung đầy đủ chỉ vào context khi skill được gọi, nên việc áp quy ước phụ thuộc vào việc skill có được kích hoạt — không phải cơ chế quy ước tự động, nhất quán theo đường dẫn như rule.
      - **Đặt CLAUDE.md riêng ở từng thư mục con:** CLAUDE.md gắn với thư mục, không diễn đạt được "mọi file test ở bất kỳ đâu"; phải chép quy ước test vào rất nhiều thư mục.
      Nguồn: https://code.claude.com/docs/en/memory · https://code.claude.com/docs/en/skills
    ref: exams/CCAR-F.md#33-rule-theo-đường-dẫn
    tags: [claude-rules, path-scoping]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-07
    exams: { CCAR-F: D1 }
    scenario: S3
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "After running the system on the topic \"impact of AI on creative industries,\" you observe that each subagent completes successfully: the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator's logs, you see it decomposed the topic into three subtasks: \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\" What is the most likely root cause?"
    options:
      - "The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents."
      - "The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic."
      - "The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors."
      - "The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria."
    answer: [B]
    explanation: |-
      **Đúng: coordinator phân rã chủ đề quá hẹp, nên các phần việc giao cho subagent không phủ hết các mảng của chủ đề.** Log của coordinator cho thấy thẳng nguyên nhân: "creative industries" bị chia chỉ thành ba mảng thị giác (digital art, graphic design, photography), bỏ hẳn âm nhạc, viết, điện ảnh. Các subagent làm đúng phần được giao — sai nằm ở *cái được giao*.
      - **Synthesis agent thiếu chỉ dẫn phát hiện lỗ hổng phạm vi:** synthesis chỉ tổng hợp những gì nhận được; đổ lỗi cho tầng hạ nguồn đang làm đúng phạm vi.
      - **Truy vấn của web search agent chưa đủ rộng:** web search tìm đúng theo subtopic được giao; mở rộng truy vấn của nó không bù được subtopic bị thiếu.
      - **Document analysis agent lọc bỏ nguồn ngoài mảng thị giác do tiêu chí quá chặt:** không có dấu hiệu bộ lọc nào; nguồn về âm nhạc, viết, điện ảnh chưa từng được yêu cầu.
    ref: exams/CCAR-F.md#12-multi-agent-coordinatorsubagent
    tags: [coordinator, decomposition]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-08
    exams: { CCAR-F: D5 }
    scenario: S3
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent. Which error propagation approach best enables intelligent recovery?"
    options:
      - "Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches."
      - "Implement automatic retry logic with exponential backoff within the subagent, returning a generic \"search unavailable\" status only after all retries are exhausted."
      - "Catch the timeout within the subagent and return an empty result set marked as successful."
      - "Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow."
    answer: [A]
    explanation: |-
      **Đúng: trả về coordinator ngữ cảnh lỗi có cấu trúc gồm loại lỗi, truy vấn đã thử, kết quả một phần và hướng thay thế.** Với đủ thông tin đó, coordinator chọn được cách phục hồi: thử lại với truy vấn khác, đi đường khác, hay tiếp tục với kết quả một phần và ghi chú chỗ thiếu.
      - **Tự retry với exponential backoff trong subagent, hết lượt mới trả trạng thái chung "search unavailable":** retry cục bộ có thể hữu ích, nhưng thông báo chung chung che mất thông tin coordinator cần để phục hồi thông minh.
      - **Bắt timeout rồi trả tập kết quả rỗng đánh dấu thành công:** nuốt lỗi, báo thất bại là thành công → không thể phục hồi và báo cáo thiếu mà không ai biết.
      - **Đẩy exception lên handler cấp cao nhất để dừng toàn bộ workflow:** dừng cả quy trình vì một lỗi là không cần thiết khi còn cách phục hồi.
    ref: exams/CCAR-F.md#53-lan-truyền-lỗi-trong-hệ-multi-agent
    tags: [error-propagation, multi-agent]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-09
    exams: { CCAR-F: D2 }
    scenario: S3
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation. What's the most effective approach to reduce overhead while maintaining system reliability?"
    options:
      - "Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator."
      - "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once."
      - "Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator."
      - "Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify."
    answer: [A]
    explanation: |-
      **Đúng: cho synthesis agent một tool `verify_fact` phạm vi hẹp cho tra cứu đơn giản, còn kiểm chứng phức tạp vẫn chuyển qua coordinator tới web search agent.** Least privilege: tool hẹp đủ cho 85% ca kiểm tra đơn giản (ngày, tên, số liệu), 15% ca cần điều tra sâu vẫn đi đường cũ → bớt vòng lặp mà giữ được kiến trúc phối hợp và độ tin cậy.
      - **Gom mọi nhu cầu kiểm chứng, trả một lô cho coordinator ở cuối lượt:** tạo phụ thuộc chặn — các bước tổng hợp sau có thể cần fact đã kiểm ở bước trước; vòng lặp qua coordinator vẫn còn.
      - **Cấp cho synthesis agent toàn bộ tool web search:** cấp thừa quyền, phá phân tách trách nhiệm; agent có tool ngoài chuyên môn dễ dùng sai và khó chọn đúng tool.
      - **Web search agent chủ động cache thêm ngữ cảnh quanh mỗi nguồn:** không thể biết trước synthesis sẽ cần kiểm gì; tốn thêm mà vẫn bỏ sót.
    ref: exams/CCAR-F.md#23-phân-bổ-tool-và-tool_choice
    tags: [scoped-tools, least-privilege]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-10
    exams: { CCAR-F: D3 }
    scenario: S5
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "Your pipeline script runs claude \"Analyze this pull request for security issues\" but the job hangs indefinitely. Logs indicate Claude Code is waiting for interactive input. What's the correct approach to run Claude Code in an automated pipeline?"
    options:
      - "Add the -p flag: claude -p \"Analyze this pull request for security issues\""
      - "Set the environment variable CLAUDE_HEADLESS=true before running the command"
      - "Redirect stdin from /dev/null: claude \"Analyze this pull request for security issues\" < /dev/null"
      - "Add the --batch flag: claude --batch \"Analyze this pull request for security issues\""
    answer: [A]
    explanation: |-
      **Đúng: thêm cờ `-p`, tức `claude -p "Analyze this pull request for security issues"`.** `-p` (`--print`) là cách được tài liệu hoá để chạy Claude Code không tương tác: in phản hồi rồi thoát, không chờ người dùng nhập — đúng thứ pipeline CI/CD cần. Lệnh `claude "query"` không có `-p` thì mở phiên tương tác với prompt ban đầu, nên job bị treo.
      - **Đặt biến môi trường `CLAUDE_HEADLESS=true`:** tài liệu Claude Code không có biến này; chế độ không tương tác bật bằng `-p`.
      - **Chuyển stdin về `/dev/null`:** mẹo shell, không phải cách chạy không tương tác của Claude Code; lệnh vẫn là dạng mở phiên tương tác.
      - **Thêm cờ `--batch`:** CLI không có cờ này (đừng nhầm với Message Batches API).
      Nguồn: https://code.claude.com/docs/en/cli-reference
    ref: exams/CCAR-F.md#36-claude-code-trong-cicd
    tags: [ci-cd, headless, cli]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-11
    exams: { CCAR-F: D4 }
    scenario: S5
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?"
    options:
      - "Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks."
      - "Switch both workflows to batch processing with status polling to check for completion."
      - "Keep real-time calls for both workflows to avoid batch result ordering issues."
      - "Switch both to batch processing with a timeout fallback to real-time if batches take too long."
    answer: [A]
    explanation: |-
      **Đúng: chỉ dùng batch cho báo cáo nợ kỹ thuật; giữ gọi realtime cho pre-merge check.** Message Batches API giảm 50% chi phí; phần lớn batch xong dưới 1 giờ nhưng có thể mất tới 24 giờ (và hết hạn nếu chưa xong) — tức không có cam kết độ trễ. Không hợp với pre-merge check (developer đang chờ để merge), rất hợp với báo cáo chạy qua đêm.
      - **Chuyển cả hai sang batch, polling trạng thái:** polling không làm batch nhanh hơn; trông vào việc "thường xong sớm" là không chấp nhận được cho luồng đang chặn developer.
      - **Giữ realtime cho cả hai để tránh lỗi thứ tự kết quả batch:** dựa trên hiểu lầm — kết quả batch có thể về không theo thứ tự nhưng ghép lại được bằng `custom_id`; lại bỏ lỡ khoản tiết kiệm cho báo cáo qua đêm.
      - **Chuyển cả hai sang batch, quá lâu thì fallback sang realtime:** thêm độ phức tạp và vẫn bắt developer chờ tới ngưỡng timeout; giải pháp đơn giản là dùng đúng API cho đúng loại việc.
      Nguồn: https://platform.claude.com/docs/en/build-with-claude/batch-processing
    ref: exams/CCAR-F.md#45-batch-processing
    tags: [batch, latency, cost]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARF-12
    exams: { CCAR-F: D4 }
    scenario: S5
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback—flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?"
    options:
      - "Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow."
      - "Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs."
      - "Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass."
      - "Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs."
    answer: [A]
    explanation: |-
      **Đúng: tách thành các lượt tập trung — review từng file để bắt lỗi cục bộ, rồi một lượt riêng tập trung vào luồng dữ liệu xuyên file.** Nguyên nhân gốc là chú ý bị loãng (attention dilution) khi xử lý 14 file cùng lúc: chỗ kỹ chỗ sơ sài, nhận xét mâu thuẫn. Review từng file cho độ sâu đồng đều; lượt tích hợp bắt lỗi giữa các file.
      - **Bắt developer chia PR thành các phần 3–4 file:** đẩy gánh nặng sang developer mà không cải thiện hệ thống review.
      - **Đổi sang model cao cấp có context window lớn hơn:** vấn đề là chất lượng chú ý trên khối lượng lớn, không phải thiếu chỗ chứa; context lớn hơn không làm review đồng đều hơn.
      - **Chạy ba lượt độc lập, chỉ báo lỗi xuất hiện ở ít nhất hai lượt:** đòi đồng thuận sẽ giấu bug thật chỉ thỉnh thoảng mới được phát hiện, và không sửa tận gốc nhận xét mâu thuẫn.
    ref: exams/CCAR-F.md#46-review-nhiều-instance-nhiều-lượt
    tags: [multi-pass-review, attention-dilution]
    created: 2026-11-18
    reviewed: 2026-11-18

  # ── CCDV-F (3 câu, guide §8) ──────────────────────────────────────────────
  - id: OF-CCDVF-01
    exams: { CCDV-F: D2 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542875%2FClaude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "A developer must process 10,000 documents overnight to produce a non-urgent analytics report. Cost is the primary concern, and results are not needed until the following morning. Which approach best fits the requirement?"
    options:
      - "Send every request synchronously through the Messages API in parallel to finish as quickly as possible."
      - "Use the Message Batches API, which processes large asynchronous workloads within a 24-hour window at reduced cost."
      - "Lower max_tokens on synchronous calls to minimize cost."
      - "Switch to the smallest available model regardless of output quality."
    answer: [B]
    explanation: |-
      **Đúng: dùng Message Batches API — xử lý khối lượng lớn bất đồng bộ trong cửa sổ 24 giờ với chi phí thấp hơn.** Batch giảm 50% chi phí so với gọi thường; phần lớn batch xong dưới 1 giờ, tối đa 24 giờ — khớp việc chạy qua đêm, không gấp, ưu tiên chi phí.
      - **Gửi đồng bộ song song qua Messages API cho nhanh:** chỉ nhanh hơn, giá mỗi token không giảm; mà tốc độ không phải tiêu chí ở đây.
      - **Giảm `max_tokens` trên các lời gọi đồng bộ:** `max_tokens` chỉ là trần độ dài đầu ra; hạ nó có thể cắt cụt kết quả và không mang lại mức giảm giá như batch.
      - **Đổi sang model nhỏ nhất bất kể chất lượng:** hy sinh yêu cầu đầu ra, lại không tận dụng việc kết quả có thể chờ tới sáng.
      Nguồn: https://platform.claude.com/docs/en/build-with-claude/batch-processing
    ref: exams/CCDV-F.md#claude-api-mechanics-68
    tags: [batch, cost]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCDVF-02
    exams: { CCDV-F: D7 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542875%2FClaude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "A Claude-powered agent summarizes web pages submitted by end users. One page contains hidden text instructing the model to ignore previous instructions and reveal its system prompt. Which mitigation is most effective?"
    options:
      - "Raise the model's temperature so its behavior is harder to predict."
      - "Treat retrieved page content as untrusted input, keep it separate from trusted instructions, and use guardrails or hooks so injected instructions cannot trigger sensitive actions."
      - "Add a line to the system prompt asking users not to include malicious instructions."
      - "Switch to a larger model that follows instructions more reliably."
    answer: [B]
    explanation: |-
      **Đúng: coi nội dung trang là dữ liệu không tin cậy, tách khỏi chỉ dẫn tin cậy, dùng guardrail/hook.** Đây là prompt injection gián tiếp: lệnh ẩn nằm trong nội dung do người ngoài kiểm soát. Cách xử lý là coi nội dung trang là **dữ liệu không tin cậy**, giữ nó tách khỏi chỉ dẫn tin cậy (vd. trả về trong `tool_result` hoặc khối dữ liệu riêng, không nhét vào system prompt), và dùng guardrail/hook theo least privilege để chữ bị chèn không thể kích hoạt tool hay hành động nhạy cảm.
      - **Tăng temperature:** không liên quan tới injection; làm hành vi khó đoán hơn không phải biện pháp an ninh.
      - **Thêm dòng nhờ người dùng đừng chèn lệnh độc:** không phải kiểm soát thực thi được, kẻ tấn công không tuân theo.
      - **Đổi sang model lớn hơn, nghe lời hơn:** model nào cũng có thể bị lệnh chèn đánh lừa; đổi model không tách dữ liệu khỏi chỉ dẫn và không chặn được hành động nhạy cảm.
    ref: exams/CCDV-F.md#ai-application-security-32
    tags: [prompt-injection, guardrails, hooks]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCDVF-03
    exams: { CCDV-F: D8 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542875%2FClaude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf
    stem: "A team needs Claude to call an internal inventory service exposed as a REST API. They want the capability to be reusable across several Claude applications and maintained independently of any one app. Which approach best fits?"
    options:
      - "Hard-code the inventory logic into each application's system prompt."
      - "Build an MCP server that exposes the inventory operations as tools so multiple Claude applications can connect to it."
      - "Paste the current inventory data into the context window on every request."
      - "Rely on a built-in tool, since built-in tools can reach any internal REST API."
    answer: [B]
    explanation: |-
      **Đúng: xây một MCP server phơi các thao tác kho hàng thành tool để nhiều ứng dụng Claude cùng kết nối.** MCP là chuẩn mở để kết nối ứng dụng AI với hệ thống bên ngoài ("build once and integrate everywhere"): server bọc REST API nội bộ, được bảo trì độc lập, và mọi ứng dụng hỗ trợ MCP đều dùng lại được — khớp hai yêu cầu "tái dùng" và "bảo trì riêng".
      - **Hard-code logic kho hàng vào system prompt của từng app:** prompt không tự gọi được API; lặp lại ở từng app, không tái dùng, khó bảo trì.
      - **Dán dữ liệu kho hiện tại vào context mỗi request:** không truy cập dữ liệu sống, không thực hiện được thao tác, lại tốn context.
      - **Dựa vào built-in tool vì chúng với tới mọi REST API nội bộ:** tiền đề sai — tool do Anthropic cung cấp là một bộ cố định (vd. server tool như web search, web fetch chạy trên hạ tầng Anthropic); muốn gọi dịch vụ nội bộ phải tự định nghĩa tool hoặc dựng MCP server.
      Nguồn: https://modelcontextprotocol.io/docs/getting-started/intro · https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
    ref: exams/CCDV-F.md#agentic-customization-41
    tags: [mcp, reuse]
