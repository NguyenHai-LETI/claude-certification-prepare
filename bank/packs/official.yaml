  # ── CCAR-P (3 câu, guide §8) ──────────────────────────────────────────────
  - id: OF-CCARP-01
    exams: { CCAR-P: D3 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542810%2FClaude+Certified+Architect+%E2%80%93+Professional+Exam+Guide.pdf
    stem: "A team exposes a customer-support agent that can read tickets, draft replies, issue refunds, and delete user accounts. Support staff only ever need to read tickets and draft replies. Applying least-privilege principles, which change best reduces risk?"
    options:
      - "Add logging to the refund and delete tools so misuse can be audited later."
      - "Remove the refund and delete tools from the agent's configuration entirely."
      - "Keep all tools but add a confirmation prompt before refunds and deletions."
      - "Replace the agent with a larger model that follows instructions more reliably."
    answer: [B]
    explanation: |-
      **Đúng: gỡ hẳn tool refund và delete khỏi cấu hình agent.** Least privilege = gỡ hẳn năng lực vai trò không cần. Nhân viên chỉ đọc ticket và soạn trả lời → bỏ hai tool này để **xoá luôn bề mặt tấn công** thay vì canh chừng nó (đây cũng là ca "capability bloat" của D3).
      - **Thêm logging cho tool refund/delete:** là kiểm soát phát hiện sau sự việc, không gỡ quyền thừa.
      - **Giữ mọi tool nhưng thêm bước xác nhận:** là kiểm soát bù trừ; quyền nguy hiểm vẫn còn đó.
      - **Thay bằng model lớn hơn:** kích cỡ model không liên quan tới phạm vi quyền.
    ref: exams/CCAR-P.md#d3--integration-19
    tags: [least-privilege, capability-bloat]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARP-02
    exams: { CCAR-P: D2 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542810%2FClaude+Certified+Architect+%E2%80%93+Professional+Exam+Guide.pdf
    stem: "An application sends the same 8,000-token system prompt and policy document on every request, followed by a short, varying user message. Latency and cost are both concerns. Which optimization most directly addresses both?"
    options:
      - "Truncate the policy document to the first 1,000 tokens."
      - "Switch to the smallest available model regardless of task fit."
      - "Place the static system prompt and policy before the dynamic content and enable prompt caching."
      - "Move the policy document into a few-shot example block."
    answer: [C]
    explanation: |-
      **Đúng: đặt system prompt và policy tĩnh trước phần động rồi bật prompt caching.** Cache được dựng theo tiền tố (`tools` → `system` → `messages`), nên phần lặp lại đứng đầu được tái dùng: giảm time-to-first-token với prompt dài, và token đọc từ cache chỉ tính một phần nhỏ giá input (mặc định 0,1×), mà không bỏ bớt context cần thiết.
      - **Cắt policy còn 1.000 token đầu:** mất nội dung policy cần dùng.
      - **Chuyển sang model nhỏ nhất bất chấp độ phù hợp:** hạ model không xét việc cần gì → rủi ro chất lượng.
      - **Dời policy vào khối few-shot:** không tạo ra tiền tố cache tái dùng được, cũng không giảm token.
    ref: exams/CCAR-P.md#d2--claude-models-prompting--context-engineering-13
    tags: [prompt-caching, latency, cost]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: OF-CCARP-03
    exams: { CCAR-P: D4 }
    source: https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542810%2FClaude+Certified+Architect+%E2%80%93+Professional+Exam+Guide.pdf
    stem: "A RAG system suddenly returns confident but incorrect answers after a document refresh, while latency and model version are unchanged. What is the most likely first place to investigate?"
    options:
      - "The model weights have silently changed."
      - "The retrieval/indexing step is returning irrelevant or stale chunks."
      - "The temperature setting is too low."
      - "The context window has shrunk."
    answer: [B]
    explanation: |-
      **Đúng: bước retrieval/indexing đang trả về chunk không liên quan hoặc cũ.** Triệu chứng xuất hiện **ngay sau khi làm mới tài liệu**, trong khi model và độ trễ không đổi → nghi bước retrieval đưa context kém cho model (re-index hỏng, embedding không khớp, chunk cũ/không liên quan). Model trả lời tự tin dựa trên context sai.
      - **Trọng số model âm thầm thay đổi:** phiên bản model không đổi; "weights tự thay đổi" không phải giả thuyết hợp lý.
      - **Temperature quá thấp:** temperature thấp không gây ra sai lệch gắn với sự kiện làm mới tài liệu.
      - **Context window bị co lại:** context window không tự co lại; cũng không liên quan tới việc làm mới tài liệu.
    ref: exams/CCAR-P.md#d4--evaluation-testing--optimization-16
    tags: [rag, debugging]
    created: 2026-11-18
    reviewed: 2026-11-18
