      - A clear instruction in the prompt to always validate before writing anything.
    answer:
      - C
    explanation: Thứ tự bắt buộc cần điều kiện tiên quyết trong code; prompt và ví dụ vẫn có xác suất lỗi, báo cáo hằng đêm thì đã muộn.
