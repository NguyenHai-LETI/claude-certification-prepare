    explanation: "Hướng dẫn an toàn khuyên tránh dùng agent duyệt web cho trang nhạy cảm, tiền bạc: bộ lọc giảm rủi ro nhưng không về 0. Lời hứa của model không phải kiểm soát; chọn ngày không liên quan."
    ref: lessons/20-san-pham-du-lieu.html#san-pham
  - id: Y24
    exams:
      CCAO-F: D5
    stem: After connecting Google Drive, a user asks Claude to summarize a file in a folder they personally cannot open. What will happen?
