      - Prompt caching lets it remember earlier conversations.
      - "`max_tokens` is optional and defaults to unlimited."
      - It does not keep conversation state between requests.
    answer:
      - A
      - D
    explanation: API không lưu trạng thái, mỗi request mang theo lịch sử cần thiết; `system` là tham số cấp cao nhất. Cache chỉ giảm chi phí tiền tố lặp lại; `max_tokens` là bắt buộc.
    ref: lessons/01-api-tich-hop.html#request
  - id: A45
    exams:
      CCDV-F: D2
    stem: Which TWO practices belong in configuration management for a production Claude application?
    options:
      - Pinning a specific model version in production.
      - Keeping prompts in version control with their evals.
      - Editing production prompts directly in the database.
      - Pointing production at a moving model alias.
    answer:
      - A
      - B
    explanation: Ghim phiên bản model và quản lý prompt trong git (kèm eval) giúp hành vi chỉ đổi khi chủ động. Sửa prompt trực tiếp hay dùng alias di động làm thay đổi không truy vết được.
    ref: lessons/01-api-tich-hop.html#cau-hinh
  - id: B28
    exams:
      CCDV-F: D5
    stem: Which TWO changes would stop prompt cache hits for a long, stable system prompt?
    options:
      - Sending the same request again within the cache lifetime.
      - Adding the current timestamp at the start of the system prompt.
      - Editing one tool definition, since tools come first in the prefix.
      - Changing only the final user question after the breakpoint.
    answer:
      - B
      - C
    explanation: "Cache theo tiền tố: đổi bất kỳ phần nào phía trước (tools, đầu system prompt) làm mất cache cho mọi phần sau. Phần sau breakpoint thay đổi thì không sao."
    ref: lessons/02-model-toi-uu.html#caching
  - id: B29
    exams:
      CCDV-F: D5
    stem: Which TWO tasks are good fits for a small, fast model such as Haiku?
    options:
      - Planning a migration that spans several services.
      - Reviewing a complex legal agreement for conflicts.
      - Tagging millions of short support messages by topic.
      - A subagent that only looks up and returns file paths.
    answer:
      - C
      - D
    explanation: Việc đơn giản, khối lượng lớn hoặc subagent tra cứu hợp với model nhỏ, nhanh, rẻ. Suy luận phức tạp nhiều bước cần model mạnh hơn.
    ref: lessons/02-model-toi-uu.html#chon-model
  - id: F64
    exams:
      CCDV-F: D6
    stem: Which TWO practices are part of defensive handling of Claude's JSON output?
    options:
      - Retrying with the specific validation error when it fails.
      - Trusting the output whenever the model sounds confident.
      - Silently skipping responses that fail to parse.
      - Validating each response against a schema before use.
    answer:
      - A
      - D
    explanation: "Parse phòng thủ: validate theo schema, lỗi thì retry kèm thông báo lỗi cụ thể. Giọng tự tin không phải bằng chứng; bỏ qua lặng lẽ làm mất dữ liệu."
    ref: lessons/06-prompt-output.html#validate-retry
  - id: H16
    exams:
      CCDV-F: D7
    stem: Which TWO are good practices for managing Claude API keys?
    options:
      - A separate key per environment, kept in a secrets manager.
      - Revoking and replacing a key immediately if it leaks.
      - Committing one shared key in `.env` for convenience.
      - Putting the key in CLAUDE.md so Claude Code can use it.
    answer:
      - A
      - B
    explanation: Mỗi môi trường một key trong secrets manager; lộ key thì thu hồi và cấp mới ngay. Commit key hay đặt vào CLAUDE.md đều làm lộ bí mật.
    ref: lessons/08-bao-mat.html#secret
  - id: D59
    exams:
      CCDV-F: D8
    stem: Which TWO needs are best met by an MCP server rather than a Skill?
    options:
      - Teaching Claude the team's writing style guide.
      - Reading live data from an internal ticketing system.
      - Letting several Claude applications share one integration.
      - Packaging a 12-step release checklist for reuse.
    answer:
      - B
      - C
    explanation: MCP server để nối hệ thống ngoài và dùng chung cho nhiều ứng dụng. Quy trình, kiến thức dùng lại (checklist, style guide) hợp với Skill.
    ref: lessons/04-tool-mcp.html#chon-cach
  - id: K59
    exams:
      CCAO-F: D1
    stem: You ask Claude to “write a project update”. Which addition makes the request most effective?
    options:
      - The audience, the period covered, the key results, and the length you need.
      - A request to make the update “as good as possible” for everyone who reads it.
      - The phrase “you are an expert writer” and nothing else.
      - A note that the update is urgent and should be ready soon.
    answer:
      - A
    explanation: Prompt hiệu quả nêu rõ người đọc, phạm vi, nội dung chính, độ dài. Lời khen hay chỉ đặt vai không thay được thông tin cụ thể.
    ref: lessons/09-ccao-f.html#prompting
  - id: K60
    exams:
      CCAO-F: D1
    stem: You must turn 30 pages of interview notes into product recommendations. How should you structure the work with Claude?
    options:
      - Ask Claude to skip the notes entirely and suggest the recommendations that are most typical.
      - Extract themes first, check them, then ask for recommendations based on the agreed themes.
      - Paste all of the notes and ask for the final recommendations in a single step.
      - Ask for recommendations first, then look for notes that support each of them.
    answer:
      - B
    explanation: Chia việc lớn thành bước có thể kiểm tra (chủ đề → khuyến nghị) cho kết quả chính xác, truy được nguồn. Làm ngược (kết luận trước, tìm bằng chứng sau) dễ thiên lệch.
    ref: lessons/09-ccao-f.html#prompting
  - id: K61
    exams:
      CCAO-F: D1
    stem: Claude's draft policy summary is accurate but full of jargon your frontline staff will not understand. What is the best next prompt?
    options:
      - “Make it better.”
      - “Use simpler words, but keep all of the legal terms exactly as they are.”
      - “Rewrite this for frontline staff with no legal background, in plain words.”
      - “Try again, and this time make sure the summary is a lot better than before.”
    answer:
      - C
    explanation: Phản hồi lặp hiệu quả nêu cụ thể người đọc và thay đổi cần làm. “Thử lại”, “làm tốt hơn” không cho Claude biết sửa gì; yêu cầu mâu thuẫn cho kết quả lưng chừng.
    ref: lessons/09-ccao-f.html#prompting
  - id: K62
    exams:
      CCAO-F: D1
    stem: You want Claude's help researching which competitors launched loyalty programs this year. How should this prompt differ from a drafting prompt?
    options:
      - Ask for an engaging, persuasive tone that suits marketing copy.
      - Ask Claude to answer from memory without using any search tools.
      - Ask for a single paragraph with no company names in it, so that it is easy to read quickly.
      - Ask for sources and dates for each finding, and to flag what it could not verify.
    answer:
      - D
    explanation: Việc nghiên cứu cần nguồn, ngày tháng và đánh dấu điều chưa kiểm chứng. Giọng thuyết phục là yêu cầu của việc soạn thảo, không phải nghiên cứu.
    ref: lessons/09-ccao-f.html#prompting
  - id: K63
    exams:
      CCAO-F: D1
    stem: Which prompt works best for brainstorming names for an internal training program?
    options:
      - “Give 20 varied names in different styles; we will shortlist later.”
      - “Give the single best name for the program and explain why it is perfect.”
      - “Give one name that has been proven to work at other companies.”
      - “Analyze our training budget before suggesting any names.”
    answer:
      - A
    explanation: Brainstorm cần số lượng và sự đa dạng, đánh giá để sau. Đòi một đáp án hoàn hảo ngay làm hẹp ý tưởng.
    ref: lessons/09-ccao-f.html#prompting
  - id: Q01
    exams:
      CCAO-F: D1
    stem: In the AI Fluency framework, which competency is about deciding which parts of a task to hand to Claude and which to keep yourself?
    options:
      - Diligence
      - Delegation
      - Description
      - Discernment
    answer:
      - B
    explanation: "4D: Delegation (giao phần nào cho AI), Description (mô tả yêu cầu rõ), Discernment (đánh giá output), Diligence (chịu trách nhiệm, minh bạch)."
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: Q02
    exams:
      CCAO-F: D1
    stem: A colleague gets vague results because they never say who the output is for or what format they need. Which AI Fluency competency should they strengthen?
    options:
      - Discernment
      - Diligence
      - Description
      - Delegation
    answer:
      - C
    explanation: Description là kỹ năng truyền đạt rõ mục tiêu, bối cảnh, người đọc và định dạng mong muốn cho AI.
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: K64
    exams:
      CCAO-F: D1
    stem: You want Claude to match the format of your team's existing incident reports. What is the most effective way to ask?
    options:
      - Describe the format as “our usual style” and let Claude work out the rest of it by itself.
      - Ask Claude to search the web for incident report templates from other firms.
      - Ask for a creative new format so that the reports stand out more.
      - Attach one or two past reports as examples and ask it to follow the same structure.
    answer:
      - D
    explanation: Ví dụ cụ thể (one-shot, few-shot) truyền đạt định dạng chính xác hơn mô tả chung chung.
    ref: lessons/09-ccao-f.html#prompting
  - id: K65
    exams:
      CCAO-F: D1
    stem: You need a summary that fits on a single slide. What should the prompt include?
    options:
      - A clear limit, such as five bullets of at most 12 words each.
      - A request to be “short but complete” so it fits the slide.
      - A request for Claude to use the smallest font size it can.
      - Nothing at all, since Claude will guess the slide size itself.
    answer:
      - A
    explanation: Ràng buộc cụ thể (số ý, số từ) cho kết quả vừa khuôn hơn yêu cầu chung chung.
    ref: lessons/09-ccao-f.html#prompting
  - id: K66
    exams:
      CCAO-F: D1
    stem: Which prompt gives Claude the most useful context for reviewing a supplier contract?
    options:
      - “Rewrite the whole contract in simpler English so that anyone can read it.”
      - “We are the buyer; flag terms that raise our costs or limit termination, ranked by risk.”
      - “Please review this contract carefully and tell me absolutely everything you notice about it.”
      - “Is this a good contract for us? Please answer with a simple yes or no.”
    answer:
      - B
    explanation: Nêu vị thế (bên mua), mục tiêu (rủi ro chi phí, điều khoản chấm dứt) và cách trình bày (xếp theo rủi ro). Câu hỏi chung chung cho câu trả lời chung chung.
    ref: lessons/09-ccao-f.html#prompting
  - id: K67
    exams:
      CCAO-F: D1
    stem: Which TWO approaches help Claude handle a complex request such as planning a regional sales conference?
    options:
      - Ask for the complete plan in one reply so that nothing gets forgotten.
      - Leave out the budget and dates so Claude has more creative freedom.
      - Break it into parts (venue, agenda, budget, invitations) and handle them in turn.
      - Ask Claude to list open questions and assumptions before drafting the plan.
    answer:
      - C
      - D
    explanation: Phân rã thành phần việc và làm rõ giả định trước khi soạn giúp kế hoạch sát thực tế. Đòi tất cả trong một lần hay giấu ràng buộc làm kết quả chung chung.
    ref: lessons/09-ccao-f.html#prompting
  - id: Q03
    exams:
      CCAO-F: D1
    stem: When is it worth asking Claude to reason step by step (or turning on extended thinking) for a business task?
    options:
      - For rewording one sentence in a routine email so that it sounds a little friendlier to the reader.
      - For translating a short greeting card message into French for a client.
      - For listing this week's meeting times in chronological order.
      - For multi-step reasoning, such as comparing pricing scenarios with several variables.
    answer:
      - D
    explanation: Suy nghĩ từng bước có ích cho bài toán nhiều bước, nhiều biến; việc đơn giản thì không cần và chỉ chậm hơn.
    ref: lessons/15-claude-101-fluency.html#claude-101
  - id: K68
    exams:
      CCAO-F: D1
    stem: Claude's second draft fixed the tone but dropped two key figures from the first draft. How should you respond?
    options:
      - Point out the missing figures and ask it to restore them while keeping the new tone.
      - Start a brand-new chat and write the whole prompt again from the very beginning, word for word.
      - Accept the draft and add the figures somewhere at the end yourself.
      - Ask it to go back to the first draft and discard all of the changes.
    answer:
      - A
    explanation: "Lặp có kiểm soát: nói rõ cái cần giữ và cái cần sửa. Làm lại từ đầu hay bỏ hết thay đổi đều phí phần đã đạt được."
    ref: lessons/09-ccao-f.html#prompting
  - id: K69
    exams:
      CCAO-F: D1
    stem: You upload quarterly sales data and want an analysis. Which instruction leads to the most trustworthy result?
    options:
      - Ask it to round every figure to the nearest thousand without noting it anywhere in the text.
      - Ask it to show the calculations or data behind each conclusion it draws.
      - Ask for a bold, confident headline that will impress leadership.
      - Ask it to ignore any rows with unusual values to keep things simple.
    answer:
      - B
    explanation: Phân tích đáng tin khi mỗi kết luận đi kèm số liệu, phép tính kiểm tra được. Bỏ dữ liệu bất thường hay làm tròn không ghi chú làm sai lệch kết quả.
    ref: lessons/09-ccao-f.html#prompting
  - id: Q04
    exams:
      CCAO-F: D1
    stem: A manager wants Claude to produce the final performance rating for each employee. Under good delegation practice, what should be handed to Claude?
    options:
      - Deciding which employees should be placed on performance improvement plans.
      - Choosing salary changes based on the ratings it assigns to each person.
      - Drafting summaries of each person's documented achievements for the manager to judge.
      - The final rating decision itself, so that the ratings are consistent across the whole team.
    answer:
      - C
    explanation: "Delegation tốt: giao phần soạn thảo, tổng hợp; giữ quyết định ảnh hưởng tới con người cho người có trách nhiệm."
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: K70
    exams:
      CCAO-F: D1
    stem: Which instruction is clearest for a customer apology email?
    options:
      - “Write something nice to the customer about the delivery delay last week.”
      - “Make the customer happy again and make sure they do not leave us.”
      - “Apologize as much as possible and in several ways so the customer does not complain further.”
      - “Apologize for the 3-day delay, explain the cause in one sentence, offer a 10% credit.”
    answer:
      - D
    explanation: Chỉ dẫn rõ nêu cụ thể nội dung (xin lỗi việc gì, nguyên nhân, bồi thường). Yêu cầu chung chung cho email chung chung.
    ref: lessons/09-ccao-f.html#prompting
  - id: K71
    exams:
      CCAO-F: D2
    stem: Claude summarizes a policy and says employees get 25 vacation days. The policy says 20. What does this show?
    options:
      - Even fluent summaries can contain errors, so key facts must be checked against the source.
      - The policy document is probably out of date and should be changed to 25.
      - Claude rounds numbers up on purpose to make summaries friendlier.
      - Errors like this only happen with very long documents, so it can be ignored.
    answer:
      - A
    explanation: Tóm tắt trôi chảy vẫn có thể sai số liệu; dữ kiện quan trọng phải đối chiếu với nguồn gốc.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K72
    exams:
      CCAO-F: D2
    stem: Claude lists “all action items” from a meeting transcript. How can you best check that the list is complete?
    options:
      - Check only that each item on the list starts with a verb.
      - Skim the transcript for decisions and owners, and compare them against the list.
      - Count the items and accept the list as complete if there are more than five of them in total.
      - Ask Claude whether the list is complete and accept its answer.
    answer:
      - B
    explanation: Kiểm tra độ đầy đủ bằng cách đối chiếu với nguồn (quyết định, người phụ trách). Số lượng hay định dạng không nói lên độ đầy đủ; hỏi lại Claude không phải kiểm chứng độc lập.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K73
    exams:
      CCAO-F: D2
    stem: Claude quotes a customer as saying “the new app is unusable”, but you cannot find that quote in the survey file. What is the most likely explanation?
    options:
      - Quotes are always exact, so the survey file is probably incomplete.
      - Claude has access to private customer messages outside the file.
      - The quote may be fabricated or paraphrased; check the source before using it.
      - The customer must have said it in a different survey or interview that you have not seen yet.
    answer:
      - C
    explanation: Trích dẫn không tìm thấy trong nguồn có thể là bịa hoặc diễn giải lại; chỉ dùng trích dẫn đã đối chiếu được.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K74
    exams:
      CCAO-F: D2
    stem: In one report, Claude says revenue grew 12% in the introduction and 8% in the conclusion. What should you do?
    options:
      - Use the higher of the two figures, since it is more positive for the business and the team.
      - Average the two numbers and report 10% growth.
      - Delete the conclusion so that only one figure remains.
      - Check the correct figure in the source data and ask Claude to fix both sections.
    answer:
      - D
    explanation: "Mâu thuẫn nội tại là dấu hiệu lỗi: xác định số đúng từ dữ liệu gốc rồi sửa cho nhất quán."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: T01
    exams:
      CCAO-F: D2
    stem: Claude's draft job advert describes the ideal candidate as joining a “young and energetic team”. What is the issue?
    options:
      - The wording may discourage some applicants and could breach equal-opportunity rules.
      - The advert is probably too short to attract enough qualified applicants.
      - There is no issue, because the phrase simply and accurately describes the team as it is today.
      - The tone is too formal and serious for a modern job advert.
    answer:
      - A
    explanation: "Nhận diện thiên lệch: cụm từ ngụ ý độ tuổi có thể loại trừ ứng viên và vi phạm quy định bình đẳng; cần sửa trước khi đăng."
    ref: lessons/16-capabilities-enterprise.html#ai-capabilities
  - id: K75
    exams:
      CCAO-F: D2
    stem: What is the most reliable way to fact-check a statistic in Claude's draft?
    options:
      - Keep it if it sounds reasonable to the people on your team.
      - Trace it to a primary source, such as the original report or official dataset.
      - Ask Claude the same question again in a brand-new chat and compare the two answers it gives.
      - Search for the number and accept the first page that mentions it.
    answer:
      - B
    explanation: Kiểm chứng tốt nhất là truy về nguồn gốc (báo cáo, dữ liệu chính thức). Hỏi lại AI hay tin trang đầu tiên không phải kiểm chứng độc lập.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K76
    exams:
      CCAO-F: D2
    stem: Which TWO outputs most need human review before use?
    options:
      - Brainstormed titles for an internal team offsite.
      - A first draft of your personal to-do list.
      - Medication dosage guidance for a patient leaflet.
      - A response to a regulator's formal information request.
    answer:
      - C
      - D
    explanation: Nội dung y tế, pháp lý, gửi cơ quan quản lý là rủi ro cao, cần người có chuyên môn duyệt. Ý tưởng nội bộ, ghi chú cá nhân thì rủi ro thấp.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K77
    exams:
      CCAO-F: D2
    stem: Claude wrote a technical incident summary for engineers. You now need it for the executive team. What is the best edit request?
    options:
      - Keep it exactly as it is, since executives should learn the technical terms too.
      - Remove all of the numbers so the summary is easier to read.
      - Turn the summary into bullet points without changing any of the content.
      - "Rewrite it for executives: business impact, cost and next steps, in plain words."
    answer:
      - D
    explanation: "Điều chỉnh theo người đọc: lãnh đạo cần tác động kinh doanh, chi phí, bước tiếp theo bằng ngôn ngữ thường."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K78
    exams:
      CCAO-F: D2
    stem: You have two Claude drafts of a customer FAQ. How should you choose between them?
    options:
      - "Compare both against criteria set in advance: accuracy, coverage, tone and length."
      - Pick the longer of the two drafts, since it most likely contains more useful information.
      - Ask Claude which of its two drafts is better and simply go with its choice.
      - Pick whichever draft was generated first.
    answer:
      - A
    explanation: So sánh output theo tiêu chí đặt trước (chính xác, đầy đủ, giọng, độ dài). Dài hơn không có nghĩa là tốt hơn; AI tự chấm không đáng tin.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K79
    exams:
      CCAO-F: D2
    stem: You want a one-page onboarding checklist that colleagues can open, copy and reuse. Which output form fits best?
    options:
      - A spoken summary of the checklist.
      - An artifact containing the checklist as a standalone document.
      - A long paragraph inside the chat reply that people can scroll back to.
      - A list of links to onboarding guides from other companies.
    answer:
      - B
    explanation: "Nội dung độc lập để dùng lại, chia sẻ: artifact. Đoạn văn trong chat khó tái sử dụng."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K80
    exams:
      CCAO-F: D2
    stem: You need Claude to extract supplier names, amounts and due dates from 50 invoices for your finance system. Which output format is most suitable?
    options:
      - A slide for each supplier with a picture.
      - A single total amount for all invoices.
      - A table or CSV with one row per invoice and fixed columns.
      - A narrative summary of the invoices, one paragraph for each supplier.
    answer:
      - C
    explanation: Dữ liệu để đưa vào hệ thống khác cần định dạng có cấu trúc (bảng, CSV) với cột cố định.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K81
    exams:
      CCAO-F: D2
    stem: Claude's research summary has 40 bullet points of mixed importance. Your director wants a quick decision brief. What should you ask for?
    options:
      - Add another 20 bullet points to the summary so that nothing at all is missing.
      - Sort the bullets alphabetically so the director can scan them faster.
      - Convert all 40 points into one long paragraph that reads more smoothly.
      - Group the points by theme and keep the top three insights with their evidence.
    answer:
      - D
    explanation: "Tổ chức, chọn lọc thông tin theo người đọc: gom nhóm, giữ ý chính kèm bằng chứng."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K82
    exams:
      CCAO-F: D2
    stem: Claude states, “This regulation was updated last month.” Your Claude setup has no web search. How should you treat the statement?
    options:
      - "As unverified: Claude may lack recent information, so check an official source."
      - As certain, because Claude always knows about the latest regulatory changes in every country.
      - As certain, because the statement includes a specific time frame.
      - As irrelevant, because regulations rarely change.
    answer:
      - A
    explanation: Không có tìm kiếm web thì thông tin gần đây có thể nằm ngoài dữ liệu huấn luyện; kiểm chứng với nguồn chính thức.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K83
    exams:
      CCAO-F: D2
    stem: Which situation most clearly calls for additional verification of Claude's output?
    options:
      - Ideas for decorating the office for a holiday.
      - Figures that will appear in an investor presentation.
      - Synonyms for a word in an internal chat message.
      - A list of icebreaker questions for a team meeting.
    answer:
      - B
    explanation: Số liệu gửi nhà đầu tư là rủi ro cao, cần kiểm chứng. Nội dung nội bộ nhẹ thì không cần mức kiểm tra đó.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: T02
    exams:
      CCAO-F: D2
    stem: Why can Claude give a confident but wrong answer about your company's internal processes?
    options:
      - It is designed to guess whenever it is asked about any company.
      - It only answers correctly when questions are asked in English.
      - It has no knowledge of your internal processes unless you provide that information.
      - It reads your company's intranet automatically in the background and sometimes misreads it.
    answer:
      - C
    explanation: Claude không biết quy trình nội bộ trừ khi được cung cấp (tài liệu, connector); nó không tự đọc intranet.
    ref: lessons/16-capabilities-enterprise.html#ai-capabilities
  - id: K84
    exams:
      CCAO-F: D2
    stem: A Claude-written newsletter is accurate but 1,200 words long; your template allows 400. What is the best approach?
    options:
      - Publish it as it is and ask readers to skim through only the parts that interest them most.
      - Delete the last two thirds of the text yourself.
      - Change the template to allow 1,200 words.
      - Ask Claude to cut it to 400 words, keeping the three most important updates.
    answer:
      - D
    explanation: "Biên tập theo khuôn: yêu cầu rút gọn có tiêu chí (giữ ý quan trọng nhất). Cắt cơ học làm mất nội dung chính."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K85
    exams:
      CCAO-F: D2
    stem: Claude's answer about refund rules differs from your official policy page. Which TWO actions are appropriate?
    options:
      - Treat the official policy as authoritative and correct the answer.
      - Check whether the knowledge files contain an outdated policy.
      - Update the official policy page to match Claude's answer.
      - Ignore the difference, since both versions are probably fine.
    answer:
      - A
      - B
    explanation: Văn bản chính thức là chuẩn; kiểm tra kho tri thức có tài liệu lỗi thời không. Không sửa chính sách theo câu trả lời của AI.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K86
    exams:
      CCAO-F: D2
    stem: Claude provides a link to a government guidance page, but the link returns “page not found”. What should you do?
    options:
      - Remove the broken link but keep the guidance text in the document as if it had been verified.
      - Treat the reference as unverified and find the guidance on the official website.
      - Assume the page moved and keep the link in your document.
      - Ask Claude to promise that the page exists.
    answer:
      - B
    explanation: Đường dẫn hỏng có thể là bịa; tìm lại trên trang chính thức. Giữ nội dung như đã kiểm chứng là sai.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: T03
    exams:
      CCAO-F: D2
    stem: Claude's analysis of customer complaints mentions only urban branches, because the uploaded data covered only those. What is the correct interpretation?
    options:
      - Claude chose to ignore rural branches on purpose to keep the analysis short.
      - The analysis is complete and valid for every branch in the whole company.
      - The conclusions apply only to the data provided; rural branches are not represented.
      - Rural branches clearly have no complaints at all, since none of them appear in the analysis.
    answer:
      - C
    explanation: Kết luận chỉ đúng trong phạm vi dữ liệu đưa vào. Thiếu dữ liệu không có nghĩa là không có vấn đề.
    ref: lessons/16-capabilities-enterprise.html#ai-capabilities
  - id: K87
    exams:
      CCAO-F: D2
    stem: Claude drafted an announcement for employees. It must now also go to external partners. What should you check first?
    options:
      - Make the formatting more colorful and the font noticeably bigger for the external partner readers.
      - Add more internal terms so that the announcement sounds more expert.
      - Send it as is, since the facts are exactly the same for both audiences.
      - Remove internal details, such as headcount or system names, that partners should not see.
    answer:
      - D
    explanation: "Đổi người đọc là đổi mức thông tin được chia sẻ: loại chi tiết nội bộ trước khi gửi ra ngoài."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K88
    exams:
      CCAO-F: D2
    stem: "You ask a quick question: “What is the difference between a lease and a licence?” Which response format is most appropriate?"
    options:
      - A short inline answer in the chat.
      - A downloadable spreadsheet comparing both
      - A 20-page artifact report.
      - A JSON file.
    answer:
      - A
    explanation: "Câu hỏi nhanh: trả lời ngắn ngay trong chat. Artifact hay dữ liệu có cấu trúc dành cho nội dung cần dùng lại."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K89
    exams:
      CCAO-F: D2
    stem: Claude's budget summary says the five line items total €48,500. What is the quickest reliable check?
    options:
      - Accept it if the number looks round.
      - Add up the five line items yourself or in a spreadsheet.
      - Ask Claude whether it is completely sure the total is correct.
      - Compare it with last year's total.
    answer:
      - B
    explanation: Phép tính kiểm tra được thì tự kiểm tra (tính lại, dùng bảng tính). Hỏi lại Claude không phải kiểm chứng.
    ref: lessons/09-ccao-f.html#danh-gia
  - id: K90
    exams:
      CCAO-F: D2
    stem: A market summary Claude prepared for a neutral board review lists only your product's strengths. What should you ask for?
    options:
      - A shorter version with only the headline.
      - A version written in a more enthusiastic tone.
      - A balanced view that includes weaknesses, risks and competitor strengths.
      - Even more strengths, so that the case for the product is more convincing.
    answer:
      - C
    explanation: "Đánh giá output theo mục đích và người đọc: hội đồng cần góc nhìn cân bằng (điểm yếu, rủi ro, đối thủ)."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: Q05
    exams:
      CCAO-F: D2
    stem: Which AI Fluency competency is a user practicing when they check Claude's output for accuracy, gaps and fitness for purpose?
    options:
      - Delegation
      - Description
      - Diligence
      - Discernment
    answer:
      - D
    explanation: "Discernment là năng lực đánh giá output: đúng không, thiếu gì, có phù hợp mục đích không."
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: K91
    exams:
      CCAO-F: D2
    stem: Claude extracts data from 47 contracts in a folder that you know holds 52. What is the right next step?
    options:
      - Identify which five are missing and why, before using the results.
      - Use the 47 results as they are, since the rest are probably duplicates.
      - Assume Claude skipped the five least important files.
      - Report that the folder holds only 47 contracts.
    answer:
      - A
    explanation: "Kiểm tra độ đầy đủ: số lượng không khớp thì tìm ra phần thiếu và lý do trước khi dùng."
    ref: lessons/09-ccao-f.html#danh-gia
  - id: T04
    exams:
      CCAO-F: D2
    stem: Why should you be careful when Claude summarizes a very long document in one pass?
    options:
      - Summaries of long documents are always shorter than one sentence.
      - Details, especially in the middle, can be missed or merged, so check key sections.
      - Claude refuses to read any document that is longer than about ten pages, so it skips the rest.
      - Long documents always produce summaries in another language.
    answer:
      - B
    explanation: Tài liệu dài dễ bị bỏ sót hoặc gộp chi tiết (nhất là phần giữa); kiểm tra các phần quan trọng hoặc tóm tắt theo phần.
    ref: lessons/16-capabilities-enterprise.html#ai-capabilities
  - id: K92
    exams:
      CCAO-F: D3
    stem: Which Claude model family is typically best for fast, low-cost, high-volume tasks such as tagging short messages?
    options:
      - The largest model, with maximum thinking
      - Any model, since all have the same speed and cost
      - Haiku
      - Opus
    answer:
      - C
    explanation: Haiku nhanh, rẻ cho việc đơn giản khối lượng lớn; Sonnet cân bằng; Opus cho suy luận phức tạp.
    ref: lessons/09-ccao-f.html#san-pham
  - id: K93
    exams:
      CCAO-F: D3
    stem: Which model is a sensible default for everyday business work such as drafting, summarizing and analysis that needs good quality at reasonable speed?
    options:
      - Haiku, for every task without exception
      - Opus, for every task without exception
      - No model; these tasks should not use AI
      - Sonnet
    answer:
      - D
    explanation: Sonnet là lựa chọn cân bằng chất lượng, tốc độ, chi phí cho việc thường ngày; Opus cho bài khó; Haiku cho việc nhanh, đơn giản.
    ref: lessons/09-ccao-f.html#san-pham
  - id: K94
    exams:
      CCAO-F: D3
    stem: Which feature lets a team share the same instructions and reference documents across many conversations?
    options:
      - Projects
      - Incognito chat
      - A single long chat thread
      - Artifacts
    answer:
      - A
    explanation: Projects gom instructions và kho tài liệu dùng chung cho mọi cuộc chat trong project.
    ref: lessons/09-ccao-f.html#san-pham
  - id: K95
    exams:
      CCAO-F: D3
    stem: You need a briefing on new data protection rules across five countries, with citations. Which feature fits best?
    options:
      - Memory, so Claude remembers the rules.
      - Research, which searches multiple sources and cites them.
      - A regular chat with web access turned off, to keep the answer focused.
      - An artifact with an empty template.
    answer:
      - B
    explanation: Research tìm nhiều bước trên nhiều nguồn và trích dẫn; chat không truy cập web chỉ dựa vào dữ liệu huấn luyện.
    ref: lessons/09-ccao-f.html#san-pham
  - id: K96
    exams:
      CCAO-F: D3
    stem: Which feature is best for building and iterating on a small interactive calculator to share with colleagues?
    options:
      - Research
      - Incognito chat
      - Artifacts
      - Memory
    answer:
      - C
    explanation: Artifact tạo nội dung độc lập (tài liệu, ứng dụng nhỏ) để xem, chỉnh và chia sẻ.
    ref: lessons/09-ccao-f.html#san-pham
  - id: K97
    exams:
      CCAO-F: D3
    stem: A team needs 5,000 product descriptions rewritten in a consistent tone. Quality on a sample is fine with the faster model. What should drive the choice?
    options:
      - Use the most capable model for everything, because a more expensive model always means better.
      - Use different models for each batch to compare them.
      - Use the slowest model to make sure it reads carefully.
      - Use the faster, cheaper model that met the quality bar on the sample.
    answer:
      - D
    explanation: "Chọn model theo yêu cầu: đã đạt chất lượng trên mẫu thì model nhanh, rẻ hơn là hợp lý cho khối lượng lớn."
    ref: lessons/09-ccao-f.html#san-pham
  - id: K98
    exams:
      CCAO-F: D3
    stem: After a two-hour chat covering many topics, Claude starts confusing earlier details. What should you do?
    options:
      - Ask for a summary of key decisions, then continue in a new chat with that summary.
      - Keep going in the same chat and repeat each earlier detail every single time Claude forgets it.
      - Switch to the smallest model to speed things up.
      - Delete all of your previous chats.
    answer:
      - A
    explanation: "Chat quá dài làm chất lượng giảm: tóm tắt rồi mở chat mới, hoặc lưu thông tin bền vững vào Project."
    ref: lessons/09-ccao-f.html#san-pham
  - id: K99
    exams:
      CCAO-F: D3
    stem: Which information should be persisted in a Project rather than repeated in each chat?
    options:
      - Today's weather forecast.
      - The style guide and product facts your team uses every week.
      - Today's one-off question about what time a single meeting starts.
      - A joke you want to share once.
    answer:
      - B
    explanation: Thông tin dùng lặp lại, ổn định nên lưu vào Project; chi tiết dùng một lần để trong chat.
    ref: lessons/09-ccao-f.html#san-pham
  - id: Q06
    exams:
      CCAO-F: D3
    stem: What is the main benefit of Claude's memory feature for an individual user?
    options:
      - It guarantees that Claude never makes mistakes.
      - It shares your chats with your manager.
      - It carries useful preferences and context across chats, and you can view and edit it.
      - It automatically stores your company's entire shared file server so you can ask about it later.
    answer:
      - C
    explanation: Memory mang sở thích, bối cảnh hữu ích sang các cuộc chat; người dùng xem, sửa, xoá được. Nó không tự nạp kho tài liệu công ty.
    ref: lessons/15-claude-101-fluency.html#claude-101
  - id: Q07
    exams:
      CCAO-F: D3
    stem: You want to ask a one-off question without it being saved to your chat history or memory. Which option fits?
    options:
      - A Project shared with your team
      - A regular chat saved to memory
      - An artifact published to colleagues
      - An incognito chat
    answer:
      - D
    explanation: Incognito chat không lưu vào lịch sử và không dùng cho memory (vẫn theo chính sách dữ liệu của tổ chức). Project chia sẻ hay artifact công khai làm lộ thông tin.
    ref: lessons/15-claude-101-fluency.html#claude-101
  - id: K100
    exams:
      CCAO-F: D3
    stem: You need Claude to produce a formatted Excel file from your sales notes. Which capability makes this possible?
    options:
      - File creation with code execution
      - Memory, which saves files across chats
      - Incognito chat mode
      - Research mode with web search
    answer:
      - A
    explanation: Tính năng tạo file (chạy code) cho phép Claude tạo bảng tính, tài liệu, slide để tải về.
    ref: lessons/09-ccao-f.html#san-pham
  - id: K101
    exams:
      CCAO-F: D3
    stem: Claude must answer questions using the latest version of documents your team edits daily in Google Drive. Which setup fits best?
    options:
      - Describe the documents from memory.
      - Connect Google Drive so Claude reads the current files with your permissions.
      - Upload a copy of each document to the Project once and never update it again.
      - Paste the document titles into the chat.
    answer:
      - B
    explanation: "Tài liệu thay đổi thường xuyên: dùng connector để đọc bản hiện hành theo quyền của bạn; bản sao tải lên sẽ lỗi thời."
    ref: lessons/09-ccao-f.html#san-pham
  - id: T05
    exams:
      CCAO-F: D3
    stem: Which TWO are good responses when a task is too large to fit comfortably in one conversation?
    options:
      - Paste every file into one message and ask for everything at once.
      - Remove all instructions so there is more room for the documents.
      - Split the work into stages and carry a short summary between chats.
      - Store stable reference material in a Project instead of pasting it each time.
    answer:
      - C
      - D
    explanation: "Quản lý giới hạn context: chia giai đoạn kèm tóm tắt, đưa tài liệu ổn định vào Project. Nhồi hết vào một tin nhắn hay bỏ chỉ dẫn làm chất lượng giảm."
    ref: lessons/16-capabilities-enterprise.html#ai-capabilities
  - id: K102
    exams:
      CCAO-F: D3
    stem: Which task most justifies using the most capable model (Opus), despite higher cost and slower responses?
    options:
      - Writing a short two-line thank-you note to a colleague after a meeting.
      - Converting a short list of names into bullet points.
      - Correcting the spelling mistakes in one sentence of an email.
      - Reconciling conflicting clauses across several long legal agreements.
    answer:
      - D
    explanation: Model mạnh nhất đáng chi khi cần suy luận phức tạp trên nhiều tài liệu; việc đơn giản thì lãng phí.
    ref: lessons/09-ccao-f.html#san-pham
  - id: K103
    exams:
      CCAO-F: D4
    stem: You are asked to gather requirements for a new expense app. How can Claude help most?
    options:
      - Turn interview notes into a structured list of requirements and open questions.
      - Decide the final requirements on its own, without asking any of the stakeholders.
      - Choose the app vendor based on its general knowledge.
      - Write the code for the app before the requirements are known.
    answer:
      - A
    explanation: Claude giúp phân tích yêu cầu (cấu trúc hoá ghi chú, nêu câu hỏi mở); quyết định cuối vẫn qua các bên liên quan.
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K104
    exams:
      CCAO-F: D4
    stem: Which task is the best first use case for Claude in an accounts payable team?
    options:
      - Signing off the quarterly accounts.
      - Drafting standard replies to supplier payment queries, reviewed before sending.
      - Approving supplier invoices for payment automatically, without any human check.
      - Changing supplier bank details whenever someone requests it.
    answer:
      - B
    explanation: "Ca sử dụng tốt: lặp lại, có người duyệt, rủi ro thấp. Thanh toán, đổi thông tin ngân hàng là điểm dễ bị gian lận, cần kiểm soát của người."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K105
    exams:
      CCAO-F: D4
    stem: Your team spends hours each week writing similar status emails. What is the best way to optimize this with Claude?
    options:
      - Stop sending status emails altogether.
      - Ask each person to write their own prompt from scratch every week.
      - Create a reusable prompt template in a Project and have a person review each email.
      - Have Claude send all of the status emails automatically, with no one reviewing them.
    answer:
      - C
    explanation: "Tối ưu quy trình: chuẩn hoá prompt dùng lại trong Project, giữ bước duyệt."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K106
    exams:
      CCAO-F: D4
    stem: How can Claude best support planning a move to a new office?
    options:
      - Choose the new office location by itself, using public listings it can find.
      - Sign the lease on the company's behalf once the plan is complete.
      - Book the movers directly without checking the dates with the team.
      - Draft a checklist and timeline that the facilities team then validates.
    answer:
      - D
    explanation: Claude hỗ trợ lập kế hoạch; người phụ trách xác nhận, ra quyết định và ký kết.
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K107
    exams:
      CCAO-F: D4
    stem: You are designing a customer feedback survey with Claude. What is the most effective way to work?
    options:
      - Draft it, test it on a few colleagues, then refine it with Claude based on feedback.
      - Accept Claude's first draft as it is and send it to all of your customers straight away.
      - Ask Claude to send the survey to customers directly.
      - Ask for 50 questions so that nothing is missed.
    answer:
      - A
    explanation: "Thiết kế giải pháp theo vòng lặp: nháp, thử nghiệm nhỏ, chỉnh theo phản hồi."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K108
    exams:
      CCAO-F: D4
    stem: A team reads every inbound email to route it to the right department. How could Claude redesign this workflow?
    options:
      - Staff stop reading emails entirely and Claude makes every routing decision alone.
      - Claude suggests a department for each email, and staff confirm or correct it.
      - Claude deletes any emails it thinks are unimportant.
      - Claude replies to every email without telling staff.
    answer:
      - B
    explanation: "Tái thiết kế quy trình: Claude gợi ý, người xác nhận; giữ kiểm soát và học từ chỉnh sửa."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K109
    exams:
      CCAO-F: D4
    stem: A finance director asks how accurate Claude will be at summarizing contracts. What is the most honest answer?
    options:
      - It cannot read contracts at all, because legal language is too complex.
      - Accuracy does not really matter, since summaries are only for reference.
      - Usually helpful but not error-free, so we will test it on samples and keep review.
      - It is always 100% accurate on contracts, so no review step is needed once it has been set up.
    answer:
      - C
    explanation: "Truyền đạt giá trị và giới hạn trung thực: hữu ích nhưng có thể sai, nên thử nghiệm và giữ bước duyệt."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: T06
    exams:
      CCAO-F: D4
    stem: When designing how a team works with Claude, what should be clearly defined?
    options:
      - Which individual employee will be blamed and disciplined whenever Claude makes a mistake.
      - How to hide Claude's involvement from customers.
      - That Claude's output never needs to be checked.
      - Who reviews Claude's output and who is accountable for the final decision.
    answer:
      - D
    explanation: "Làm việc người–AI hiệu quả cần rõ vai trò: ai duyệt, ai chịu trách nhiệm quyết định cuối."
    ref: lessons/16-capabilities-enterprise.html#human-agent-teams
  - id: K110
    exams:
      CCAO-F: D4
    stem: Staff worry that Claude will be used to monitor their performance. What is the best way to address this?
    options:
      - Explain clearly what Claude will and will not be used for, in line with company policy.
      - Ignore the concern, since worries like this usually pass on their own.
      - Tell staff that how the company uses its tools is none of their business.
      - Promise anything that will stop the questions.
    answer:
      - A
    explanation: Minh bạch về phạm vi sử dụng AI, đúng chính sách, giúp xây dựng lòng tin.
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K111
    exams:
      CCAO-F: D4
    stem: After a three-month pilot of Claude in customer support, which evidence best supports expanding it?
    options:
      - One enthusiastic email from a team member who enjoyed using the tool.
      - Measured changes in handling time and quality scores, compared with the period before.
