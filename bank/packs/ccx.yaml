    explanation: Lỗi truy cập (cần quyết định có thử lại) khác với kết quả rỗng hợp lệ (truy vấn chạy tốt nhưng không có kết quả). Gộp hai trường hợp làm báo cáo khẳng định “không có nghiên cứu” trong khi thực ra chưa tìm được. Phải ghi nhận là khoảng trống độ phủ. Lỗi tìm kiếm không có nghĩa là kết quả tồn tại. Model lớn hơn không sửa lỗi truy cập. Hai trường hợp đòi hỏi hành động khác nhau.
