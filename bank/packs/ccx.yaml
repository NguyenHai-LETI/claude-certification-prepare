    stem: A user wants Claude in Chrome to log into their online banking and pay several bills automatically. What is the most appropriate guidance?
    options:
      - Proceed, since safety classifiers make prompt injection on banking sites impossible.
      - Proceed, but only after asking Claude to promise it will be careful with payments.
