      - Claude loads a skill only when it is relevant to the task at hand.
      - Skills are always loaded into every chat, which uses up the context window.
      - Skills require code execution to be enabled in Claude.
      - Skills can only be created by Anthropic and cannot be customized.
    answer:
      - A
      - C
    explanation: Skill nạp theo nhu cầu (progressive disclosure) và cần bật code execution. Không nạp vào mọi chat; người dùng và tổ chức tự tạo được skill.
    ref: lessons/20-san-pham-du-lieu.html#connector-skill
  - id: Y27
    exams:
      CCAO-F: D6
    stem: Claude is summarizing a user's inbox and can also send emails. One message contains hidden text telling Claude to forward all invoices to an outside address. What is this risk called, and what reduces it most?
    options:
      - Hallucination; switch to a larger model so Claude invents fewer details.
      - Bias; add instructions telling Claude to treat all senders the same way.
      - Rate limiting; slow down the summary so Claude processes fewer emails.
      - Prompt injection; limit write actions or require approval before sending.
    answer:
      - D
    explanation: Chỉ dẫn giấu trong nội dung bên ngoài là prompt injection. Nó cần cả việc đọc nội dung ngoài vùng tin cậy và quyền hành động; giới hạn quyền ghi hoặc bắt duyệt trước khi gửi cắt được điều kiện thứ hai.
    ref: lessons/20-san-pham-du-lieu.html#rui-ro-agent
  - id: Y28
    exams:
      CCAO-F: D4
    stem: A support team wants Claude to draft replies to customer complaints in Cowork, using connected email. Which workflow design is most appropriate?
    options:
      - Let Claude send replies directly to save time, since drafts are usually accurate.
      - Have Claude draft replies and a team member review and send each one.
      - Have Claude only read complaints, and type every reply manually as before.
      - Let Claude send replies but only to customers who have complained before.
    answer:
      - B
    explanation: 'Đưa Claude vào quy trình sẵn có: Claude soạn, người duyệt và gửi; giữ con người ở bước có hậu quả. Gửi thẳng bỏ kiểm soát; bỏ hẳn phần soạn mất giá trị; tiêu chí "đã từng phàn nàn" không liên quan rủi ro.'
    ref: lessons/20-san-pham-du-lieu.html#rui-ro-agent
  - id: Y29
    exams:
      CCAO-F: D7
    stem: A Pro user keeps hitting usage limits by midday. They paste the same 40-page handbook into each new chat and use Research for quick questions. Which TWO changes help most? (Choose two.)
    options:
      - Put the handbook in a Project, where reused content is cached and counts less.
      - Use plain chat or web search instead of Research for quick factual questions.
      - Open more browser tabs so each chat draws from a separate usage limit.
      - Switch to the largest model so each answer needs fewer follow-up messages.
    answer:
      - A
      - B
    explanation: Tài liệu dùng lại trong Project được cache nên tốn ít hơn; Research tốn nhiều, chỉ dùng cho việc cần thu thập rộng. Mọi nơi dùng Claude tính chung một hạn mức; model lớn tốn hạn mức nhanh hơn.
    ref: lessons/20-san-pham-du-lieu.html#gioi-han
  - id: Y30
    exams:
      CCAO-F: D7
    stem: After a three-hour chat about a product launch, Claude starts mixing up earlier decisions. What is the best next step?
    options:
      - Keep going and repeat each decision in every new message as a reminder.
      - Ask Claude to summarize the key decisions, then continue in a new chat with that summary.
      - Switch to incognito mode so earlier messages no longer affect the answers.
      - Report a bug, because Claude should recall every message perfectly regardless of length.
    answer:
      - B
    explanation: "Chat quá dài làm chất lượng giảm: tóm tắt quyết định chính rồi mở chat mới kèm tóm tắt (hoặc đưa vào Project). Lặp lại mỗi tin tốn hạn mức; incognito không mang bối cảnh; không phải lỗi."
    ref: lessons/20-san-pham-du-lieu.html#gioi-han
  - id: Y31
    exams:
      CCAO-F: D2
    stem: Claude's summary of a supplier contract confidently states “the penalty clause is in section 12.4.” The summary goes to the legal team today. What should the associate do?
    options:
      - Send it, since Claude stated the section number confidently and precisely.
      - Ask Claude how confident it is and send it if Claude says above 90%.
      - Reformat the summary into a table so the section numbers are easier to read.
      - Check section 12.4 against the original contract before sending the summary.
    answer:
      - D
    explanation: Model có thể bịa chi tiết trông rất cụ thể. Trích dẫn gửi cho bộ phận pháp lý phải đối chiếu với văn bản gốc. Độ tin cậy tự báo không phải kiểm chứng; định dạng lại không sửa nội dung.
    ref: lessons/20-san-pham-du-lieu.html#cau-mau
  - id: Y32
    exams:
      CCAO-F: D4
    stem: A department head asks whether Claude can fully automate approval of employee expense claims, including integration with the finance system. What should a Claude associate do?
    options:
      - Build it alone with chat prompts, since associates can configure any integration.
      - Explain the value and limits, and escalate the integration design to developers or architects.
      - Reject the idea, because AI should never be used anywhere near financial processes.
      - Promise full automation by next week to keep the department head satisfied.
    answer:
      - B
    explanation: Associate giải thích giá trị và giới hạn cho các bên, và chuyển phần tích hợp, tự động hoá phức tạp cho developer, architect. Tự làm vượt phạm vi; cấm hẳn là cực đoan; hứa quá mức là thiếu trung thực.
    ref: lessons/20-san-pham-du-lieu.html#cau-mau
  - id: Y33
    exams:
      CCAO-F: D1
    stem: A user asks Claude to “write something about our Q3 results” and gets a vague, generic paragraph. What is the best way to improve the prompt?
    options:
      - Repeat the same request with “please be better” added at the end.
      - State the audience, purpose, key figures, length and format, and attach the Q3 data.
      - Switch to a different AI tool, since Claude cannot write about financial results.
      - Ask for ten versions at once and pick whichever one sounds the most confident.
    answer:
      - B
    explanation: Prompt nghiệp vụ tốt nêu người đọc, mục đích, dữ liệu, độ dài, định dạng và đính kèm nguồn. Thêm "làm tốt hơn" không thêm thông tin; đổi công cụ không giải quyết gốc; chọn bản "nghe tự tin" không phải đánh giá.
    ref: lessons/20-san-pham-du-lieu.html#cau-mau
  - id: Y34
    exams:
      CCAO-F: D1
    stem: An associate must produce a market-entry memo covering competitors, regulations, pricing and risks. What is the most effective way to approach it with Claude?
    options:
      - Ask for the entire memo in one prompt with no other context, then send it.
      - Break it into parts (competitors, regulations, pricing, risks), review each, then combine.
      - Ask Claude only for the conclusion, since the supporting sections are rarely read.
      - Copy a memo from another market and ask Claude to replace the country names.
    answer:
      - B
    explanation: "Việc lớn thì chia nhỏ: từng phần được làm và kiểm kỹ rồi mới ghép. Một prompt cho tất cả thiếu kiểm soát; bỏ phần căn cứ làm kết luận khó kiểm chứng; chép memo khác dễ sai bối cảnh."
    ref: lessons/20-san-pham-du-lieu.html#cau-mau
  - id: Y35
    exams:
      CCAO-F: D4
    stem: Leadership asks an associate to explain what Claude will and won't do in a new customer-support workflow. Which message is most accurate?
    options:
      - Claude will handle every customer case end to end, so the support team can be reduced right away.
      - Claude drafts replies and summarizes cases faster; staff still review sensitive or high-impact replies.
      - Claude cannot help customer support, because it often makes mistakes with names and dates.
      - Claude is always correct when it sounds confident, so its replies need no further checking.
    answer:
      - B
    explanation: Giao tiếp với các bên phải nêu cả giá trị (soạn nháp, tóm tắt nhanh) lẫn giới hạn (người duyệt ca nhạy cảm, có hậu quả). Hứa tự động hoá toàn bộ, phủ nhận hoàn toàn, hay tin vào giọng tự tin đều sai.
    ref: lessons/20-san-pham-du-lieu.html#cau-mau
  - id: Q09
    exams:
      CCAO-F: D1
    stem: "A prompt reads: “Create a three-column table of region, revenue and growth; compare with last quarter before concluding; write for the executive team without jargon.” Which 4D Description elements does it cover?"
    options:
      - Product only, since the table format is the only concrete instruction given
      - "Product, Process and Performance: the output, the method, and the quality bar"
      - Delegation and Diligence, since it decides what AI does and who is accountable
      - Discernment only, because it asks Claude to evaluate last quarter's numbers
    answer:
      - B
    explanation: Bảng ba cột là Product (đầu ra), so sánh quý trước rồi kết luận là Process (cách làm), viết cho ban giám đốc không biệt ngữ là Performance (mức chất lượng, cách cư xử). Delegation, Diligence, Discernment là các chiều khác của 4D.
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: Q10
    exams:
      CCAO-F: D7
    stem: Claude's draft explainer is accurate but too technical for the sales team. Which follow-up best reflects the discernment loop?
    options:
      - “Rewrite this, it isn't good.”
      - “Paragraph two is too technical; simplify it for non-engineers and keep the figures.”
      - “Start over from scratch with a completely different structure and new examples.”
      - “Make it sound more confident so the sales team trusts the explanation more.”
    answer:
      - B
    explanation: "Discernment: đọc kỹ, chỉ đúng chỗ chưa đạt, góp ý cụ thể rồi lặp lại. Góp ý chung chung không cho Claude biết sửa gì; làm lại từ đầu bỏ phần đã đúng; nghe tự tin hơn không phải tiêu chí chất lượng."
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: Q11
    exams:
      CCAO-F: D6
    stem: Before publishing a client newsletter drafted with Claude, which action best reflects the Diligence dimension?
    options:
      - Asking Claude to confirm that every fact in the newsletter is correct
      - Running the draft through Claude again to make the wording more polished
      - Reviewing and fact-checking it, taking responsibility, and being open about AI use per policy
      - Publishing quickly, since speed was the main reason for using AI in the first place
    answer:
      - C
    explanation: "Diligence là chịu trách nhiệm về những gì gửi đi: duyệt, kiểm chứng, minh bạch về việc dùng AI theo chính sách. Hỏi Claude tự xác nhận không phải kiểm chứng; đánh bóng câu chữ không đảm bảo đúng; gửi vội bỏ trách nhiệm."
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: Q12
    exams:
      CCAO-F: D4
    stem: A team is choosing a new supplier. Applying the Delegation dimension, how should work be split between Claude and people?
    options:
      - Claude compiles and compares supplier information; people verify it and make the final choice.
      - Claude makes the final supplier choice, since it can weigh more data than any person.
      - People do everything manually, because supplier choices are too important for AI.
      - Claude signs the contract through a connector once its comparison is complete.
    answer:
      - A
    explanation: "Delegation: giao cho AI phần hợp (thu thập, so sánh nháp), giữ phán đoán và quyết định có hệ quả lớn cho con người. Để AI quyết định hay ký thay bỏ trách nhiệm; tự làm hết thì bỏ phí giá trị của AI."
    ref: lessons/15-claude-101-fluency.html#ai-fluency
  - id: Z01
    exams:
      CCAR-F: D1
    scenario: S1
    stem: In your support agent, the system prompt says “never refund more than $500 without a manager,” yet logs show three such refunds last month. What is the most reliable fix?
    options:
      - Repeat the rule in capital letters at both the start and the end of the system prompt.
      - Add few-shot examples of the agent escalating refunds above $500 to a manager.
      - Intercept `process_refund` calls in code and route amounts above $500 to escalation.
      - Lower the temperature so the agent follows the written refund rule more consistently.
    answer:
      - C
    explanation: "Quy tắc nghiệp vụ có hậu quả tài chính cần cơ chế tất định: chặn lời gọi tool bằng code (hook PreToolUse hoặc cổng trong vòng lặp) và chuyển sang escalation. Lời dặn, few-shot, temperature chỉ giảm xác suất."
    ref: lessons/21-lab-ccar-f.html#lab-ex1
  - id: Z02
    exams:
      CCAR-F: D2
    scenario: S1
    stem: "`process_refund` fails because the order is outside the 30-day return window. What should the tool return to the agent?"
    options:
      - A generic “Operation failed” message so internal policy details are not exposed.
      - An empty successful result, so the conversation can continue without interruption.
      - An error with category transient and isRetryable true, so the agent tries again later.
      - An error with category business, isRetryable false, and a clear explanation for the customer.
    answer:
      - D
    explanation: Vi phạm chính sách là lỗi business, không thử lại được; kèm lời giải thích để agent nói với khách. Thông báo chung chung không giúp phục hồi; trả rỗng là nuốt lỗi; gắn transient làm agent thử lại vô ích.
    ref: lessons/21-lab-ccar-f.html#lab-ex1
  - id: Z03
    exams:
      CCAR-F: D1
    scenario: S1
    stem: "A customer writes: “Order 123 never arrived, order 456 was charged twice, and please update my email.” How should the agent handle this?"
    options:
      - Answer only the first issue, then ask the customer to send the others separately.
      - Escalate immediately, because messages with several issues are too complex for agents.
      - Split the request into three concerns, handle each with the right tools, and reply once.
      - Ask the customer to choose which single issue is the most important one to resolve.
    answer:
      - C
    explanation: Yêu cầu nhiều vấn đề thì tách từng mục, xử lý từng mục (có thể song song) rồi tổng hợp một câu trả lời. Bắt khách gửi lại hay chọn một việc đẩy việc cho khách; escalate ngay là quá tay khi các việc nằm trong khả năng.
    ref: lessons/21-lab-ccar-f.html#lab-ex1
  - id: Z04
    exams:
      CCAR-F: D3
    scenario: S2
    stem: A new hire clones the repository, but Claude Code does not follow the team's API conventions that everyone else gets. The conventions live in a senior developer's `~/.claude/CLAUDE.md`. What should change?
    options:
      - Move the conventions into the project's CLAUDE.md or `.claude/rules/` and commit them.
      - Ask the new hire to copy the senior developer's home-directory CLAUDE.md manually.
      - Add the conventions to `.claude/settings.local.json` so each developer loads them.
      - Run `/memory` on the new hire's machine so it imports the senior developer's rules.
    answer:
      - A
    explanation: Chỉ dẫn cho cả đội phải ở cấp project và commit vào repo. File ở thư mục nhà là cấp user, không chia sẻ; chép tay dễ lệch; `settings.local.json` không chứa chỉ dẫn và không commit; `/memory` chỉ xem file đang nạp.
    ref: lessons/21-lab-ccar-f.html#lab-ex2
  - id: Z05
    exams:
      CCAR-F: D3
    scenario: S2
    stem: Team members need a shared GitHub MCP server, and one developer also wants a personal experimental server. Which TWO configurations are correct? (Choose two.)
    options:
      - Put the shared server in the project's `.mcp.json` with `${GITHUB_TOKEN}` for the credential.
      - Put the personal experimental server in the developer's `~/.claude.json`.
      - Commit the GitHub token inline in `.mcp.json` so everyone has working credentials.
      - Put both servers in `CLAUDE.md` as instructions so Claude can connect to them.
    answer:
      - A
      - B
    explanation: Server dùng chung ở `.mcp.json` của project, secret qua biến môi trường; server cá nhân ở `~/.claude.json`. Hai server dùng được cùng lúc. Commit token làm lộ secret; CLAUDE.md không cấu hình được MCP.
    ref: lessons/21-lab-ccar-f.html#lab-ex2
  - id: Z06
    exams:
      CCAR-F: D3
    scenario: S2
    stem: A `/analyze-deps` skill produces thousands of lines and should only be able to read files. Which frontmatter fits?
    options:
      - "`context: fork` and `allowed-tools: Read, Grep, Glob`"
      - "`argument-hint: deps` and `allowed-tools: Bash`"
      - "`context: shared` and `allowed-tools: Write, Edit`"
      - '`paths: ["**/*"]` and `context: main`'
    answer:
      - A
    explanation: "`context: fork` chạy skill trong context riêng để output dài không làm bẩn hội thoại chính; `allowed-tools` giới hạn ở công cụ đọc. Bash, Write, Edit vượt quyền cần; `paths` là của rule, `context: shared`, `context: main` không phải giá trị đúng."
    ref: lessons/21-lab-ccar-f.html#lab-ex2
  - id: Z07
    exams:
      CCAR-F: D4
    scenario: S6
    stem: Your extraction retries fix date-format errors, but documents missing a purchase-order number still fail after three retries. What should you conclude?
    options:
      - Retry more times, since the model eventually finds the number on a later attempt.
      - Retries cannot recover information that is absent; make the field nullable or route to review.
      - Switch to a larger model, because smaller models miss values hidden in long documents.
      - Remove the field from the schema entirely, since unreliable fields should never be extracted.
    answer:
      - B
    explanation: Retry có ích với lỗi định dạng, cấu trúc; vô ích khi thông tin không có trong tài liệu. Để trường nullable, hoặc chuyển người xem khi trường đó bắt buộc với nghiệp vụ. Thử thêm hay đổi model không tạo ra dữ liệu không tồn tại; bỏ trường là quá tay.
    ref: lessons/21-lab-ccar-f.html#lab-ex3
  - id: Z08
    exams:
      CCAR-F: D4
    scenario: S6
    stem: Contracts must be processed within 30 hours of arrival using the Message Batches API, which may take up to 24 hours. What is the longest interval between batch submissions that still guarantees the SLA?
    options:
      - Every 24 hours
      - Every 12 hours
      - Every 6 hours
      - Every 30 hours
    answer:
      - C
    explanation: "Thời gian chờ tối đa tới lần gửi cộng 24 giờ xử lý phải không vượt 30 giờ: 6 + 24 = 30. Mỗi 12 giờ thành 36 giờ, mỗi 24 giờ thành 48 giờ, đều vượt SLA."
    ref: lessons/21-lab-ccar-f.html#lab-ex3
  - id: Z09
    exams:
      CCAR-F: D5
    scenario: S6
    stem: An extraction pipeline reports 96% overall accuracy, and the team wants to stop human review of high-confidence outputs. What should happen first?
    options:
      - Stop review now, since 96% is above the team's target accuracy threshold.
      - Measure accuracy by document type and field, using stratified samples of high-confidence results.
      - Ask the model to rate its confidence more strictly before removing human review.
      - Keep reviewing only the documents that users have complained about in the past.
    answer:
      - B
    explanation: Độ chính xác tổng có thể che giấu kết quả kém ở một loại tài liệu hoặc một trường. Đo theo loại và theo trường, lấy mẫu phân tầng trên kết quả tin cậy cao, rồi mới giảm duyệt. Điểm tự tin tự báo không phải bằng chứng.
    ref: lessons/21-lab-ccar-f.html#lab-ex3
  - id: Z10
    exams:
      CCAR-F: D1
    scenario: S3
    stem: Your coordinator launches the web-search and document-analysis subagents one after the other, and research takes twice as long as expected. What should change?
    options:
      - Have the coordinator emit both Task calls in a single response so they run in parallel.
      - Merge both subagents into one agent with all tools so that no delegation is needed.
      - Raise `max_tokens` on the coordinator so it can plan both subagents more quickly.
      - Let each subagent start the next one directly instead of returning to the coordinator.
    answer:
      - A
    explanation: Muốn chạy song song thì coordinator phát nhiều lời gọi Task trong cùng một response. Gộp agent mất chuyên môn hoá và cô lập context; `max_tokens` không liên quan; subagent gọi nhau phá mô hình hub-and-spoke.
    ref: lessons/21-lab-ccar-f.html#lab-ex4
  - id: Z11
    exams:
      CCAR-F: D1
    scenario: S3
    stem: A synthesis subagent writes reports without the source URLs that the search subagent found. The coordinator assumed the synthesis agent would “see” the earlier results. What is the fix?
    options:
      - Enable automatic context inheritance so subagents share the coordinator's history.
      - Ask the synthesis subagent to search the web again to rediscover the sources.
      - Pass the findings, with their URLs, explicitly in the synthesis subagent's prompt.
      - Store the URLs in CLAUDE.md so that every subagent loads them at startup.
    answer:
      - C
    explanation: Subagent có context riêng, không thừa hưởng lịch sử của coordinator. Mọi thứ nó cần phải đưa rõ trong prompt, tốt nhất ở dạng có cấu trúc giữ nguồn. "Thừa hưởng tự động" không tồn tại; tìm lại tốn kém; CLAUDE.md không dành cho dữ liệu từng phiên.
    ref: lessons/21-lab-ccar-f.html#lab-ex4
  - id: Z12
    exams:
      CCAR-F: D5
    scenario: S3
    stem: The document-analysis subagent times out on two of five sources. What should it return to the coordinator?
    options:
      - Nothing until all five sources succeed, so the report is never incomplete.
      - Results from the three sources as if they were complete, to avoid confusion.
      - A generic failure message, after which the coordinator stops the whole run.
      - "The three results plus a structured error: failure type, queries tried, what is missing."
    answer:
      - D
    explanation: Trả kết quả một phần kèm lỗi có cấu trúc để coordinator đi tiếp và ghi chú độ phủ trong báo cáo. Chờ đủ có thể không bao giờ xong; giả như đầy đủ là nuốt lỗi; dừng cả hệ vì một lỗi là anti-pattern.
    ref: lessons/21-lab-ccar-f.html#lab-ex4
  - id: Z13
    exams:
      CCAR-F: D5
    scenario: S4
    stem: A developer-productivity agent loses track of class names it found earlier while exploring a large codebase and starts referring to “typical patterns.” Which action fits the exam's context-management guidance?
    options:
      - Move the codebase index into a vector database and query it through embeddings.
      - Record key findings in a scratchpad file and delegate focused questions to subagents.
      - Switch the agent to streaming responses so earlier findings stay in the output.
      - Request a higher rate limit so the agent can reread the codebase more often.
    answer:
      - B
    explanation: "Phiên dài bị suy giảm: ghi phát hiện chính vào scratchpad, giao câu hỏi cụ thể cho subagent, tóm tắt giữa các giai đoạn. Vector database, streaming, rate limit đều nằm ngoài phạm vi CCAR-F và không chữa vấn đề chú ý."
    ref: lessons/21-lab-ccar-f.html#pham-vi
  - id: Z14
    exams:
      CCAR-F: D3
    scenario: S5
    stem: The CI pipeline runs Claude Code to review pull requests and post inline comments. Which invocation matches the exam guide?
    options:
      - '`claude "review this PR"` with `CLAUDE_HEADLESS=1` set in the CI environment'
      - '`claude --batch "review this PR"` so it runs without waiting for user input'
      - '`claude "review this PR" < /dev/null` so the job never waits for interactive input'
      - '`claude -p "review this PR" --output-format json --json-schema review.schema.json`'
