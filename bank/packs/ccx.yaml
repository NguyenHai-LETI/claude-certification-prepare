    exams:
      CCDV-F: D7
    stem: You want Claude Code to never run `terraform destroy`. The rule is in CLAUDE.md, but it was ignored once. What should you do?
    options:
      - Repeat the rule in CLAUDE.md in bold capitals and move it to the very top of the file.
      - Block it with a PreToolUse hook (matcher `Bash`) or a `deny` rule in settings.
