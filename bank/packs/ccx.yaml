      - The chat stays out of history and memory, but is retained for 30 days and included in org exports.
    answer:
      - D
    explanation: Incognito không lưu vào lịch sử và memory, không dùng để huấn luyện, nhưng vẫn được giữ 30 ngày vì an toàn; ở Team, Enterprise nó nằm trong bản xuất dữ liệu và Compliance API. Nó không bị xoá ngay lập tức.
    ref: lessons/20-san-pham-du-lieu.html#du-lieu-goi
  - id: Y08
    exams:
      CCAO-F: D6
    stem: An analyst needs to study salary distribution by department using a spreadsheet that contains employee names and bank account numbers. What is the best approach?
