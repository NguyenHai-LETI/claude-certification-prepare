      - Upload the full file and tell Claude not to remember the names or account numbers.
      - Upload it to a personal Pro account, since personal plans do not share data with employers.
      - Remove names and account numbers first, then analyze with the company-approved plan.
      - Skip using Claude entirely, because no AI tool may ever process any salary data.
    answer:
      - C
    explanation: Bỏ dữ liệu định danh không cần cho phân tích và dùng gói được tổ chức phê duyệt. Lời dặn không phải kiểm soát; tài khoản cá nhân có thể vi phạm chính sách công ty; bỏ hẳn việc là cực đoan.
    ref: lessons/20-san-pham-du-lieu.html#du-lieu-goi
  - id: Y09
    exams:
      CCAO-F: D6
    stem: Who controls data such as data exports and retention settings for a company's Claude Enterprise organization?
