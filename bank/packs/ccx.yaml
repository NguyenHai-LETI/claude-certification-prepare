    ref: lessons/09-ccao-f.html#xu-ly-su-co
  - id: X01
    exams:
      CCDV-F: D5
    stem: A Python service calls the Claude API with the `requests` library and a hand-written retry loop. During peak hours it fails on 529 errors that the team never handled. What is the most appropriate change?
    options:
      - Switch to the official Anthropic Python SDK, which retries 429, 5xx and connection errors with backoff.
      - Keep `requests` but add a fixed one-second sleep before every request to reduce load on the API.
      - Open a persistent WebSocket connection to the API so requests reuse one connection during peaks.
      - Lower `max_tokens` on every request so that each call finishes faster and avoids overload errors.
    answer:
      - A
    explanation: SDK chính thức bọc REST API và đã có retry với exponential backoff cho 408, 409, 429, 5xx (gồm 529) và lỗi kết nối. Ngủ cố định không xử lý lỗi; Messages API không có WebSocket; `max_tokens` không liên quan tới quá tải phía server.
    ref: lessons/19-api-nang-cao.html#rest-sdk
  - id: X02
    exams:
      CCDV-F: D5
    stem: A developer sends a raw HTTPS request to `/v1/messages` with a valid `x-api-key` and JSON body, but receives a 400 error. Which required header is most likely missing?
    options:
      - "`authorization: Bearer <key>`, because the API ignores `x-api-key` on POST requests"
      - "`anthropic-version`, which selects the API version the request is written against"
      - "`anthropic-beta`, which every Messages API request must send to enable tool use"
      - "`accept: text/event-stream`, which every Messages API request must send to get a reply"
    answer:
      - B
    explanation: "Request REST cần `x-api-key`, `anthropic-version` và `content-type: application/json`. `anthropic-beta` chỉ dùng khi bật tính năng beta; `text/event-stream` chỉ liên quan streaming; API key đi qua `x-api-key`."
    ref: lessons/19-api-nang-cao.html#rest-sdk
  - id: X03
    exams:
      CCDV-F: D2
    stem: A team wants a browser chat UI to show Claude's answer token by token. What is the recommended architecture?
    options:
      - Call the Messages API directly from browser JavaScript with streaming enabled and the key in a config file.
      - Open a WebSocket from the browser straight to api.anthropic.com and subscribe to the model's token events.
      - "Have the backend call the API with `stream: true` and relay the server-sent events to the browser."
      - Poll the Messages API from the browser every 200 ms and append whatever new text has been generated.
    answer:
      - C
    explanation: "Streaming của Messages API là SSE. Server giữ API key, gọi API với `stream: true` rồi chuyển tiếp sự kiện xuống trình duyệt (SSE hoặc WebSocket tuỳ kiến trúc). Gọi từ trình duyệt làm lộ key; API không có WebSocket hay cơ chế poll từng phần."
    ref: lessons/19-api-nang-cao.html#rest-sdk
  - id: X04
    exams:
      CCDV-F: D5
    stem: Before running a nightly job over 50,000 contracts, you need an accurate estimate of input tokens per document for the model you will use. What should you do?
    options:
      - Divide each document's character count by four, which matches Claude's tokenizer for most languages.
      - Run each document through `tiktoken`, since all modern LLM tokenizers produce nearly identical counts.
      - "Send each document to the Messages API with `max_tokens: 1` and read the usage from the response."
      - Call the `count_tokens` endpoint with the same model and request content you plan to send.
    answer:
      - D
    explanation: "`count_tokens` đếm theo tokenizer của đúng model, không sinh output. Quy tắc 4 ký tự và tokenizer của hãng khác lệch nhiều (nhất là code, tiếng Việt). Gọi Messages API thật vẫn tốn tiền và hạn mức cho 50.000 request."
    ref: lessons/19-api-nang-cao.html#dem-token
  - id: X05
    exams:
      CCDV-F: D5
    stem: "Your app caches a 120,000-token system prompt. A response shows `input_tokens: 85`, `cache_read_input_tokens: 120000`, `cache_creation_input_tokens: 0`. How many input tokens did the model actually process?"
    options:
      - 85, because `input_tokens` is always the total number of input tokens in the request
      - 120,085, the sum of cached reads, cache writes and the uncached input after the last breakpoint
      - 120,000, because the uncached part of the prompt is not processed when a cache hit occurs
      - 0, because a full cache hit means the model reuses its previous answer without reading input
    answer:
      - B
    explanation: Tổng input = `cache_read_input_tokens` + `cache_creation_input_tokens` + `input_tokens`. `input_tokens` chỉ là phần sau điểm cache cuối. Cache lưu tiền tố đã xử lý, không lưu câu trả lời.
    ref: lessons/19-api-nang-cao.html#dem-token
  - id: X06
    exams:
      CCDV-F: D2
    stem: Users can paste arbitrarily long text into your summarization feature, and some requests fail because they exceed the context window. What is the best first safeguard?
    options:
      - Count the tokens of the assembled request before sending, and chunk or reject input above a threshold.
      - Silently truncate every pasted text to its first 10,000 characters before building the request.
      - Increase `max_tokens` to the model's maximum so that the request has more room for the long input.
      - Retry the failed request three times with exponential backoff, since the error may be transient.
    answer:
      - A
    explanation: Đếm token trước rồi chia nhỏ hoặc từ chối rõ ràng là cách đúng. Cắt âm thầm làm mất nội dung; tăng `max_tokens` chiếm thêm chỗ của chính context window; lỗi quá kích thước không phải lỗi tạm thời nên retry vô ích.
    ref: lessons/19-api-nang-cao.html#dem-token
  - id: X07
    exams:
      CCDV-F: D2
    stem: A batch script fires 400 parallel requests at once and many return 429 with a `retry-after` header, even though the per-minute total is under the organization's limits. What is the best fix?
    options:
      - Retry each failed request immediately in a tight loop until it succeeds, to keep throughput high.
      - Lower `max_tokens` on every request, since output token reservations count against the limit.
      - Cap concurrency, honor `retry-after` with backoff, and spread requests evenly over time.
      - Create a second API key in the same workspace and split the requests across the two keys.
    answer:
      - C
    explanation: Rate limit dùng token bucket và có thể áp theo khoảng ngắn; burst lớn vẫn dính 429 dù tổng phút chưa vượt. Giới hạn đồng thời, chờ đúng `retry-after`, rải tải. OTPM đếm token thật chứ không đếm `max_tokens`; hạn mức tính theo tổ chức nên thêm key không tăng hạn mức.
    ref: lessons/19-api-nang-cao.html#rate-limit
  - id: X08
    exams:
      CCDV-F: D5
    stem: Your RAG service is hitting its input-tokens-per-minute (ITPM) limit. Every request includes the same 30,000-token policy manual followed by a short question. Which change raises effective throughput without a tier increase?
    options:
      - Move the manual into the user message instead of the system prompt so it is counted differently.
      - Cache the manual with prompt caching, because tokens read from cache do not count toward ITPM.
