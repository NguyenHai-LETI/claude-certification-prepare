      - A system prompt instruction describing both number formats and asking the agent to convert them.
      - Using only one OCR provider from now on, even though it handles fewer document languages.
    answer:
      - B
    explanation: "Chuẩn hoá định dạng không đồng nhất từ nhiều tool bằng PostToolUse hook: tất định, trước khi model xử lý."
    ref: lessons/03-agent.html#hook-sdk
  - id: C243
    exams:
      CCAR-F: D1
    scenario: S6
    stem: Extracted records must pass validation before they are written to the ERP. The agent occasionally writes first. What is the reliable control?
