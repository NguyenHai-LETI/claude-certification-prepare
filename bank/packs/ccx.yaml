      - It can speed up review by summarizing terms and flagging risks; approval stays with people.
      - Yes, it can approve the contracts on its own once it has read the company's purchasing policy.
      - No, it cannot help with contracts at all, because legal text is too complex.
      - It is only useful for writing the emails that accompany each contract.
