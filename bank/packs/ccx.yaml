    explanation: "Bối cảnh chung cho một loại việc lặp lại đặt vào Project: tài liệu vào kho, giọng văn vào instructions. Dán lại tốn công và hạn mức; memory dành cho thông tin cá nhân, không thay kho tài liệu; incognito bỏ mất bối cảnh."
