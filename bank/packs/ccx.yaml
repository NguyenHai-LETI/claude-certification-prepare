  - id: G16
    exams:
      CCDV-F: D4
    stem: Your agent fails with HTTP 400 on the second turn. The trace shows the `tool_result` block has no `tool_use_id`. What kind of problem is this, and how is it fixed?
    options:
      - A model output problem; fix it with clearer prompting and better examples.
