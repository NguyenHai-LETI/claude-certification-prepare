      - The push runs without asking, because local settings have higher precedence than team ones.
      - The push is denied outright, because ask and allow rules conflict for the same command.
    answer:
      - A
    explanation: Thứ tự đánh giá là deny → ask → allow, độ cụ thể không đổi được thứ tự. Danh sách quyền gộp giữa các cấp, nên luật ask của đội vẫn áp dụng.
    ref: lessons/05-claude-code.html#settings
  - id: E24
    exams:
      CCDV-F: D3
    stem: Your team has a `/deploy` skill that pushes to production. You want people to run it explicitly, and Claude must never start it on its own because a request looked related. Which frontmatter setting fits?
    options:
      - "`disable-model-invocation: true`"
      - "`user-invocable: false`"
      - "`user-invocable: false` with `context: fork`"
      - "`argument-hint: [env]`"
    answer:
      - A
    explanation: "`disable-model-invocation: true` để chỉ người dùng gọi được, hợp với workflow có tác dụng phụ. `user-invocable: false` thì ngược lại: ẩn khỏi menu, chỉ Claude gọi. `context: fork` chỉ cho skill chạy trong subagent riêng, không ngăn Claude tự gọi."
    ref: lessons/05-claude-code.html#command-skill
  - id: Y01
    exams:
      CCAO-F: D6
    stem: An HR team wants Claude to screen 400 job applications and send rejection emails automatically to candidates it ranks lowest. What does Anthropic's Usage Policy require?
    options:
      - Nothing extra, since screening applications is an ordinary business operation.
      - A qualified person must review and be able to change each outcome, and candidates must be told AI was used.
      - The team must stop, because employment decisions are prohibited uses of Claude in every case.
      - The team only needs to add “be fair to all candidates” to the prompt before running the screening.
    answer:
      - B
    explanation: "Sàng lọc, loại ứng viên là khuyến nghị rủi ro cao trong lĩnh vực việc làm: được làm, nhưng cần người có chuyên môn xem xét và có quyền sửa trước khi quyết định, và phải báo cho ứng viên có AI tham gia. Không bị cấm hẳn; lời dặn trong prompt không phải biện pháp kiểm soát."
    ref: lessons/20-san-pham-du-lieu.html#usage-policy
  - id: Y02
    exams:
      CCAO-F: D6
    stem: Which of these tasks is NOT a high-risk AI recommendation under the Usage Policy?
    options:
      - Recommending which specific funds a client should buy for their retirement account
      - Deciding whether a tenant's rental application should be approved or denied
      - Drafting an internal summary of how a new tax law works for the finance team
      - Determining whether an insurance claim should be paid out to the policyholder
    answer:
      - C
    explanation: Soạn tóm tắt nội bộ giải thích luật mà không áp vào hoàn cảnh của một người cụ thể không phải khuyến nghị rủi ro cao. Khuyến nghị đầu tư cá nhân, duyệt thuê nhà, quyết định bồi thường bảo hiểm đều thuộc lĩnh vực rủi ro cao.
    ref: lessons/20-san-pham-du-lieu.html#usage-policy
  - id: Y03
    exams:
      CCAO-F: D6
    stem: A clinic uses Claude to draft personalized medication guidance for patients. A nurse reviews each draft before it is sent. What else does the Usage Policy require?
    options:
      - Patients must be clearly told that AI was used to produce the guidance.
      - Every message must name Claude and the exact model version that was used.
      - The clinic must also get written approval from Anthropic for each message.
      - Nothing else, since a nurse's review fully replaces any other requirement.
    answer:
      - A
    explanation: Khuyến nghị rủi ro cao cần cả người có chuyên môn duyệt lẫn công bố cho người nhận rằng có AI tham gia. Không bắt buộc nêu tên Claude hay model; không cần Anthropic duyệt từng tin.
    ref: lessons/20-san-pham-du-lieu.html#usage-policy
  - id: Y04
    exams:
      CCAO-F: D6
    stem: A marketing associate asks Claude to write social posts that pretend to come from real customers to make a product look popular. How should this be handled?
    options:
      - Proceed if the posts are positive and the product genuinely works well for customers.
      - Proceed if a manager reviews the posts before they are published on social media.
      - Decline, because fake personas that mislead audiences violate the Usage Policy.
      - Proceed, but add a small disclaimer that the posts were edited for length only.
    answer:
      - C
    explanation: Tạo nhân vật giả hoặc gán nội dung sai nguồn để lừa người xem là việc bị cấm trong Universal Usage Standards. Người duyệt hay chú thích mơ hồ không biến việc bị cấm thành được phép.
    ref: lessons/20-san-pham-du-lieu.html#usage-policy
  - id: Y05
    exams:
      CCAO-F: D6
    stem: An employee asks whether their company's Claude Team plan chats are used to train Anthropic's models. What is accurate by default?
    options:
      - Yes, all chats are used unless each employee opts out in their personal settings.
      - No, inputs and outputs from commercial plans are not used for training by default.
      - Only chats that include uploaded files are used, to improve document understanding.
      - Yes, but only after the organization's data retention period has fully expired.
    answer:
      - B
    explanation: Mặc định Anthropic không dùng input, output từ gói thương mại (Team, Enterprise, API) để huấn luyện, trừ khi gửi feedback hoặc tổ chức đồng ý. Gói cá nhân mới có cài đặt cải thiện model do người dùng chọn.
    ref: lessons/20-san-pham-du-lieu.html#du-lieu-goi
  - id: Y06
    exams:
      CCAO-F: D6
    stem: A user on a Pro plan wants to make sure their conversations are not used to improve Claude. What should they do?
    options:
      - Keep the model improvement setting turned off in their privacy settings.
      - Write “do not use this for training” at the start of every conversation.
      - Delete the Claude app and use the website instead, which never trains.
      - Switch to Haiku, because smaller models are not trained on user chats.
    answer:
      - A
    explanation: Ở gói cá nhân, việc dùng chat để cải thiện model do cài đặt riêng tư quyết định. Lời dặn trong chat không có tác dụng; web hay app, model nào cũng theo cùng cài đặt đó.
    ref: lessons/20-san-pham-du-lieu.html#du-lieu-goi
  - id: Y07
    exams:
      CCAO-F: D6
    stem: A Team plan user opens an incognito chat to ask about a sensitive personnel issue. Which statement is accurate?
