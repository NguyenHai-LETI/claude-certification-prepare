    explanation: "Tách lỗi tầng tích hợp (HTTP 4xx/5xx, parse lỗi, thiếu `tool_use_id`: sửa bằng code) khỏi lỗi đầu ra model (chọn sai tool, bịa: sửa bằng prompt, mô tả, schema)."
