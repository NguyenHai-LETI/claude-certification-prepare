    ref: lessons/07-context.html#human-review
  - id: G14
    exams:
      CCAR-F: D5
    scenario: S3
    stem: Two credible sources report different market sizes for the same year. How should the document-analysis subagent handle this?
    options:
      - Average the two values and report that mean as the single market size for the year.
      - Keep only the more recent value and drop the older source.
      - Report both values with their sources and flag the conflict for the coordinator.
      - Omit the statistic, since the sources disagree.
