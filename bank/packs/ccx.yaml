      - Have an owner provision a skill with the template and steps for the org.
      - Create one large Project that every meeting in the company must use.
    answer:
      - C
    explanation: "Quy trình lặp lại dùng ở nhiều nơi, cần thống nhất: đóng gói thành skill do chủ tổ chức cấp; đổi mẫu thì sửa một lần. Dán tay và memory cá nhân dễ lệch; ép mọi cuộc họp vào một Project là gượng ép."
    ref: lessons/20-san-pham-du-lieu.html#connector-skill
  - id: Y26
    exams:
      CCAO-F: D5
    stem: Which TWO statements about skills in Claude are accurate? (Choose two.)
