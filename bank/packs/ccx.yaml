id: ccx
title: Bộ câu tự soạn từ tài liệu ôn tập công khai (artifact 3NhHr42…)
origin: imported
source: https://claude.ai/artifact/3NhHr42CxTHGEs33N1ntFf
license: Không ghi giấy phép. Tài liệu ôn tập cá nhân, không thuộc và không được Anthropic xác nhận.
imported: 2026-11-18
description: "Câu tiếng Anh như đề thật, giải thích tiếng Việt. Tác giả ghi: câu tự soạn theo task statement của Exam Guide v1.0, không lấy từ đề thật."
questions:
  - id: A01
    exams:
      CCDV-F: D2
    stem: Your app calls the Messages API. Some responses end mid-sentence and the response has `stop_reason` = `max_tokens`. What is the most appropriate fix?
    options:
      - Retry the identical request until a response arrives that is not truncated.
      - Raise `max_tokens` for this route, or ask the model to continue where it stopped.
      - Add “keep answers short” to the system prompt so every answer fits the limit.
      - Switch the request to streaming, which removes the output token limit for the call.
    answer:
      - B
    explanation: "`max_tokens` nghĩa là câu trả lời bị cắt vì chạm giới hạn đã đặt. Tăng giới hạn hoặc yêu cầu viết tiếp. Gửi lại y hệt sẽ bị cắt tương tự; streaming chỉ đổi cách nhận dữ liệu, không bỏ giới hạn; ép “ngắn gọn” làm giảm chất lượng mà không giải quyết gốc."
    ref: lessons/01-api-tich-hop.html#stop-reason
  - id: A02
    exams:
      CCDV-F: D2
    stem: During a traffic spike your service receives HTTP 429 `rate_limit_error` responses. What should the client do?
    options:
      - Retry immediately in a tight loop until the request succeeds.
      - Treat it as a permanent failure and surface an error to the user.
      - Back off, honoring the `retry-after` header, then retry.
      - Rotate to an API key from another workspace to bypass the limit.
    answer:
      - C
    explanation: 429 là lỗi tạm thời, retry được nhưng phải backoff (ưu tiên theo header `retry-after`). Retry dồn dập làm tình hình tệ hơn; đổi key để lách giới hạn là sai cách vận hành.
    ref: lessons/01-api-tich-hop.html#loi-http
  - id: A03
    exams:
      CCDV-F: D2
    stem: A request fails with HTTP 400 `invalid_request_error`. Which handling is correct?
    options:
      - Retry with exponential backoff, because 400 errors are usually transient under load.
      - Inspect and fix the request (parameters, message format); a resend will fail again.
      - Wait about 60 seconds for the limit window to reset, then resend the same payload.
      - Switch to another cloud provider endpoint, since the first-party API rejected it.
    answer:
      - B
    explanation: "4xx (trừ 429) là lỗi của chính request: sai tham số, sai định dạng, thiếu trường. Gửi lại y hệt luôn lỗi. Chỉ 429, 500, 529 (và lỗi kết nối) mới nên retry."
    ref: lessons/01-api-tich-hop.html#loi-http
  - id: A04
    exams:
      CCDV-F: D2
    stem: Your logs show occasional HTTP 529 `overloaded_error` responses. What is the right client behavior?
    options:
      - Retry with exponential backoff.
      - Fix the request body, because 529 indicates malformed JSON.
      - Revoke and rotate the API key.
      - Lower `max_tokens` to 1 so the request is accepted.
    answer:
      - A
    explanation: "529 nghĩa là phía API đang quá tải: lỗi tạm thời, retry kèm exponential backoff. Không liên quan tới định dạng request hay key."
    ref: lessons/01-api-tich-hop.html#loi-http
  - id: A05
    exams:
      CCDV-F: D2
    stem: A chatbot built on the Messages API “forgets” what the user said two turns ago. The code sends only the newest user message on each request. What is the fix?
    options:
      - Pass a `conversation_id` so the API looks up the earlier turns on the server.
      - Enable prompt caching so the API remembers previous messages between calls.
      - Send the full conversation history in `messages` on every request.
      - Put the earlier turns in `stop_sequences` so the model keeps them in mind.
    answer:
      - C
    explanation: "Messages API không lưu trạng thái: mỗi request phải mang theo lịch sử cần thiết. Prompt caching chỉ giảm chi phí cho phần tiền tố lặp lại, không phải bộ nhớ; `conversation_id` không phải tham số của API."
    ref: lessons/01-api-tich-hop.html#request
  - id: A06
    exams:
      CCDV-F: D2
    stem: Where should a persistent role description and global rules go in a Messages API request?
    options:
      - In the top-level `system` parameter.
      - As the first element of `messages` with role `system`.
      - In `stop_sequences`.
      - In the `metadata` field.
    answer:
      - A
    explanation: "`system` là tham số riêng ở cấp cao nhất của request. Message có role system không được đứng đầu mảng `messages`; `metadata` và `stop_sequences` không dùng để chỉ dẫn model."
    ref: lessons/01-api-tich-hop.html#request
  - id: A07
    exams:
      CCDV-F: D2
    stem: When streaming a response, which server-sent event carries the final `stop_reason` and the output token usage?
    options:
      - "`message_start`"
      - "`content_block_delta`"
      - "`message_delta`"
      - "`ping`"
    answer:
      - C
    explanation: "Thứ tự sự kiện: `message_start` → các `content_block_start/delta/stop` → `message_delta` (có `stop_reason` và usage) → `message_stop`. `ping` chỉ giữ kết nối."
    ref: lessons/01-api-tich-hop.html#streaming
  - id: A08
    exams:
      CCDV-F: D2
    stem: A feature generates long reports. Users stare at a blank screen for a minute and some requests hit HTTP timeouts. What should you change first?
    options:
      - Move the feature to the Message Batches API to avoid the HTTP timeouts.
      - Stream the response so text appears as it is generated.
      - Lower the temperature so the model writes a shorter report.
      - Split the report into parallel requests and concatenate the parts.
    answer:
      - B
    explanation: Streaming vừa hiện chữ dần cho người dùng vừa tránh timeout với output dài. Batch có thể mất tới 24 giờ, không hợp với người đang chờ; chia nhỏ song song làm mất mạch văn.
    ref: lessons/01-api-tich-hop.html#streaming
  - id: A09
    exams:
      CCDV-F: D2
      CCAR-F: D4
    scenario: S6
    stem: You need to regenerate 50,000 product descriptions over the weekend. Nobody is waiting on the results and cost is the top priority. Which approach fits best?
    options:
      - Synchronous calls with maximum concurrency using an async client.
      - The Message Batches API.
      - Fast mode on the most capable model.
      - Streaming each request.
    answer:
      - B
    explanation: "Khối lượng lớn, không gấp: Message Batches API rẻ hơn khoảng 50%, xử lý trong tối đa 24 giờ. Fast mode tăng tốc nhưng đắt hơn; streaming không giảm chi phí."
    ref: lessons/01-api-tich-hop.html#batch
  - id: A10
    exams:
      CCDV-F: D2
      CCAR-F: D4
    scenario: S6
    stem: After a batch finishes, how should you match each result to its original request?
    options:
      - Results are returned in the same order as the requests.
      - By the `custom_id` you assigned to each request.
      - By the timestamp on each result.
      - Submit one request per batch so matching is unnecessary.
    answer:
      - B
    explanation: Kết quả batch có thể về theo thứ tự bất kỳ; luôn ghép theo `custom_id`. Một request mỗi batch thì mất hết lợi ích của batch.
    ref: lessons/01-api-tich-hop.html#batch
  - id: A11
    exams:
      CCDV-F: D2
      CCAR-F: D4
    scenario: S5
    stem: To save money, a team moves its pre-merge code review check (which blocks merging until it passes) to the Message Batches API. What is the main problem?
    options:
      - Batches cannot include a system prompt, so the review rules would be lost.
      - Batches cost more per token than synchronous calls once the queue is long.
      - Batches have no latency guarantee (up to 24 hours), so they cannot gate a merge.
      - Batches cannot process source code or diffs; they only accept natural-language text.
    answer:
      - C
    explanation: Batch không cam kết độ trễ nên không dùng cho bước chặn như kiểm tra trước merge. Hợp với báo cáo qua đêm, audit hằng tuần.
    ref: lessons/01-api-tich-hop.html#batch
  - id: A12
    exams:
      CCDV-F: D2
    stem: You want Claude to analyze a 40-page PDF contract through the API. What is the standard way to send it?
    options:
      - Convert every page to plain text first and paste the whole contract into the system prompt.
      - Send a `document` content block (base64, or a `file_id` from the Files API).
      - PDF input is not supported by the API; run OCR outside and send the text.
      - Put the base64-encoded PDF string in the request `metadata` field.
    answer:
      - B
    explanation: PDF gửi bằng content block `document`; ảnh dùng block `image`. Files API cho phép tải một lần, tham chiếu nhiều lần bằng `file_id`.
    ref: lessons/01-api-tich-hop.html#vision
  - id: A13
    exams:
      CCDV-F: D2
    stem: Your company requires that all model inference be billed and governed through its existing AWS account and IAM policies. How should you call Claude?
    options:
      - Through Amazon Bedrock.
      - Through the first-party API with an AWS IP allowlist.
      - Self-host Claude model weights on EC2.
      - Through the Message Batches API.
    answer:
      - A
    explanation: Claude có trên Amazon Bedrock, Google Vertex AI, Microsoft Foundry. Mỗi nền tảng có model ID, cách xác thực riêng và tính năng mới có thể đến chậm hơn. Trọng số model không được phát hành để tự host.
    ref: lessons/01-api-tich-hop.html#nen-tang
  - id: A14
    exams:
      CCDV-F: D2
    stem: Production behavior changed unexpectedly the day a new model version was released. Your code refers to a moving model alias. What is the best long-term fix?
    options:
      - Lower the temperature to 0 so outputs stay identical across model versions.
      - Pin a versioned model ID in production and re-run evals before upgrading.
      - Add “behave exactly as the previous version did” to the system prompt.
      - Retry each request until the output matches the old style, then cache it.
    answer:
      - B
    explanation: Ghim model ID cụ thể để hành vi không đổi bất ngờ; nâng cấp có chủ đích sau khi đọc migration guide và chạy lại eval.
    ref: lessons/01-api-tich-hop.html#cau-hinh
  - id: A15
    exams:
      CCDV-F: D2
    stem: Prompts are edited directly in an admin dashboard and nobody can tell which change caused last week's quality drop. What practice addresses this?
    options:
      - Keep prompts in version control and run the eval suite on every prompt change.
      - Let each developer keep their own local copy of the prompts and compare by hand.
      - Move every prompt into CLAUDE.md so Claude Code can track the changes.
      - Freeze all prompts permanently so that quality can never drift again.
    answer:
      - A
    explanation: "Prompt là code: lưu trong git, gắn phiên bản, chạy eval khi đổi để truy được nguyên nhân hồi quy."
    ref: lessons/01-api-tich-hop.html#cau-hinh
  - id: A16
    exams:
      CCDV-F: D2
    stem: An interactive feature must summarize 200 short documents within about a minute. Which implementation is most appropriate?
    options:
      - Use the async client with `asyncio.gather` and a semaphore capping concurrency.
      - Fire all 200 requests at once with no concurrency limit so they finish together.
      - Process the documents one by one in a loop to stay under the rate limit.
      - Submit a Message Batch and poll every few seconds until all results are in.
    answer:
      - A
    explanation: Song song bằng async client nhưng giới hạn số request đồng thời để không dính 429. Tuần tự quá chậm; batch không có cam kết thời gian.
    ref: lessons/01-api-tich-hop.html#async
  - id: A17
    exams:
      CCDV-F: D2
    stem: What does the official Anthropic SDK do by default when a request fails?
    options:
      - Never retries anything; every retry and backoff policy must be written by hand in your code.
      - Retries connection errors, 408, 409, 429 and 5xx twice by default, with backoff.
      - Retries every failed request, including 400 and 401, until the SDK's timeout.
      - Retries indefinitely with a fixed one-second delay until the request succeeds.
    answer:
      - B
    explanation: SDK có sẵn retry mặc định 2 lần với exponential backoff cho lỗi kết nối, 408, 409, 429 và 5xx. Lỗi 4xx khác không được retry.
    ref: lessons/01-api-tich-hop.html#loi-http
  - id: A18
    exams:
      CCDV-F: D2
    stem: In which surface does Claude follow only the system prompt that you supply, with no product-level system prompt added by Anthropic?
    options:
      - claude.ai
      - Claude Desktop app
      - The Messages API
      - Claude Code
    answer:
      - C
    explanation: claude.ai và Desktop có system prompt riêng của Anthropic; Claude Code nạp thêm CLAUDE.md, skill, rule. Qua API, model chỉ có những gì bạn gửi.
    ref: lessons/01-api-tich-hop.html#giao-dien
  - id: A19
    exams:
      CCDV-F: D2
    stem: A response comes back with `stop_reason` = `refusal`. How should the integration handle it?
    options:
      - Retry the identical request in a loop until the model returns a normal answer.
      - Check `stop_reason` first; review the request or send it to a fallback path.
      - Treat it the same as `max_tokens` and increase the limit before resending.
      - Ignore it and display the content, since refusals still return a complete answer.
    answer:
      - B
    explanation: "`refusal` là model từ chối vì lý do an toàn. Luôn kiểm tra `stop_reason` trước khi dùng content; gửi lại y hệt không giúp gì."
    ref: lessons/01-api-tich-hop.html#stop-reason
  - id: A20
    exams:
      CCDV-F: D2
    stem: A server tool (such as web search) runs for a long time and the response ends with `stop_reason` = `pause_turn`. What should you do?
    options:
      - Treat the turn as finished and show the partial answer to the user as the final result.
      - Append the response to the conversation and call the API again so it can continue.
      - Raise an error, because `pause_turn` means the server tool failed to run.
      - Switch to a client tool, since server tools cannot finish within one turn.
    answer:
      - B
    explanation: "`pause_turn`: lượt bị tạm dừng khi server tool chạy lâu. Gửi lại hội thoại (kèm nội dung vừa nhận) để model làm tiếp."
    ref: lessons/01-api-tich-hop.html#stop-reason
  - id: B01
    exams:
      CCDV-F: D5
    stem: You must classify millions of support tickets into eight categories with low latency and low cost. Quality on your eval is already acceptable with smaller models. Which model tier fits best?
    options:
      - Haiku
      - Opus at maximum effort
      - The most capable model available, with adaptive thinking
      - Sonnet with fast mode
    answer:
      - A
    explanation: "Việc đơn giản, khối lượng lớn, cần nhanh và rẻ: Haiku. Model mạnh để dành cho suy luận phức tạp, agent dài hơi."
    ref: lessons/02-model-toi-uu.html#chon-model
  - id: B02
    exams:
      CCDV-F: D5
    stem: What is the recommended method for choosing a model for a new feature?
    options:
      - Always start with the most capable model available to minimize the risk of quality issues.
      - Always use the cheapest model and fix any quality problems through prompting.
      - Set a quality bar, then pick the cheapest, fastest model that passes your evals.
      - Pick whichever model ranks highest on public benchmarks for the task type.
    answer:
      - C
    explanation: Đặt tiêu chí chất lượng trước, đo trên bộ eval của chính bài toán, rồi chọn model rẻ và nhanh nhất vẫn đạt.
    ref: lessons/02-model-toi-uu.html#chon-model
  - id: B03
    exams:
      CCDV-F: D5
    stem: "A product manager reports a “bug”: the same prompt returns differently worded answers on each run. Which response is most accurate?"
    options:
      - Variation is inherent to LLM sampling; rely on validation and tests, not identical text.
      - Setting temperature to 0 guarantees byte-identical outputs on every run of the same prompt.
      - It is an API bug and should be reported to Anthropic support with request IDs.
      - Passing the same random seed with each request makes outputs fully deterministic.
    answer:
      - A
    explanation: "Không tất định là đặc tính của LLM. Giảm ngẫu nhiên không bảo đảm tất định, nên vẫn cần validate và test. (Thực tế 11/2026: API version mới bỏ hẳn `temperature`, `top_p`, `top_k`.)"
    ref: lessons/02-model-toi-uu.html#khong-tat-dinh
  - id: B04
    exams:
      CCDV-F: D5
    stem: For which task is enabling extended or adaptive thinking most worthwhile?
    options:
      - Extracting a date field from millions of short, uniform emails.
      - Diagnosing a subtle concurrency bug across several services.
      - Translating short UI labels.
      - Returning a fixed greeting.
    answer:
      - B
    explanation: "Thinking đáng tiền cho bài suy luận nhiều bước: bug khó, kiến trúc, toán. Việc đơn giản khối lượng lớn thì để thấp để tiết kiệm."
    ref: lessons/02-model-toi-uu.html#thinking
  - id: B05
    exams:
      CCDV-F: D5
    stem: What does adaptive thinking mean?
    options:
      - The developer sets a fixed thinking budget per request.
      - The model decides when to think and how much, based on the task.
      - Thinking is disabled to save tokens.
      - The model thinks only on the first turn of a conversation, then stops.
    answer:
      - B
    explanation: "Adaptive thinking: model tự quyết khi nào và nghĩ bao nhiêu. Extended thinking kiểu cũ đặt ngân sách cố định bằng `budget_tokens` (model mới đã bỏ, điều chỉnh bằng effort)."
    ref: lessons/02-model-toi-uu.html#thinking
  - id: B06
    exams:
      CCDV-F: D5
    stem: What does raising the `effort` setting do?
    options:
      - Switches the request to a larger model in the same family automatically.
      - Trades speed and token spend for more thorough reasoning and work.
      - Increases the context window available for the conversation.
      - Only changes the formatting and length of the final output.
    answer:
      - B
    explanation: Effort là núm đánh đổi độ kỹ với tốc độ và token trong cùng một model. Effort thấp hợp với subagent, việc đơn giản.
    ref: lessons/02-model-toi-uu.html#thinking
  - id: B07
    exams:
      CCDV-F: D5
    stem: What is fast mode?
    options:
      - The same model generating output faster, at a premium price.
      - A cheaper mode that queues requests and returns them within an hour.
      - An alias that routes requests to the smallest, cheapest model.
      - A batch processing option.
    answer:
      - A
    explanation: "Fast mode: cùng model, sinh output nhanh hơn, giá cao hơn. Không dùng được với Batch API."
    ref: lessons/02-model-toi-uu.html#thinking
  - id: B08
    exams:
      CCDV-F: D5
    stem: Every request sends the same 20k-token tool definitions and system prompt, followed by a different user question. How should you apply prompt caching?
    options:
      - Put a `cache_control` breakpoint after tools and system; send the question after it.
      - Cache only the user question with `cache_control`, since it changes on every request.
      - Put the current timestamp at the start of the system prompt so caches stay fresh.
      - Add `cache_control` to every message in the conversation, including the question.
    answer:
      - A
    explanation: "Cache theo tiền tố: phần cố định để trước và đặt breakpoint sau nó; phần thay đổi để sau. Có giới hạn số breakpoint (4) và độ dài tối thiểu."
    ref: lessons/02-model-toi-uu.html#caching
  - id: B09
    exams:
      CCDV-F: D5
    stem: The system prompt starts with the current date and time. `usage.cache_read_input_tokens` is always 0. Why?
    options:
      - Changing the prefix invalidates everything after it; the timestamp breaks every hit.
      - The cache TTL is only one second, so every entry expires before the next request arrives.
      - Prompt caching only works with the Message Batches API, not with synchronous calls.
      - System prompts cannot be cached; only tool definitions and messages are cacheable.
    answer:
      - A
    explanation: Thứ tự cache là tools → system → messages; đổi một byte ở phía trước là mất cache của mọi phần sau. Dời phần biến động (thời gian, ID) ra sau breakpoint.
    ref: lessons/02-model-toi-uu.html#caching
  - id: B10
    exams:
      CCDV-F: D5
    stem: You change one tool definition in a cached request. Which cached content is invalidated?
    options:
      - Only the tools section; the system prompt and messages stay cached as before.
      - Tools, system and messages, because tools come first in the prefix.
      - Only the messages section, since it is the last part of the prefix.
      - Nothing, because tool definitions are cached separately from the prompt.
    answer:
      - B
    explanation: Tools đứng đầu tiền tố nên đổi tool làm mất cache của cả system và messages phía sau.
    ref: lessons/02-model-toi-uu.html#caching
  - id: B11
    exams:
      CCDV-F: D5
    stem: Which response fields should you log to track cost per request, including caching effects?
    options:
      - "The `usage` fields: input, output, cache creation and cache read tokens."
      - Only the HTTP response headers, which report the billed amount per call.
      - "`stop_reason` and `model`, which together determine the price of each call."
      - The length of the response text in characters, multiplied by the model price.
    answer:
      - A
    explanation: "Trường `usage` có `input_tokens`, `output_tokens`, `cache_creation_input_tokens`, `cache_read_input_tokens`: đủ để tính chi phí và kiểm tra cache có trúng không. Header HTTP, `stop_reason` hay độ dài chữ không cho biết số token bị tính tiền."
    ref: lessons/02-model-toi-uu.html#chi-phi
  - id: B12
    exams:
      CCDV-F: D5
    stem: What is the default lifetime of a prompt cache entry?
    options:
      - 5 minutes, with a longer 1-hour option available.
      - 24 hours, matching the Message Batches processing window.
      - Until the API key that created the entry is rotated.
      - 30 seconds, refreshed only when the prompt is edited.
    answer:
      - A
    explanation: TTL mặc định 5 phút (làm mới mỗi lần trúng), có tuỳ chọn 1 giờ. Ghi cache đắt hơn input thường một chút, đọc cache rẻ hơn nhiều.
    ref: lessons/02-model-toi-uu.html#caching
  - id: B13
    exams:
      CCDV-F: D5
    stem: A newer model version is released. What should you do before switching production traffic?
    options:
      - Switch immediately, because newer models are always better for every task.
      - Read the migration guide for breaking changes and re-run your evals on it.
      - Wait at least one year so other teams can find the problems first.
      - Upgrade production right away and ask users to report any problems they see.
    answer:
      - B
