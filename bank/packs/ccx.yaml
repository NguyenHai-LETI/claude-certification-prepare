    exams:
      CCAO-F: D7
    stem: A weekly workflow takes 2 hours because you paste the same background information into every new chat. How can you optimize it?
    options:
      - Put the background into a Project so every chat starts with it.
      - Use a smaller font so the background takes less space in the chat.
