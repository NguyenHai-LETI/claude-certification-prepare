      - The HTTP client, so that it validates every response against the API's JSON schema.
      - The prompt and tool descriptions, so Claude confirms which order the customer means.
      - The model choice, switching to a larger model so that it tracks conversation context.
    answer:
      - C
    explanation: Mọi lớp tích hợp đều đúng; lỗi bắt đầu ở lựa chọn của model, tức lỗi đầu ra. Sửa bằng prompt, mô tả tool, tiêu chí xác nhận (và có thể chặn bằng code khi rủi ro tài chính). Retry, validate HTTP không chạm tới lỗi; đổi model lớn là quá tay trước khi sửa gốc.
    ref: lessons/07-context.html#debug
  - id: G53
    exams:
      CCDV-F: D4
    stem: A developer reports that Claude “randomly” returns malformed JSON in a pipeline. What is the most effective first diagnostic step?
    options:
      - Ask Claude in the same session to explain why its previous outputs were malformed.
      - Inspect the logged traces of failing runs to find the first step where output diverges.
      - Lower the temperature and rerun the pipeline several times to see if the issue disappears.
      - Add “always return valid JSON” in capital letters at the top of the system prompt.
    answer:
      - B
    explanation: Đọc trace của các lần lỗi để tìm chặng đầu tiên sai, rồi mới chọn cách sửa (schema, strict tool, validate). Hỏi Claude tự giải thích là đoán; chỉnh temperature hay thêm lời dặn là sửa mò trước khi biết nguyên nhân.
    ref: lessons/07-context.html#debug
  - id: G54
    exams:
      CCDV-F: D4
    stem: After rewording a summarization prompt, a developer reads three outputs and says it “feels better”. Before shipping, what should they do?
    options:
      - Ship it, because the new outputs read better and manual review is the most reliable signal.
      - Ask the model to grade its own three outputs on a scale from 1 to 10 and ship above 8.
      - Ship it behind a feature flag and wait for user complaints to reveal any regressions.
      - Run both prompt versions on the existing eval set and compare scores before deciding.
    answer:
      - D
    explanation: Đổi prompt thì chạy lại bộ eval và so điểm hai phiên bản. Ba mẫu đọc bằng mắt không đủ; model tự chấm đầu ra của chính nó không thay được eval; chờ người dùng phàn nàn là để lỗi lọt ra production.
    ref: lessons/07-context.html#debug
  - id: G55
    exams:
      CCDV-F: D4
    stem: Which TWO failures should be fixed in application code rather than in prompts, schemas, or tool descriptions? (Choose two.)
    options:
      - Requests time out because a slow tool blocks the agent loop for several minutes.
      - Claude chooses `search_docs` when `search_tickets` was the appropriate tool.
      - The app crashes because it parses a `tool_use` input with string matching.
      - Claude invents a value for a field that the source document does not contain.
    answer:
      - A
      - C
    explanation: Timeout và lỗi parse (khớp chuỗi thay vì parse JSON) là lỗi tầng tích hợp, sửa bằng code. Chọn sai tool và bịa giá trị là lỗi đầu ra model, sửa bằng mô tả tool, schema (trường nullable), few-shot.
    ref: lessons/07-context.html#debug
  - id: G56
    exams:
      CCDV-F: D4
    stem: A classification feature passes 95% of eval cases overall, but most failures cluster on messages written in Vietnamese. What is the best next step?
    options:
      - Accept the result, since 95% overall accuracy is above most production thresholds.
      - Remove Vietnamese messages from the eval set because they are a minority of traffic.
      - Slice results by language, add more Vietnamese cases, and target that segment.
      - Switch to the largest model and rerun the eval without changing the eval set.
    answer:
      - C
    explanation: Tỷ lệ tổng có thể che giấu lỗi tập trung ở một nhóm. Chia kết quả theo nhóm, bổ sung ca cho nhóm yếu rồi sửa có mục tiêu. Bỏ ca khó làm eval mất giá trị; đổi model trước khi hiểu lỗi là quá tay.
    ref: lessons/07-context.html#debug
  - id: E62
    exams:
      CCDV-F: D3
    stem: A developer closed the terminal mid-task and wants to reopen the most recent Claude Code conversation in the same project directory. Which command fits?
    options:
      - "`claude --continue`"
      - "`claude --init`"
      - "`claude -p --batch`"
      - "`claude --fork`"
    answer:
      - A
    explanation: "`--continue` (`-c`) mở lại hội thoại gần nhất trong thư mục hiện tại; `--resume` dùng để chọn một phiên cụ thể theo id hoặc tên. `--init`, `--batch`, `--fork` dạng này không phải cách mở lại phiên (`--fork-session` chỉ dùng kèm `--resume` hoặc `--continue`)."
    ref: lessons/05-claude-code.html#ci-cd
  - id: E63
    exams:
      CCDV-F: D3
    stem: A CI job runs `claude -p` and a downstream script must react to each event (tool calls, messages) as it happens rather than waiting for the final result. Which output option fits?
    options:
      - "`--output-format text`, then split the output on blank lines as each event finishes."
      - "`--output-format stream-json`, which emits newline-delimited JSON events as they occur."
      - "`--output-format json`, which already sends partial results while the run continues."
      - Interactive mode without `-p`, piping the terminal UI into the downstream script.
    answer:
      - B
    explanation: "`stream-json` phát từng sự kiện JSON theo dòng khi chúng xảy ra. `json` trả một kết quả cuối cùng; `text` không có cấu trúc; bỏ `-p` thì job treo chờ người."
    ref: lessons/05-claude-code.html#ci-cd
  - id: E64
    exams:
      CCDV-F: D3
    stem: A developer joins an existing repository that has no CLAUDE.md. What is the quickest way to create a useful starting file?
    options:
      - Copy a CLAUDE.md from another company project and edit the project name at the top.
      - Run `/init`, which scans the repository and drafts a CLAUDE.md to review and refine.
      - Create `~/.claude/CLAUDE.md` so the instructions also apply to this repository.
      - Ask teammates to describe their conventions in each prompt instead of using a file.
    answer:
      - B
    explanation: "`/init` quét repo và tạo bản CLAUDE.md đầu tiên để chỉnh tiếp. Chép file của dự án khác dễ sai quy ước; file ở `~/.claude/` là cấp user, không chia sẻ với đội; nhắc lại trong từng prompt không bền."
    ref: lessons/05-claude-code.html#claude-md
  - id: E65
    exams:
      CCDV-F: D3
    stem: A developer adds `Bash(git push:*)` to `allow` in their `.claude/settings.local.json`, but the project's `.claude/settings.json` denies `Bash(git push:*)`. What happens when Claude tries to push?
    options:
      - The push runs, because local settings have higher priority than project settings.
      - The push runs, because the more specific allow rule overrides a general deny rule.
      - The push is blocked, because a deny rule at any level wins over allow rules.
      - Claude asks the user, because conflicting allow and deny rules fall back to ask.
    answer:
      - C
    explanation: Quyền được xét theo thứ tự deny, ask, allow; deny ở bất kỳ cấp nào thắng allow ở cấp khác. Thứ tự ưu tiên giữa các file áp cho khoá đơn, không cho phép allow khoét ngoại lệ trong deny.
    ref: lessons/05-claude-code.html#settings
  - id: E66
    exams:
      CCDV-F: D3
    stem: Which TWO belong in a project skill rather than in CLAUDE.md? (Choose two.)
    options:
      - A step-by-step release checklist that is only needed when someone cuts a release.
      - The team's code style rules that should apply to every edit in the repository.
      - A database migration procedure with helper scripts used a few times a month.
      - The command to run the test suite, which Claude needs in nearly every session.
    answer:
      - A
      - C
    explanation: Skill chỉ nạp khi cần, hợp với quy trình theo việc (release, migration kèm script). CLAUDE.md luôn được nạp, hợp với quy ước chung và lệnh dùng gần như mọi phiên.
    ref: lessons/05-claude-code.html#command-skill
  - id: U04
    exams:
      CCDV-F: D4
    stem: A team is building an eval for an extraction prompt and must choose between 30 hand-graded cases and 500 automatically graded cases with slightly noisier scoring. What does Anthropic's eval guidance favor?
    options:
      - 30 hand-graded cases, because human judgment is the only reliable signal for prompts.
      - 500 automatically graded cases, since volume generally beats a small hand-graded set.
      - No fixed set; spot-check a few live outputs each day instead of maintaining an eval.
      - 500 cases, but graded by the same prompt under test so the scoring stays consistent.
    answer:
      - B
    explanation: "Hướng dẫn eval của Anthropic ưu tiên số lượng: nhiều ca chấm tự động hơi nhiễu tốt hơn ít ca chấm tay. Kiểm vài mẫu mỗi ngày không phải eval; dùng chính prompt đang thử để chấm tạo thiên lệch."
    ref: lessons/17-building-api.html#module-2
  - id: U05
    exams:
      CCDV-F: D4
    stem: Which grading method fits checking whether an extracted invoice total exactly equals the expected number?
    options:
      - A model-based grader that rates the answer's quality on a 1–10 scale.
      - A human reviewer who reads each output and records a pass or fail mark.
      - A code-based grader that compares the extracted value with the expected one.
      - A second Claude call that asks the model whether it is confident in the value.
    answer:
      - C
    explanation: "So khớp chính xác là việc của grader bằng code: nhanh, rẻ, đáng tin, mở rộng được. Model-based và người chấm để dành cho tiêu chí chủ quan; hỏi model có tự tin không thì không phải chấm điểm."
    ref: lessons/17-building-api.html#module-2
  - id: U06
    exams:
      CCDV-F: D2
    stem: A RAG system over a long Markdown handbook often retrieves chunks that start mid-sentence and lose their section context. Which chunking change helps most?
    options:
      - Use structure-based chunks split on headings, with some overlap between chunks.
      - Use much larger fixed-size chunks so each chunk always contains a whole document.
      - Use single-sentence chunks so that every retrieved chunk is maximally precise.
      - Skip chunking and send the entire handbook in every request to avoid splits.
    answer:
      - A
    explanation: Tài liệu có cấu trúc rõ thì cắt theo tiêu đề và giữ overlap để chunk không đứt câu, giữ ngữ cảnh mục. Chunk quá lớn làm retrieval kém chính xác; một câu mỗi chunk mất ngữ cảnh; gửi cả cuốn tốn token và không mở rộng được.
    ref: lessons/17-building-api.html#module-5
  - id: U07
    exams:
      CCDV-F: D2
    stem: Users search an internal knowledge base with exact product codes like “XR-2210”, and pure embedding search often misses them. What is the best improvement?
    options:
      - Raise the number of embedding results returned from 5 to 50 for every query.
      - Switch to a larger embedding model, since bigger models capture codes better.
      - Ask Claude to guess the right document from the product code before retrieval.
      - Add lexical BM25 search alongside embeddings and merge the ranked results.
    answer:
      - D
    explanation: Mã sản phẩm là khớp từ khoá chính xác, thế mạnh của tìm kiếm lexical (BM25). Kết hợp với semantic search rồi gộp thứ hạng (hybrid). Lấy thêm kết quả embedding hay đổi model embedding vẫn yếu với chuỗi mã; để Claude đoán thì không có căn cứ.
    ref: lessons/17-building-api.html#module-5
  - id: U08
    exams:
      CCDV-F: D2
    stem: A team building RAG asks which Anthropic endpoint to call to generate embeddings. What is accurate?
    options:
      - Use the `/v1/embeddings` endpoint with the same API key as the Messages API.
      - Anthropic offers no embedding model; use a provider such as Voyage AI for embeddings.
      - Call the Messages API with `output_config` set to return a vector instead of text.
      - Use the `count_tokens` endpoint, which returns token vectors usable as embeddings.
    answer:
      - B
    explanation: Anthropic không cung cấp model embedding; tài liệu và khoá học dùng Voyage AI. `/v1/embeddings` của Anthropic không tồn tại; Messages API không trả vector; `count_tokens` chỉ trả số token.
    ref: lessons/17-building-api.html#module-5
  - id: U09
    exams:
      CCDV-F: D1
    stem: Incoming support emails fall into billing, technical, and account categories, each needing a different specialized prompt. Which workflow pattern fits?
    options:
      - "Routing: classify each email first, then send it to the matching specialized prompt."
      - "Parallelization: run all three specialized prompts on every email and pick the longest."
      - "Evaluator-optimizer: generate a reply and have a grader rewrite it until it scores 10."
      - A fully autonomous agent with all three prompts merged into one large system prompt.
    answer:
      - A
    explanation: Phân loại trước rồi chuyển tới pipeline chuyên biệt là routing. Chạy cả ba lãng phí; evaluator-optimizer giải bài khác (nâng chất lượng một đầu ra); gộp thành agent lớn mất tính dự đoán mà không cần thiết.
    ref: lessons/17-building-api.html#module-9
  - id: U10
    exams:
      CCDV-F: D1
    stem: Marketing copy must meet a brand rubric, and first drafts often miss one or two criteria that a reviewer can name. Which pattern fits best?
    options:
      - Prompt chaining with a fixed outline step, a draft step, and a translation step.
      - Routing each request to a model sized by the length of the requested copy.
      - "Evaluator-optimizer: a grader checks the draft against the rubric and gives feedback."
      - Parallelization that writes five drafts at once and returns all of them to the user.
    answer:
      - C
    explanation: "Có tiêu chí rõ và phản hồi cụ thể giúp bản sau tốt hơn: đúng chỗ của evaluator-optimizer (producer, grader, vòng phản hồi). Chaining cố định không có bước chấm; routing theo độ dài không liên quan; trả năm bản đẩy việc chấm cho người dùng."
    ref: lessons/17-building-api.html#module-9
  - id: U11
    exams:
      CCDV-F: D1
    stem: An agent edits a web page's CSS but has no way to check the result, so it often reports success on broken layouts. What should be added?
    options:
      - A stronger instruction telling the agent to be more careful when editing styles.
      - Environment inspection, such as a screenshot or test tool, to verify each change.
      - A higher `max_tokens` so the agent can describe its intended changes in more detail.
      - A rule that the agent must stop after exactly one edit to reduce compounding errors.
    answer:
      - B
    explanation: Agent cần quan sát kết quả hành động của mình (chụp màn hình, chạy test) để tự kiểm và sửa. Lời dặn "cẩn thận" không cho thông tin mới; `max_tokens` không liên quan; giới hạn một lần sửa bỏ mất khả năng tự sửa.
    ref: lessons/17-building-api.html#module-9
  - id: W03
    exams:
      CCDV-F: D8
    stem: 'A booking tool sometimes receives `"guests": "two"` instead of an integer, which crashes the handler. What is the most reliable fix?'
    options:
      - Add “guests must be a number” to the tool description and to the system prompt.
      - Catch the crash and retry the whole conversation from the beginning on failure.
      - Lower the temperature so the model is less likely to produce string values.
      - "Enable `strict: true` on the tool with a schema that sets `additionalProperties: false`."
    answer:
      - D
    explanation: Strict tool use ràng buộc việc sinh theo schema, nên input luôn đúng kiểu. Mô tả và lời dặn chỉ giảm xác suất; retry cả hội thoại tốn kém; temperature không bảo đảm kiểu dữ liệu.
    ref: lessons/18-tool-use.html#strict-mode
  - id: W04
    exams:
      CCDV-F: D8
    stem: When enabling strict tool use, which schema requirement must the tool's `input_schema` meet?
    options:
      - Every property must be optional so the model can omit fields it cannot fill.
      - "It must set `additionalProperties: false` and list its required fields."
      - It must avoid nested objects, because strict mode only supports flat schemas.
      - It must be written in YAML rather than JSON so the grammar can be compiled.
    answer:
      - B
    explanation: "Strict cần schema đóng: `additionalProperties: false` và khai `required`. Không bắt mọi trường optional; object lồng nhau vẫn được; schema vẫn là JSON Schema."
    ref: lessons/18-tool-use.html#strict-mode
  - id: W05
    exams:
      CCDV-F: D8
    stem: Claude returns three `tool_use` blocks in one response. How should the app send the results back?
    options:
      - Send three separate user messages, one `tool_result` each, in the order received.
      - Send only the first `tool_result` and let Claude request the other two again.
      - Send all three `tool_result` blocks together in a single user message.
      - Merge the three results into one text block without `tool_use_id` references.
    answer:
      - C
    explanation: Mọi `tool_result` của một lượt nằm trong một user message, mỗi khối đúng `tool_use_id`. Tách nhiều message làm Claude dần thôi gọi song song; bỏ bớt hay gộp thành text mất liên kết với lời gọi.
    ref: lessons/18-tool-use.html#parallel-tools
  - id: W06
    exams:
      CCDV-F: D8
    stem: One of three parallel tool calls throws an exception while the other two succeed. What should the app return?
    options:
      - "Two successful results plus one `tool_result` with `is_error: true` and a clear message."
      - Only the two successful results, silently dropping the failed call from the message.
      - An HTTP 500 to the end user, since any tool failure invalidates the whole turn.
      - Three empty results, so that Claude retries all three tools from the beginning.
    answer:
      - A
    explanation: "Trả đủ ba kết quả, khối lỗi có `is_error: true` kèm thông điệp rõ để Claude tự xử lý (thử lại, đổi hướng, báo người dùng). Bỏ khối lỗi gây lệch `tool_use_id`; dừng cả lượt hay trả rỗng là nuốt hoặc phóng đại lỗi."
    ref: lessons/18-tool-use.html#parallel-tools
  - id: W07
    exams:
      CCDV-F: D8
    stem: A payment workflow must run tools strictly one at a time because each call depends on the previous result. How can you prevent parallel tool calls?
    options:
      - "Set `disable_parallel_tool_use: true` in `tool_choice`, so at most one tool is called per turn."
      - Define only one tool in the request and merge every payment step into its input schema.
      - Tell Claude in the system prompt to never call more than one tool in a single response.
      - Set `max_tokens` low enough that the model can only fit one `tool_use` block per turn.
    answer:
      - A
    explanation: "`disable_parallel_tool_use: true` trong `tool_choice` giới hạn tối đa một lời gọi tool mỗi lượt. Gộp mọi bước vào một tool làm hỏng thiết kế; lời dặn chỉ là xác suất; cắt `max_tokens` dễ làm cụt câu trả lời."
    ref: lessons/18-tool-use.html#parallel-tools
  - id: W08
    exams:
      CCDV-F: D5
    stem: An agent loops through 200 employee records, calling a lookup tool for each and filtering the results, and every intermediate result fills the context. Which feature reduces tokens and round trips most?
    options:
      - Prompt caching on the tool definitions, so each of the 200 calls costs less to send.
      - Message Batches, so that the 200 lookups are processed overnight at a 50% discount.
      - Programmatic tool calling, where Claude writes code that calls the tool and filters results.
      - A larger context window model, so all 200 intermediate results fit in a single turn.
    answer:
      - C
    explanation: Programmatic tool calling cho Claude viết code chạy trong code execution, gọi tool nhiều lần và lọc kết quả; chỉ kết quả cuối vào context. Cache giảm giá phần lặp nhưng không giảm số vòng; Batches không hỗ trợ vòng tool nhiều lượt; context lớn hơn không bớt token.
    ref: lessons/18-tool-use.html#cost-optimization
  - id: W09
    exams:
      CCDV-F: D5
    stem: An app sends the same 40 tool definitions on every request, and only the user question changes. How should prompt caching be set up?
    options:
      - Put a cache breakpoint on the user question, since it is the last block in the request.
      - Reorder the tool list randomly on each request so that the cache stays fresh.
      - Add a timestamp to the system prompt so each cached entry can be identified later.
      - Keep the tool list stable and place a cache breakpoint after the tool definitions.
    answer:
      - D
    explanation: Cache theo tiền tố, thứ tự `tools`, `system`, `messages`. Giữ danh sách tool cố định và đặt điểm cache sau phần cố định. Đặt điểm cache ở câu hỏi thay đổi thì không trúng; đảo thứ tự tool hay thêm timestamp làm mất cache.
    ref: lessons/18-tool-use.html#cost-optimization
  - id: W10
    exams:
      CCDV-F: D8
    stem: Two tools, `search_orders` and `find_order`, take the same inputs and Claude picks between them inconsistently. What is the best fix?
    options:
      - Keep both tools and add few-shot examples showing when each one should be chosen.
      - Merge them into one well-described tool with a clear input contract.
      - Add a router model in front that decides which of the two tools to expose.
      - Rename them `tool_a` and `tool_b` so Claude relies only on their descriptions.
    answer:
      - B
    explanation: Hai tool chồng chéo cùng đầu vào thì gộp thành một tool mô tả rõ. Few-shot hay router là chữa triệu chứng và quá tay; tên vô nghĩa làm việc chọn tool khó hơn.
    ref: lessons/18-tool-use.html#tool-definition
  - id: A46
    exams:
      CCDV-F: D2
    stem: A business owner asks for “an AI that answers customer questions about our policies.” What should a developer do first to turn this into a buildable spec?
    options:
      - Pick the most capable model and start prototyping, since requirements emerge from demos.
      - Write a long system prompt covering every policy and hand it to the business owner to test.
      - "Define functional and non-functional requirements: sources, accuracy bar, latency, escalation."
      - Choose an agent framework first, because the framework decides what the system can do.
    answer:
      - C
    explanation: Đi từ yêu cầu nghiệp vụ tới yêu cầu chức năng (nguồn dữ liệu, phạm vi, khi nào chuyển người) và phi chức năng (độ chính xác, độ trễ, chi phí). Chọn model hay framework trước khi có tiêu chí là đặt ngược thứ tự.
    ref: lessons/01-api-tich-hop.html#giao-dien
  - id: A47
    exams:
      CCDV-F: D2
    stem: A model your production app uses has been marked deprecated with a retirement date. What is the right response?
    options:
      - Ignore it until the retirement date, since deprecated models keep working until then anyway.
      - "Plan a migration: run your evals on the recommended replacement, then switch deliberately."
      - Switch production to the replacement model immediately without testing to avoid surprises.
      - Move the workload to a third-party cloud, where deprecated models are supported indefinitely.
    answer:
      - B
    explanation: "Deprecated nghĩa là vẫn chạy nhưng có ngày ngừng; sau ngày retire request sẽ lỗi. Lên kế hoạch: chạy eval trên model thay thế, đổi có chủ đích. Chờ tới hạn rất rủi ro; đổi ngay không test có thể đổi hành vi; nền tảng khác cũng có lịch ngừng."
    ref: lessons/01-api-tich-hop.html#cau-hinh
  - id: A48
    exams:
      CCDV-F: D2
    stem: Several teams edit the production system prompt directly in a database, and nobody can tell which change caused a quality drop last week. What practice fixes this?
    options:
      - Keep prompts in version control with versions, review changes, and run evals on each change.
      - Restrict prompt edits to one senior engineer who remembers the history of each change.
      - Freeze the prompt permanently so no further changes can cause a quality regression.
      - Store a copy of the prompt in each request's metadata so it can be searched later.
    answer:
      - A
    explanation: "Prompt là code: lưu trong git, gắn phiên bản, review, chạy eval khi đổi để biết thay đổi nào gây giảm chất lượng. Dựa vào trí nhớ một người hay đóng băng prompt đều không bền; lưu vào metadata không cho so sánh và kiểm soát."
    ref: lessons/01-api-tich-hop.html#cau-hinh
  - id: A49
    exams:
      CCDV-F: D2
    stem: After launch, how should a team keep a Claude feature healthy over its life cycle?
    options:
      - Rely on users to report problems, then patch the prompt directly in production.
      - Re-tune the prompt weekly, regardless of metrics, to keep up with new models.
      - Monitor quality, latency, cost and errors; rerun evals before model or prompt changes.
      - Lock the model and prompt forever, since any change risks unexpected behavior.
    answer:
      - C
    explanation: Vận hành gồm giám sát chất lượng, độ trễ, chi phí, lỗi, và chạy lại eval trước mỗi thay đổi model hay prompt. Chờ người dùng báo, chỉnh định kỳ không theo số liệu, hay khoá vĩnh viễn (model sẽ bị retire) đều không bền.
    ref: lessons/01-api-tich-hop.html#cau-hinh
  - id: A50
    exams:
      CCDV-F: D2
    stem: "A requirements review lists three jobs: live chat replies, a nightly report on 20,000 tickets, and a pre-merge code check. Which mapping is correct?"
    options:
      - Batches for all three, since batching is always the cheapest way to call the API.
      - Real-time API for live chat and the pre-merge check; Message Batches for the report.
      - Real-time API for all three, since batch results arrive in an unpredictable order.
      - Batches for live chat and the report; real-time API only for the pre-merge check.
    answer:
      - B
    explanation: Người dùng đang chờ và bước chặn (trước merge) cần API đồng bộ; báo cáo hằng đêm khối lượng lớn hợp với Batches (rẻ 50%, tối đa 24 giờ). Thứ tự kết quả batch xử lý được bằng `custom_id`.
    ref: lessons/01-api-tich-hop.html#batch
  - id: DV01
    exams:
      CCDV-F: D2
    stem: A support chat must show the first words of an answer within one second. The system prompt is a 6,000-token policy that is identical on every request. Which design best meets this requirement?
    options:
      - Use the Message Batches API so that requests are processed asynchronously at a lower cost
      - Raise max_tokens so the model can finish its answer in a single response
      - Stream the response and cache the static policy prefix with prompt caching
      - Send the policy as a user message instead of in the system prompt on every request
    answer:
      - C
    explanation: Yêu cầu là độ trễ tới chữ đầu tiên. Streaming cho người dùng thấy chữ sớm; caching phần tĩnh giảm thời gian xử lý input. Batch có thể mất tới 24 giờ; max_tokens và vị trí policy không giải quyết độ trễ.
    ref: lessons/26-bo-sung-ccdv-f.html#yeu-cau-vong-doi
  - id: DV02
    exams:
      CCDV-F: D2
    stem: A company has standardized on AWS, with IAM roles and private networking for every service. It wants to add Claude to an internal application. Which option best fits this infrastructure requirement?
    options:
      - Use Claude through Amazon Bedrock so access follows the existing IAM model
      - Call the Claude API directly and store a shared API key in each service's configuration
      - Ask every employee to use claude.ai and paste results into the application
      - Self-host an open model so that no external provider is needed
    answer:
      - A
    explanation: "Yêu cầu hạ tầng (đã chuẩn hoá AWS, IAM) chỉ ra Bedrock: xác thực bằng IAM của cloud, không dùng x-api-key. Key dùng chung khó kiểm soát; claude.ai không phải tích hợp; tự host model khác không phải Claude."
    ref: lessons/26-bo-sung-ccdv-f.html#yeu-cau-vong-doi
  - id: DV03
    exams:
      CCDV-F: D2
    stem: A newer Claude model is released and benchmarks look better. Your production classifier currently passes its eval suite. What is the best next step?
    options:
      - Switch production to the new model today because newer models are always more accurate
      - Keep the current model forever so that the application behavior never changes again
      - Switch production first and rely on user complaints to reveal any regressions quickly
      - Run the existing eval suite against the new model, then roll out gradually if it passes
    answer:
      - D
    explanation: "Đổi model là một lần phát hành: model mới có thể đổi định dạng, độ dài, cách gọi tool. Chạy eval trước rồi mở dần. Giữ mãi model cũ thì sẽ gặp ngày retire; đổi trước rồi chờ khiếu nại là đẩy rủi ro sang người dùng."
    ref: lessons/26-bo-sung-ccdv-f.html#yeu-cau-vong-doi
  - id: DV04
    exams:
      CCDV-F: D2
    stem: During peak hours, about 2% of calls fail with HTTP 529. The business requires that customer requests are not lost. Which approach fits the availability requirement?
    options:
      - Immediately retry each failed request in a tight loop until it eventually succeeds
      - Retry with exponential backoff, and queue or fall back to another model when retries are exhausted
      - Return the 529 error to the customer and ask them to try again later
      - Raise max_tokens so that each request finishes before the server becomes overloaded
    answer:
      - B
    explanation: 529 là quá tải tạm thời. Retry có backoff, hết lượt thì đưa vào hàng đợi hoặc fallback để không mất request. Retry dồn dập làm quá tải nặng hơn; trả lỗi cho khách vi phạm yêu cầu; max_tokens không liên quan.
    ref: lessons/26-bo-sung-ccdv-f.html#yeu-cau-vong-doi
  - id: DV05
    exams:
      CCDV-F: D2
    stem: Answer quality dropped last week. The team cannot tell which prompt text was live when the bad answers were produced. Which practice would prevent this?
    options:
      - Keep the prompt in an environment variable on the server so it can be edited quickly
      - Ask the model to repeat its system prompt at the start of each answer for later auditing
      - Lower the temperature so that every answer is identical and easy to compare later
      - Store prompts in version control and log the prompt version and model ID with each request
    answer:
      - D
    explanation: Prompt cần phiên bản như code, và mỗi request log kèm phiên bản prompt và model ID để truy lỗi về đúng bản. Sửa nóng trong biến môi trường mất dấu vết; bắt model lặp system prompt làm lộ prompt; temperature không giúp truy vết.
    ref: lessons/26-bo-sung-ccdv-f.html#phien-ban
  - id: DV06
    exams:
      CCDV-F: D2
    stem: Your Claude Code plugin calls an MCP tool provided by another plugin, which you list as a bare string in dependencies. After that plugin released a new major version, your plugin broke for users. What is the best fix?
    options:
      - Copy the other plugin's files into your plugin so that you never depend on it again
      - Remove the dependency entry and ask every user to install the other plugin by hand
      - Declare the dependency as an object with a tested semver range, such as ~2.1.0
      - Set your own plugin's version field to the latest number so it updates in lockstep
    answer:
      - C
    explanation: Chuỗi trần theo bản mới nhất của marketplace, nên bản lớn đổi tên tool làm hỏng plugin của bạn. Khai báo { name, version } với dải semver đã test. Chép mã mất cập nhật bảo mật; bỏ khai báo làm người dùng tự lo; version của bạn không ghim plugin khác.
    ref: lessons/26-bo-sung-ccdv-f.html#phien-ban
  - id: DV07
    exams:
      CCDV-F: D2
    stem: 'A plugin declares { "name": "secrets-vault", "version": "~2.1.0" } in its dependencies. Which versions of secrets-vault can users receive on update?'
    options:
      - Patch releases in the 2.1.x line, but not 2.2 or later
      - Any release the marketplace publishes, including 3.0 and later
      - Exactly 2.1.0 and never any other version, including patches
      - Any 2.x release, such as 2.2 and 2.9, but not 3.0
    answer:
      - A
    explanation: Dải ~2.1.0 nhận các bản vá 2.1.x, không lên 2.2. Dải ^2.0 mới nhận mọi 2.x. Muốn đúng một bản thì dùng =2.1.0. Người duy trì plugin phụ thuộc phải gắn tag phát hành để dải tìm được bản.
    ref: lessons/26-bo-sung-ccdv-f.html#phien-ban
  - id: DV08
    exams:
      CCDV-F: D2
    stem: "Two developers on a team get different Claude Code behavior in the same repository: one is asked for permission to run tests, the other is not. What is the best way to make behavior consistent?"
    options:
      - Ask each developer to type the same allow rules into their own user settings file
      - Commit shared permissions to .claude/settings.json and review changes to it through pull requests
      - Put every permission rule into .claude/settings.local.json and commit that file too
      - Tell both developers to always run Claude Code with --dangerously-skip-permissions
    answer:
      - B
    explanation: Cấu hình dùng chung của đội nằm trong .claude/settings.json, commit vào repo và sửa qua PR. User settings là riêng mỗi người; settings.local.json để riêng và tự gitignore; bỏ qua quyền là mất an toàn.
    ref: lessons/26-bo-sung-ccdv-f.html#phien-ban
  - id: DV09
    exams:
      CCDV-F: D2
    stem: You must migrate a 400-file codebase from one HTTP client library to another using Claude Code. Many modules have no tests. Which plan is most appropriate?
    options:
      - Ask Claude to convert the entire repository in one session and open a single large pull request
      - Convert the files that fail to compile first and skip the files that still appear to work
      - Generate the new code with a high temperature so that Claude explores more alternatives
      - Add behavior-preserving tests, plan in plan mode, then migrate in small batches verified by CI
    answer:
      - D
    explanation: "Refactor lớn: test giữ hành vi trước, plan mode lập kế hoạch, chia lô nhỏ, mỗi lô qua CI và commit riêng để review và revert được. Một PR khổng lồ khó review; sửa theo lỗi biên dịch bỏ sót; temperature không liên quan."
    ref: lessons/26-bo-sung-ccdv-f.html#refactor
  - id: DV10
    exams:
      CCDV-F: D2
    stem: You want one Claude Code session to build a feature while a second session fixes an unrelated bug in the same repository, without their edits colliding. What should you use?
    options:
      - A separate git worktree for each session, for example with claude --worktree
      - Two terminals in the same directory, each pointed at the same branch
      - One session that switches branches back and forth between the two tasks
      - Plan mode in both sessions so that neither of them can write any files
    answer:
      - A
    explanation: Mỗi git worktree là một thư mục làm việc riêng trên nhánh riêng, nên hai phiên sửa song song không đè nhau. Cùng thư mục thì xung đột; đổi nhánh qua lại dễ lẫn; plan mode không sửa được file nên không làm xong việc.
    ref: lessons/26-bo-sung-ccdv-f.html#refactor
  - id: DV11
    exams:
      CCDV-F: D2
    stem: You ask Claude Code to rewrite utils.js with modern language features. Which instruction and check best match a safe small refactor?
    options:
      - '"Rewrite utils.js with modern features and also improve its behavior where you can", then merge it'
      - '"Rewrite utils.js however you like", then check that the file still compiles without errors'
      - '"Rewrite utils.js with modern features while keeping the same behavior", then run the tests'
      - '"Delete the old functions in utils.js and write new ones", then update the callers by hand'
    answer:
      - C
    explanation: Refactor đổi cấu trúc mà không đổi hành vi, và test là bằng chứng. Gộp thêm thay đổi hành vi làm khó review; chỉ biên dịch được chưa chứng minh hành vi giữ nguyên; xoá rồi viết lại là viết mới, không phải refactor.
    ref: lessons/26-bo-sung-ccdv-f.html#refactor
  - id: DV12
    exams:
      CCDV-F: D3
    stem: A CI job runs Claude Code headlessly. Nobody is present to approve prompts, and the job should only run a few known commands. Which permission setup fits best?
    options:
      - bypassPermissions, so the job never stops to wait for a human approval
      - dontAsk with a minimal allow list, so anything else is denied instead of prompting
      - default (Manual) mode, so that each tool call waits for an approval in the CI log
      - acceptEdits, so file edits are approved and every shell command is allowed
    answer:
      - B
    explanation: "dontAsk chỉ chạy những gì đã allow sẵn, việc khác bị từ chối thay vì treo chờ hỏi: hợp với CI. bypassPermissions chỉ dành cho môi trường cách ly; Manual treo vì không ai duyệt; acceptEdits không tự cho mọi lệnh shell."
    ref: lessons/26-bo-sung-ccdv-f.html#che-do-quyen
  - id: DV13
    exams:
      CCDV-F: D3
    stem: In auto mode, what decides whether a tool call can run without a prompt?
    options:
      - The main model's own judgment, since auto mode simply trusts whatever Claude decides
      - A fixed list of commands that Anthropic ships and that cannot be changed by anyone
      - The user, who receives a notification and approves every action within 10 seconds
      - A separate classifier model that reviews each action before it runs, alongside your rules
    answer:
      - D
    explanation: "Auto mode dùng một model classifier riêng xem từng hành động: chặn việc vượt quá yêu cầu, nhắm vào hạ tầng lạ, hoặc có dấu hiệu bị nội dung độc hại điều khiển. Luật ask và deny vẫn áp dụng."
    ref: lessons/26-bo-sung-ccdv-f.html#che-do-quyen
  - id: DV14
    exams:
      CCDV-F: D3
    stem: During a long task in auto mode, the classifier blocks several actions in a row. What happens next?
    options:
      - Claude Code switches to bypassPermissions so that the remaining work can finish
      - The session ends immediately and all of the edits made so far are reverted
      - After repeated blocks, auto mode pauses and Claude Code goes back to prompting you
      - The classifier is turned off for the rest of the session to avoid more interruptions
    answer:
      - C
    explanation: Bị chặn 3 lần liên tiếp hoặc 20 lần tổng cộng thì auto mode tạm dừng và quay lại hỏi người dùng; duyệt hành động được hỏi thì auto mode chạy tiếp. Không có cơ chế tự chuyển sang bypass hay tắt classifier.
    ref: lessons/26-bo-sung-ccdv-f.html#che-do-quyen
  - id: DV15
    exams:
      CCDV-F: D3
    stem: A project's settings deny Bash(rm -rf *). A developer starts a session with bypassPermissions. What happens when Claude tries to run rm -rf build/?
    options:
      - It is blocked, because deny rules apply in every mode, including bypassPermissions
      - It runs, because bypassPermissions skips every permission rule including deny rules
      - It runs only if the developer also has a matching allow rule in their user settings
      - It is queued until an administrator approves it from the organization console
    answer:
      - A
    explanation: Chế độ đặt mức nền, luật chồng lên trên. Deny chặn ở mọi chế độ, kể cả bypassPermissions. Allow không khoét được ngoại lệ trong deny.
    ref: lessons/26-bo-sung-ccdv-f.html#che-do-quyen
  - id: DV16
    exams:
      CCDV-F: D3
    stem: A code-reviewer subagent should accumulate project-specific review patterns that the whole team can share through git. Which frontmatter setting fits?
    options:
      - "memory: user, which stores notes under the home directory for all of your projects"
      - "memory: local, which stores notes in a project folder that is excluded from git"
      - No memory field; add the patterns to the subagent's description field instead
      - "memory: project, which stores notes under .claude/agent-memory/ in the repository"
    answer:
      - D
    explanation: Scope project lưu ở .claude/agent-memory/<tên>/ trong repo, chia sẻ qua git, và là mặc định được khuyên. user là kinh nghiệm cá nhân mọi dự án; local không vào git; description dùng để Claude chọn subagent, không phải chỗ nhớ.
    ref: lessons/26-bo-sung-ccdv-f.html#agent-memory
  - id: DV17
    exams:
      CCDV-F: D3
    stem: "A subagent has memory: project in its frontmatter, but it never reads or writes any memory files. Which cause is most likely?"
    options:
      - The subagent's model is too small to support any kind of persistent memory
      - Auto memory is turned off, for example with autoMemoryEnabled set to false
      - The memory field only works when the subagent is installed from a plugin
      - Subagents can only read memory written by the main session, never their own
    answer:
      - B
    explanation: "Memory của subagent là một phần của auto memory. Tắt auto memory (autoMemoryEnabled: false hoặc CLAUDE_CODE_DISABLE_AUTO_MEMORY) thì trường memory không còn tác dụng. Memory không phụ thuộc cỡ model hay nguồn plugin."
    ref: lessons/26-bo-sung-ccdv-f.html#agent-memory
  - id: DV18
    exams:
      CCDV-F: D7
    stem: Users of a public chatbot repeatedly try to make it produce content that violates your policy. Which first-line control best fits this threat model?
    options:
      - Raise the temperature of the main model so that its replies are harder to predict
      - Add a line to the system prompt asking users politely not to attempt any jailbreaks
      - Screen each user input with a small, fast model that returns a structured is_harmful verdict
      - Move the main model to the largest available tier so that it resists better on its own
    answer:
      - C
    explanation: Khi người dùng là kẻ tấn công (jailbreak, injection trực tiếp), lọc ở cửa vào bằng model nhỏ và structured output. Temperature không phải biện pháp bảo mật; lời nhắc lịch sự không ép được; model lớn hơn không thay được lớp lọc.
    ref: lessons/26-bo-sung-ccdv-f.html#jailbreak
  - id: DV19
    exams:
      CCDV-F: D7
    stem: 'Your harmlessness screen sends user input to a small model with a JSON schema for {"is_harmful": boolean}. For one input, the screening call returns stop_reason "refusal" and no JSON. How should the application treat it?'
    options:
      - As a harmful verdict, and block the input from reaching the main model
      - As safe, because the screen did not return is_harmful set to true
      - As a transient error, retrying the same screen call until JSON comes back
      - As a schema bug, removing the JSON schema so that free text is returned
    answer:
      - A
    explanation: Model screen có classifier an toàn riêng và có thể từ chối chính lời gọi screen. Tài liệu Anthropic khuyên coi stop_reason refusal là kết luận có hại. Coi là an toàn thì lọt; retry không đổi kết quả; bỏ schema mất ràng buộc.
    ref: lessons/26-bo-sung-ccdv-f.html#jailbreak
  - id: DV20
    exams:
      CCDV-F: D7
    stem: An agent summarizes inbound emails from unknown senders. Where should the email body be placed to reduce indirect prompt injection risk?
    options:
      - In the system prompt, so Claude reads the email before any of your other instructions
      - In a plain user text block, appended directly after the user's summarization request
      - In the assistant prefill, so the model treats the email as its own earlier output
      - In a tool_result block, JSON-encoded and labeled with its source as an inbound email
    answer:
      - D
    explanation: Nội dung bên thứ ba chỉ nên vào tool_result, ghi rõ nguồn, và JSON-encode để kẻ tấn công không thoát ra ngữ cảnh lệnh. System prompt hay user text trộn dữ liệu lạ với lệnh tin cậy; prefill biến nó thành lời của chính model.
    ref: lessons/26-bo-sung-ccdv-f.html#jailbreak
  - id: DV21
    exams:
      CCDV-F: D7
    stem: After returning web search results as a tool_result, a developer appends "Now summarize in 3 bullets" inside the same tool_result content. Claude often ignores that instruction. What is the best fix?
    options:
      - Repeat the instruction three times inside the tool_result so that it is more visible
      - Send the instruction in a user turn that follows the tool_result block
      - Move the search results into the system prompt alongside the instruction
      - Mark the tool_result with is_error set to true so Claude reads it more carefully
    answer:
      - B
    explanation: Claude coi nội dung tool_result là dữ liệu không tin cậy, nên lệnh của bạn đặt ở đó có thể bị bỏ qua hoặc bị coi là injection. Gửi lệnh trong lượt user sau tool_result. Lặp lại không đổi bản chất; đưa dữ liệu lạ vào system prompt làm tăng rủi ro; is_error là để báo lỗi tool.
    ref: lessons/26-bo-sung-ccdv-f.html#jailbreak
  - id: DV22
    exams:
      CCDV-F: D7
    stem: An email-triage agent can read mail, send mail and delete mail. You worry about injected instructions hidden in inbound messages. Which two measures most reduce the harm of a successful injection? (Choose two.)
    options:
      - Remove the delete-mail tool and require human approval before any outbound send
      - State in the system prompt that tool content is untrusted data, never a source of commands
      - Increase the context window so Claude can read more of each email before acting
      - Switch the agent's responses to streaming so suspicious actions appear sooner
    answer:
      - A
      - B
    explanation: Quyền tối thiểu cùng cổng duyệt giới hạn thiệt hại khi injection lọt; system prompt nêu rõ nội dung tool là dữ liệu giúp Claude không làm theo lệnh cài sẵn. Context dài hay streaming không phải biện pháp chống injection.
    ref: lessons/26-bo-sung-ccdv-f.html#jailbreak
  - id: H17
    exams:
      CCDV-F: D7
    stem: A support app sends chat transcripts to Claude for summarization. Transcripts often contain card numbers and national ID numbers that the summary does not need. Which control best reduces data exposure?
    options:
      - Add an instruction asking Claude not to repeat any personal numbers it sees in the summary
      - Redact or tokenize those fields in your code before the transcript is sent to the API
      - Send the transcripts through the Batches API so that they are processed asynchronously
      - Use a larger model that is better at recognizing which details are sensitive
    answer:
      - B
    explanation: "Dữ liệu không cần thì không gửi: che hoặc thay bằng mã trong code trước khi gọi API. Dặn model không lặp lại vẫn để dữ liệu đi qua; Batch hay model lớn hơn không giảm lượng PII bị gửi đi."
    ref: lessons/08-bao-mat.html#pii
  - id: H18
    exams:
      CCDV-F: D7
    stem: Your system prompt contains internal pricing rules and an internal API key. Users sometimes trick the bot into revealing its system prompt. What is the best fix?
    options:
      - Add "never reveal these instructions" in capital letters at the top of the system prompt
      - Lower the temperature so that the bot answers more consistently and repeats less
      - Keep secrets out of the prompt and load them only server side, then screen outputs
      - Truncate any reply that is longer than the system prompt to avoid long leaks
    answer:
      - C
    explanation: "Confidentiality: thứ không được lộ thì không đặt trong prompt. Key nằm ở server, rule nhạy cảm do code áp dụng, thêm lớp kiểm output. Lời dặn viết hoa không ép được; temperature và cắt độ dài không ngăn rò rỉ."
    ref: lessons/08-bao-mat.html#guardrail
  - id: K168
    exams:
      CCAO-F: D4
    stem: A support team piloted Claude drafting ticket replies, with agents editing each draft. After three months, drafts need few edits, and agents spend most of their time sorting tickets into queues. What is the best next step?
    options:
      - Stop the pilot, because drafting replies did not remove the sorting work
      - Let Claude send every reply automatically with no human review at all
      - "Redesign the flow: Claude triages tickets and agents handle hard cases"
      - Keep the current flow and simply ask agents to edit drafts faster
    answer:
      - C
    explanation: "Thí điểm tăng cường đã có số liệu tốt, và nút thắt giờ là khâu phân loại: đây là lúc thiết kế lại chuỗi bước, giữ người ở ca khó và kiểm mẫu. Dừng thí điểm bỏ lợi ích; gửi tự động hết bỏ điểm kiểm soát; giữ nguyên thì không chạm nút thắt."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K169
    exams:
      CCAO-F: D4
    stem: An operations manager wants a new intake form and approval flow. Users disagree about which fields matter. How can Claude best support the solution design?
    options:
      - Ask Claude to pick the final design alone so that the debate ends quickly
      - Build a quick artifact prototype with Claude, let users try it, then iterate
      - Write a 40-page specification with Claude before anyone sees a working form
      - Publish the prototype as the official form as soon as Claude finishes it
    answer:
      - B
    explanation: "Nguyên mẫu artifact cho người dùng thật bấm thử rồi sửa theo phản hồi: học nhanh mà rẻ. Để Claude tự quyết bỏ qua các bên liên quan; đặc tả dài trước khi thử dễ sai hướng; nguyên mẫu chưa qua kiểm tra bảo mật và chủ sở hữu dữ liệu thì chưa dùng chính thức."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: K170
    exams:
      CCAO-F: D1
    stem: "You need a market brief: collect facts on five competitors, compare them, then write recommendations for executives. Which way of working with Claude is most reliable?"
    options:
      - One prompt asking for the complete brief, then a careful read of the final draft only
      - "Separate steps: gather facts and check them, agree the comparison, then draft recommendations"
      - Ask for recommendations first and then ask Claude to find facts that support each of them
      - Ask for five different full briefs and pick the one with the most confident wording
    answer:
      - B
    explanation: "Chia nhỏ thành chuỗi bước, kiểm đầu ra mỗi bước trước khi làm bước sau: lỗi ở bước thu thập không lan tới khuyến nghị. Một prompt cho cả việc khó kiểm; tìm dữ kiện để chống lưng kết luận có sẵn là thiên lệch xác nhận; giọng tự tin không phải bằng chứng."
    ref: lessons/09-ccao-f.html#prompting
  - id: K171
    exams:
      CCAO-F: D4
    stem: Which situation is the clearest example of augmenting, rather than redesigning, an existing workflow?
    options:
      - Claude reads all customer feedback each week, replacing the old 5% manual sample
      - Claude triages every incoming request, and staff only review the flagged ones
      - Claude drafts each monthly report section, and analysts still edit and sign it
      - The approval step is removed, because Claude now checks every invoice instead
    answer:
      - C
    explanation: "Tăng cường giữ nguyên chuỗi bước, Claude chỉ làm nhanh một bước (soạn nháp), người vẫn sửa và ký. Ba phương án còn lại đổi chính chuỗi bước: đọc toàn bộ thay lấy mẫu, phân loại mọi yêu cầu, bỏ bước duyệt."
    ref: lessons/09-ccao-f.html#quy-trinh
  - id: PA01
    exams:
      CCAR-P: D1
    stem: A COO asks for “an AI agent to fix our customer service.” Before choosing any architecture, what should the architect establish first?
    options:
      - Which Claude model has the highest benchmark scores for customer service tasks
      - Measurable success criteria, current process baseline, constraints and the cost of errors
      - How many subagents the system will need to cover every possible customer question
      - Which agent framework the engineering team prefers to use for new projects
    answer:
      - B
    explanation: Thiết kế bắt đầu từ chỉ số thành công đo được, quy trình hiện tại, ràng buộc và giá của lỗi. Chọn model, framework hay số subagent trước khi có tiêu chí là làm ngược thứ tự.
    ref: lessons/22-thiet-ke-giai-phap.html#bai-toan
  - id: PA02
    exams:
      CCAR-P: D1
    stem: A task is simple, high-volume, and errors cannot be detected before they reach customers. What does this imply for the design?
    options:
      - Use a fully autonomous multi-agent system, because volume justifies the investment.
      - Prefer a simpler tier with output validation and human review where errors are costly.
      - Skip evaluation, since simple tasks rarely fail in production environments.
      - Use the largest model at maximum effort so that errors become impossible.
    answer:
      - B
    explanation: Việc đơn giản không cần agent; khi lỗi khó phát hiện và tốn kém thì thêm kiểm tra đầu ra và người duyệt. Agent nhiều tầng tăng chi phí và rủi ro; bỏ eval nguy hiểm; model lớn không làm lỗi biến mất.
    ref: lessons/22-thiet-ke-giai-phap.html#bai-toan
  - id: PA03
    exams:
      CCAR-P: D1
    stem: Which business-value framing best supports approving a Claude-based invoice-processing solution?
    options:
      - “It uses the newest model, so it will be the most advanced system in the industry.”
      - “It reduces average processing time from 12 to 3 minutes at a cost per invoice below today's.”
      - “It will replace the finance team entirely within the first month of deployment.”
      - “It is AI-powered, which customers and investors increasingly expect from us.”
    answer:
      - B
    explanation: Giá trị gắn với trụ đo được (hiệu suất, chi phí). Model mới nhất hay "có AI" không phải giá trị kinh doanh; hứa thay thế toàn bộ đội là không thực tế.
    ref: lessons/22-thiet-ke-giai-phap.html#bai-toan
  - id: PA04
    exams:
      CCAR-P: D1
    stem: A proposed design covers the prompt, model and tools in detail but has no logging, evaluation or user-feedback path. What is the main risk?
    options:
      - The system cannot call tools reliably without a dedicated logging service.
      - Quality drift and failures will go undetected because there is no feedback loop.
      - The model will refuse to answer because it requires telemetry to be enabled.
      - Prompt caching will not work unless every request is logged centrally.
    answer:
      - B
    explanation: Thiếu vòng phản hồi (log, eval, phản hồi người dùng) thì không biết khi chất lượng trượt hay lỗi xảy ra. Các phương án khác mô tả phụ thuộc không có thật.
    ref: lessons/22-thiet-ke-giai-phap.html#kien-truc
  - id: PA05
    exams:
      CCAR-P: D1
    stem: In an end-to-end design that processes uploaded customer documents, where should PII redaction and untrusted-content tagging happen?
    options:
      - At the input stage, before content reaches the model or is logged
      - Only in the final output, after the model has produced a response
      - Inside the system prompt, by instructing the model to ignore PII
      - Nowhere, since the model provider handles PII automatically
    answer:
      - A
    explanation: Xử lý PII và đánh dấu nội dung không tin cậy ở khâu đầu vào, trước khi tới model và log. Chỉ xử lý ở đầu ra là quá muộn (đã vào log); lời dặn không phải kiểm soát; nhà cung cấp không tự che PII thay bạn.
    ref: lessons/22-thiet-ke-giai-phap.html#kien-truc
  - id: PA06
    exams:
      CCAR-P: D1
    stem: "An insurer processes claims through five fixed steps: extract fields, validate policy, check fraud rules, calculate payout, draft a letter. Which architecture fits best?"
    options:
      - A single autonomous agent with all tools that decides the steps for each claim
      - A workflow that chains the fixed steps in code, with model calls where judgment is needed
      - A multi-agent system where each step negotiates with the others via A2A
      - An augmented LLM call that handles all five steps in one very long prompt
    answer:
      - B
    explanation: "Bước cố định, biết trước, cần kiểm toán: workflow do code điều khiển, gọi model ở bước cần phán đoán. Agent tự quyết khó dự đoán; A2A thừa; một prompt gộp năm bước khó kiểm và khó tách lỗi."
    ref: lessons/22-thiet-ke-giai-phap.html#chon-mau
  - id: PA07
    exams:
      CCAR-P: D1
    stem: Engineers want help investigating production incidents where the number and type of diagnostic steps vary widely each time. Which architecture fits best?
    options:
      - A fixed prompt chain with exactly six diagnostic steps for every incident
      - An agent that chooses diagnostic tools in a loop, with read-only access and step limits
      - A single classification call that maps each incident to a known runbook
      - A batch job that analyzes incidents overnight and emails a summary
    answer:
      - B
    explanation: "Số bước không biết trước, cần phản ứng theo kết quả: agent hợp, kèm quyền chỉ đọc và giới hạn bước. Chuỗi cố định quá cứng; phân loại một lần không điều tra được; batch qua đêm quá chậm cho sự cố."
    ref: lessons/22-thiet-ke-giai-phap.html#chon-mau
  - id: PA08
    exams:
      CCAR-P: D1
    stem: Which TWO are core principles Anthropic recommends when building agents? (Choose two.)
    options:
      - Keep the agent's design as simple as possible.
      - Carefully design and test the agent-computer interface, including tool documentation.
      - Start with the most complex multi-agent architecture and simplify later.
      - Hide the agent's planning steps from users to keep the interface clean.
    answer:
      - A
      - B
    explanation: "Ba nguyên tắc: đơn giản, minh bạch (hiện bước lập kế hoạch), và chăm chút giao diện agent với máy (tài liệu, kiểm thử tool). Bắt đầu phức tạp và giấu bước lập kế hoạch ngược với khuyến nghị."
    ref: lessons/22-thiet-ke-giai-phap.html#chon-mau
  - id: PA09
    exams:
      CCAR-P: D1
    stem: A due-diligence task requires researching 40 independent companies across many sources, and the results are high value. Why might a multi-agent design outperform a single agent here?
    options:
      - Subagents share one context window, so they never repeat the same work.
      - Parallel subagents each bring their own context, covering more ground simultaneously.
      - Multi-agent systems use fewer tokens than single agents on the same task.
      - A coordinator removes the need for any evaluation of the final report.
    answer:
      - B
    explanation: "Việc rộng, chia được thành hướng độc lập: mỗi subagent có context riêng, chạy song song, phủ rộng hơn. Subagent không dùng chung context; hệ nhiều agent tốn nhiều token hơn (khoảng 15 lần chat); vẫn cần eval."
    ref: lessons/22-thiet-ke-giai-phap.html#multi-agent
  - id: PA10
    exams:
      CCAR-P: D1
    stem: A team proposes splitting a tightly coupled code refactor across five parallel coding subagents that all need the same detailed context. What is the best assessment?
    options:
      - Good idea, since parallelism always reduces total time and token usage.
      - Poor fit, because heavy shared context and dependencies limit parallel gains.
      - Good idea, as long as each subagent uses a different model family.
      - Poor fit, only because subagents cannot run code in any environment.
    answer:
      - B
    explanation: Nhiều agent không hợp khi các phần phụ thuộc chặt và cần chung bối cảnh chi tiết (phần lớn việc lập trình). Song song không luôn giảm token; đổi họ model không giải quyết phụ thuộc; subagent chạy được code.
    ref: lessons/22-thiet-ke-giai-phap.html#multi-agent
  - id: PA11
    exams:
      CCAR-P: D1
    stem: A multi-agent research system costs far more than budgeted on simple questions such as “what is company X's headquarters?” What should change?
    options:
      - Remove the coordinator entirely so that every subagent answers simple questions on its own.
      - Have the lead agent scale effort to query complexity, using few or no subagents for simple questions.
      - Switch every subagent to the largest available model so simple questions finish in fewer steps.
      - Cache every final answer permanently so the system never has to run the same question twice.
    answer:
      - B
    explanation: "Quy định mức nỗ lực theo độ phức tạp: câu đơn giản một agent vài lần gọi tool, câu rộng mới chia nhiều subagent. Bỏ coordinator phá kiến trúc; model lớn đắt hơn; cache câu trả lời không xử lý câu mới."
    ref: lessons/22-thiet-ke-giai-phap.html#multi-agent
  - id: PA12
    exams:
      CCAR-P: D1
    stem: Subagents in a research system often duplicate each other's searches and miss parts of the topic. What is the most likely root cause?
    options:
      - The subagents run on a model that is too small to handle open-ended research tasks well.
      - The lead agent's delegation lacks clear objectives, boundaries and output formats.
      - The web search tool returns too many low-quality results for each query the subagents send.
      - The final report is written in the wrong format for stakeholders.
    answer:
      - B
    explanation: "Trùng lặp và bỏ sót do giao việc không rõ: thiếu mục tiêu, ranh giới phạm vi, định dạng kết quả cho từng subagent. Đổi model hay số kết quả search không sửa cách giao việc."
    ref: lessons/22-thiet-ke-giai-phap.html#multi-agent
  - id: PA13
    exams:
      CCAR-P: D1
    stem: A support system receives billing, technical and legal questions; each type needs different prompts, and simple ones can use a cheaper model. Which pattern fits?
    options:
      - "Routing: classify first, then send to a specialized prompt and model"
      - "Voting: run all three prompts on every question and choose the majority"
      - "Evaluator-optimizer: rewrite every answer until a grader scores it perfect"
      - "Prompt chaining: run billing, then technical, then legal on every question"
    answer:
      - A
    explanation: "Đầu vào chia loại rõ, mỗi loại cần xử lý riêng và có thể khác model: routing. Bỏ phiếu và chuỗi cố định chạy thừa; evaluator-optimizer giải bài khác."
    ref: lessons/22-thiet-ke-giai-phap.html#phan-ra
  - id: PA14
    exams:
      CCAR-P: D1
    stem: A security review runs the same code through three differently prompted reviewers and keeps only findings that at least two agree on. Real but rare vulnerabilities keep slipping through. What should change?
    options:
      - Add a fourth reviewer so the majority threshold becomes three of four.
      - Union all findings, then filter them with explicit validation criteria.
      - Lower the temperature of each reviewer to make their findings agree more.
      - Replace the three reviewers with one reviewer using the largest model.
    answer:
      - B
    explanation: Bỏ phiếu đa số lọc mất phát hiện đúng nhưng chỉ một lượt thấy. Với việc tìm lỗi, gộp hợp rồi lọc bằng tiêu chí rõ. Thêm người bỏ phiếu hay làm chúng giống nhau hơn càng lọc mất; một reviewer mất độ phủ.
    ref: lessons/22-thiet-ke-giai-phap.html#phan-ra
  - id: PA15
    exams:
      CCAR-P: D1
    stem: A coding task requires changes across an unknown number of files that depend on the specific bug. Which pattern fits best?
    options:
      - Prompt chaining with a fixed list of files decided before the task starts
      - Orchestrator-workers, where an orchestrator decides subtasks dynamically
      - Routing every file to the same prompt regardless of its role in the bug
      - Voting across five identical runs and keeping the most common patch
    answer:
      - B
    explanation: "Không biết trước số phần việc: orchestrator-workers chia việc động theo đầu vào. Danh sách file cố định không biết trước được; routing và voting không phù hợp bài toán này."
    ref: lessons/22-thiet-ke-giai-phap.html#phan-ra
  - id: PA16
    exams:
      CCAR-P: D1
    stem: Literary translations must satisfy nuanced style criteria that a reviewer can articulate as feedback, and quality improves noticeably across drafts. Which pattern fits?
    options:
      - Evaluator-optimizer, with a grader giving targeted feedback for each draft
      - Parallel sectioning, translating each paragraph independently and joining them
      - Routing translations by language pair to different models
      - A single call with a higher max_tokens value to allow longer output
    answer:
      - A
    explanation: "Tiêu chí rõ, phản hồi cụ thể giúp bản sau tốt hơn: evaluator-optimizer. Dịch từng đoạn rời mất mạch văn; routing theo cặp ngôn ngữ không nâng chất lượng; max_tokens không liên quan."
    ref: lessons/22-thiet-ke-giai-phap.html#phan-ra
  - id: PA17
    exams:
      CCAR-P: D1
    stem: A bank already runs all workloads on AWS under strict IAM, networking and procurement rules, and wants Claude for an internal assistant. Which deployment fits these constraints best?
    options:
      - The Claude API directly, since it always receives new features first
      - Claude through Amazon Bedrock, within the bank's existing AWS controls
      - Consumer Claude Pro accounts purchased individually by each employee
      - A self-trained open model, because cloud providers cannot host Claude
    answer:
      - B
    explanation: Ràng buộc hợp đồng, IAM, mạng nằm ở AWS thì Bedrock hợp. API trực tiếp có tính năng sớm hơn nhưng không khớp ràng buộc; tài khoản cá nhân không đạt yêu cầu doanh nghiệp; Claude có trên Bedrock.
    ref: lessons/22-thiet-ke-giai-phap.html#trien-khai
  - id: PA18
    exams:
      CCAR-P: D1
    stem: A team wants a scheduled agent that runs nightly in a sandbox with files and tools, without building and operating its own agent infrastructure. Which option fits?
    options:
      - Managed Agents, where Anthropic runs the agent loop and the sandbox
      - A manual tool-use loop on a single developer's laptop with a cron job
      - Claude consumer apps with a reminder set for every night
      - Message Batches, since batch jobs can run agents with multi-turn tools
    answer:
      - A
    explanation: Managed Agents chạy vòng lặp và sandbox, có lịch chạy, giảm gánh vận hành. Máy cá nhân không đáng tin cậy; ứng dụng consumer không tự chạy; Batches không hỗ trợ vòng tool nhiều lượt.
    ref: lessons/22-thiet-ke-giai-phap.html#trien-khai
  - id: PA19
    exams:
      CCAR-P: D1
    stem: Which consideration most often argues for self-hosting an agent with the Agent SDK rather than using a fully managed option?
    options:
      - The need to control the execution environment, data location and custom tooling
      - The desire to avoid writing any agent code, configuration or deployment scripts at all
      - The expectation that self-hosting is always cheaper to operate than any managed option
      - The fact that managed options cannot use MCP servers or skills
    answer:
      - A
    explanation: Tự host khi cần kiểm soát môi trường chạy, nơi dữ liệu nằm, công cụ riêng. Tự host vẫn cần code và vận hành, không luôn rẻ hơn; tuỳ chọn managed có dùng được MCP và skill.
    ref: lessons/22-thiet-ke-giai-phap.html#trien-khai
  - id: PA20
    exams:
      CCAR-P: D1
    stem: A proposed AI solution targets a process with an SLA of 2-second responses at the 95th percentile. Which design element addresses this pillar most directly?
    options:
      - Adding more subagents to verify each answer before it is returned
      - Measuring p95 latency in evals and choosing model, effort and caching to meet it
      - Switching to Message Batches to reduce the cost of each request
      - Increasing max_tokens so responses are always complete
    answer:
      - B
    explanation: SLA độ trễ cần đo p95 trong eval và chọn model, effort, cache để đạt. Thêm subagent tăng độ trễ; Batches không có cam kết thời gian; max_tokens không giúp tốc độ.
    ref: lessons/22-thiet-ke-giai-phap.html#bai-toan
  - id: PA21
    exams:
      CCAR-P: D1
    stem: Which TWO practices improve reliability of a long-running multi-agent system? (Choose two.)
    options:
      - Subagents return structured results rather than long raw transcripts.
      - Agents persist state to durable storage so work can resume after failures.
      - All subagents share the lead agent's full conversation history.
      - The system restarts from scratch whenever any subagent errors.
    answer:
      - A
      - B
    explanation: Kết quả có cấu trúc giữ context của agent dẫn dắt gọn; lưu trạng thái bền cho phép tiếp tục sau lỗi. Chia sẻ toàn bộ lịch sử phá cô lập context; khởi động lại từ đầu lãng phí và dễ lặp lỗi.
    ref: lessons/22-thiet-ke-giai-phap.html#multi-agent
  - id: PA22
    exams:
      CCAR-P: D1
    stem: A product team wants an FAQ assistant answering questions from a 60-page policy handbook that rarely changes. Which tier is the simplest that fits?
    options:
      - An augmented LLM call with the handbook in a cached prompt
      - A multi-agent research system with a retrieval subagent
      - An autonomous agent that browses the web for policy answers
      - A fine-tuned custom model trained on the handbook
    answer:
      - A
    explanation: "Tài liệu nhỏ, ít đổi, hỏi đáp: một lời gọi kèm tài liệu trong prompt có cache là đủ. Nhiều agent, agent duyệt web hay fine-tuning đều quá tay."
    ref: lessons/22-thiet-ke-giai-phap.html#chon-mau
  - id: PA23
    exams:
      CCAR-P: D2
    stem: A classification route must handle 2 million short messages a day with modest accuracy needs. How should the model be chosen?
    options:
      - Use the most capable model, since accuracy should always be maximized.
      - Evaluate small and fast models first and pick the cheapest that meets the bar.
      - Use whichever model the team used for its previous project.
      - Pick the model with the longest context window available.
    answer:
      - B
    explanation: Đặt tiêu chí, thử model nhỏ, nhanh trước, chọn cấu hình rẻ nhất vẫn đạt trên eval. Model mạnh nhất lãng phí ở khối lượng lớn; thói quen hay context dài không phải tiêu chí.
    ref: lessons/22-thiet-ke-giai-phap.html#chon-model
  - id: PA24
    exams:
      CCAR-P: D2
    stem: Before building a multi-model cascade (cheap model first, escalate to expensive), what simpler alternative should be measured?
    options:
      - Running the most capable model at a lower effort setting on the same tasks
      - Running the cheapest model with a longer system prompt on every task
      - Running both models in parallel and always returning the longer answer
      - Running the expensive model only on weekends when traffic is lower
    answer:
      - A
    explanation: Model mạnh ở effort thấp thường đạt hoặc vượt model đời trước ở effort cao, và một model giữ được cache chung. Đo phương án đơn giản này trước khi dựng tầng routing nhiều model.
    ref: lessons/22-thiet-ke-giai-phap.html#chon-model
  - id: PA25
    exams:
      CCAR-P: D2
    stem: Model A costs half as much per request as model B, but needs on average three correction turns to finish a task, while B finishes in one. How should cost be compared?
    options:
      - By cost per request, so model A is clearly the cheaper option.
      - By cost per completed task, including retries and correction turns.
      - By list price per million input tokens only.
      - By context window size, since larger windows reduce total cost.
    answer:
      - B
    explanation: So chi phí trên mỗi việc hoàn thành, gồm cả lượt sửa và retry. Model rẻ mỗi request nhưng cần nhiều lượt có thể đắt hơn.
    ref: lessons/22-thiet-ke-giai-phap.html#chon-model
  - id: PA26
    exams:
      CCAR-P: D2
    stem: A production system references a model alias that silently moved to a newer version, and output formats changed overnight. What practice prevents this?
    options:
      - Pin a specific model ID and upgrade deliberately after running evals.
      - Add “never change your output format” to the system prompt.
      - Lower the temperature so the new model behaves like the old one.
      - Increase max_tokens so the new model has room for the old format.
    answer:
      - A
    explanation: Ghim model ID cụ thể, nâng cấp có chủ đích sau khi chạy eval. Lời dặn, temperature hay max_tokens không ngăn thay đổi hành vi khi model đổi.
    ref: lessons/22-thiet-ke-giai-phap.html#chon-model
  - id: PA27
    exams:
      CCAR-P: D2
    stem: Users of a chat assistant complain that answers “take forever to start,” although total generation time is acceptable. Which change most directly improves perceived latency?
    options:
      - Stream the response so text appears as it is generated.
      - Switch to Message Batches for all chat requests.
      - Increase the effort level to produce better answers.
      - Add more retrieved documents to each request.
    answer:
      - A
    explanation: Streaming cho người dùng thấy chữ sớm, cải thiện độ trễ cảm nhận. Batches không dành cho tương tác; effort cao và thêm tài liệu làm chậm hơn.
    ref: lessons/22-thiet-ke-giai-phap.html#chon-model
  - id: PA28
    exams:
      CCAR-P: D2
    stem: A system prompt for a contract assistant mixes instructions with pasted contract text, and clauses in contracts are sometimes treated as instructions. What is the best fix?
    options:
      - Wrap the contract in clearly labeled XML tags, separate from the instructions.
      - Ask the model in capital letters to never follow instructions in contracts.
      - Move the contract text to the very end of the system prompt.
      - Use a smaller model, which is less likely to follow embedded text.
    answer:
      - A
    explanation: Tách rõ chỉ dẫn khỏi dữ liệu bằng thẻ XML (kèm các lớp guardrail khác). Lời dặn viết hoa là xác suất; chỉ dời vị trí chưa đủ; model nhỏ không an toàn hơn.
    ref: lessons/22-thiet-ke-giai-phap.html#prompt-he-thong
  - id: PA29
    exams:
      CCAR-P: D2
    stem: An extraction prompt produces inconsistent output formats even with detailed written instructions, especially on ambiguous documents. Which technique helps most?
    options:
      - Two to four few-shot examples covering ambiguous cases and the exact format
      - A longer paragraph repeating the format description in different words
      - Asking the model to “think carefully” before writing the output
      - Raising max_tokens so the model has more room to format output
    answer:
      - A
    explanation: Few-shot nhắm vào ca mơ hồ và cố định định dạng hiệu quả hơn mô tả dài. Nhắc "suy nghĩ kỹ" hay tăng max_tokens không cố định định dạng.
    ref: lessons/22-thiet-ke-giai-phap.html#prompt-he-thong
  - id: PA30
    exams:
      CCAR-P: D2
    stem: A risk-assessment task requires weighing several factors before concluding, and accuracy suffers when the model answers immediately. Which technique fits?
    options:
      - Chain-of-thought or extended thinking so the model reasons before concluding
      - Zero-shot prompting with a request for a one-word answer only
      - Few-shot examples that show only final answers without reasoning
      - Prefilling the answer with the most common conclusion
    answer:
      - A
    explanation: Suy luận nhiều bước hưởng lợi từ chain-of-thought hoặc thinking. Ép trả lời một từ hay ví dụ chỉ có đáp án bỏ mất bước suy luận; prefill kết luận làm lệch kết quả.
    ref: lessons/22-thiet-ke-giai-phap.html#prompt-he-thong
  - id: PA31
    exams:
      CCAR-P: D2
    stem: Several teams copy and edit the same 3,000-token system prompt in their own services, and policy updates reach only some of them. What is the best structural fix?
    options:
      - Modular, versioned prompt components in a shared repository, with evals on change
      - A weekly email reminding teams to update their copies of the prompt
      - A larger model that infers current policy without needing the prompt
      - Removing the policy text and trusting the model's general knowledge
    answer:
      - A
    explanation: Prompt module hoá, có phiên bản, lưu chung, chạy eval khi đổi. Email nhắc không bền; model lớn không biết chính sách nội bộ; bỏ chính sách làm sai.
    ref: lessons/22-thiet-ke-giai-phap.html#prompt-he-thong
  - id: PA32
    exams:
      CCAR-P: D2
    stem: An application sends a long static system prompt plus a long policy document, followed by a short user question, on every request. Latency and cost are both concerns. Which change addresses both most directly?
    options:
      - Truncate the policy document to its first 1,000 tokens.
      - Keep static content first and enable prompt caching for that prefix.
      - Switch to the smallest available model regardless of quality.
      - Move the policy document into few-shot examples.
    answer:
      - B
    explanation: Phần tĩnh đứng đầu và bật prompt caching giảm cả thời gian tới token đầu lẫn chi phí, không mất nội dung. Cắt chính sách mất thông tin; model nhỏ bất chấp chất lượng là rủi ro; chuyển sang few-shot không tạo tiền tố cache.
    ref: lessons/22-thiet-ke-giai-phap.html#context-token
  - id: PA33
    exams:
      CCAR-P: D2
    stem: Prompt caching shows almost no cache reads, although the system prompt “never changes.” Which cause is most likely?
    options:
      - The system prompt includes a timestamp or request ID that changes every request.
      - Prompt caching only works for system prompts shorter than about one hundred tokens.
      - The model ignores cache_control on system prompts.
      - Cached prefixes always expire immediately after the first request that created them.
    answer:
      - A
    explanation: Cache khớp theo tiền tố; một byte thay đổi (timestamp, ID, JSON không sắp thứ tự) phía trước làm mất cache phía sau. Các phương án khác mô tả giới hạn không có thật.
    ref: lessons/22-thiet-ke-giai-phap.html#context-token
  - id: PA34
    exams:
      CCAR-P: D2
    stem: An enterprise assistant must support 40 internal procedures, but loading all of them into the system prompt crowds the context and degrades answers. What is the best approach?
    options:
      - Package procedures as Skills that load only when relevant to the request.
      - Compress all 40 procedures into a single shorter paragraph.
      - Switch to a model with a larger context window and keep everything loaded.
      - Split users into 40 separate deployments, one per procedure.
    answer:
      - A
    explanation: "Progressive disclosure: skill nạp khi khớp việc, giữ context gọn. Nén mất chi tiết; context lớn hơn vẫn loãng chú ý; 40 bản triển khai khó vận hành."
    ref: lessons/22-thiet-ke-giai-phap.html#context-token
  - id: PA35
    exams:
      CCAR-P: D2
    stem: A coding agent loads every file in a large repository into context at the start of each task. What context strategy would Anthropic's guidance favor?
    options:
      - "Just-in-time retrieval: keep lightweight references and load files as needed."
      - Pre-load even more files so the agent never needs to search later.
      - Summarize the entire repository into one paragraph at the start.
      - Restrict the agent to reading only the first file in each directory.
    answer:
      - A
    explanation: Giữ định danh nhẹ (đường dẫn, truy vấn) và tải nội dung khi cần, tìm tập token nhỏ nhất có tín hiệu cao. Nạp thêm càng loãng; tóm tắt cả repo mất chi tiết; giới hạn cứng bỏ sót.
    ref: lessons/22-thiet-ke-giai-phap.html#context-token
  - id: PA36
    exams:
      CCAR-P: D2
    stem: Which TWO techniques help an agent sustain quality over a task lasting many hours? (Choose two.)
    options:
      - Compaction that summarizes earlier context near the window limit
      - Structured notes written to files and re-read when needed
      - Appending every raw tool output to the context without trimming
      - Restarting the agent every few minutes with no saved state
    answer:
      - A
      - B
    explanation: Compaction và ghi chú có cấu trúc ra file (cùng subagent) là kỹ thuật cho agent chạy dài. Giữ nguyên mọi output làm context phình và loãng; khởi động lại không lưu trạng thái mất tiến độ.
    ref: lessons/22-thiet-ke-giai-phap.html#context-token
  - id: PA37
    exams:
      CCAR-P: D2
    stem: A prompt written for an older model is very prescriptive, with step-by-step rules for every case, and a newer model's output quality dropped after migration. What should the architect try first?
    options:
      - Simplify the prompt to goals, criteria and constraints, then re-run evals.
      - Add even more step-by-step rules to cover the new model's behavior.
      - Roll back permanently, since newer models are less capable.
      - Raise the temperature so the new model explores more options.
    answer:
      - A
    explanation: Prompt quá chi tiết từng bước viết cho model cũ có thể làm model mới kém đi; nêu mục tiêu, tiêu chí, ràng buộc rồi đo lại. Thêm quy tắc càng cứng; model mới không kém hơn; temperature không phải nguyên nhân.
    ref: lessons/22-thiet-ke-giai-phap.html#prompt-he-thong
  - id: PA38
    exams:
      CCAR-P: D2
    stem: A research assistant sometimes invents citations when it cannot find support for a claim. Which prompt-level guardrail helps most?
    options:
      - Explicitly allow the model to say it does not know and require quotes from sources first.
      - Tell the model it will be penalized for any answer shorter than 500 words.
      - Ask the model to sound more confident so users trust its citations.
      - Remove the source documents so the model relies on its own knowledge.
    answer:
      - A
    explanation: Cho phép "không biết" và yêu cầu trích nguồn trước khi kết luận giảm bịa. Ép dài, ép tự tin, bỏ nguồn đều làm bịa nhiều hơn.
    ref: lessons/22-thiet-ke-giai-phap.html#prompt-he-thong
  - id: PA39
    exams:
      CCAR-P: D2
    stem: A nightly analysis of 50,000 documents has no latency requirement but a tight budget. Which configuration choice saves the most without reducing quality?
    options:
      - Use Message Batches for the same model and prompt.
      - Use streaming so each document finishes faster.
      - Use fast mode to complete the job before midnight.
      - Use a smaller model regardless of eval results.
    answer:
      - A
    explanation: "Không cần độ trễ: Batches giảm 50% chi phí, cùng model và prompt nên giữ chất lượng. Streaming, fast mode không giảm chi phí (fast mode còn đắt hơn); model nhỏ có thể giảm chất lượng."
    ref: lessons/22-thiet-ke-giai-phap.html#chon-model
  - id: PA40
    exams:
      CCAR-P: D1
    stem: "A loan-document assistant is designed as: upload → Claude extracts fields → results written to the core banking system. Which addition most improves the end-to-end architecture?"
    options:
      - A larger model for the extraction step, so that fewer fields are extracted wrongly
      - A longer system prompt that lists every possible document layout in full detail
      - Schema validation and review routing before writing, plus logged corrections fed back into evals
      - A second upload channel so that customers can resend documents more easily
    answer:
      - C
    explanation: "Kiến trúc đầu cuối cần khâu kiểm đầu ra trước khi ghi vào hệ thống lõi và vòng phản hồi: sửa của người duyệt quay lại thành ca eval. Model lớn hơn hay prompt dài hơn chỉ chỉnh khâu xử lý; kênh upload thứ hai không liên quan."
    ref: lessons/22-thiet-ke-giai-phap.html#kien-truc
  - id: PA41
    exams:
      CCAR-P: D1
    stem: A legal team uses Claude to review every clause of every vendor contract, something it previously could only spot-check. Which business value pillar does this mainly represent?
    options:
      - "Transformation: doing work that was not feasible before"
      - "Cost: lowering the price paid per contract reviewed"
      - "Performance SLAs: meeting a committed response time"
      - "Efficiency: reducing the time of an existing step"
    answer:
      - A
    explanation: "Trước đây chỉ kiểm mẫu, nay xem được toàn bộ: đó là chuyển đổi (làm được việc trước đây không khả thi). Hiệu suất là làm nhanh một bước sẵn có; chi phí và SLA là các trụ khác."
    ref: lessons/22-thiet-ke-giai-phap.html#bai-toan
  - id: PA42
    exams:
      CCAR-P: D2
    stem: A classifier must sort short emails into three clearly defined categories, and a zero-shot prompt with precise definitions already reaches the accuracy target. What should the architect do about few-shot examples?
    options:
      - Add ten examples anyway, because few-shot always improves accuracy
      - Keep zero-shot, and add examples only if evals show ambiguous misses
      - Switch to chain-of-thought for every email so the reasoning is visible
      - Fine-tune a custom model, since prompting has reached its limits
    answer:
      - B
    explanation: Zero-shot đủ cho việc rõ ràng; ví dụ tốn token và có thể làm model bám mẫu. Chỉ thêm few-shot khi eval cho thấy lỗi ở ca mơ hồ. Chain-of-thought cho mọi email tốn thêm mà không cần; fine-tune là quá tay khi đã đạt mục tiêu.
    ref: lessons/22-thiet-ke-giai-phap.html#prompt-he-thong
  - id: PB01
    exams:
      CCAR-P: D3
    stem: A support agent can read tickets, draft replies, issue refunds and delete user accounts. Support staff only ever read tickets and draft replies. Applying least privilege, which change best reduces risk?
    options:
      - Add audit logging to the refund and delete tools so misuse can be reviewed.
      - Remove the refund and delete tools from this agent's configuration entirely.
      - Keep all tools but require a confirmation prompt before refunds and deletions.
      - Replace the agent with a larger model that follows instructions more reliably.
    answer:
      - B
    explanation: Quyền tối thiểu nghĩa là bỏ năng lực vai trò không cần, loại hẳn bề mặt tấn công. Log và xác nhận là biện pháp phát hiện, bù trừ; cỡ model không liên quan phạm vi quyền.
    ref: lessons/23-tich-hop.html#tool-bloat
  - id: PB02
    exams:
      CCAR-P: D3
    stem: An agent connected to 12 MCP servers exposes over 200 tool definitions, consuming much of the context and lowering tool-selection accuracy. What is the most effective remedy?
    options:
      - Use tool search with deferred loading so only relevant tools are loaded on demand.
      - Shorten every tool description to a single sentence to save tokens.
      - Switch to a model with a larger context window and keep all tools loaded.
      - Merge all 200 tools into one generic tool that accepts a command string.
    answer:
      - A
    explanation: Tool search với defer_loading chỉ nạp tool cần, giảm token và tăng độ chính xác chọn tool. Mô tả quá ngắn làm chọn sai hơn; context lớn hơn không chữa loãng; một tool chung mất ràng buộc và an toàn.
    ref: lessons/23-tich-hop.html#tool-bloat
  - id: PB03
    exams:
      CCAR-P: D3
    stem: A research agent has a general-purpose `fetch_url` tool and keeps fetching arbitrary pages, including internal addresses. What is the best redesign?
    options:
      - Keep `fetch_url` and add “only fetch public websites” to the system prompt.
      - Replace it with a constrained tool that validates URLs against an allowlist.
      - Log every fetched URL so the security team can review them weekly.
      - Increase the agent's timeout so fetches of internal pages fail more often.
    answer:
      - B
    explanation: Thay tool chung bằng tool hẹp có kiểm tra (allowlist, chặn dải nội bộ) là phòng ngừa, đồng thời chặn SSRF. Lời dặn là xác suất; log là phát hiện sau; timeout không phải kiểm soát.
    ref: lessons/23-tich-hop.html#tool-bloat
  - id: PB04
    exams:
      CCAR-P: D3
    stem: Which TWO are signs of capability bloat in an agent configuration? (Choose two.)
    options:
      - Several tools with overlapping descriptions that the agent confuses
      - Write permissions on systems the agent's role only needs to read
      - Tool descriptions that state inputs, outputs and when to use each tool
      - A small set of tools each matched to one well-defined responsibility
    answer:
      - A
      - B
    explanation: Tool chồng chéo và quyền ghi thừa là dấu hiệu phình năng lực. Mô tả rõ và bộ tool nhỏ đúng trách nhiệm là thiết kế tốt.
    ref: lessons/23-tich-hop.html#tool-bloat
  - id: PB05
    exams:
      CCAR-P: D3
    stem: An internal agent queries the HR database through a single service account with full read access, for any employee who asks. What is the main security gap?
    options:
      - The service account password may be too short to meet the company's compliance standards for HR.
      - Users can see records beyond their own permissions, since the agent ignores per-user authorization.
      - The HR database may respond too slowly when many employees send questions at the same time.
      - The agent cannot cache results because each employee asks different questions.
    answer:
      - B
    explanation: "Tài khoản dịch vụ dùng chung làm mất phân quyền theo người dùng: ai hỏi cũng thấy mọi bản ghi. Cần hành động theo danh tính và quyền của người hỏi. Mật khẩu, tốc độ, cache không phải lỗ hổng chính."
    ref: lessons/23-tich-hop.html#xac-thuc
  - id: PB06
    exams:
      CCAR-P: D3
    stem: An MCP server receives an access token from the client and forwards that same token to a downstream SaaS API. According to MCP security guidance, what is wrong?
    options:
      - Nothing is wrong, since forwarding the token avoids a second, slower authorization flow for users.
      - "Token passthrough: the server must accept only tokens issued to it and use its own downstream tokens."
      - The server may forward the token, as long as it also logs the token in plain text for later audits.
      - The client should send its API key instead of an access token.
    answer:
      - B
    explanation: "Token passthrough là anti-pattern: server không được chuyển tiếp token nhận từ client, phải kiểm token được cấp cho chính nó (audience) và dùng token riêng cho API phía sau. Log token dạng rõ là lộ secret."
    ref: lessons/23-tich-hop.html#xac-thuc
  - id: PB07
    exams:
      CCAR-P: D3
    stem: For a remote MCP server that requires user authorization, which TWO practices does the MCP authorization specification require of clients? (Choose two.)
    options:
      - Use PKCE in the OAuth authorization code flow.
      - Include a resource indicator naming the MCP server the token is for.
      - Embed long-lived API keys in the client's source code.
      - Reuse a single token across all MCP servers the client connects to.
    answer:
      - A
      - B
    explanation: "Đặc tả dựa trên OAuth 2.1: client phải dùng PKCE và resource indicator (RFC 8707). Key trong mã nguồn và dùng chung token cho mọi server là lỗ hổng."
    ref: lessons/23-tich-hop.html#xac-thuc
  - id: PB08
    exams:
      CCAR-P: D3
    stem: A proxy MCP server connects users to a third-party API using one static client ID, and an attacker obtains authorization codes without the user's real consent. What is this attack called?
    options:
      - Confused deputy
      - Rate-limit exhaustion
      - Context drift
      - Prompt caching poisoning
    answer:
      - A
    explanation: "Confused deputy: proxy bị lợi dụng để lấy quyền mà người dùng chưa đồng ý. Biện pháp: xin đồng ý theo từng client, kiểm tra redirect URI. Các phương án khác là khái niệm không liên quan."
    ref: lessons/23-tich-hop.html#xac-thuc
  - id: PB09
    exams:
      CCAR-P: D3
    stem: An agent needs credentials for a payment API during automated sessions. Where should the credential live?
    options:
      - In the system prompt, so the agent can copy it into each payment tool call it makes.
      - In a secrets manager or vault, injected at call time outside the model's context.
      - In a CLAUDE.md file committed to the repository, so every session can read it easily.
      - In the first user message of each session, sent by the client.
    answer:
      - B
    explanation: Secret nằm ở secrets manager hoặc vault, được gắn vào lời gọi ngoài context của model. Đặt trong prompt, CLAUDE.md hay tin nhắn làm lộ qua log và transcript.
    ref: lessons/23-tich-hop.html#xac-thuc
  - id: PB10
    exams:
      CCAR-P: D3
    stem: A company's inventory service must be usable from Claude Code, claude.ai and two internal Claude API apps. Which integration mechanism fits best?
    options:
      - An MCP server for the inventory service, reused by all four clients
      - A custom tool written separately inside each of the four applications
      - A2A, so each client negotiates with the inventory service as an agent
      - Pasting inventory exports into each conversation when needed
    answer:
      - A
    explanation: "Một hệ thống dùng lại ở nhiều client: MCP server. Viết tool riêng ở bốn nơi khó bảo trì; A2A dành cho agent với agent; dán dữ liệu thủ công không cập nhật."
    ref: lessons/23-tich-hop.html#giao-thuc
  - id: PB11
    exams:
      CCAR-P: D3
    stem: Your procurement agent must hand off negotiation tasks to a supplier's own AI agent, whose internals you cannot see. Which mechanism fits best?
    options:
      - MCP, exposing the supplier's agent as a set of tools on your server
      - A2A, where each agent publishes its capabilities and exchanges tasks
      - Direct database access to the supplier's systems
      - A shared prompt that both companies edit together
    answer:
      - B
    explanation: Giao việc giữa các agent hộp đen của các tổ chức khác nhau là trường hợp của A2A. MCP dành cho agent dùng tool; truy cập DB đối tác không khả thi; prompt chung không phải giao thức.
    ref: lessons/23-tich-hop.html#giao-thuc
  - id: PB12
    exams:
      CCAR-P: D3
    stem: Developers use Claude Code daily, and the team's cloud tasks already have a well-documented CLI with scoped credentials. What is often the simplest integration?
    options:
      - Let Claude Code call the existing CLI through Bash with scoped permissions.
      - Build a new MCP server that wraps every CLI command before any use.
      - Use A2A so Claude Code negotiates with the CLI as another agent.
      - Copy CLI documentation into every prompt and let Claude infer the API.
    answer:
      - A
    explanation: Trong môi trường developer, CLI tốt sẵn có thường là cách đơn giản nhất, kèm quyền giới hạn. Viết MCP bọc mọi lệnh là thừa ở bước đầu; A2A không áp dụng; dán tài liệu không cho Claude chạy được.
    ref: lessons/23-tich-hop.html#giao-thuc
  - id: PB13
    exams:
      CCAR-P: D3
    stem: A team plans a RAG pipeline for an internal knowledge base of about 120,000 tokens that changes monthly. What simpler alternative should be considered first?
    options:
      - Include the whole knowledge base in the prompt with prompt caching.
      - Fine-tune a model on the knowledge base every month.
      - Build a multi-agent system with one agent per document.
      - Use web search to find answers instead of internal documents.
    answer:
      - A
    explanation: Kho nhỏ hơn khoảng 200.000 token có thể đưa toàn bộ vào prompt kèm caching, không cần RAG. Fine-tune, nhiều agent, web search đều không phù hợp hoặc quá tay.
    ref: lessons/23-tich-hop.html#rag
  - id: PB14
    exams:
      CCAR-P: D3
    stem: Retrieved chunks often lack the context needed to match queries; for example a chunk says “revenue grew 3%” without naming the company or quarter. Which technique addresses this?
    options:
      - "Contextual retrieval: prepend a short chunk-specific context before embedding and BM25 indexing."
      - Increase chunk size to whole documents so that no surrounding context is ever lost in retrieval.
      - Remove BM25 and rely only on embeddings, which capture semantic meaning better than keywords.
      - Lower the similarity threshold so more unrelated chunks are returned.
    answer:
      - A
    explanation: Contextual retrieval thêm ngữ cảnh cho từng chunk trước khi index (embedding và BM25), giảm truy xuất thất bại khoảng 49%, khoảng 67% khi thêm rerank. Chunk cả tài liệu làm retrieval kém chính xác; bỏ BM25 mất khớp từ khoá; hạ ngưỡng tăng nhiễu.
    ref: lessons/23-tich-hop.html#rag
  - id: PB15
    exams:
      CCAR-P: D3
    stem: Which TWO additions most improve retrieval quality in a production RAG pipeline? (Choose two.)
    options:
      - Hybrid retrieval combining embeddings with BM25 keyword search
      - A reranking step that selects the best chunks from a larger candidate set
      - Removing document metadata to keep the index smaller
      - Using the same chunk size for code, tables and prose without testing
    answer:
      - A
      - B
    explanation: Truy xuất lai và rerank là hai cải tiến chính. Bỏ metadata mất khả năng lọc và phân quyền; một cỡ chunk cho mọi loại nội dung mà không thử là kém.
    ref: lessons/23-tich-hop.html#rag
  - id: PB16
    exams:
      CCAR-P: D3
    stem: In a company-wide RAG assistant, employees sometimes see excerpts from documents they are not authorized to open. What is the correct fix?
    options:
      - Tell the model in the system prompt not to quote restricted documents.
      - Filter retrieval by each user's access permissions using document metadata.
      - Remove all restricted documents from the company's knowledge base.
      - Reduce the number of retrieved chunks so restricted ones appear less often.
    answer:
      - B
    explanation: Phân quyền phải áp ở bước truy xuất bằng metadata quyền truy cập của từng người. Lời dặn không phải kiểm soát; xoá tài liệu mất giá trị; giảm số chunk chỉ giảm xác suất.
    ref: lessons/23-tich-hop.html#rag
  - id: PB17
    exams:
      CCAR-P: D3
    stem: Finance users ask questions like “total revenue by region last quarter” over a data warehouse. Which retrieval approach fits?
    options:
      - Embed every table row and retrieve the most similar rows
      - Give Claude a tool that runs governed SQL queries and returns results
      - Ask Claude to estimate totals from its general knowledge
      - Use BM25 keyword search over exported CSV files
    answer:
      - B
    explanation: Câu hỏi tổng hợp trên dữ liệu có cấu trúc cần truy vấn SQL (qua tool có kiểm soát). Embedding từng dòng không tính tổng được; ước lượng từ kiến thức chung sai; BM25 trên CSV không tổng hợp.
    ref: lessons/23-tich-hop.html#truy-xuat
  - id: PB18
    exams:
      CCAR-P: D3
    stem: Users search a support knowledge base with exact error codes such as “E-4471,” and semantic search returns loosely related articles. What helps most?
    options:
      - Add lexical keyword (BM25) or exact-match search for identifiers.
      - Use a larger embedding model so codes are understood semantically.
      - Ask users to describe errors in full sentences instead of codes.
      - Increase the number of semantic results returned per query.
    answer:
      - A
    explanation: Mã định danh chính xác hợp với tìm kiếm từ khoá hoặc khớp chính xác. Model embedding lớn hơn vẫn yếu với chuỗi mã; bắt người dùng đổi cách hỏi đẩy việc cho họ; thêm kết quả thêm nhiễu.
    ref: lessons/23-tich-hop.html#truy-xuat
  - id: PB19
    exams:
      CCAR-P: D3
    stem: Engineers ask “which services break if we change the billing API?” across a large microservice estate. Which retrieval strategy fits best?
    options:
      - Semantic search over every service's README and design documents
      - A dependency graph or structural index queried by relationship
      - BM25 keyword search over commit messages from the past year
      - Random sampling of code files from each microservice repository
    answer:
      - B
    explanation: Câu hỏi về quan hệ phụ thuộc hợp với đồ thị hoặc chỉ mục cấu trúc. Tìm theo nghĩa hay từ khoá trong README, commit dễ bỏ sót quan hệ thật.
    ref: lessons/23-tich-hop.html#truy-xuat
  - id: PB20
    exams:
      CCAR-P: D3
    stem: A RAG assistant meets its 92% accuracy target but misses the 3-second p95 latency SLA; profiling shows the reranker and 20 retrieved chunks dominate latency. What is the best first adjustment?
    options:
      - Remove retrieval entirely and rely on the model's built-in knowledge to answer faster.
      - Tune the candidate count and reranker settings, then verify both SLA and accuracy on evals.
      - Switch to the largest model and add more chunks to compensate for any accuracy loss.
      - Quietly raise the SLA to 10 seconds in the documentation without telling stakeholders.
    answer:
      - B
    explanation: Điều chỉnh đúng nút gây trễ (số chunk, cấu hình rerank) rồi đo lại cả độ trễ lẫn độ chính xác trên eval. Bỏ retrieval làm sai; model lớn chậm hơn; đổi SLA âm thầm là sai quy trình.
    ref: lessons/23-tich-hop.html#tre-chinh-xac
  - id: PB21
    exams:
      CCAR-P: D3
    stem: An agent performs three independent lookups sequentially before answering, and users wait too long. Which change reduces latency without reducing accuracy?
    options:
      - Run the independent lookups in parallel.
      - Skip two of the lookups to save time.
      - Use a smaller model for the final answer.
      - Reduce max_tokens to shorten every response.
    answer:
      - A
    explanation: Bước độc lập chạy song song giảm độ trễ mà giữ độ chính xác. Bỏ lookup hay hạ model có thể giảm chất lượng; max_tokens có thể cắt cụt câu trả lời.
    ref: lessons/23-tich-hop.html#tre-chinh-xac
  - id: PB22
    exams:
      CCAR-P: D3
    stem: A multi-step agent in production occasionally gives wrong answers, and logs show only final outputs. Which observability change helps diagnose these failures?
    options:
      - Step-level tracing of requests, tool calls and tool results with a shared request ID
      - Daily screenshots of the usage dashboard showing total request counts per model
      - Logging only the HTTP status codes returned by the model API for each request
      - Asking users to describe what went wrong in a free-text form
    answer:
      - A
    explanation: Trace từng bước gắn mã yêu cầu xuyên suốt cho biết lỗi bắt đầu ở đâu. Số request tổng, mã HTTP hay mô tả của người dùng không đủ để chẩn đoán agent nhiều bước.
    ref: lessons/23-tich-hop.html#quan-sat
  - id: PB23
    exams:
      CCAR-P: D3
    stem: Answer quality degrades slowly over weeks, with no errors or latency changes. Which monitoring strategy detects this?
    options:
      - Alerting on HTTP 5xx error rates and timeouts returned by the model API
      - "Online evaluation: periodically sampling transcripts and scoring them with graders"
      - Monitoring CPU and memory usage on the application servers that call the API
      - Checking the model provider's status page daily
    answer:
      - B
    explanation: Trượt chất lượng không sinh lỗi HTTP; cần eval online lấy mẫu transcript và chấm định kỳ, kèm các tín hiệu như tỷ lệ escalation. CPU hay trang trạng thái không đo chất lượng.
    ref: lessons/23-tich-hop.html#quan-sat
  - id: PB24
    exams:
      CCAR-P: D3
    stem: Full prompts and responses are logged for debugging, and they contain customer PII. What is the best practice?
    options:
      - Stop logging entirely so no PII is ever stored.
      - Redact PII before logging, restrict access, and set a retention period.
      - Keep full logs indefinitely in a shared bucket for future analysis.
      - Encrypt the logs and share the key with every engineer.
    answer:
      - B
    explanation: Che PII trước khi ghi, giới hạn người đọc, đặt thời hạn lưu giữ được khả năng debug mà vẫn bảo vệ dữ liệu. Bỏ log mất khả năng chẩn đoán; lưu vô hạn hay chia khoá cho mọi người là rủi ro.
    ref: lessons/23-tich-hop.html#quan-sat
  - id: PB25
    exams:
      CCAR-P: D3
    stem: An assistant must support hundreds of tools and dozens of procedures that change often. Which context strategy fits best?
    options:
      - "Progressive discovery: skills and tool search loaded on demand, with strong descriptions"
      - A monolithic system prompt that contains every tool definition and every procedure
      - A separate deployment for each procedure, chosen manually by users before each chat
      - Removing descriptions so the model infers tools from their names
    answer:
      - A
    explanation: "Nhiều tool, nhiều quy trình, thay đổi thường xuyên: khám phá dần (skill, tool search) và đầu tư vào mô tả để tìm đúng. Prompt nguyên khối phình và loãng; tách deployment khó dùng; bỏ mô tả làm chọn sai."
    ref: lessons/23-tich-hop.html#context-chien-luoc
  - id: PB26
    exams:
      CCAR-P: D4
    stem: Which set of signals gives the most useful production dashboard for a Claude-based support agent?
    options:
      - Server CPU and memory usage only, since the model runs on Anthropic's side
      - Total monthly invoice from Anthropic, reviewed once at the end of each month
      - The number of deployments per week, and the number of open pull requests
      - Cost per route, cache hits, p95 latency, error rates and sampled quality
    answer:
      - D
    explanation: Giám sát hệ LLM cần cả chi phí (token theo route, cache hit), hiệu năng (p95, lỗi 429/529) và chất lượng (eval online trên mẫu transcript). CPU, hoá đơn cuối tháng hay số lần deploy không cho biết hệ có đang trả lời tốt không.
    ref: lessons/23-tich-hop.html#quan-sat
  - id: PB27
    exams:
      CCAR-P: D4
    stem: Escalations to human agents rose from 8% to 15% over two weeks, with no errors or latency changes. What should monitoring have done, and what is the next step?
    options:
      - Nothing; escalation rate is a business metric and not part of AI monitoring
      - Alert on the escalation trend, then inspect sampled transcripts to find the cause
      - Restart the service, since rising escalations usually indicate a memory leak
      - Raise the confidence threshold so that the agent escalates fewer conversations
    answer:
      - B
    explanation: Tỷ lệ escalation là tín hiệu chất lượng; cần cảnh báo theo xu hướng rồi đọc mẫu transcript để tìm nguyên nhân (dữ liệu mới, prompt, model). Khởi động lại không chạm nguyên nhân; hạ escalation bằng ngưỡng là che triệu chứng và tăng rủi ro.
    ref: lessons/23-tich-hop.html#quan-sat
  - id: PB28
    exams:
      CCAR-P: D3
    stem: A RAG assistant misses its 3-second p95 SLA. Nobody knows which stage is slow. What should the architect do first?
    options:
      - Switch to the smallest model, since generation is usually the slowest stage
      - Trace each stage and build a latency budget, then cut the stage that takes most
      - Remove the reranker entirely, because rerankers always add the most latency
      - Ask users to accept 5 seconds, since accuracy matters more than latency
    answer:
      - B
    explanation: "Đo trước khi sửa: trace theo khâu (truy xuất, rerank, chờ token đầu, sinh) cho biết khâu nào vượt ngân sách. Đổi model nhỏ hay bỏ reranker khi chưa đo có thể hạ độ chính xác mà không chạm khâu chậm; tự nới SLA không phải quyết định của kiến trúc sư."
    ref: lessons/23-tich-hop.html#tre-chinh-xac
  - id: PB29
    exams:
      CCAR-P: D3
    stem: After moving 40 procedures into Skills, token use dropped sharply, but the assistant often answers without applying the right procedure. What is the most likely cause?
    options:
      - Skills cannot hold procedures, so they must go back in the system prompt
      - The context window is too small to hold even one full skill at a time
      - Skill descriptions are too vague for Claude to match them to requests
      - Progressive discovery always lowers accuracy compared with monolithic context
    answer:
      - C
    explanation: Với Skills, chỉ tên và description nằm sẵn trong context; description mơ hồ thì Claude không biết khi nào nạp skill. Sửa description cho rõ khi nào dùng và đo tỷ lệ chọn đúng skill. Khám phá dần không tự làm giảm chính xác nếu tìm đúng.
    ref: lessons/23-tich-hop.html#context-chien-luoc
  - id: PC01
    exams:
      CCAR-P: D4
    stem: A document-extraction system reports 97% overall accuracy, but one customer complains that invoice dates are often wrong. What should the evaluation report include?
    options:
      - Only the overall accuracy, since it already exceeds the 95% target.
      - Accuracy broken down by document type and by field, not just the overall average.
      - The number of tokens processed per day as the main quality indicator.
      - A survey of how satisfied engineers are with the extraction prompts.
    answer:
      - B
    explanation: Trung bình tổng có thể che giấu lỗi tập trung ở một loại tài liệu hay một trường. Chia theo loại và theo trường. Token mỗi ngày hay khảo sát kỹ sư không đo chất lượng.
    ref: lessons/24-danh-gia-governance.html#chi-so
  - id: PC02
    exams:
      CCAR-P: D4
    stem: A customer-facing agent succeeds 80% of the time per attempt. Customers expect it to behave correctly every time they use it. Which metric best reflects that expectation over three uses?
    options:
      - pass@3, the probability that at least one of three attempts succeeds
      - pass^3, the probability that all three attempts succeed
      - Average tokens per attempt across the three attempts
      - The fastest of the three attempts' latencies
    answer:
      - B
    explanation: "Khi cần nhất quán mỗi lần, đo pass^k (cả k lần đều đạt): 0,8^3 ≈ 51%. pass@k hợp khi được thử nhiều cách và chỉ cần một lần đúng. Token hay độ trễ nhanh nhất không đo độ tin cậy."
    ref: lessons/24-danh-gia-governance.html#chi-so
  - id: PC03
    exams:
      CCAR-P: D4
    stem: Which TWO metrics belong in an evaluation plan for a customer-support agent with financial actions? (Choose two.)
    options:
      - Rate of policy-violating actions attempted, measured on adversarial test cases
      - p95 time to resolution for typical requests
      - The number of lines in the system prompt
      - How many tools are defined in the agent configuration
    answer:
      - A
      - B
    explanation: Kế hoạch eval đo cả an toàn (hành động vi phạm trên ca đối kháng) lẫn hiệu năng (p95 thời gian giải quyết). Số dòng prompt hay số tool không phải chỉ số kết quả.
    ref: lessons/24-danh-gia-governance.html#chi-so
  - id: PC04
    exams:
      CCAR-P: D4
    stem: A team's eval set contains 50 hand-picked examples that the current prompt already handles perfectly. What is the main weakness?
    options:
      - It is too large, which makes every evaluation run slow and expensive to repeat often.
      - It lacks realistic distribution, edge cases and known failures, so it cannot reveal problems.
      - It uses hand-picked examples, which automated graders cannot score in a reliable way.
      - It should contain only synthetic data generated by the model.
    answer:
      - B
    explanation: Bộ eval toàn ca dễ đã đạt không phát hiện được lỗi. Cần mẫu lưu lượng thật, ca biên, ca từng lỗi, ca đối kháng. Bộ 50 ca không quá lớn; dữ liệu tổng hợp hữu ích nhưng không thay hoàn toàn dữ liệu thật.
    ref: lessons/24-danh-gia-governance.html#bo-du-lieu
  - id: PC05
    exams:
      CCAR-P: D4
    stem: A team wants to grade the tone and helpfulness of 5,000 responses per week. Which approach is most practical?
    options:
      - A model-based grader with a clear rubric, calibrated against a human-graded sample
      - Exact-match comparison against a single reference answer for each response
      - Having one engineer read all 5,000 responses every week
      - Asking the responding model to rate its own helpfulness
    answer:
      - A
    explanation: "Tiêu chí chủ quan ở quy mô lớn: model chấm theo rubric rõ, hiệu chỉnh so với mẫu người chấm. Khớp chính xác không chấm được giọng văn; một người đọc 5.000 câu không bền; tự chấm thiên lệch."
    ref: lessons/24-danh-gia-governance.html#bo-du-lieu
  - id: PC06
    exams:
      CCAR-P: D4
    stem: How should capability evals and regression evals differ?
    options:
      - Capability evals target hard tasks with low pass rates; regression evals must stay near 100%.
      - Capability evals run only in production; regression evals run only on developer laptops.
      - Capability evals always use human graders; regression evals never use any graders at all.
      - There is no difference; both terms describe the same evaluation suite.
    answer:
      - A
    explanation: Eval năng lực nhắm việc khó, tỷ lệ đạt thấp để leo dần; eval hồi quy giữ những gì đã làm được gần 100%. Môi trường chạy hay loại grader không phải điểm phân biệt.
    ref: lessons/24-danh-gia-governance.html#bo-du-lieu
  - id: PC07
    exams:
      CCAR-P: D4
    stem: Code-based graders report that an agent passes 90% of tasks, but users still report failures. What should the team do next?
    options:
      - Read transcripts of passing and failing runs to check whether graders measure the right thing.
      - Increase the pass threshold to 95% and keep the existing graders exactly as they are now.
      - Stop collecting user reports, since the automated graders already show high quality.
      - Replace all graders with the agent's self-assessment of success.
    answer:
      - A
    explanation: "Điểm cao nhưng người dùng vẫn gặp lỗi: đọc transcript để kiểm grader có đo đúng thứ cần đo. Nâng ngưỡng không sửa grader sai; bỏ phản hồi người dùng mất tín hiệu; tự chấm không tin cậy."
    ref: lessons/24-danh-gia-governance.html#bo-du-lieu
  - id: PC08
    exams:
      CCAR-P: D4
    stem: A new prompt improves offline eval scores. What is the safest way to roll it out?
    options:
      - Replace the old prompt for all users immediately, since the offline evals already passed.
      - Canary to a small share of traffic, compare primary and guardrail metrics, then expand or roll back.
      - Deploy to all users at once on a Friday evening, when traffic and attention are lowest.
      - Ask users whether they prefer the new prompt before measuring anything.
    answer:
      - B
    explanation: Eval offline rồi canary, A/B so chỉ số chính và chỉ số bảo vệ, mở rộng dần hoặc rollback. Thay toàn bộ ngay bỏ qua rủi ro thực tế; triển khai tối thứ Sáu không phải kiểm soát; hỏi cảm nhận trước khi đo không đủ.
    ref: lessons/24-danh-gia-governance.html#ab-test
  - id: PC09
    exams:
      CCAR-P: D4
    stem: A team changes the model, the system prompt and the retrieval settings at the same time, and quality drops. What process mistake made diagnosis hard?
    options:
      - Changing several variables at once, so the cause cannot be attributed.
      - Running the change through offline evals before deployment.
      - Keeping a rollback path to the previous configuration.
      - Measuring guardrail metrics alongside the primary metric.
    answer:
      - A
    explanation: Đổi nhiều biến cùng lúc thì không biết thay đổi nào gây ra kết quả. Eval offline, đường rollback, chỉ số bảo vệ đều là thực hành tốt.
    ref: lessons/24-danh-gia-governance.html#ab-test
  - id: PC10
    exams:
      CCAR-P: D4
    stem: An A/B test shows the new configuration resolves 3% more tickets but costs 40% more per ticket. How should the decision be made?
    options:
      - Always ship whichever variant improves the primary metric, regardless of other metrics.
      - Weigh the primary gain against guardrail metrics like cost using agreed business criteria.
      - Reject any change that increases cost per ticket, regardless of the benefit it brings.
      - Run the test indefinitely until both metrics improve together.
    answer:
      - B
    explanation: Quyết định theo tiêu chí kinh doanh đã thống nhất, cân lợi ích chỉ số chính với chỉ số bảo vệ (chi phí). Luôn chọn chỉ số chính hay luôn từ chối khi tăng chi phí đều cứng nhắc; chạy mãi không ra quyết định.
    ref: lessons/24-danh-gia-governance.html#ab-test
  - id: PC11
    exams:
      CCAR-P: D4
    stem: A RAG system suddenly returns confident but incorrect answers after a document refresh, while latency and model version are unchanged. Where should investigation start?
    options:
      - The model weights, which may have been changed silently by the provider
      - The retrieval and indexing step, which may return irrelevant or stale chunks
      - The temperature setting, which may now be too low for creative answers
      - The context window, which may have shrunk after the latest document refresh
    answer:
      - B
    explanation: "Sự kiện kích hoạt là làm mới tài liệu, model và độ trễ không đổi: nghi retrieval, index trước (re-index hỏng, embedding lệch). Trọng số không tự đổi; temperature, context window không bị ảnh hưởng bởi việc làm mới tài liệu."
    ref: lessons/24-danh-gia-governance.html#chan-doan
  - id: PC12
    exams:
      CCAR-P: D4
    stem: Right after switching the model alias to a newer version, the agent starts producing a different JSON layout that breaks downstream parsing. What is the most likely cause category?
    options:
      - "Model mismatch: behavior changed with the new model version."
      - "Retrieval failure: the index returns stale chunks."
      - "Rate limiting: requests are being throttled."
      - "Network failure: responses are truncated in transit."
    answer:
      - A
    explanation: "Thay đổi trùng thời điểm đổi model: hành vi model khác. Chạy eval hai phiên bản, ghim model ID, dùng structured output. Retrieval, rate limit, mạng không giải thích việc đổi layout."
    ref: lessons/24-danh-gia-governance.html#chan-doan
  - id: PC13
    exams:
      CCAR-P: D4
    stem: An assistant cites specific regulation numbers that do not exist, even though the relevant regulations are in its retrieved context. Which fix targets this hallucination best?
    options:
      - Enable citations on the source documents and require answers to quote supporting text.
      - Increase the temperature so the model explores more possible numbers.
      - Remove the retrieved context so the model uses its training knowledge.
      - Switch to a smaller model, which invents fewer details.
    answer:
      - A
    explanation: Buộc câu trả lời dựa trên đoạn trích từ nguồn và bật citations để kiểm chứng. Tăng temperature, bỏ nguồn hay model nhỏ không giảm bịa.
    ref: lessons/24-danh-gia-governance.html#chan-doan
  - id: PC14
    exams:
      CCAR-P: D4
    stem: Which TWO symptoms point to an integration-layer problem rather than a model-output problem? (Choose two.)
    options:
      - Intermittent 529 errors and timeouts at peak hours
      - JSON parsing crashes because the app matches tool input as raw strings
      - The model chooses a search tool when a lookup tool was appropriate
      - Answers become vague in very long conversations
    answer:
      - A
      - B
    explanation: 529, timeout và lỗi parse do code là lỗi tầng tích hợp, sửa bằng code. Chọn sai tool là lỗi đầu ra (sửa mô tả tool); trả lời mơ hồ trong hội thoại dài là context drift.
    ref: lessons/24-danh-gia-governance.html#chan-doan
  - id: PC15
    exams:
      CCAR-P: D4
    stem: Monthly API costs rose sharply. Which optimization should normally be tried first because it saves money without trading off quality?
    options:
      - Prompt caching for stable prefixes and trimming unnecessary input tokens
      - Switching every route to the smallest model available
      - Lowering max_tokens to a very small value on all requests
      - Reducing the number of evaluation runs before each release
    answer:
      - A
    explanation: "Thứ tự: miễn phí trước (cache, cắt token thừa, Batches cho việc không gấp), đánh đổi sau (hạ model, hạ effort). Model nhỏ nhất có thể giảm chất lượng; max_tokens quá thấp cắt cụt; bớt eval tăng rủi ro."
    ref: lessons/24-danh-gia-governance.html#toi-uu
  - id: PC16
    exams:
      CCAR-P: D4
    stem: An agent loops through hundreds of records, calling a tool for each and pulling every intermediate result into context. Which optimization cuts tokens and round trips most?
    options:
      - Programmatic tool calling, letting code process intermediate results outside the context
      - Increasing the context window so that all of the intermediate results fit at once
      - Adding a separate summarization call after every single tool result in the loop
      - Running the same loop with a faster model
    answer:
      - A
    explanation: Programmatic tool calling cho code xử lý kết quả trung gian trong sandbox, chỉ kết quả cuối vào context. Context lớn hơn vẫn tốn token; tóm tắt mỗi kết quả thêm lượt gọi; model nhanh không giảm số vòng.
    ref: lessons/24-danh-gia-governance.html#toi-uu
  - id: PC17
    exams:
      CCAR-P: D4
    stem: Analysis shows 70% of a route's traffic is simple FAQ questions while 30% requires complex reasoning. What is a reasonable optimization to evaluate?
    options:
      - Route simple questions to a smaller model or lower effort, measured against the quality bar.
      - Send all traffic to the most capable model at maximum effort to protect answer quality.
      - Reject complex questions so that the system only ever answers the simple FAQ questions.
      - Batch all questions overnight to reduce cost.
    answer:
      - A
    explanation: Định tuyến phần đơn giản sang cấu hình rẻ hơn, đo bằng eval, là đánh đổi hợp lý (cân thêm việc mất cache). Model mạnh nhất cho mọi thứ lãng phí; từ chối câu khó mất giá trị; batch qua đêm không hợp hỏi đáp.
    ref: lessons/24-danh-gia-governance.html#toi-uu
  - id: PC18
    exams:
      CCAR-P: D4
    stem: Which change reduces end-to-end latency for an agent without lowering answer quality?
    options:
      - Parallelizing independent tool calls and caching the stable prompt prefix
      - Cutting the system prompt down to one short sentence of instructions
      - Lowering max_tokens so that long answers are cut off much sooner
      - Removing the validation of outputs before they are returned to users
    answer:
      - A
    explanation: Song song hoá bước độc lập và cache tiền tố tĩnh giảm độ trễ mà giữ chất lượng. Cắt system prompt, cắt max_tokens hay bỏ validate đều có thể giảm chất lượng hoặc an toàn.
    ref: lessons/24-danh-gia-governance.html#toi-uu
  - id: PC19
    exams:
      CCAR-P: D4
    stem: Stakeholders ask whether a new agent is “secure enough.” Which evaluation produces the most useful evidence?
    options:
      - A red-team test set of injection and misuse attempts, reporting the attack success rate
      - A written statement from the model provider confirming that the model is safe
      - The number of security-related words in the system prompt
      - A one-time manual review of ten normal conversations by a senior engineer
    answer:
      - A
    explanation: Bằng chứng bảo mật đến từ bộ thử đối kháng có đo tỷ lệ tấn công thành công. Tuyên bố của nhà cung cấp, từ khoá trong prompt hay vài hội thoại bình thường không đo được rủi ro.
    ref: lessons/24-danh-gia-governance.html#chi-so
  - id: PC20
    exams:
      CCAR-P: D4
    stem: Which practice keeps an eval set useful as the product evolves?
    options:
      - Add real failures from production to the eval set after fixing them.
      - Freeze the eval set forever so scores stay comparable.
      - Delete cases the system already passes to keep the set small.
      - Replace the eval set every week with entirely new random cases.
    answer:
      - A
    explanation: Đưa lỗi thật từ production vào bộ eval để chặn hồi quy. Đóng băng mãi thì lỗi thời; xoá ca đã đạt mất eval hồi quy; thay toàn bộ mỗi tuần mất khả năng so sánh.
    ref: lessons/24-danh-gia-governance.html#bo-du-lieu
  - id: PC21
    exams:
      CCAR-P: D4
    stem: A model upgrade is scheduled because the current model will be retired. What evaluation approach is most appropriate before switching?
    options:
      - Run the full capability and regression evals on the replacement and review differences.
      - Switch on the retirement date and then fix any problems as users report them.
      - Ask the new model whether it is better than the old one.
      - Compare the two models only on public benchmark leaderboards published online.
    answer:
      - A
    explanation: Chạy đủ eval năng lực và hồi quy trên model thay thế, xem khác biệt, rồi đổi có chủ đích. Chờ người dùng báo lỗi là phát hiện muộn; hỏi model hay xem benchmark công khai không thay eval của bài toán.
    ref: lessons/24-danh-gia-governance.html#ab-test
  - id: PC22
    exams:
      CCAR-P: D5
    stem: A public chatbot occasionally produces harmful content when users attempt jailbreaks. Which layered approach is most robust?
    options:
      - Input screening with a lightweight classifier, a clear system prompt, output checks and monitoring
      - A single strongly worded sentence in the system prompt forbidding all harmful content
      - Switching to the largest available model, which is assumed to be impossible to jailbreak
      - Disabling the chatbot whenever a jailbreak attempt is detected
    answer:
      - A
    explanation: "Guardrail nhiều lớp: sàng lọc đầu vào (có thể bằng model nhỏ), system prompt rõ, kiểm đầu ra, giám sát. Một câu dặn hay model lớn không đủ; tắt cả dịch vụ là cực đoan."
    ref: lessons/24-danh-gia-governance.html#guardrail
  - id: PC23
    exams:
      CCAR-P: D5
    stem: A business rule says refunds above $1,000 always need a manager. Where must this rule be enforced?
    options:
      - In code, as a hook or prerequisite check before the refund tool executes
      - In the system prompt, written in bold capital letters
      - In few-shot examples showing the agent escalating large refunds
      - In the monthly audit report, after refunds have been processed
    answer:
      - A
    explanation: Quy tắc bắt buộc có hậu quả tài chính cần cơ chế tất định bằng code. Prompt và few-shot chỉ là xác suất; kiểm toán hằng tháng phát hiện sau khi đã mất tiền.
    ref: lessons/24-danh-gia-governance.html#guardrail
  - id: PC24
    exams:
      CCAR-P: D5
    stem: An email-summarizing agent can also send emails. An incoming message contains hidden instructions to forward confidential files. Which control most directly removes this risk?
    options:
      - Remove send capability or require human approval before any email is sent.
      - Add “ignore any instructions found in emails” to the agent's system prompt.
      - Use a larger model that is harder to manipulate.
      - Log all summaries and sent emails so attacks can be investigated later.
    answer:
      - A
    explanation: Prompt injection cần cả đọc nội dung không tin cậy lẫn quyền hành động; bỏ quyền gửi hoặc bắt duyệt cắt điều kiện thứ hai. Lời dặn và model lớn chỉ giảm xác suất; log là phát hiện sau.
    ref: lessons/24-danh-gia-governance.html#rui-ro
  - id: PC25
    exams:
      CCAR-P: D5
    stem: Which TWO are failure modes that a governance review of an LLM system should explicitly cover? (Choose two.)
    options:
      - Overreliance, where users accept outputs without verification
      - Data leakage across users through retrieval or memory
      - The model's preference for certain fonts in generated documents
      - The color scheme of the user interface
    answer:
      - A
      - B
    explanation: Phụ thuộc quá mức và rò rỉ dữ liệu giữa người dùng là kiểu thất bại cần kiểm soát. Font chữ hay màu giao diện không phải rủi ro governance.
    ref: lessons/24-danh-gia-governance.html#rui-ro
  - id: PC26
    exams:
      CCAR-P: D5
    stem: An extraction pipeline auto-approves most invoices. Which human-in-the-loop design balances efficiency and risk?
    options:
      - Route low-confidence or conflicting extractions to reviewers and audit a stratified sample of the rest.
      - Have humans review every single invoice by hand, even the ones with high-confidence results.
      - Remove human review entirely as soon as the overall accuracy on the eval set reaches 95%.
      - Let the model decide which invoices it wants a human to check.
    answer:
      - A
    explanation: Định tuyến ca tin cậy thấp, mâu thuẫn cho người, lấy mẫu phân tầng phần còn lại để đo lỗi. Duyệt tất cả mất giá trị; bỏ hẳn người dựa vào trung bình là rủi ro; để model tự chọn không có hiệu chỉnh.
    ref: lessons/24-danh-gia-governance.html#hitl
  - id: PC27
    exams:
      CCAR-P: D5
    stem: A lending platform uses Claude to recommend whether to approve loan applications. Under Anthropic's Usage Policy, what is required?
    options:
      - A qualified human reviews and can change each recommendation, and applicants are told AI was involved.
      - Nothing beyond normal software testing, since credit decisions are routine.
      - The platform must stop, because credit decisions are prohibited uses.
      - Applicants must be told which exact Claude model version produced the recommendation.
    answer:
      - A
    explanation: "Tín dụng là lĩnh vực rủi ro cao: cần người có chuyên môn duyệt, có quyền sửa, và công bố có AI tham gia. Không bị cấm; không cần nêu phiên bản model."
    ref: lessons/24-danh-gia-governance.html#hitl
  - id: PC28
    exams:
      CCAR-P: D5
    stem: A hospital wants clinicians to use Claude with protected health information (PHI). What is the correct starting point?
    options:
      - Use a HIPAA-ready offering with a signed BAA, and confirm which features are covered.
      - Use consumer accounts and tell clinicians to avoid patient names.
      - Enable incognito chats for clinicians, which makes any plan HIPAA compliant automatically.
      - Add a HIPAA compliance disclaimer to the system prompt of each clinician conversation.
    answer:
      - A
    explanation: PHI cần dịch vụ HIPAA-ready có BAA, và kiểm tra tính năng nào thuộc phạm vi BAA (không phải mọi tính năng). Tài khoản consumer, incognito hay câu tuyên bố trong prompt không đáp ứng HIPAA.
    ref: lessons/24-danh-gia-governance.html#tuan-thu
  - id: PC29
    exams:
      CCAR-P: D5
    stem: A European company must honor data subjects' rights and minimize personal data under GDPR when using Claude via the API. Which TWO design choices support this? (Choose two.)
    options:
      - Redact or pseudonymize personal data that is not needed for the task before sending it.
      - Sign a data processing agreement and configure retention and processing region appropriately.
      - Store all prompts indefinitely in case they are needed for future analysis.
      - Rely on the model to forget personal data after each response.
    answer:
      - A
      - B
    explanation: Tối thiểu hoá dữ liệu (che, bí danh hoá) và cơ sở hợp đồng, thời hạn lưu, vùng xử lý phù hợp hỗ trợ GDPR. Lưu vô hạn ngược nguyên tắc; "model tự quên" không phải biện pháp.
    ref: lessons/24-danh-gia-governance.html#tuan-thu
  - id: PC30
    exams:
      CCAR-P: D5
    stem: An organization has a zero data retention (ZDR) arrangement for the Claude API. Which statement is accurate?
    options:
      - ZDR covers every Anthropic product, including Team plan chats and the Console.
      - ZDR applies to eligible API features; some products and models fall outside it.
      - ZDR means flagged policy violations are never retained under any circumstance.
      - ZDR is enabled automatically for every API key without any agreement.
    answer:
      - B
    explanation: ZDR áp cho Messages API và tính năng đủ điều kiện; Console, Managed Agents, giao diện Team, Enterprise và một số model nằm ngoài. Nội dung bị gắn cờ, giữ theo luật vẫn có quy định riêng; ZDR cần thoả thuận.
    ref: lessons/24-danh-gia-governance.html#tuan-thu
  - id: PC31
    exams:
      CCAR-P: D5
    stem: A US federal agency requires FedRAMP-authorized services for an AI assistant. What should the architect do?
    options:
      - Deploy through an environment holding the required FedRAMP authorization, and verify it.
      - Use any public API endpoint, since FedRAMP requirements apply only to physical hardware.
      - Ask Claude in the system prompt to follow all FedRAMP requirements during each session.
      - Build an on-premise clone of Claude from public documentation.
    answer:
      - A
    explanation: Hệ thống liên bang chỉ dùng dịch vụ đã được cấp phép FedRAMP ở mức cần; chọn môi trường triển khai đạt yêu cầu và kiểm chứng. FedRAMP không chỉ về phần cứng; lời dặn không phải tuân thủ; không thể tự dựng Claude.
    ref: lessons/24-danh-gia-governance.html#tuan-thu
  - id: PC32
    exams:
      CCAR-P: D5
    stem: A resume-screening assistant scores candidates. How should the team check for bias?
    options:
      - Evaluate on matched resumes that differ only in sensitive attributes and compare outcomes across groups.
      - Instruct the model in the system prompt to always remain unbiased toward every candidate.
      - Remove all candidate names from resumes and trust that this eliminates every form of bias.
      - Check that the overall average score looks reasonable.
    answer:
      - A
    explanation: Đo thiên lệch bằng eval theo nhóm, cặp hồ sơ chỉ khác thuộc tính nhạy cảm. Lời dặn không đo được; bỏ tên giúp một phần nhưng thiên lệch có thể qua đặc điểm khác; trung bình tổng che giấu chênh lệch.
    ref: lessons/24-danh-gia-governance.html#dao-duc
  - id: PC33
    exams:
      CCAR-P: D5
    stem: Which practice best supports transparency for end users of a Claude-powered advisory tool?
    options:
      - Disclose that AI is involved, show sources, and explain how to get human help.
      - Present AI outputs as if written by staff to increase user trust.
      - Hide sources to keep the interface simple and uncluttered.
      - Show the full system prompt to every user on every page.
    answer:
      - A
    explanation: "Minh bạch: công bố có AI, hiện nguồn, chỉ đường tới người hỗ trợ. Giả là nhân viên viết là lừa dối; giấu nguồn giảm khả năng kiểm chứng; phơi toàn bộ system prompt không phải minh bạch có ích."
    ref: lessons/24-danh-gia-governance.html#dao-duc
  - id: PC34
    exams:
      CCAR-P: D5
    stem: A coding agent in CI has write access to production infrastructure credentials it never needs. What is the best governance fix?
    options:
      - Remove access to production credentials and run the agent with least-privilege, sandboxed permissions.
      - Keep the access but add an audit log entry whenever the production credentials are used.
      - Add a strict prompt rule telling the agent never to touch any production infrastructure.
      - Run the agent less often so the risk window is smaller.
    answer:
      - A
    explanation: "Quyền tối thiểu, sandbox: bỏ quyền không cần. Log là phát hiện sau; lời dặn là xác suất; chạy ít hơn vẫn giữ rủi ro."
    ref: lessons/24-danh-gia-governance.html#guardrail
  - id: PC35
    exams:
      CCAR-P: D5
    stem: An internal assistant with memory occasionally surfaces one employee's personal details to another employee. What is the root issue to fix?
    options:
      - Memory and retrieval are not scoped per user, so data crosses user boundaries.
      - The model is too creative and should use a much lower temperature setting.
      - The employees are asking questions that are too personal.
      - The context window is too large and should be reduced to limit what it recalls.
    answer:
      - A
    explanation: Rò rỉ giữa người dùng do memory, retrieval không được giới hạn theo người dùng. Temperature, cách hỏi hay độ lớn context không phải nguyên nhân.
    ref: lessons/24-danh-gia-governance.html#rui-ro
  - id: PC36
    exams:
      CCAR-P: D5
    stem: Which action by an autonomous operations agent most clearly needs a human approval gate?
    options:
      - Deleting a production database after detecting duplicate records
      - Reading recent error logs to summarize an ongoing incident
      - Searching internal documentation for a runbook
      - Drafting a status update for the team's incident channel
    answer:
      - A
    explanation: Hành động không đảo ngược, hậu quả lớn (xoá DB production) cần cổng duyệt. Đọc log, tìm tài liệu, soạn nháp có rủi ro thấp.
    ref: lessons/24-danh-gia-governance.html#hitl
  - id: PC37
    exams:
      CCAR-P: D5
    stem: A model sometimes refuses legitimate requests from a medical-information app, frustrating users. How should the team respond?
    options:
      - Measure the false refusal rate on legitimate cases and adjust prompts and scope within policy.
      - Remove all safety-related instructions from the prompt so the model never refuses again.
      - Ignore refusals, since any refusal is a sign the system is safe.
      - Switch to a different model provider automatically whenever any refusal occurs.
    answer:
      - A
    explanation: Từ chối sai cũng là chỉ số an toàn cần đo; điều chỉnh prompt, phạm vi trong giới hạn chính sách. Bỏ hết hướng dẫn an toàn là rủi ro; coi mọi từ chối là tốt bỏ qua trải nghiệm; đổi nhà cung cấp là phản ứng thái quá.
    ref: lessons/24-danh-gia-governance.html#guardrail
  - id: PC38
    exams:
      CCAR-P: D5
    stem: Legal asks how long prompts and outputs are retained when using the Claude API under standard commercial terms without special arrangements. What should the architect do?
    options:
      - Consult Anthropic's published retention documentation and contract, and design logging to match policy.
      - Assume data is never stored anywhere, because the Messages API itself is stateless.
      - Assume all data is stored forever and therefore avoid using the API for any purpose.
      - Ask the model how long Anthropic retains its own inputs.
    answer:
      - A
    explanation: Trả lời bằng tài liệu chính thức và hợp đồng, rồi thiết kế log phù hợp. API không lưu trạng thái hội thoại nhưng phía nhà cung cấp có chính sách lưu; giả định cực đoan sai; hỏi model không đáng tin.
    ref: lessons/24-danh-gia-governance.html#tuan-thu
  - id: PC39
    exams:
      CCAR-P: D5
    stem: Who should be accountable for decisions made with a Claude-based system in a regulated process?
    options:
      - A named human owner and process, with decision logs and an escalation path
      - The model itself, since it produced each recommendation
      - The model provider, since it trained, hosts and updates the underlying model
      - No one in particular, because the system is fully automated
    answer:
      - A
    explanation: Trách nhiệm giải trình thuộc về người và quy trình được chỉ định, có nhật ký và đường leo thang. Model hay nhà cung cấp không thay được trách nhiệm của tổ chức sử dụng.
    ref: lessons/24-danh-gia-governance.html#dao-duc
  - id: PC40
    exams:
      CCAR-P: D4
    stem: Usage data shows cache_read_input_tokens is near zero, even though every request starts with the same 8,000-token policy. The first line of the system prompt contains the current timestamp. What is the best fix?
    options:
      - Move the timestamp after the static policy so the cached prefix stays identical
      - Remove prompt caching, since it does not work with system prompts this long
      - Switch to a model with a larger context window so that more of it is cached
      - Send each request through the Batches API so that caching applies automatically
    answer:
      - A
    explanation: Cache chỉ trúng khi phần đầu giống hệt từng byte. Dấu thời gian ở dòng đầu làm mọi request khác nhau ngay từ đầu. Đưa phần thay đổi xuống sau phần tĩnh. Context lớn hơn hay Batches không sửa được lỗi thứ tự.
    ref: lessons/24-danh-gia-governance.html#toi-uu
  - id: PC41
    exams:
      CCAR-P: D5
    stem: An extraction system routes cases with model-reported confidence below 0.9 to humans. Audits show many auto-approved 0.95 cases are wrong. What should be done?
    options:
      - Trust the reported confidence more, since the model knows its own accuracy
      - Remove human review entirely, because the confidence score is unreliable
      - Raise the threshold to 0.99 without checking how often those cases are right
      - Calibrate the scores on labeled data and pick the threshold from measured accuracy
    answer:
      - D
    explanation: "Độ tin cậy model tự báo phải được hiệu chỉnh: đo trên tập có nhãn xem các ca báo 0,95 đúng bao nhiêu, rồi chọn ngưỡng theo số liệu. Nâng ngưỡng mù quáng vẫn không biết đúng sai; bỏ người duyệt làm rủi ro tăng."
    ref: lessons/24-danh-gia-governance.html#hitl
  - id: PC42
    exams:
      CCAR-P: D5
    stem: Reviewers in a human-in-the-loop queue have approved 99.8% of AI recommendations for six months, spending about 10 seconds on each. What does this most likely indicate?
    options:
      - The model is nearly perfect, so the review step can safely be removed
      - Possible automation bias; show evidence, limit queue load, and audit approvals
      - The reviewers are highly skilled and need no change to their workflow
      - The queue is too short, and more cases should be routed to human review
    answer:
      - B
    explanation: "Tỷ lệ chấp thuận gần tuyệt đối với thời gian rất ngắn là dấu hiệu automation bias: người duyệt thành con dấu. Cần hiện bằng chứng, giữ hàng chờ vừa sức, kiểm tra lại các ca đã duyệt. Chưa thể kết luận model hoàn hảo."
    ref: lessons/24-danh-gia-governance.html#hitl
  - id: PC43
    exams:
      CCAR-P: D5
    stem: How can a team most directly test whether a candidate-screening prompt treats applicants differently by gender?
    options:
      - Ask the model whether it is biased, and record its answer in the audit log
      - Remove the gender field, then assume that the bias problem is solved
      - Score paired resumes that differ only in gender-indicating names, and compare
      - Review ten random outputs by hand and check whether they look reasonable
    answer:
      - C
    explanation: "Test phản thực: cặp hồ sơ giống hệt trừ thuộc tính nhạy cảm, đủ nhiều cặp, so kết quả theo nhóm. Hỏi model tự đánh giá không phải bằng chứng; bỏ trường giới tính vẫn còn thuộc tính đại diện như tên; mười mẫu không đủ để thấy chênh lệch."
    ref: lessons/24-danh-gia-governance.html#dao-duc
  - id: PC44
    exams:
      CCAR-P: D5
    stem: An HR assistant can retrieve employee records. Which control best addresses the risk of one employee seeing another's personal data?
    options:
      - A system prompt rule telling the assistant never to reveal other people's data
      - Filtering retrieval by the requester's permissions before anything reaches the model
      - A disclaimer on every answer saying that information may contain personal data
      - A larger model that is better at judging what information is sensitive
    answer:
      - B
    explanation: "Rủi ro hậu quả nặng thì kiểm soát phải nằm ngoài model: lọc quyền ở tầng truy xuất để model không bao giờ nhận dữ liệu người hỏi không được xem. Lời dặn trong prompt có thể bị vượt qua; disclaimer và model lớn không ngăn rò rỉ."
    ref: lessons/24-danh-gia-governance.html#rui-ro
  - id: PD01
    exams:
      CCAR-P: D6
    stem: In the first discovery workshop for an AI claims assistant, which question set is most valuable?
    options:
      - Which model version, framework and vector database the client would prefer us to use
      - Current process and volumes, success metrics, data sources, constraints and the cost of errors
      - How many agents, subagents and tools the final production system should contain
      - Which user interface colors match the company brand
    answer:
      - B
    explanation: Discovery tập trung vào quy trình hiện tại, khối lượng, chỉ số thành công, dữ liệu, ràng buộc và giá của lỗi. Model, số agent, màu giao diện là quyết định sau.
    ref: lessons/25-ben-lien-quan-van-hanh.html#discovery
  - id: PD02
    exams:
      CCAR-P: D6
    stem: A project reaches deployment and is blocked by the security and legal teams, who were never consulted. Which discovery step was missed?
    options:
      - Identifying all stakeholders and approvers, including security and legal
      - Selecting the fastest available model for the use case
      - Writing the system prompt before any requirements were gathered
      - Choosing a vector database for retrieval
    answer:
      - A
    explanation: Discovery phải xác định mọi bên liên quan và người phê duyệt, gồm bảo mật và pháp chế. Các phương án khác không giải thích việc bị chặn ở bước phê duyệt.
    ref: lessons/25-ben-lien-quan-van-hanh.html#discovery
  - id: PD03
    exams:
      CCAR-P: D6
    stem: What should the primary output of a structured discovery phase be?
    options:
      - A requirements document with functional and non-functional needs, success metrics, scope and risks
      - A finished production system that is already deployed and ready for all users
      - A list of every Claude feature and integration the client might ever want to use
      - A marketing announcement about the upcoming AI launch
    answer:
      - A
    explanation: "Đầu ra của discovery là tài liệu yêu cầu: chức năng, phi chức năng, chỉ số thành công, phạm vi, rủi ro, kế hoạch thí điểm. Hệ thống hoàn chỉnh hay thông báo marketing là giai đoạn sau."
    ref: lessons/25-ben-lien-quan-van-hanh.html#discovery
  - id: PD04
    exams:
      CCAR-P: D6
    stem: Six months after choosing retrieval over fine-tuning, a new team member asks why. What artifact should answer this?
    options:
      - An architecture decision record capturing context, options, criteria and consequences
      - The full chat history of the original team's project messaging channel
      - The model's own explanation when it is asked about the design afterwards
      - A screenshot of the final architecture diagram
    answer:
      - A
    explanation: ADR ghi bối cảnh, phương án, tiêu chí, quyết định và hệ quả. Lịch sử chat khó tìm và không đầy đủ; model không biết quyết định của đội; sơ đồ không nói lý do.
    ref: lessons/25-ben-lien-quan-van-hanh.html#truyen-dat
  - id: PD05
    exams:
      CCAR-P: D6
    stem: An architect must explain to the executive committee why the design uses a mid-sized model instead of the most capable one. Which framing works best?
    options:
      - “It meets the agreed accuracy and latency targets at 60% lower cost per case; we will re-evaluate quarterly.”
      - “The mid-sized model has fewer parameters, which reduces the attention head count per layer.”
      - “The largest model is always worse, so we never recommend it.”
      - “The vendor suggested it in a blog post, so it must be correct.”
    answer:
      - A
    explanation: "Với lãnh đạo: nói theo chỉ số đã thống nhất, chi phí, kế hoạch xem lại. Chi tiết kiến trúc model không hữu ích với người nghe này; khẳng định tuyệt đối hay dựa vào bài blog không phải lập luận."
    ref: lessons/25-ben-lien-quan-van-hanh.html#truyen-dat
  - id: PD06
    exams:
      CCAR-P: D6
    stem: Which TWO topics matter most when presenting an AI design to the legal and security teams? (Choose two.)
    options:
      - Where data flows, where it is stored, and for how long
      - Access controls, audit logs and how incidents are handled
      - The exact wording of every few-shot example in the prompt
      - The number of GPUs used to train the underlying model
    answer:
      - A
      - B
    explanation: Pháp chế và bảo mật quan tâm luồng dữ liệu, nơi lưu, thời hạn, kiểm soát truy cập, nhật ký, xử lý sự cố. Ví dụ few-shot và phần cứng huấn luyện không phải trọng tâm.
    ref: lessons/25-ben-lien-quan-van-hanh.html#truyen-dat
  - id: PD07
    exams:
      CCAR-P: D6
    stem: The business sponsor asks for “100% accuracy” before approving launch. What is the best response?
    options:
      - Agree to the target and promise the sponsor that the system will never make any mistake.
      - Explain non-determinism, propose an accuracy target measured on evals, and describe safeguards for errors.
      - Refuse to launch any AI system until it reaches 100% accuracy on every possible input.
      - Hide the measured error rate from the sponsor to avoid delaying the project's approval.
    answer:
      - B
    explanation: Giải thích tính không tất định, đề xuất ngưỡng đo trên eval và cơ chế xử lý lỗi (duyệt, rollback). Hứa 100%, từ chối mãi hay giấu tỷ lệ lỗi đều sai.
    ref: lessons/25-ben-lien-quan-van-hanh.html#truyen-dat
  - id: PD08
    exams:
      CCAR-P: D6
    stem: Which SLA definition for an AI document-summary service is the most appropriate?
    options:
      - “Summaries are always perfect, complete and instantaneous for every document submitted.”
      - “p95 under 5 seconds, 99.5% availability of our service, and ≥90% eval accuracy measured monthly.”
      - “The service will be fast and accurate most of the time for most of our users.”
      - “Latency and accuracy depend entirely on the model provider, not on our own system.”
    answer:
      - B
    explanation: SLA tốt có chỉ số cụ thể, cách đo, chu kỳ đo. "Luôn hoàn hảo" không thực tế; mô tả mơ hồ không kiểm được; đẩy hết trách nhiệm cho nhà cung cấp bỏ qua phần hệ thống của bạn.
    ref: lessons/25-ben-lien-quan-van-hanh.html#ky-vong
  - id: PD09
    exams:
      CCAR-P: D6
    stem: Stakeholders disagree about whether an AI assistant should launch company-wide. What is the best way to align expectations?
    options:
      - Run a scoped pilot with agreed success metrics and a decision date for expansion.
      - Launch to everyone at once and let the usage data settle the disagreement later.
      - Cancel the project until every stakeholder agrees unanimously on the full rollout.
      - Let the engineering team decide without stakeholder input.
    answer:
      - A
    explanation: Thí điểm có phạm vi, chỉ số đã thống nhất và ngày quyết định giúp các bên đồng thuận dựa trên số liệu. Ra mắt toàn bộ là rủi ro; huỷ dự án hay bỏ qua bên liên quan đều không tốt.
    ref: lessons/25-ben-lien-quan-van-hanh.html#ky-vong
  - id: PD10
    exams:
      CCAR-P: D6
    stem: Users of a deployed assistant report wrong answers through informal chat messages that get lost. What lifecycle practice should be added?
    options:
      - A structured feedback channel whose reports are triaged and added to the eval set
      - A policy that users must not report errors outside quarterly reviews
      - A larger model so that users have fewer errors to report
      - Removing the assistant until a perfect version is available
    answer:
      - A
    explanation: Kênh phản hồi có cấu trúc, phân loại và đưa ca lỗi vào bộ eval khép vòng cải tiến. Hạn chế báo lỗi, đổi model hay gỡ hệ thống không giải quyết việc mất phản hồi.
    ref: lessons/25-ben-lien-quan-van-hanh.html#ky-vong
  - id: PD11
    exams:
      CCAR-P: D6
    stem: An AI system is being handed off from a consulting team to the client's operations team. Which package enables them to run it?
    options:
      - Architecture and data-flow diagrams, ADRs, versioned prompts and configs, eval reports and runbooks
      - The source code only, since an experienced operations team can infer everything else
      - A detailed slide deck summarizing the project's business value and the launch timeline
      - Access to the consultants' personal chat histories with Claude
    answer:
      - A
    explanation: "Bàn giao khả năng vận hành: sơ đồ, ADR, prompt và cấu hình có phiên bản, báo cáo eval, runbook. Chỉ code hay slide không đủ; lịch sử chat cá nhân không phải tài liệu."
    ref: lessons/25-ben-lien-quan-van-hanh.html#tai-lieu
  - id: PD12
    exams:
      CCAR-P: D6
    stem: What should an operations runbook for a Claude-based service include?
    options:
      - Alerts, diagnosis steps, rollback, handling of 429 and 529 errors, and escalation contacts
      - The full text of every conversation the system has handled since it was launched
      - A complete history of all model releases and price changes from the provider
      - Marketing guidelines for describing the AI to customers
    answer:
      - A
    explanation: "Runbook cho người vận hành: cảnh báo, cách chẩn đoán, rollback, xử lý lỗi thường gặp, liên hệ leo thang. Toàn bộ hội thoại, lịch sử phát hành model hay hướng dẫn marketing không phải runbook."
    ref: lessons/25-ben-lien-quan-van-hanh.html#tai-lieu
  - id: PD13
    exams:
      CCAR-P: D6
    stem: Anthropic announces that a model your production system uses is deprecated with a retirement date. What is the best lifecycle response?
    options:
      - "Plan a migration: evaluate the replacement, review migration notes, switch before retirement."
      - Wait until the retirement date arrives, then switch over when requests start failing.
      - Ignore the notice, since deprecated models remain available indefinitely.
      - Switch production to the replacement immediately, without running any evaluations.
    answer:
      - A
    explanation: Deprecated vẫn chạy nhưng có ngày retire, sau đó request lỗi. Lên kế hoạch, chạy eval trên model thay thế, đọc ghi chú migration, đổi có chủ đích trước hạn. Chờ, bỏ qua hay đổi không test đều rủi ro.
    ref: lessons/25-ben-lien-quan-van-hanh.html#vong-doi
  - id: PD14
    exams:
      CCAR-P: D6
    stem: Which sequence best reflects the lifecycle phases named in the CCAR-P blueprint?
    options:
      - Discovery, design, handoff, monitoring, iteration
      - Design, launch, done
      - Coding, testing, marketing, retirement
      - Training, fine-tuning, deployment, archive
    answer:
      - A
    explanation: "Blueprint nêu các giai đoạn: discovery, design, handoff, monitoring, iteration, và đây là vòng lặp. Các chuỗi khác thiếu discovery, giám sát hoặc là vòng đời huấn luyện model."
    ref: lessons/25-ben-lien-quan-van-hanh.html#vong-doi
  - id: PD15
    exams:
      CCAR-P: D6
    stem: Six months after launch, the business adds a new product line that the assistant must support. What should happen?
    options:
      - Return to discovery for the new scope, update evals, and release through the normal process.
      - Add the new product documents straight into the production prompt without any testing.
      - Build a completely separate system from scratch just for the new product line.
      - Tell users to avoid asking about the new product line.
    answer:
      - A
    explanation: Yêu cầu mới đưa vòng đời về discovery cho phạm vi mới, cập nhật eval, phát hành qua quy trình chuẩn. Sửa thẳng production không test là rủi ro; xây lại từ đầu lãng phí; bảo người dùng tránh hỏi là bỏ yêu cầu.
    ref: lessons/25-ben-lien-quan-van-hanh.html#vong-doi
  - id: PD16
    exams:
      CCAR-P: D6
    stem: A product manager wants a feature that would require sending customer PII to a third-party tool, which conflicts with policy. How should the architect handle it?
    options:
      - Explain the conflict, present compliant alternatives with their trade-offs, and record the decision.
      - Build the feature quietly as requested, since the product manager owns the decision.
      - Refuse to discuss the feature at all and escalate the product manager to leadership.
      - Ask the model to decide whether the policy applies.
    answer:
      - A
    explanation: Nêu xung đột, đưa phương án tuân thủ kèm đánh đổi, ghi lại quyết định. Làm âm thầm vi phạm chính sách; từ chối trao đổi phá hợp tác; để model quyết định chính sách là sai trách nhiệm.
    ref: lessons/25-ben-lien-quan-van-hanh.html#truyen-dat
  - id: PD17
    exams:
      CCAR-P: D6
    stem: Which TWO practices keep stakeholders aligned after launch? (Choose two.)
    options:
      - Regular reports on the agreed metrics, including failures and costs
      - A clear process for prioritizing feedback and change requests
      - Reporting only positive results to maintain enthusiasm
      - Changing success metrics whenever results fall short
    answer:
      - A
      - B
    explanation: Báo cáo đều theo chỉ số đã thống nhất (cả lỗi và chi phí) và quy trình ưu tiên phản hồi giữ các bên thống nhất. Chỉ báo tin tốt hay đổi chỉ số khi không đạt làm mất niềm tin.
    ref: lessons/25-ben-lien-quan-van-hanh.html#ky-vong
  - id: PD18
    exams:
      CCAR-P: D6
    stem: Where should production system prompts, tool definitions and model IDs be documented and controlled?
    options:
      - In version control, with change review and evals on each change
      - In a shared spreadsheet that anyone can edit without history
      - Only inside the running application's memory
      - In each engineer's personal notes
    answer:
      - A
    explanation: "Prompt, tool definition, model ID là cấu hình như code: lưu trong git, review, chạy eval khi đổi. Bảng tính không lịch sử, bộ nhớ ứng dụng hay ghi chú cá nhân không kiểm soát được."
    ref: lessons/25-ben-lien-quan-van-hanh.html#tai-lieu
  - id: PD19
    exams:
      CCAR-P: D7
    stem: A regulated company must ensure no developer can allow Claude Code to run certain destructive commands, regardless of local settings. Where should this be configured?
    options:
      - Managed settings deployed by administrators, which take precedence over all other levels
      - Each repository's CLAUDE.md, as a firm instruction that Claude should always follow
      - Each developer's personal settings file, configured by IT during their onboarding
      - A team wiki page describing which commands are forbidden
    answer:
      - A
    explanation: Managed settings do admin triển khai có ưu tiên cao nhất và không ghi đè được; deny luôn thắng. CLAUDE.md và wiki là lời dặn; cài đặt cá nhân có thể bị sửa.
    ref: lessons/25-ben-lien-quan-van-hanh.html#claude-code-doi
  - id: PD20
    exams:
      CCAR-P: D7
    stem: Ten repositories need the same set of skills, slash commands, hooks and MCP servers for Claude Code. What is the most maintainable distribution approach?
    options:
      - Package them as a plugin in an internal plugin marketplace.
      - Copy the files into each repository and update them manually.
      - Email the configuration files to every developer each quarter.
      - Put everything into one very long CLAUDE.md in each repository.
    answer:
      - A
    explanation: Plugin gói skill, command, hook, MCP để cài cho nhiều repo, phân phối qua marketplace nội bộ. Chép tay hay email dễ lệch phiên bản; CLAUDE.md không chứa hook hay MCP.
    ref: lessons/25-ben-lien-quan-van-hanh.html#claude-code-doi
  - id: PD21
    exams:
      CCAR-P: D7
    stem: Engineering leadership wants visibility into Claude Code usage, costs and tool activity across teams. What should be set up?
    options:
      - OpenTelemetry export of Claude Code metrics and events to the company's observability stack
      - A weekly survey asking every developer how often and how heavily they use Claude Code
      - Screen recordings of developers' terminals during working hours
      - A rule that developers must paste every Claude Code session into a shared team document
    answer:
      - A
    explanation: Claude Code xuất metric và event qua OpenTelemetry để theo dõi sử dụng, chi phí, hoạt động tool. Khảo sát không chính xác; quay màn hình hay dán phiên xâm phạm và không bền.
    ref: lessons/25-ben-lien-quan-van-hanh.html#claude-code-doi
  - id: PD22
    exams:
      CCAR-P: D7
    stem: A team wants Claude to review every pull request automatically and post comments. Which setup is most appropriate?
    options:
      - A GitHub Actions workflow running Claude Code headlessly with pre-declared, minimal permissions
      - An interactive Claude Code session left permanently open on a shared build server
      - Developers manually pasting diffs into claude.ai before each merge
      - A nightly batch job that reviews all of the merged code and reports the next morning
    answer:
      - A
    explanation: GitHub Actions chạy Claude Code headless, quyền khai sẵn ở mức tối thiểu. Phiên tương tác để mở không bền và rủi ro; dán tay không tự động; review sau khi merge là quá muộn cho cổng trước merge.
    ref: lessons/25-ben-lien-quan-van-hanh.html#claude-code-doi
  - id: PD23
    exams:
      CCAR-P: D7
    stem: "A developer has three independent tasks: a bug fix, a dependency upgrade and a new endpoint. How can Claude Code help without the tasks interfering with each other?"
    options:
      - Run separate sessions in parallel git worktrees, one per task.
      - Ask one session to work on all three tasks in the same directory at once.
      - Complete the tasks strictly one after another to avoid any parallelism.
      - Disable version control so Claude can edit files freely.
    answer:
      - A
    explanation: Worktree song song cho mỗi việc độc lập giúp không giẫm chân nhau và tăng thông lượng. Một phiên làm ba việc cùng chỗ dễ xung đột; tắt version control là nguy hiểm.
    ref: lessons/25-ben-lien-quan-van-hanh.html#quy-trinh-dev
  - id: PD24
    exams:
      CCAR-P: D7
    stem: Which metric best measures whether AI-assisted tooling improves a team's productivity?
    options:
      - Lead time from request to production, together with post-release defect rate
      - The number of lines of code generated by Claude across the team each week
      - How many prompts each developer sends to Claude Code per working day
      - The number of Claude Code sessions opened per developer
    answer:
      - A
    explanation: "Năng suất đo bằng kết quả: thời gian từ yêu cầu tới production, tỷ lệ lỗi sau phát hành, thời gian review. Số dòng code, số prompt, số phiên là chỉ số hoạt động, dễ đánh lừa."
    ref: lessons/25-ben-lien-quan-van-hanh.html#quy-trinh-dev
  - id: PD25
    exams:
      CCAR-P: D7
    stem: During a product launch, the API returns many 429 errors with retry-after headers. Which TWO actions are appropriate? (Choose two.)
    options:
      - Honor retry-after with backoff and cap concurrent requests.
      - Move non-urgent work to Message Batches and cache stable prompt prefixes.
      - Retry every failed request immediately in a tight loop.
      - Create new API keys in the same organization to bypass the limit.
    answer:
      - A
      - B
    explanation: Chờ đúng retry-after, backoff, giới hạn đồng thời; chuyển việc không gấp sang Batches và cache để giảm tải. Retry dồn dập làm tệ hơn; hạn mức tính theo tổ chức nên thêm key không giúp.
    ref: lessons/25-ben-lien-quan-van-hanh.html#van-hanh
  - id: PD26
    exams:
      CCAR-P: D7
    stem: A specific request intermittently produces a server error and you need help from Anthropic support. What information is most useful to include?
    options:
      - The request-id from the response, timestamp, model and steps to reproduce
      - Your API key, so that support can replay the failing request directly
      - A screenshot of the application's home page showing the error banner
      - The full text of all conversations from the past month
    answer:
      - A
    explanation: request-id, thời điểm, model, cách tái hiện giúp nhà cung cấp tìm đúng request. Không bao giờ gửi API key; ảnh trang chủ hay toàn bộ hội thoại không hữu ích và có thể lộ dữ liệu.
    ref: lessons/25-ben-lien-quan-van-hanh.html#van-hanh
  - id: PD27
    exams:
      CCAR-P: D7
    stem: After a deployment, API costs for one agent route triple overnight while traffic is flat. What should the on-call engineer check first?
    options:
      - Usage by route and model, cache hit rate, and whether the agent loop stops correctly
      - Whether the model provider raised its prices without any notice that morning
      - Whether the developers' laptops have enough memory to run the agent locally
      - Whether the user interface colors changed in the release
    answer:
      - A
    explanation: "Chi phí tăng mà lưu lượng không đổi: xem usage theo route, model, tỷ lệ cache hit, và vòng lặp agent có dừng đúng không (lặp vô hạn, cache bị phá). Giá, máy developer, màu giao diện không phải nghi vấn đầu."
    ref: lessons/25-ben-lien-quan-van-hanh.html#van-hanh
  - id: PD28
    exams:
      CCAR-P: D7
    stem: Claude Code writes code quickly for a team, but bugs slip through because the same session writes and approves its own changes. Which workflow change helps most?
    options:
      - Ask the writing session to double-check its own work before finishing
      - Use a separate reviewer subagent or session, plus tests as an automatic gate
      - Generate more code per session so that reviewers see the full picture
      - Switch to a larger model so that fewer bugs are written in the first place
    answer:
      - B
    explanation: Kiểm tra độc lập (subagent hoặc phiên review riêng không mang context của phiên viết) cùng test làm cổng tự động bắt lỗi mà phiên viết bỏ qua. Tự kiểm trong cùng phiên dễ lặp lại cùng giả định; diff lớn khó review; model lớn hơn không thay cổng kiểm.
    ref: lessons/25-ben-lien-quan-van-hanh.html#quy-trinh-dev
  - id: PD29
    exams:
      CCAR-P: D6
    stem: Before signing off the handoff of a Claude-based system to a client's operations team, what is the best evidence that the handoff succeeded?
    options:
      - The client team has received the repository link and a recorded demo
      - The documentation set exceeds 100 pages and covers every component
      - The building team has promised to answer questions for three months
      - The client team reruns the evals and resolves a simulated incident alone
    answer:
      - D
    explanation: "Bàn giao thành công là đội nhận vận hành được một mình: tự chạy lại eval ra cùng số, tự xử lý sự cố diễn tập theo runbook. Link repo, độ dày tài liệu hay lời hứa hỗ trợ không chứng minh được điều đó."
    ref: lessons/25-ben-lien-quan-van-hanh.html#tai-lieu
  - id: PD30
    exams:
      CCAR-P: D7
    stem: Costs for an agent route tripled after a Friday deployment that added a new tool in the middle of the tool list. Traffic is flat and there are no errors. What is the most likely cause?
    options:
      - The new tool changed the prompt prefix, so cached reads dropped to near zero
      - Anthropic raised its prices over the weekend without any prior notice
      - The route is now hitting 529 errors that are retried silently many times
      - The model alias was moved to a smaller and cheaper model over the weekend
    answer:
      - A
    explanation: Định nghĩa tool nằm ở phần đầu prompt; chèn tool vào giữa làm phần đầu thay đổi nên cache không trúng. Kiểm cache_read_input_tokens để xác nhận; đặt tool mới ở cuối. Không có lỗi nên không phải 529; model rẻ hơn thì chi phí giảm chứ không tăng.
    ref: lessons/25-ben-lien-quan-van-hanh.html#van-hanh
  - id: PD31
    exams:
      CCAR-P: D7
    stem: Requests start failing with HTTP 429, and the responses have no retry-after header. Retrying with backoff does not help. What should the on-call engineer suspect?
    options:
      - A temporary overload on Anthropic's side that will clear within minutes
      - A malformed request body that the API is rejecting with the wrong code
      - The organization reached its usage tier's monthly spend cap
      - An expired API key that needs to be rotated immediately
    answer:
      - C
    explanation: 429 do chạm trần chi tiêu tháng của tier không có retry-after và retry không giúp; cần nâng tier hoặc chờ chu kỳ mới. Quá tải là 529; request sai là 400; key hết hạn là 401.
    ref: lessons/25-ben-lien-quan-van-hanh.html#van-hanh
