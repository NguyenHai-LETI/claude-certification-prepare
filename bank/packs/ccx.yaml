      - Ask Claude in a fresh prompt to “find and fix its own mistake”, then rerun the whole task.
      - Switch between models until the wrong answers stop appearing in testing.
      - Increase `max_tokens` so the agent has room to reason its way to the answer.
    answer:
      - A
