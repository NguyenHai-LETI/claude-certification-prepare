    explanation: 'PreToolUse chặn qua `hookSpecificOutput.permissionDecision: "deny"` kèm `permissionDecisionReason` (giá trị khác: allow, ask, defer). `continue: false` dừng cả phiên chứ không phải cách từ chối một lời gọi; trường `permission` không tồn tại; chữ thường in ra stdout không chặn gì.'
