    explanation: "Tài liệu giảm độ trễ: max_tokens đặt giới hạn cứng cho độ dài output; khi chạm giới hạn, API cắt câu trả lời, có thể giữa câu hoặc giữa từ. Đây là kỹ thuật thô, phù hợp nhất với câu trả lời trắc nghiệm hoặc ngắn khi đáp án nằm ngay đầu. Muốn câu trả lời ngắn mà trọn vẹn thì yêu cầu ngắn gọn trong prompt. max_tokens áp dụng cho mọi request, không riêng streaming. Nó không khiến model “lập kế hoạch” ngắn hơn. Đơn vị là token chứ không phải từ. Nguồn: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency"
    ref: lessons/02-messages-api.html#stop-reason
