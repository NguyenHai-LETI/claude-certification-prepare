  - id: AI-CCDVF-015
    exams: { CCDV-F: D6, CCAR-F: D5 }
    stem: "An agent harness automatically compacts context as it nears the limit and lets the agent save progress to files. The team notices the agent wrapping up tasks early and leaving them unfinished as its context fills. What prompt change does Anthropic suggest?"
    options:
      - "Tell the agent to finish every task within half of its context window to stay on the safe side."
      - "Tell the agent its context will be compacted automatically, so it should save state and keep working."
      - "Tell the agent to stop and ask the user for permission whenever its context passes a threshold."
      - "Tell the agent nothing about context, and reduce max_tokens to force it to pick shorter tasks."
