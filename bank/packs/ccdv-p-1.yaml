  - id: ccdv-p-1.q0033
    exams:
      CCDV-P: D2
    stem: |-
      You work as a senior software engineer at EchoPoint Media Works. The company runs a production pipeline that summarizes wire feeds, drafts program notes, and tags an archive of transcripts. Volume is high, editors sample outputs for quality, and the team measures cost and quality movements on live traffic rather than waiting for offline suites.

      Archive tagging sends one short request for each transcript segment, and rate limit errors persist across whole surges. Surge telemetry shows the request rate limit at 97 percent, the input token limit at 35 percent, and the output token limit at 25 percent. Prompt caching already covers the shared tagging instructions.

      What should you do?
    options:
      - Ask for a higher input token limit ahead of the next surge.
      - Combine consecutive transcript segments into fewer, larger tagging requests.
      - Add jittered backoff to the tagging client and keep request volume unchanged.
      - Extend prompt caching to the transcript segment text in each request.
    answer:
      - B
    explanation: |-
      **Rate limit theo request chạm trước, token còn dư: gộp nhiều việc nhỏ vào ít request hơn**

      > 💡 Gặp **request rate limit 97%, token còn dư** thì chọn **gộp đoạn vào ít request hơn**: chữa đúng limit đang chạm, không chữa limit còn trống.

      **Đề hỏi gì.** Job gắn tag gửi **một request ngắn cho mỗi đoạn transcript**, và lỗi rate limit kéo dài suốt từng đợt cao điểm. Telemetry cho thấy **request rate limit ở 97%**, còn input token chỉ 35% và output token 25%. Prompt caching đã phủ phần chỉ dẫn dùng chung. Đề hỏi nên làm gì.

      **Vì sao đúng (B).** Ràng buộc đang chặn là số request mỗi phút (RPM), còn hai limit token dư nhiều. Gộp các đoạn transcript liền nhau vào ít request lớn hơn thì số request giảm hẳn, trong khi tổng token gần như không đổi và vẫn nằm trong phần dư của ITPM và OTPM.

      **Vì sao sai**

      - A: Input token mới dùng 35% limit, nên nâng limit này không chạm vào chỗ đang nghẽn là số request.
      - C: Backoff có jitter chỉ giãn các lần gửi lại. Số request cần gửi vẫn vượt RPM trong suốt đợt cao điểm, nên lỗi vẫn kéo dài.
      - D: Cache thêm giúp giảm token tính vào ITPM, mà ITPM đang dư. Số request không giảm, và đoạn transcript mỗi request một khác nên cũng không đọc lại được từ cache.

      **Kiến thức liên quan.** Chạm RPM trước thường xảy ra khi hệ thống gửi rất nhiều request ngắn, mỗi request chỉ làm một việc nhỏ, chẳng hạn gửi mỗi đánh giá một request để phân loại. Khi đó số request chạm giới hạn trong lúc lượng token vẫn còn xa giới hạn. Gộp nhiều việc vào một request sẽ giảm số request đi nhiều lần, còn tổng token thì không tăng.

      **Từ khoá**

      - B: Combine consecutive transcript segments
      - stem: request rate limit at 97 percent

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-2-quy-mo-va-thong-luong#rang-buoc-nao-dang-chan-tai`
