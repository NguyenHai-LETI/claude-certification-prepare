  - id: ccdv-p-1.q0066
    exams:
      CCDV-P: D4
    stem: |-
      You are a senior software engineer at DriveSphere Mobility. The company operates an owner-support agent that reads vehicle manuals, warranty documents, and inbound owner messages, and can open service tickets and send responses. Inbound content is untrusted, the agent holds tool access with real side effects, and your team owns its guardrail stack and adversarial testing.

      The owner support agent opened a service ticket against the wrong vehicle for an owner with two registered vehicles. The tool log shows open_ticket received the identifier of the first vehicle as its argument. The transcript shows the owner named the second vehicle in the latest message, while an earlier turn discussed the first vehicle. Retrieval logs show the correct warranty document for the second vehicle was retrieved.

      What should you conclude?
    options:
      - The open_ticket tool resolved the vehicle identifier against the wrong owner record in the database.
      - Retrieval surfaced the wrong warranty document and misdirected the ticket.
      - The model carried a stale vehicle reference across turns and the tool ran its arguments correctly.
      - The harness reordered the conversation history before the final model call that chose the vehicle.
    answer:
      - C
    explanation: |-
      **Lỗi nhiều lượt: thông tin đúng còn trong request mà model vẫn dùng tham chiếu cũ của lượt trước**

      > 💡 Gặp **tool nhận tham số của lượt cũ, còn truy xuất đã đúng** thì chọn **carried a stale vehicle reference**: lỗi ở model lúc điền tham số, không ở tool.

      **Đề hỏi gì.** Chủ xe có **hai xe**. Lượt trước nói về xe thứ nhất, **tin nhắn mới nhất nói về xe thứ hai**. Log tool: `open_ticket` **nhận mã xe thứ nhất**. Log truy xuất: đã lấy về **đúng giấy bảo hành của xe thứ hai**. Đề hỏi nên kết luận gì.

      **Vì sao đúng (C).** Log tool cho thấy `open_ticket` nhận mã xe thứ nhất, tức tool chỉ làm theo tham số được truyền. Thông tin đúng vẫn còn nguyên trong request: tin nhắn mới nhất nhắc xe thứ hai, và giấy bảo hành đúng của xe thứ hai đã được lấy về. Có đủ thông tin mà vẫn chọn xe cũ thì lỗi nằm ở chỗ model lấy lại xe của lượt trước để điền tham số.

      **Vì sao sai**

      - A: Log tool cho thấy tham số truyền vào đã là mã xe thứ nhất. Tool mở ticket cho đúng xe nó được bảo, nên không phải tool tra nhầm hồ sơ.
      - B: Log truy xuất cho thấy đã lấy về đúng giấy bảo hành của xe thứ hai, nên tầng truy xuất không có lỗi.
      - D: Đề không có dấu hiệu nào cho thấy lịch sử bị đảo: transcript vẫn ghi tin nhắn mới nhất nói về xe thứ hai. Kết luận harness làm sai cần bằng chứng mà đề không đưa ra.

      **Kiến thức liên quan.** Với lỗi nhiều lượt (**multi-turn failures**), câu hỏi đầu tiên là thông tin cần cho lượt hỏng có còn trong request của lượt đó không. Chỉ khi thông tin vẫn còn nguyên trong request mà câu trả lời bỏ qua nó, bạn mới nên nghi tới prompt hay model.

      **Từ khoá**

      - C: carried a stale vehicle reference
      - stem: open_ticket received the identifier of the first vehicle | named the second vehicle in the latest message

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `4-1-chan-doan-loi-phuc-tap#loi-nhieu-luot-loi-lo-ra-o-luot-sau-nhung-sinh-ra-tu-luot-truoc`
