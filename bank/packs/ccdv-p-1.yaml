  - id: ccdv-p-1.q0013
    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at Pinnacle Learning Institute. The institute runs a course tutor grounded in its published curriculum and technical library. The tutor must cite its sources and decline to answer questions outside the specified curriculum and technical library. Evaluation suites and calibrated LLM judges enforce a quality bar before any prompt or model change ships. Retrieval quality and judge reliability are your team's responsibility.

      A calibration run compares the citation judge with expert labels on 500 sampled tutor answers. Raw agreement is 94 percent, and Cohen's kappa is 0.06. The experts marked 96 percent of the answers as acceptable.

      What should you conclude?
    options:
      - The judge is validated, and raw agreement above 90 percent supports gating releases.
      - Agreement is mostly chance, and the judge is unproven on the rare failing answers.
      - The expert labels are unreliable, and a second annotation pass must precede any conclusion.
      - The kappa statistic misleads on skewed data, and raw agreement should decide instead.
    answer:
      - B
    explanation: |-
      **Khớp thô cao trên dữ liệu lệch mà kappa gần 0: judge chưa được chứng minh ở các ca sai hiếm**

      > 💡 Gặp **khớp thô cao mà kappa gần 0 trên dữ liệu lệch** thì chọn **khớp là do may rủi, judge chưa được chứng minh trên ca sai hiếm**.

      **Đề hỏi gì.** Đợt hiệu chỉnh so judge kiểm trích dẫn với nhãn chuyên gia trên 500 câu trả lời: **khớp thô 94%** nhưng **Cohen's kappa chỉ 0,06**, và chuyên gia chấm **96% câu là chấp nhận được**. Đề hỏi nên kết luận gì.

      **Vì sao đúng (B).** Khi 96% câu trả lời là đạt, một judge câu nào cũng chấm đạt đã khớp khoảng 96% mà chẳng bắt được câu sai nào. Kappa trừ đi phần khớp do may rủi đó, và 0,06 nghĩa là judge gần như không hơn chấm bừa. Vậy 94% chủ yếu là may rủi, còn trên đúng những câu sai hiếm gặp, chỗ cổng release cần bắt, judge chưa được chứng minh.

      **Vì sao sai**

      - A: Khớp thô trên 90% nghe cao, nhưng với 96% câu là đạt thì chấm đạt hết cũng được con số đó. Dùng judge này chặn release là để lọt gần hết câu sai.
      - C: Không có dấu hiệu nào cho thấy nhãn chuyên gia sai. Kappa thấp ở đây đến từ judge không bắt được câu sai, không phải từ hai bộ nhãn người vênh nhau.
      - D: Kappa được dùng chính vì dữ liệu lệch làm khớp thô bị thổi phồng. Để khớp thô quyết định là bỏ đúng con số cho thấy judge không bắt được câu sai.

      **Kiến thức liên quan.** Con số dễ tính nhất là tỉ lệ khớp thô, tức phần trăm số câu mà judge và người cho cùng kết quả. Nhưng chỉ nhìn con số này thì dễ bị đánh lừa. Một judge lười, câu nào cũng chấm đạt, vẫn khớp với người 85% mà không bắt được câu sai nào.

      **Từ khoá**

      - B: Agreement is mostly chance
      - stem: Cohen's kappa is 0.06 | 96 percent of the answers as acceptable

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-2-llm-as-judge#hieu-chinh-judge-voi-nhan-cua-nguoi`
