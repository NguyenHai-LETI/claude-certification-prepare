  - id: ccdv-p-1.q0015
    exams:
      CCDV-P: D4
    stem: |-
      You are a senior software engineer at Pinnacle Learning Institute. The institute runs a course tutor grounded in its published curriculum and technical library. The tutor must cite its sources and decline to answer questions outside the specified curriculum and technical library. Evaluation suites and calibrated LLM judges enforce a quality bar before any prompt or model change ships. Retrieval quality and judge reliability are your team's responsibility.

      After a re-chunking deploy, the tutor declines questions on database topics that the curriculum covers. The same questions receive correct answers when the relevant passage is pasted into the conversation. The retrieval log for a declined question shows the query returned chunks from unrelated units. Each decline follows the out-of-corpus template and ends with stop_reason end_turn.

      What is the most likely cause?
    options:
      - The re-chunked index stopped surfacing the relevant database passages for those queries.
      - The model lost database knowledge when the team changed its model tier.
      - The out-of-corpus instruction in the system prompt is too strict for database topics.
      - The model refuses database content and the harness renders each refusal as a decline template.
    answer:
      - A
    explanation: |-
      **Dán đúng đoạn văn vào là trả lời đúng: lỗi nằm ở truy xuất sau lần chia chunk lại**

      > 💡 Gặp **dán đúng đoạn văn vào thì trả lời đúng** thì chọn **lỗi truy xuất**: index không đưa đoạn đó lên.

      **Đề hỏi gì.** Sau lần **deploy chia chunk lại**, trợ lý từ chối các câu về cơ sở dữ liệu mà chương trình có dạy. **Dán đoạn văn liên quan vào hội thoại thì trả lời đúng**. Log truy xuất cho thấy truy vấn lấy về **chunk của những bài không liên quan**, và mỗi lần từ chối đều theo mẫu ngoài chương trình, kết thúc bằng `stop_reason` `end_turn`. Đề hỏi nguyên nhân nhiều khả năng nhất.

      **Vì sao đúng (A).** Ba chi tiết cùng chỉ về tầng truy xuất. Lỗi bắt đầu ngay sau khi chia chunk lại, log cho thấy truy vấn lấy về chunk của bài khác, và khi có đúng đoạn văn thì model trả lời đúng. Không nhận được đoạn liên quan nên trợ lý làm đúng như dặn là từ chối câu ngoài tài liệu. Index mới không còn đưa lên các đoạn về cơ sở dữ liệu cho những truy vấn đó.

      **Vì sao sai**

      - B: Đề không nói gì về đổi tier model, và dán đoạn văn vào thì model trả lời đúng, nên model vẫn biết cách trả lời khi có tài liệu.
      - C: Chỉ dẫn từ chối câu ngoài chương trình đã có từ trước và vẫn chạy đúng: trợ lý từ chối vì không nhận được đoạn nào liên quan. Có đoạn văn đúng thì nó trả lời, nên chỉ dẫn không quá chặt.
      - D: Refusal do safety classifier của API dừng với `stop_reason` là `refusal`. Ở đây mọi lần từ chối kết thúc bằng `end_turn` theo mẫu ngoài chương trình, tức trợ lý đang làm theo chỉ dẫn khi không có tài liệu.

      **Kiến thức liên quan.** Khi câu trả lời dựa trên văn bản bị sai, lỗi có thể nằm ở khâu truy xuất (lấy sai đoạn văn bản), ở chính văn bản, hoặc ở grounding. Câu hỏi đầu tiên là đoạn đúng có được lấy về không.

      **Từ khoá**

      - A: re-chunked index stopped surfacing
      - stem: correct answers when the relevant passage is pasted into the conversation

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `4-1-chan-doan-loi-phuc-tap#loi-truy-xuat-hay-loi-grounding`
