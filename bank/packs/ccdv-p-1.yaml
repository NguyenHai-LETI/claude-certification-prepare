  - id: ccdv-p-1.q0063
    exams:
      CCDV-P: D6
    stem: |-
      You work as a site reliability engineer at BrightCart Retail. The company runs a storefront shopping assistant on the Claude API and a nightly batch pipeline that enriches the product catalog. Traffic peaks are sharp, latency targets are strict, and the integration layer must degrade gracefully when limits or failures occur. The assistant holds no payment or identity data; it works over the public catalog and order-status tools.

      Shoppers report a blank response panel before storefront answers appear. Each answer combines prose text with a structured product-card block, and the storefront client renders product cards only from a complete card block that passes schema validation. The integration delivers the full response after generation completes. Telemetry shows six seconds of total generation for a typical answer, and time to first token at the API is under 500 milliseconds. You need to meet the following requirements:

      - Visible output starts within one second of each request.
      - Product cards render only from a complete card block that passes schema validation.

      What should you do?
    options:
      - Generate the prose and the card block in two sequential requests, and validate the block before it renders.
      - Stream the response, render the prose text on arrival, and hold the product-card block until validation passes.
      - Keep buffered delivery and move the storefront route to a faster model tier.
      - Stream the response and render every token in the browser as it arrives.
    answer:
      - B
    explanation: |-
      **Streaming cho chữ hiện sớm, còn khối có cấu trúc thì chờ về đủ và kiểm xong mới hiển thị**

      > 💡 Gặp **hai yêu cầu: chữ hiện sớm, khối thẻ phải đủ và qua kiểm mới hiện** thì chọn **render the prose text on arrival** và **hold the product-card block**.

      **Đề hỏi gì.** Tầng tích hợp **chờ sinh xong cả 6 giây** mới giao response, dù **TTFT ở API dưới 500 mili giây**. Có hai yêu cầu: **chữ hiện trong 1 giây**, và **thẻ sản phẩm chỉ hiện từ khối đầy đủ đã qua kiểm schema**. Đề hỏi cách làm.

      **Vì sao đúng (B).** TTFT ở API dưới 500 mili giây, nên chữ đầu tiên đã có từ rất sớm, chỉ bị giữ lại vì tầng tích hợp chờ sinh xong cả sáu giây. Stream response thì phần chữ hiện ra trong vòng một giây. Riêng khối thẻ sản phẩm thì giữ lại tới khi về đủ và qua kiểm schema mới hiển thị, nên vẫn đáp ứng yêu cầu thứ hai.

      **Vì sao sai**

      - A: Hai request nối tiếp vẫn giao từng response trọn gói, nên người mua vẫn chờ request đầu sinh xong mới thấy chữ, chưa kể thêm thời gian của request thứ hai. Yêu cầu hiện chữ trong một giây không đạt.
      - C: Model nhanh hơn có rút ngắn được sáu giây thì người mua vẫn phải chờ sinh xong cả câu trả lời mới thấy chữ. Giữ cách giao trọn gói thì khó đạt mốc một giây.
      - D: Hiển thị mọi token ngay khi tới thì khối thẻ sản phẩm cũng hiện ra từng mảnh, khi chưa đủ và chưa qua kiểm schema, trái với yêu cầu thứ hai.

      **Kiến thức liên quan.** Streaming gửi response về dần qua server-sent events. Mỗi response gồm nhiều khối (content block), ví dụ một khối text hay một khối `tool_use`. Nhờ streaming, người dùng thấy chữ ngay từ token đầu tiên thay vì chờ tới token cuối.

      **Từ khoá**

      - B: render the prose text on arrival | hold the product-card block
      - stem: delivers the full response after generation completes | renders product cards only from a complete card block

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `6-2-toi-uu-do-tre#streaming-cho-nguoi-dung-thay-chu-som-hon`
