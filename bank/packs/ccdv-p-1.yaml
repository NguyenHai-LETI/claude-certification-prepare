    exams:
      CCDV-P: D4
    stem: |-
      You are a senior software engineer at Horizon Crest Hospitality. The company operates a guest concierge agent across its properties in Lisbon, Osaka, and Vancouver, with property-level configuration and a shared platform team. The concierge answers property questions, coordinates requests with booking and housekeeping tools, and must stay within tight latency and cost budgets in every region.

      The shared platform dashboard shows that failed booking-tool calls across the concierge fleet tripled on Monday. The platform team shipped no release that day. You group the failed calls by property and find that 94 percent originate from Osaka, where the property team enabled a new room-upgrade workflow on Monday morning. Failure rates for Lisbon and Vancouver match the prior week.

      What is the most likely cause?
    options:
      - A behavior shift in the model tier that serves all regions
      - Transient infrastructure noise in the booking-tool backend
      - A regression in the shared platform code across all properties
      - A property-level configuration change in the Osaka room-upgrade workflow
    answer:
      - D
    explanation: |-
      **Lỗi dồn vào một khách sạn ngay sau thay đổi của chính khách sạn đó thì nguyên nhân là thay đổi cấu hình ở đó**

      > 💡 Gặp **94% lỗi từ một nơi vừa bật tính năng mới** thì chọn **property-level configuration change**: lỗi dồn vào đâu thì tìm thay đổi ở đó.

      **Đề hỏi gì.** Lệnh gọi tool đặt phòng hỏng tăng gấp ba vào thứ Hai, platform không phát hành gì. Tách theo khách sạn thì **94% đến từ Osaka**, nơi đội khách sạn vừa **bật workflow nâng hạng phòng mới sáng thứ Hai**. Lisbon và Vancouver vẫn như tuần trước.

      **Vì sao đúng (D).** Hai dấu hiệu cùng chỉ về một chỗ. Lỗi tập trung gần hết ở Osaka, trong khi hai khách sạn kia không đổi, nên nguyên nhân không thể là thứ dùng chung cho cả ba. Và thứ duy nhất vừa thay đổi là cấu hình riêng của Osaka, bật đúng sáng hôm đó. Câu hỏi "cái gì vừa đổi" trả lời thẳng: workflow nâng hạng phòng của Osaka.

      **Vì sao sai**

      - A: Model phục vụ cả ba khu vực, nên nếu model đổi hành vi thì Lisbon và Vancouver cũng phải hỏng nhiều hơn. Hai nơi đó vẫn như tuần trước.
      - B: Nhiễu hạ tầng ngẫu nhiên thì rải đều, không dồn 94% vào đúng một khách sạn vừa bật tính năng mới, và cũng không kéo dài cả ngày như vậy.
      - C: Code platform dùng chung cho mọi khách sạn, và platform không phát hành gì hôm thứ Hai. Lỗi ở code chung thì ba nơi cùng hỏng.

      **Kiến thức liên quan.** Trước khi sửa gì, bạn cần trả lời ba câu hỏi. Câu thứ hai là cái gì vừa thay đổi trong một hai giờ trước, ví dụ một lần deploy, một feature flag, version cấu hình hay model.

      **Từ khoá**

      - D: property-level configuration change
      - stem: 94 percent originate from Osaka
      - case: property-level configuration

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `4-2-xu-ly-su-co#triage-co-that-khong-cai-gi-vua-doi-nang-toi-dau`
