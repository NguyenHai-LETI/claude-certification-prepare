  - id: ccdv-p-1.q0044
    exams:
      CCDV-P: D2
    stem: |-
      You are a senior software engineer at Meridian Advisory Group. The firm operates a research copilot that runs multi-hour analysis jobs over public market and industry sources. Agents search, read, and synthesize documents, accumulate working notes, and produce cited briefs for consultants. Jobs run long enough to hit context limits, and the team is accountable for cost, accuracy, and citation quality.

      Consultants ask for a confidence indicator on each brief section so they know what to verify before delivery. An engineer proposes displaying the mean cosine similarity of the section's retrieved passages.

      What should you recommend?
    options:
      - Show the count of sources the agent read for each section.
      - Report the share of claims in each section that cite a supporting passage.
      - Publish the mean similarity score of the retrieved passages for each section.
      - Ask the model to append a self-rated confidence percentage to each section.
    answer:
      - B
    explanation: |-
      **Chỉ báo độ tin cậy của câu trả lời phải dựa vào trích dẫn làm căn cứ cho từng nhận định**

      > 💡 Gặp **chỉ báo độ tin cậy cho từng phần** thì chọn **tỉ lệ nhận định có trích dẫn làm căn cứ**: độ tin cậy đến từ căn cứ, không từ điểm truy xuất hay model tự chấm.

      **Đề hỏi gì.** Chuyên viên muốn mỗi phần của bản tóm tắt có **chỉ báo độ tin cậy** để biết cần kiểm gì trước khi giao. Một kỹ sư đề xuất hiện **trung bình cosine similarity** của các đoạn được truy xuất cho phần đó. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (B).** Chuyên viên cần biết nhận định nào có căn cứ. Tỉ lệ nhận định trong phần có trích dẫn trỏ tới một đoạn tài liệu làm căn cứ đo đúng điều đó, và chỉ thẳng ra những nhận định không có trích dẫn, tức những chỗ phải kiểm trước khi giao.

      **Vì sao sai**

      - A: Số nguồn agent đã đọc không cho biết nhận định nào được nguồn nào làm căn cứ. Đọc nhiều nguồn vẫn có thể viết ra nhận định không nằm trong nguồn nào.
      - C: Similarity chỉ cho biết đoạn truy xuất gần câu truy vấn tới đâu. Đoạn có điểm cao vẫn có thể không làm căn cứ cho nhận định model viết ra.
      - D: Claude không có sẵn tín hiệu nào cho biết câu trả lời đáng tin tới đâu. Con số phần trăm do model tự chấm không gắn với căn cứ nào để kiểm.

      **Kiến thức liên quan.** Có ba việc cần làm, là kèm trích dẫn nguồn cho mỗi nhận định (**source citation**), nói rõ khi tài liệu không đủ để trả lời (**uncertainty declaration**), và có tín hiệu cho biết câu trả lời đáng tin tới đâu (**confidence signals**). Claude không có sẵn tín hiệu nào cho biết câu trả lời đáng tin tới đâu, nên bạn phải tự tạo.

      **Từ khoá**

      - B: share of claims in each section that cite a supporting passage
      - stem: so they know what to verify before delivery
      - case: produce cited briefs

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-4-truy-xuat-va-grounding#grounding-buoc-cau-tra-loi-bam-vao-tai-lieu`
