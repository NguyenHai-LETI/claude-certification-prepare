  - id: ccdv-p-1.q0022
    exams:
      CCDV-P: D1
    stem: |-
      You are a senior software engineer at Horizon Crest Hospitality. The company operates a guest concierge agent across its properties in Lisbon, Osaka, and Vancouver, with property-level configuration and a shared platform team. The concierge answers property questions, coordinates requests with booking and housekeeping tools, and must stay within tight latency and cost budgets in every region.

      A contractor proposes rebuilding the concierge agent as a supervisor with four parallel subagents, one for each tool category. The current single agent with the full toolset answers a routine property question in four seconds. Traffic analysis shows that nine of ten guest requests resolve through one or two dependent tool calls.

      What should you recommend?
    options:
      - Stay with the single agent and reserve parallel subagents for requests with independent subtasks.
      - Route each guest request to a dedicated subagent through a trained request classifier.
      - Split the toolset across two sequential agents that hand each request between them.
      - Adopt the supervisor design with four parallel subagents for every guest request.
    answer:
      - A
    explanation: |-
      **Chỉ tách thành nhiều agent khi có lý do cụ thể; việc gồm vài bước phụ thuộc nhau thì một agent là đủ**

      > 💡 Gặp **9 trên 10 yêu cầu chỉ cần một hai lệnh gọi tool phụ thuộc nhau** thì chọn **Stay with the single agent**: không có phần việc độc lập thì không có gì để song song.

      **Đề hỏi gì.** Một nhà thầu đề xuất dựng lại concierge thành supervisor với **bốn subagent song song**, mỗi subagent một nhóm tool. Agent hiện tại trả lời câu hỏi thường trong 4 giây, và **9 trên 10 yêu cầu chỉ cần một hai lệnh gọi tool phụ thuộc nhau**.

      **Vì sao đúng (A).** Chạy song song chỉ có lợi khi việc chia được thành nhiều phần độc lập. Ở đây hầu hết yêu cầu là một hai lệnh gọi tool phụ thuộc nhau, tức bước sau phải chờ kết quả bước trước, nên bốn subagent song song không có gì để chạy cùng lúc mà chỉ thêm chi phí và độ trễ chuyển tay. Giữ một agent và chỉ dùng subagent song song cho số ít yêu cầu thật sự có các phần việc độc lập.

      **Vì sao sai**

      - B: Thêm bộ phân loại đã huấn luyện để chuyển mỗi yêu cầu tới một subagent riêng là thêm một tầng phải dựng và có thể phân loại sai, trong khi agent hiện tại đã xử lý tốt yêu cầu thường trong 4 giây.
      - C: Chia tool cho hai agent chạy nối tiếp thì yêu cầu nào cũng phải chuyển tay một lần, thêm độ trễ và thêm chỗ rơi thông tin, mà không giải quyết được vấn đề gì.
      - D: Supervisor với bốn subagent cho mọi yêu cầu là trả giá đắt nhất của hệ nhiều agent cho đúng loại yêu cầu không có phần việc độc lập nào để chạy song song.

      **Kiến thức liên quan.** Anthropic khuyên tìm giải pháp đơn giản nhất trước, và chỉ thêm độ phức tạp khi nó cải thiện kết quả một cách đo được (*demonstrably improves outcomes*). Hệ nhiều agent (**multi-agent**) thường tốn **3 đến 10 lần token** so với một agent làm cùng việc, vì context bị chép sang từng agent, các agent phải nhắn qua lại, và kết quả phải tóm tắt lại mỗi lần chuyển tay.

      **Từ khoá**

      - A: Stay with the single agent
      - stem: nine of ten guest requests resolve through one or two dependent tool calls

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-3-chon-kien-truc-khi-mo-rong#doc-so-lieu-truoc-khi-doi-kien-truc`
