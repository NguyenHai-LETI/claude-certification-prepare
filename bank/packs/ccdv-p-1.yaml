  - id: ccdv-p-1.q0031
    exams:
      CCDV-P: D7
    stem: |-
      You are a platform engineer at Ironhaven Manufacturing. The company exposes maintenance manuals, parts inventory, and work-order tools to Claude agents through remote MCP servers used by plant engineering teams. Your team owns MCP deployment and authentication, tool catalog governance, agent identity, and the managed configuration that plant teams inherit. Changes must roll out to the fleet without breaking running integrations.

      A tampered maintenance manual made a plant agent call the `close_work_order` tool on 14 open orders during a documentation lookup session. The managed configuration grants every plant tool to every session. Plant teams must keep both lookup and work-order workflows in service.

      What should you do?
    options:
      - Remove the tampered manual from the manual library and rescan the remaining manuals to keep all workflows in service.
      - Remove the `close_work_order` tool from the catalog until the manual corpus passes a rescan.
      - Scope the managed configuration to grant read-only tools to lookup sessions and write tools to work-order sessions.
      - Add a managed system prompt line that requires confirmation before destructive tool calls.
    answer:
      - C
    explanation: |-
      **Thu hẹp bề mặt tấn công bằng cấu hình: session đọc nội dung không tin cậy chỉ cầm tool chỉ đọc**

      > 💡 Gặp **session tra tài liệu mà cầm cả tool ghi** thì chọn **Scope the managed configuration to grant read-only tools**: đọc nội dung lạ thì chỉ cầm tool chỉ đọc.

      **Đề hỏi gì.** Một sổ tay bảo trì bị cài chữ khiến agent gọi `close_work_order` trên **14 lệnh đang mở**, ngay trong một session chỉ để tra tài liệu. Managed configuration **cấp mọi tool cho mọi session**. Các nhóm nhà máy phải **giữ được cả workflow tra cứu lẫn workflow lệnh công việc**.

      **Vì sao đúng (C).** Lỗ nằm ở chỗ session tra tài liệu, nơi agent đọc nội dung không tin cậy, lại cầm cả tool ghi. Chia quyền trong managed configuration thì session tra cứu chỉ có tool chỉ đọc, còn tool ghi chỉ có ở session lệnh công việc. Sổ tay bị cài chữ có lừa được model thì session tra cứu cũng không có tool nào để đóng lệnh. Cả hai workflow vẫn chạy, và chặn bằng cấu hình nên model không vượt qua được.

      **Vì sao sai**

      - A: Gỡ sổ tay bị sửa và quét lại chỉ xử lý được tài liệu đã biết. Tài liệu bị cài chữ tiếp theo vẫn đến được session đang cầm đủ tool ghi.
      - B: Gỡ `close_work_order` khỏi catalog thì workflow lệnh công việc mất luôn tool đóng lệnh, trái với yêu cầu giữ cả hai workflow. Gắn lại sau khi quét xong thì lỗ cũ quay lại.
      - D: Một dòng system prompt đòi xác nhận chỉ là lời dặn cho model. Chính nội dung bị cài chữ có thể thuyết phục model bỏ qua lời dặn đó, nên nó không phải cơ chế chặn.

      **Kiến thức liên quan.** Bề mặt tấn công (**attack surface**) gồm mọi đường người ngoài có thể đưa chữ vào agent, cộng với mọi thứ agent làm được khi bị lừa.

      **Từ khoá**

      - C: Scope the managed configuration to grant read-only tools
      - stem: The managed configuration grants every plant tool to every session

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-2-phong-thu-tan-cong-agent#be-mat-tan-cong-va-bo-ba-nguy-hiem`
