  - id: ccdv-p-1.q0025
    exams:
      CCDV-P: D3
    stem: |-
      You are a site reliability engineer at HelioGrid Energy. The company operates a field-operations copilot that helps technicians diagnose inverter faults, draft work orders, and summarize sensor readings from solar sites. The service carries uptime and quality SLOs, is instrumented end to end, and your team leads incident response when quality or availability regresses.

      HelioGrid Energy scores five percent of copilot responses with a judge model. After a model update, the daily mean score drifted from 0.91 to 0.84 over three weeks without crossing the static alert threshold of 0.80. Technicians escalated the quality drop before any alert fired. Incident review calls for alerting that catches sustained post-update drift without firing on isolated low scores.

      Which alert design should you use?
    options:
      - An alert that fires each time one sampled response scores below 0.80
      - A raised static threshold that fires when the daily mean score falls below 0.85
      - A golden-set evaluation run once at rollout, with an alert on a pass rate below target
      - A rolling seven-day score mean compared against a frozen pre-update baseline, alerting on a sustained gap
    answer:
      - D
    explanation: |-
      **Bắt chất lượng giảm dần sau khi đổi model: so trung bình trượt với baseline trước khi đổi, báo khi chênh lệch kéo dài**

      > 💡 Gặp **điểm trôi dần mà không chạm ngưỡng tĩnh** thì chọn **rolling seven-day score mean** so với baseline trước khi đổi model.

      **Đề hỏi gì.** Judge chấm 5% response. Sau một lần đổi model, điểm trung bình ngày **trôi từ 0,91 xuống 0,84 trong ba tuần mà không chạm ngưỡng tĩnh 0,80**, và kỹ thuật viên phàn nàn trước khi có cảnh báo. Đề cần cảnh báo bắt được độ trôi kéo dài sau khi đổi model mà **không báo vì vài điểm thấp lẻ tẻ**.

      **Vì sao đúng (D).** Ngưỡng tĩnh chỉ hỏi "điểm có dưới 0,80 không", nên chất lượng tụt từ 0,91 xuống 0,84 vẫn lọt. Thứ cần so là điểm hiện tại với chính mức của hệ thống trước khi đổi model. Trung bình trượt bảy ngày làm phẳng vài điểm thấp lẻ tẻ, còn baseline chốt từ trước lần đổi cho biết đã lệch bao nhiêu. Chỉ báo khi khoảng lệch kéo dài thì bắt đúng kiểu trôi dần sau khi đổi model.

      **Vì sao sai**

      - A: Báo mỗi khi một response dưới 0,80 sẽ báo liên tục vì những điểm thấp lẻ tẻ luôn có, đúng thứ đề muốn tránh. Nó cũng không nói được trung bình đang trôi dần.
      - B: Nâng ngưỡng tĩnh lên 0,85 chỉ bắt được đúng sự cố lần này. Lần sau chất lượng trôi từ 0,95 xuống 0,88 thì vẫn lọt, vì ngưỡng vẫn không so với mức trước khi đổi.
      - C: Golden set chạy một lần lúc rollout chỉ cho biết model mới qua được lúc đầu. Độ trôi diễn ra trong ba tuần sau đó trên lưu lượng thật thì không bắt được.

      **Kiến thức liên quan.** Mỗi span cần ghi đủ version. Tên model thật sự đã trả lời có sẵn ở `gen_ai.response.model`, còn version prompt thì bạn tự thêm một thuộc tính. Nên tính SLI chất lượng mỗi ngày và tách theo model.

      **Từ khoá**

      - D: rolling seven-day score mean
      - stem: without crossing the static alert threshold

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `3-2-giam-sat-va-canh-bao#nhan-ra-chat-luong-giam-sau-khi-doi-model`
