  - id: ccdv-p-1.q0057
    exams:
      CCDV-P: D8
    stem: |-
      You are a staff software engineer at Nexora Systems. The engineering organization runs a fleet of coding agents for migrations, refactors, code review, and CI incident first response. Agents work on isolated worktrees, run unattended on schedules, and operate under managed settings your team defines. Generation outpaces human review, and the verification pipeline is yours to engineer.

      A merge queue backlog at Nexora Systems grew for five straight weeks, and a director proposes doubling the agent fleet so fixes land faster. Review capacity, human and AI combined, already runs at its limit.

      What should you recommend?
    options:
      - Expand calibrated review capacity first and hold the generation fleet at its current size
      - Approve the expansion and assign the new agents to backlog items
      - Batch the queued pull requests into weekly release batches for bulk human review
      - Merge changes below an agreed risk score without review to clear the queue
    answer:
      - A
    explanation: |-
      **Hàng đợi merge dồn mà review đã hết sức: tăng năng lực review đã hiệu chỉnh trước, giữ nguyên số agent**

      > 💡 Gặp **review đã chạy hết sức mà muốn thêm agent** thì chọn **expand calibrated review capacity** trước, giữ nguyên số agent.

      **Đề hỏi gì.** Hàng đợi merge **dồn thêm năm tuần liền**, và một giám đốc muốn **gấp đôi số agent** để các bản sửa lên nhanh hơn. Trong khi đó **năng lực review, cả người lẫn AI, đã chạy hết mức**.

      **Vì sao đúng (A).** Cả đội chỉ đi nhanh bằng tốc độ review. Review đã hết sức thì thêm agent chỉ thêm PR vào hàng đợi, không làm bản sửa lên nhanh hơn. Phải nới chỗ nghẽn trước, tức thêm năng lực review, và phần AI review phải được hiệu chỉnh để đáng tin. Trong lúc đó giữ số agent như cũ để hàng đợi không phình thêm.

      **Vì sao sai**

      - B: Gấp đôi agent khi review đã hết sức thì hàng PR chờ còn dài hơn. Các agent mới cũng phải đi qua đúng chỗ review đang nghẽn đó.
      - C: Gom PR thành đợt mỗi tuần cho người review hàng loạt làm mỗi PR chờ lâu hơn, và review cả loạt dễ thành duyệt vội. Năng lực review không tăng thêm chút nào.
      - D: Merge không review những thay đổi có điểm rủi ro thấp là bỏ kiểm chứng để thông hàng đợi. Điểm rủi ro chấm sai một lần là lỗi lên thẳng production.

      **Kiến thức liên quan.** Khi phần lớn kỹ sư chạy nhiều agent cùng lúc, cả đội chỉ đi nhanh bằng tốc độ người review. Cách làm là xếp nhiều lớp kiểm tra nối tiếp nhau, mỗi lớp chuyên bắt một kiểu lỗi, và chỉ để người làm những việc mà máy chưa làm được.

      **Từ khoá**

      - A: Expand calibrated review capacity
      - stem: already runs at its limit
      - case: Generation outpaces human review

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `8-2-kiem-chung-va-ai-code-review#khi-sinh-code-nhanh-hon-nguoi-review`
