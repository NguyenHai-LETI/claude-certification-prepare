  - id: ccdv-p-1.q0005
    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at Stonegate Development Partners. The firm processes construction contracts, permits, and inspection reports through an extraction service that feeds project dashboards. Throughput is bursty, accuracy is contractual, and the team runs online sampling and judge-based review to hold quality while controlling spend.

      Your team writes a new judge prompt that scores extraction accuracy on sampled production documents. A colleague inspects 10 verdicts, calls them reasonable, and proposes wiring the judge into the release gate.

      What should you do next?
    options:
      - Tighten the passing threshold on the release gate for the first month.
      - Compare the new judge's scores with the retired judge's scores on the same documents.
      - Measure the judge's agreement with expert labels on a stratified sample before any gating.
      - Run the judge twice on each document and accept it when both scores match.
    answer:
      - C
    explanation: |-
      **Judge mới phải được hiệu chỉnh với nhãn của chuyên gia trước khi cho chặn release**

      > 💡 Gặp **judge mới mới xem qua vài kết quả** thì chọn **đo mức khớp với nhãn chuyên gia trước khi gating**.

      **Đề hỏi gì.** Nhóm viết **judge prompt mới** chấm độ chính xác trích dữ liệu. Một đồng nghiệp **đọc 10 kết quả, thấy hợp lý**, rồi đề xuất nối judge vào cổng release. Đề hỏi nên làm gì tiếp.

      **Vì sao đúng (C).** Mười kết quả trông hợp lý chưa cho biết judge có chấm giống người hay không, nhất là ở những ca sai hiếm gặp. Hiệu chỉnh nghĩa là cho judge và chuyên gia cùng chấm một mẫu, ở đây là mẫu lấy theo từng loại tài liệu, rồi đo mức khớp giữa hai bên. Chỉ khi mức khớp đủ thì judge mới được chặn release.

      **Vì sao sai**

      - A: Siết ngưỡng qua cổng không làm judge chấm đúng hơn. Judge chưa được kiểm thì ngưỡng nào cũng dựa trên một cây thước chưa ai đo.
      - B: Judge cũ đã bị cho nghỉ, và chưa chắc nó từng khớp với người. Khớp với judge cũ chỉ cho biết hai judge giống nhau, không cho biết judge mới chấm đúng.
      - D: Chạy hai lần cho cùng điểm chỉ chứng tỏ judge chấm ổn định. Một judge có thể chấm sai giống hệt nhau cả hai lần.

      **Kiến thức liên quan.** Hiệu chỉnh là cho judge và người chấm cùng chấm một mẫu, so hai kết quả, rồi sửa rubric hay prompt của judge cho tới khi hai bên đủ khớp. Bạn chỉ nên tin judge sau bước này.

      **Từ khoá**

      - C: agreement with expert labels
      - stem: inspects 10 verdicts, calls them reasonable
      - case: judge-based review

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-2-llm-as-judge#hieu-chinh-judge-voi-nhan-cua-nguoi`
