  - id: ccdv-p-1.q0059
    exams:
      CCDV-P: D2
    stem: |-
      You work as a site reliability engineer at BrightCart Retail. The company runs a storefront shopping assistant on the Claude API and a nightly batch pipeline that enriches the product catalog. Traffic peaks are sharp, latency targets are strict, and the integration layer must degrade gracefully when limits or failures occur. The assistant holds no payment or identity data; it works over the public catalog and order-status tools.

      During a catalog release, the assistant's integration layer logs a spike in HTTP 400 invalid_request_error responses caused by a malformed tool definition. The retry middleware treats every non-200 response as transient and retries each failure five times with exponential backoff. Latency alarms fire while the malformed requests retry and fail.

      What should you do?
    options:
      - Fail over to a secondary region after three consecutive failures on a route
      - Restrict retries to rate limit, overload, and server errors, and surface invalid request errors immediately
      - Add jitter to the exponential backoff schedule for retried requests
      - Increase the retry count and extend the backoff ceiling for every error class
    answer:
      - B
    explanation: |-
      **Retry theo loại lỗi: 400 do request sai thì gửi lại y nguyên vẫn lỗi, chỉ retry 429, 529 và 5xx**

      > 💡 Gặp **400 invalid_request_error mà middleware retry mọi lỗi** thì chọn **Restrict retries to rate limit, overload, and server errors**: request sai thì báo ngay để sửa.

      **Đề hỏi gì.** Một định nghĩa tool sai cấu trúc làm API trả **HTTP 400 invalid_request_error** hàng loạt. Middleware **coi mọi response khác 200 là lỗi tạm thời** và retry năm lần với backoff, nên cảnh báo độ trễ kêu. Đề hỏi nên sửa gì.

      **Vì sao đúng (B).** Lỗi 400 nghĩa là chính request sai, ở đây là định nghĩa tool hỏng. Gửi lại y nguyên thì API vẫn trả 400, nên năm lần retry chỉ cộng thêm thời gian chờ cho người mua. Retry chỉ đáng làm với lỗi tạm thời như 429 (rate limit), 529 (quá tải) và 5xx. Lỗi invalid request phải báo ra ngay để đội sửa định nghĩa tool.

      **Vì sao sai**

      - A: Region khác nhận đúng định nghĩa tool hỏng đó và trả cùng lỗi 400. Fail over chỉ che lỗi cấu hình, lại còn thêm độ trễ vì phải chờ đủ ba lần lỗi.
      - C: Jitter giúp các client không retry cùng một lúc khi API quá tải. Lỗi ở đây không phải quá tải mà là request sai, nên retry lệch giờ nhau thì vẫn lỗi y như cũ.
      - D: Thêm lần retry và nới backoff cho mọi loại lỗi làm mỗi request hỏng chờ lâu hơn nữa, trong khi lỗi 400 không bao giờ tự hết.

      **Kiến thức liên quan.** Nên nhìn cột "Gửi lại y nguyên?" trước tiên, vì nếu gửi lại mà không đổi gì vẫn ra kết quả cũ thì retry chỉ tốn thêm tiền. Lỗi `429`, `500` và `529` là lỗi tạm thời, gửi lại sau khi backoff thì có thể thành công. Lỗi `400` là request sai cấu trúc, phải sửa rồi mới gửi.

      **Từ khoá**

      - B: Restrict retries to rate limit, overload, and server errors
      - stem: treats every non-200 response as transient | malformed tool definition
      - case: degrade gracefully when limits or failures occur

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-1-do-tin-cay-dich-vu-claude#phan-loai-truoc-khi-xu-ly`
