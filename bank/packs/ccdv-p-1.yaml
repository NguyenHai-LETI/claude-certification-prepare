    exams:
      CCDV-P: D2
    stem: |-
      You are a senior software engineer at Meridian Advisory Group. The firm operates a research copilot that runs multi-hour analysis jobs over public market and industry sources. Agents search, read, and synthesize documents, accumulate working notes, and produce cited briefs for consultants. Jobs run long enough to hit context limits, and the team is accountable for cost, accuracy, and citation quality.

      The copilot ingests public sources into an embedding index overnight, and consultants report that briefs miss filings and articles published the same day. Repairs to the ingestion jobs and re-embedding of changed sources also cost the team one engineer-day each week.

      Which retrieval approach should you use for the copilot's source gathering?
    options:
      - Hourly re-embedding of changed and new sources
      - Agentic search that queries live sources at run time
      - A larger embedding model over the nightly index
      - A reranking stage over the nightly index candidates
    answer:
      - B
    explanation: |-
      **Nguồn công khai đổi trong ngày, index nuôi tốn công: để agent tự tìm trên nguồn thật lúc chạy**

      > 💡 Gặp **index đêm sót tài liệu trong ngày, nuôi index tốn công** thì chọn **agentic search trên nguồn thật**: không index thì không có index cũ.

      **Đề hỏi gì.** Copilot nạp nguồn công khai vào **index embedding mỗi đêm**, nên bản tóm tắt **sót hồ sơ và bài báo đăng trong ngày**. Sửa job nạp và embed lại nguồn đã đổi còn tốn **một ngày công mỗi tuần**. Đề hỏi nên dùng cách truy xuất nào cho phần thu thập nguồn.

      **Vì sao đúng (B).** Agentic search để agent tự gọi tool tìm trên nguồn thật ngay lúc job chạy, nên tài liệu đăng sáng nay cũng thấy được. Không có index phải dựng trước thì cũng không có index cũ hơn nguồn, và đội bỏ được việc sửa job nạp và embed lại mỗi tuần.

      **Vì sao sai**

      - A: Embed lại mỗi giờ thu hẹp độ trễ nhưng vẫn trễ, và còn làm phần việc nuôi index nặng hơn, trong khi nó đã tốn một ngày công mỗi tuần.
      - C: Model embedding lớn hơn chỉ tìm khớp nghĩa tốt hơn trong index. Tài liệu đăng trong ngày chưa có trong index thì vẫn không tìm ra.
      - D: Rerank chỉ xếp lại những ứng viên đã có trong index đêm qua. Tài liệu chưa được nạp thì không có mặt để xếp.

      **Kiến thức liên quan.** Agentic search là để agent tự gọi tool đi tìm khi cần, thay vì tìm sẵn một lần rồi đưa vào prompt. Agent không nạp sẵn nội dung mà chỉ giữ những thứ giúp tìm lại được, như đường dẫn file hay câu truy vấn, và chỉ đọc nội dung khi thật sự cần.

      **Từ khoá**

      - B: Agentic search
      - stem: miss filings and articles published the same day

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-4-truy-xuat-va-grounding#rag-agentic-search-hay-ca-hai`
