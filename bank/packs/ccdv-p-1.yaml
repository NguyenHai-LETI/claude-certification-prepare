  - id: ccdv-p-1.q0008
    exams:
      CCDV-P: D8
    stem: |-
      You work as a platform engineer at HarvestPeak Foods. The company runs scheduled agents that reconcile supplier quality reports, watch production telemetry, and file exception summaries before each shift. Runs are unattended, must fail safe, and escalate to a human when evidence is ambiguous. Long reconciliations checkpoint so that a restart never repeats a completed posting.

      During an overnight run, the telemetry watcher flags drift on one production line. The supplier report that could explain the drift has not arrived, and the agent cannot attribute the cause. Reconciliations already completed for other lines must stand, and the next shift starts in six hours.

      Which escalation design should you use?
    options:
      - Post the affected line with the closest historical value and flag the substitution in the morning summary.
      - Suspend every scheduled run across the fleet and page the shift lead to restart them after review.
      - Checkpoint the completed lines, hold the posting for the affected line, and page the shift lead with the collected evidence.
      - Retry the supplier feed until the shift starts and file the exception summary without the affected line.
    answer:
      - C
    explanation: |-
      **Agent không người trực gặp bằng chứng chưa rõ: giữ phần đã xong, dừng đúng phần chưa rõ và gọi người kèm bằng chứng**

      > 💡 Gặp **bằng chứng chưa rõ ở một phần việc** thì chọn **checkpoint phần đã xong, giữ phần chưa rõ, gọi người kèm bằng chứng**.

      **Đề hỏi gì.** Trong lượt chạy đêm, telemetry báo **một dây chuyền bị lệch**, nhưng báo cáo của nhà cung cấp có thể giải thích lại **chưa tới**, nên agent **không xác định được nguyên nhân**. Các dây chuyền khác đã đối soát xong phải được giữ nguyên, và sáu giờ nữa mới tới ca sau. Đề hỏi nên thiết kế leo thang thế nào.

      **Vì sao đúng (C).** Leo thang tốt dừng đúng chỗ chưa rõ và gọi đúng người, mang theo đủ thứ để người đó quyết định. Checkpoint các dây chuyền đã xong để kết quả của chúng được giữ. Giữ lại bút toán của dây chuyền bị lệch, vì ghi bừa một số thì sai không gỡ được. Rồi gọi trưởng ca kèm bằng chứng đã thu thập, còn sáu giờ là đủ thời gian cho người quyết.

      **Vì sao sai**

      - A: Ghi một giá trị lịch sử gần nhất là để agent tự đoán đúng lúc bằng chứng chưa rõ, trái với yêu cầu fail safe. Gắn cờ trong bản tóm tắt buổi sáng thì số sai đã nằm trong sổ cả đêm.
      - B: Dừng mọi lượt chạy của cả hệ thống vì một dây chuyền là phản ứng quá tay. Các dây chuyền đã đối soát xong phải được giữ, còn các lượt chạy khác không liên quan cũng bị chặn theo.
      - D: Retry nguồn dữ liệu cho tới lúc vào ca không thay được quyết định của người. Nộp bản tóm tắt mà bỏ dây chuyền bị lệch thì không ai được báo về chỗ chưa rõ.

      **Kiến thức liên quan.** Thứ nhất là checkpoint (**checkpointing**), tức lưu kết quả làm dở ra chỗ vẫn còn sau khi session mất. Thứ ba là leo thang (**escalation design**). Bạn quyết định từ trước khi chạy: lần chạy sẽ dừng ở đâu, và khi đó ai được gọi.

      **Từ khoá**

      - C: hold the posting for the affected line
      - stem: cannot attribute the cause
      - case: escalate to a human when evidence is ambiguous

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `8-3-agent-chay-khong-nguoi-truc#checkpoint-thong-bao-va-leo-thang`
