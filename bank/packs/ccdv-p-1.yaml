  - id: ccdv-p-1.q0050
    exams:
      CCDV-P: D1
    stem: |-
      You are a platform engineer at VectorTrail Logistics. The company runs a multi-agent system that coordinates shipment planning across road, rail, and sea. A supervisor agent delegates route planning, customs paperwork, and exception handling to worker agents that call carrier and tracking tools. The system serves live operations in Rotterdam, Singapore, and Chicago, and long-running jobs must survive restarts and model upgrades.

      Worker agents at VectorTrail Logistics can call 240 carrier, customs, and tracking tools. Loading every schema consumes a third of the context window before planning starts, and tool selection accuracy fell as the catalog grew.

      Which approach should you use?
    options:
      - One consolidated tool with an action parameter that names the operation
      - A split of the catalog across two worker agents with half each
      - A tool search tool with the full catalog deferred until discovery
      - Shorter descriptions for every tool in the catalog
    answer:
      - C
    explanation: |-
      **Catalog tool quá lớn: dùng tool search, để định nghĩa tool ngoài context cho tới khi cần**

      > 💡 Gặp **catalog hàng trăm tool, ngốn context, chọn nhầm** thì chọn **tool search tool**, để cả catalog ở dạng deferred.

      **Đề hỏi gì.** Worker có **240 tool**. Nạp đủ schema thì **mất một phần ba context** trước khi bắt đầu lập kế hoạch, và độ chính xác khi **chọn tool giảm dần** khi catalog lớn lên.

      **Vì sao đúng (C).** Tool search giải quyết cả hai vấn đề. Các tool được đánh dấu `defer_loading` nên không chiếm context cho tới khi Claude tìm tới. Mỗi lần Claude chỉ thấy vài tool liên quan thay vì 240 tool, nên ít chọn nhầm hơn. Catalog vẫn đủ 240 tool, không phải bỏ khả năng nào.

      **Vì sao sai**

      - A: Gộp thành một tool có tham số action thì schema của tool đó phải mô tả đủ 240 thao tác, nên vẫn nặng. Chọn nhầm tool chỉ chuyển thành chọn nhầm giá trị action.
      - B: Chia đôi thì mỗi worker vẫn có 120 tool, vẫn quá nhiều để chọn cho chính xác, mà còn thêm việc phải quyết định giao việc cho worker nào.
      - D: Mô tả ngắn hơn làm schema nhẹ đi một chút, nhưng 240 tool vẫn nằm trong context. Mô tả sơ sài còn làm Claude khó phân biệt các tool giống nhau hơn.

      **Kiến thức liên quan.** Với tool search, Claude không phải đọc hết 138 tool mà tự tìm tool mình cần. Bạn vẫn gửi đủ định nghĩa mọi tool trong request, nhưng đánh dấu `defer_loading: true` cho những tool không cần nạp sẵn, rồi thêm một tool chuyên để tìm tool.

      **Từ khoá**

      - C: tool search tool
      - stem: consumes a third of the context window

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-4-kien-truc-context-va-memory#giu-catalog-tool-lon-ngoai-context`
