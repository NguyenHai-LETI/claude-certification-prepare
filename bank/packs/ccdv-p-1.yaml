  - id: ccdv-p-1.q0065
    exams:
      CCDV-P: D4
    stem: |-
      You are a senior software engineer at DriveSphere Mobility. The company operates an owner-support agent that reads vehicle manuals, warranty documents, and inbound owner messages, and can open service tickets and send responses. Inbound content is untrusted, the agent holds tool access with real side effects, and your team owns its guardrail stack and adversarial testing.

      Intermittently the owner support agent sends a reply that promises a service booking and opens no ticket. Nine failing traces and 40 passing traces cover the same reply flow. In every failing trace the warranty lookup tool timed out and the harness appended an empty tool result with no error marker. In every passing trace the tool returned within its deadline.

      What is the most likely cause?
    options:
      - The model ignores tool results in the failing traces and answers from conversation context alone.
      - Non-deterministic sampling produces the divergent replies under identical prompts and tool results.
      - The harness masks the timeout and the model reads the empty result as a successful lookup.
      - The warranty lookup tool returns malformed records in the failing traces and the model misreads them.
    answer:
      - C
    explanation: |-
      **Harness nuốt lỗi timeout thành kết quả rỗng, nên model tưởng lần tra cứu đã thành công**

      > 💡 Gặp **tool result rỗng không có dấu báo lỗi** thì chọn **harness masks the timeout**: lỗi của tool phải báo bằng `is_error`, đừng trả rỗng.

      **Đề hỏi gì.** Agent **hứa đặt lịch mà không mở ticket**, lúc có lúc không. So **9 trace lỗi với 40 trace đúng**: trace lỗi nào cũng có **tool tra bảo hành timeout** và harness nối vào **tool result rỗng, không có dấu báo lỗi**; trace đúng thì tool trả kịp. Đề hỏi nguyên nhân.

      **Vì sao đúng (C).** Đặt trace lỗi cạnh trace đúng thì chỗ khác nhau đầu tiên là lần gọi tool tra bảo hành: cả chín trace lỗi đều timeout, cả 40 trace đúng đều không. Harness không báo lỗi mà nối vào một tool result rỗng, nên với model, lần tra đó trông như đã chạy xong và không có gì bất thường, và model viết tiếp như việc đã xong. Cách sửa là cho harness trả tool result có đánh dấu lỗi (`is_error`) và nói rõ tool bị timeout.

      **Vì sao sai**

      - A: Model không bỏ qua kết quả tool, nó đọc đúng thứ được đưa vào: một kết quả rỗng không có dấu lỗi. Lỗi chỉ xảy ra khi tool timeout, đúng ở chỗ harness đưa kết quả rỗng.
      - B: Nếu do lấy mẫu ngẫu nhiên thì lỗi phải rải đều, không gắn với điều kiện nào. Ở đây lỗi chỉ xuất hiện khi tool timeout, và kết quả tool ở hai nhóm cũng không giống nhau: một bên rỗng, một bên có dữ liệu.
      - D: Trong trace lỗi, tool không trả bản ghi nào vì đã timeout. Thứ model nhận là kết quả rỗng do harness nối vào, không phải bản ghi sai định dạng.

      **Kiến thức liên quan.** Cùng lý do đó, khi tool bị timeout hay gặp lỗi mạng, harness cũng phải gửi về `tool_result` có `is_error: true`. Nếu harness chỉ gửi về một kết quả rỗng mà không đánh dấu lỗi, Claude không có tín hiệu rõ ràng nào cho biết tool đã hỏng, và dễ làm tiếp như thể tool đã chạy xong.

      **Từ khoá**

      - C: harness masks the timeout
      - stem: appended an empty tool result with no error marker

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `4-1-chan-doan-loi-phuc-tap#loi-luc-co-luc-khong-chay-nhieu-lan-roi-moi-ket-luan`
