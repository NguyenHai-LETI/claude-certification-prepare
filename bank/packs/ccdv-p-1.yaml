  - id: ccdv-p-1.q0054
    exams:
      CCDV-P: D8
    stem: |-
      You are a staff software engineer at Nexora Systems. The engineering organization runs a fleet of coding agents for migrations, refactors, code review, and CI incident first response. Agents work on isolated worktrees, run unattended on schedules, and operate under managed settings your team defines. Generation outpaces human review, and the verification pipeline is yours to engineer.

      Two migration agents run at the same time in separate worktrees of the same repository. Each agent runs the integration suite, and the suite starts a local database on one fixed port. Both agents report intermittent test failures, and each suite passes when its agent runs alone.

      What should you do?
    options:
      - Retry the failing tests until both suites report a clean pass.
      - Move both agents into one shared worktree with a single checkout and one database.
      - Run the two migrations in sequence instead of in parallel to avoid the shared database.
      - Give each worktree its own database instance on a distinct port through an environment override.
    answer:
      - D
    explanation: |-
      **Hai agent song song trên hai worktree mà dùng chung một cổng database: mỗi worktree một database riêng**

      > 💡 Gặp **hai worktree, một cổng database cố định** thì chọn **mỗi worktree một database trên cổng riêng**: worktree chỉ tách file và nhánh.

      **Đề hỏi gì.** Hai agent migration chạy cùng lúc trên **hai worktree của cùng repo**. Bộ test tích hợp **bật database local trên một cổng cố định**. Cả hai báo test lỗi lúc có lúc không, nhưng chạy riêng thì qua.

      **Vì sao đúng (D).** Worktree chỉ tách file và nhánh. Database local là một tiến trình trên máy, nên hai bộ test cùng bật trên một cổng cố định sẽ tranh cổng hoặc chạy chung dữ liệu với nhau, và test hỏng lúc có lúc không. Cho mỗi worktree một database trên cổng riêng qua biến môi trường thì hai bộ test tách hẳn nhau, mà hai agent vẫn chạy song song.

      **Vì sao sai**

      - A: Retry tới khi xanh chỉ giấu xung đột cổng đi. Gốc lỗi vẫn còn, và một bộ test qua nhờ may thì không chứng minh migration đúng.
      - B: Gom hai agent vào một worktree là bỏ đúng thứ giữ cho chúng không sửa vào file của nhau. Hai agent vẫn dùng chung một database, nên còn đụng nhau nhiều hơn.
      - C: Chạy lần lượt thì hết lỗi, nhưng mất lợi ích của chạy song song. Chỉ cần tách database là đủ, không phải bỏ chạy song song.

      **Kiến thức liên quan.** Các agent vẫn chạy chung một máy, nên database hay port mạng thì vẫn dùng chung. Nếu integration test bật database ở một port cố định, hai agent chạy test cùng lúc sẽ tranh nhau port đó.

      **Từ khoá**

      - D: own database instance on a distinct port
      - stem: starts a local database on one fixed port
      - case: Agents work on isolated worktrees

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `8-1-chay-song-song-coding-agent#cho-moi-agent-mot-worktree-rieng`
