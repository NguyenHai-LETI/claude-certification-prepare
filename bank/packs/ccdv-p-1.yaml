    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at Pinnacle Learning Institute. The institute runs a course tutor grounded in its published curriculum and technical library. The tutor must cite its sources and decline to answer questions outside the specified curriculum and technical library. Evaluation suites and calibrated LLM judges enforce a quality bar before any prompt or model change ships. Retrieval quality and judge reliability are your team's responsibility.

      The golden set was sampled two years ago from the curriculum of that time. Pinnacle Learning Institute added 40 courses since then, and this quarter wrong-answer reports doubled, concentrated in the new courses. The suite pass rate held at 97 percent through every recent release, and no failing production query matches any suite task.

      What should you do?
    options:
      - Audit the prompt and the retrieval index for leaked suite questions and quarantine matches.
      - Resample the golden set from current traffic and re-pin the baseline.
      - Add harder questions from the original courses to counter saturation.
      - Gate future releases on the production complaint rate in place of the offline suite.
    answer:
      - B
    explanation: |-
      **Bộ eval thiếu độ phủ khi chương trình đổi: lấy mẫu lại golden set từ lưu lượng hiện tại**

      > 💡 Gặp **bộ eval vẫn đạt cao mà không ca nào khớp lỗi thật** thì chọn **lấy mẫu lại golden set từ lưu lượng hiện tại**.

      **Đề hỏi gì.** Golden set được lấy mẫu **từ hai năm trước**, khi đó học viện chưa có **40 khoá học mới**. Quý này báo trả lời sai **tăng gấp đôi, dồn vào các khoá mới**, trong khi bộ eval vẫn đạt **97%** qua mọi bản release, và **không câu hỏi lỗi nào trên production khớp với ca nào trong bộ eval**. Đề hỏi nên làm gì.

      **Vì sao đúng (B).** Bộ eval vẫn đạt 97% vì nó chỉ hỏi về chương trình cũ, còn lỗi nằm ở 40 khoá mà bộ eval không có ca nào. Đây là thiếu độ phủ. Cách sửa là lấy mẫu lại golden set từ câu hỏi thật hiện nay, để bộ eval có cả các khoá mới, rồi đặt lại mốc so sánh trên bộ mới.

      **Vì sao sai**

      - A: Kiểm lộ đáp án là việc nên làm khi điểm tăng bất thường trên chính bộ eval. Ở đây vấn đề là bộ eval không có ca nào giống câu hỏi lỗi, nên tìm ca bị lộ không sửa được chỗ thiếu.
      - C: Thêm câu khó từ các khoá cũ là chữa bão hoà, tức điểm chạm trần. Lỗi lại nằm ở các khoá mới, nên bộ eval vẫn không có ca nào về chỗ đang hỏng.
      - D: Chặn release theo tỉ lệ khiếu nại thì chỉ biết lỗi sau khi học viên đã gặp. Bộ eval offline vẫn cần, chỉ là phải phủ đúng chương trình hiện tại.

      **Kiến thức liên quan.** Thiếu độ phủ (coverage gaps) là khi sinh viên hỏi những loại câu mà bộ eval gần như không có. Mỗi tháng, đội so tỉ lệ từng chủ đề trong câu hỏi thật của sinh viên với tỉ lệ trong bộ eval, và chuyển ticket báo sai thành ca mới.

      **Từ khoá**

      - B: Resample the golden set from current traffic
      - stem: no failing production query matches any suite task

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-1-thiet-ke-he-thong-eval#giu-bo-eval-con-dung-theo-thoi-gian`
