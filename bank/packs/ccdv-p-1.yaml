  - id: ccdv-p-1.q0045
    exams:
      CCDV-P: D1
    stem: |-
      You are a senior software engineer at Meridian Advisory Group. The firm operates a research copilot that runs multi-hour analysis jobs over public market and industry sources. Agents search, read, and synthesize documents, accumulate working notes, and produce cited briefs for consultants. Jobs run long enough to hit context limits, and the team is accountable for cost, accuracy, and citation quality.

      A Meridian Advisory Group brief runs as one conversation for five days, and input spend climbs each day as the history grows. Leadership sets two constraints: cut token spend in half, and keep cache reads high between interventions.

      What should you recommend?
    options:
      - Trim the oldest messages client-side to a fixed ceiling on every request.
      - Strip thinking blocks from earlier turns before each request.
      - Enable server-side compaction and keep the cached system prompt prefix in place.
      - Move the job to a smaller model tier at the midpoint of each day.
    answer:
      - C
    explanation: |-
      **Hội thoại chạy nhiều ngày: compaction phía server giảm input mà vẫn giữ được cache**

      > 💡 Gặp **hội thoại nhiều ngày, giảm token mà giữ cache** thì chọn **server-side compaction**: nén theo ngưỡng, giữa hai lần nén chỉ nối thêm nên cache còn nguyên.

      **Đề hỏi gì.** Một bản phân tích chạy **trong một hội thoại suốt năm ngày**, chi phí input tăng mỗi ngày theo độ dài lịch sử. Lãnh đạo đặt hai ràng buộc: **giảm một nửa chi phí token**, và **giữ tỉ lệ đọc cache cao giữa các lần can thiệp**. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (C).** Compaction phía server thay cả đoạn hội thoại cũ bằng một bản tóm tắt khi lịch sử dài tới ngưỡng, nên input mỗi lượt giảm hẳn. Giữa hai lần nén, lịch sử chỉ được nối thêm và system prompt đã cache giữ nguyên ở đầu, nên các lượt vẫn đọc được prefix từ cache. Chỉ ở lần nén mới mất một phần cache, đúng với ràng buộc giữ cache cao giữa các lần can thiệp.

      **Vì sao sai**

      - A: Cắt tin nhắn cũ nhất ở mỗi request làm phần đầu lịch sử đổi ở mọi lượt, nên lượt nào cũng mất cache từ chỗ bị cắt trở đi. Hội thoại còn mất dần thông tin cũ mà không có bản tóm tắt nào giữ lại.
      - B: Bỏ thinking block khỏi các lượt cũ là sửa lịch sử đã gửi, nên prefix khác đi và cache bị mất. Phần lớn lịch sử cũng không phải thinking, nên khó giảm được một nửa.
      - D: Đổi model giữa hội thoại làm mất toàn bộ cache, vì cache gắn với từng model. Model nhỏ hơn còn có thể làm giảm độ chính xác của bản phân tích.

      **Kiến thức liên quan.** Compaction (**context compaction**) thay cả đoạn hội thoại cũ bằng một bản tóm tắt. Từ request sau, bạn đặt block này ở đầu `messages` thay cho các message cũ đã được tóm tắt, và gửi lại đúng y như lúc nhận, không thêm bớt field nào.

      **Từ khoá**

      - C: server-side compaction
      - stem: keep cache reads high between interventions
      - case: Jobs run long enough to hit context limits

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-4-kien-truc-context-va-memory#don-ket-qua-tool-va-nen-hoi-thoai`
