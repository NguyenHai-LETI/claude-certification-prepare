  - id: ccdv-p-1.q0060
    exams:
      CCDV-P: D4
    stem: |-
      You work as a site reliability engineer at BrightCart Retail. The company runs a storefront shopping assistant on the Claude API and a nightly batch pipeline that enriches the product catalog. Traffic peaks are sharp, latency targets are strict, and the integration layer must degrade gracefully when limits or failures occur. The assistant holds no payment or identity data; it works over the public catalog and order-status tools.

      A prompt update for the shopping assistant shipped at noon. Minutes later, the assistant recommends discontinued products, and support contacts rise. The previous prompt version is tagged in version control.

      What should you do next?
    options:
      - Hold the current version and start a root-cause investigation before any change.
      - Edit the live prompt in place to remove the line you suspect caused the change.
      - Roll back to the previous prompt version and keep the failing version with its traces.
      - Add an output filter that blocks responses that name discontinued products.
    answer:
      - C
    explanation: |-
      **Chất lượng giảm ngay sau thay đổi prompt của chính mình: rollback về version trước, giữ bản lỗi để điều tra**

      > 💡 Gặp **lỗi ngay sau thay đổi của chính mình, bản trước còn tag** thì chọn **Roll back to the previous prompt version**: dừng thiệt hại trước, tìm nguyên nhân sau.

      **Đề hỏi gì.** Prompt mới phát hành lúc trưa, **vài phút sau** trợ lý gợi ý hàng **đã ngừng bán** và liên hệ hỗ trợ tăng. **Version trước đã có tag** trong version control. Đề hỏi việc làm ngay lúc này.

      **Vì sao đúng (C).** Lỗi xuất hiện ngay sau một thay đổi của chính đội, và bản trước còn tag sẵn, nên rollback là cách dừng thiệt hại nhanh và chắc nhất. Giữ lại version lỗi cùng trace của nó để sau đó tìm nguyên nhân và biến ca này thành ca kiểm thử, mà người mua không phải chịu lỗi trong lúc chờ.

      **Vì sao sai**

      - A: Tìm nguyên nhân trước khi đổi gì thì suốt thời gian điều tra, trợ lý vẫn gợi ý hàng ngừng bán và liên hệ hỗ trợ vẫn tăng. Giảm thiệt hại phải đi trước, tìm nguyên nhân để sau.
      - B: Sửa thẳng prompt đang chạy theo phỏng đoán là deploy một bản chưa qua eval. Dòng bị nghi chưa chắc là nguyên nhân duy nhất, và bản sửa có thể sinh lỗi mới.
      - D: Bộ lọc chỉ che triệu chứng, prompt lỗi vẫn chạy. Chặn câu trả lời cũng không cho người mua câu trả lời đúng, và lỗi nào khác của bản mới vẫn còn nguyên.

      **Kiến thức liên quan.** Rollback về bản cấu hình tốt gần nhất hợp khi chất lượng giảm ngay sau một thay đổi của chính bạn. Sửa nóng prompt rồi deploy tiếp chỉ hợp khi nguyên nhân đã rõ, sửa nhỏ và có eval chạy được trong vài phút. Nếu nguyên nhân mới chỉ là phỏng đoán, bản sửa chưa qua eval có thể sinh lỗi mới.

      **Từ khoá**

      - C: Roll back to the previous prompt version
      - stem: Minutes later | previous prompt version is tagged in version control

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `4-2-xu-ly-su-co#giam-thiet-hai-va-rollback`
