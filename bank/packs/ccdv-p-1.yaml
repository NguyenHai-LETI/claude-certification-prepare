    exams:
      CCDV-P: D4
    stem: |-
      You work as a senior software engineer at EchoPoint Media Works. The company runs a production pipeline that summarizes wire feeds, drafts program notes, and tags an archive of transcripts. Volume is high, editors sample outputs for quality, and the team measures cost and quality movements on live traffic rather than waiting for offline suites.

      A retriever change made the program-notes route fabricate broadcast dates, and editors caught the fault two days later during sampling. The fix shipped, and the postmortem requires a gate that blocks recurrence before deployment.

      Which gate should you use?
    options:
      - A dashboard alert that fires when the fabricated-date rate rises on live traffic
      - An expanded editor sampling rotation that reviews twice the current share of outputs
      - A pre-deployment evaluation that replays the incident transcripts and fails on any fabricated date
      - A prompt instruction that tells the model to state dates only from retrieved text
    answer:
      - C
    explanation: |-
      **Chặn lỗi tái diễn trước khi deploy: biến transcript của sự cố thành ca eval chạy trước mỗi lần deploy**

      > 💡 Gặp **chặn tái diễn trước khi deploy** thì chọn **eval chạy lại transcript của sự cố**: cảnh báo và lấy mẫu đều chỉ thấy lỗi sau khi đã lên production.

      **Đề hỏi gì.** Một thay đổi retriever làm tuyến ghi chú chương trình **bịa ngày phát sóng**, và hai ngày sau biên tập viên mới bắt được khi lấy mẫu. Bản sửa đã lên, và postmortem yêu cầu một cổng **chặn lỗi tái diễn trước khi deploy**. Đề hỏi nên dùng cổng nào.

      **Vì sao đúng (C).** Lấy transcript của chính sự cố làm ca eval hồi quy, chạy trước mỗi lần deploy, và cho trượt ngay khi có một ngày phát sóng bịa. Thay đổi nào làm lỗi quay lại sẽ bị chặn từ trước khi tới production, đúng yêu cầu của postmortem.

      **Vì sao sai**

      - A: Cảnh báo trên dashboard chỉ kêu khi lỗi đã chạy trên lưu lượng thật, tức sau khi deploy. Nó giúp phát hiện sớm hơn chứ không chặn được trước khi deploy.
      - B: Lấy mẫu gấp đôi vẫn là kiểm sau khi output đã ra production. Lần này biên tập viên lấy mẫu cũng mất hai ngày mới thấy.
      - D: Dặn model chỉ nêu ngày có trong văn bản truy xuất được không phải là cổng. Không có gì kiểm câu dặn đó còn tác dụng sau lần đổi retriever tiếp theo.

      **Kiến thức liên quan.** Sự cố chỉ thật sự khép lại khi lần sau lỗi đó bị chặn trước khi tới tay khách. Eval hồi quy là bộ ca kiểm thử chạy lại mỗi khi bạn thay đổi cấu hình, để chắc chắn lỗi đã sửa không quay lại.

      **Từ khoá**

      - C: pre-deployment evaluation that replays the incident transcripts
      - stem: blocks recurrence before deployment

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `4-2-xu-ly-su-co#bien-su-co-thanh-eval-canh-bao-va-postmortem`
