      CCDV-P: D1
    stem: |-
      You are a senior software engineer at Pinnacle Learning Institute. The institute runs a course tutor grounded in its published curriculum and technical library. The tutor must cite its sources and decline to answer questions outside the specified curriculum and technical library. Evaluation suites and calibrated LLM judges enforce a quality bar before any prompt or model change ships. Retrieval quality and judge reliability are your team's responsibility.

      Tutoring conversations at Pinnacle Learning Institute span a semester module and reach the context limit in a single session. The tutor must keep conversational continuity, and the team does not want client-side history bookkeeping.

      Which approach should you use?
    options:
      - Client-side truncation of the oldest turns on each request
      - A fresh conversation for each new student question
      - The memory tool as the store for the full transcript
      - Server-side compaction of the earlier conversation history
    answer:
      - D
    explanation: |-
      **Hội thoại chạm giới hạn context mà cần giữ mạch: dùng compaction phía server**

      > 💡 Gặp **chạm giới hạn context mà không muốn tự quản lý lịch sử** thì chọn **server-side compaction**.

      **Đề hỏi gì.** Hội thoại dạy học kéo dài cả một học phần và **chạm giới hạn context ngay trong một session**. Trợ lý phải **giữ được mạch hội thoại**, và nhóm **không muốn tự quản lý lịch sử phía client**. Đề hỏi nên dùng cách nào.

      **Vì sao đúng (D).** Compaction thay phần hội thoại cũ bằng một bản tóm tắt, nên hội thoại đi tiếp được mà vẫn giữ mạch. Bản phía server do API tự nén khi input chạm ngưỡng, nên ứng dụng không phải tự tính khi nào cắt hay tự lưu phần nào. Cách này đáp ứng cả hai yêu cầu của đề.

      **Vì sao sai**

      - A: Cắt bớt lượt cũ phía client chính là kiểu tự quản lý lịch sử mà nhóm không muốn, và các lượt bị cắt mất hẳn, nên trợ lý mất mạch về những gì đã dạy.
      - B: Mỗi câu hỏi một hội thoại mới thì không còn mạch hội thoại nào, trái với yêu cầu chính của đề.
      - C: Memory tool dùng để ghi những điều cần nhớ qua nhiều session, không phải chỗ chứa nguyên transcript. Nạp lại cả transcript từ memory thì context vẫn đầy như cũ.

      **Kiến thức liên quan.** Lịch sử dài có hai kỹ thuật xử lý. Context editing (**context editing**) xoá bớt kết quả tool cũ theo luật bạn đặt. Compaction (**context compaction**) thay cả đoạn hội thoại cũ bằng một bản tóm tắt.

      **Từ khoá**

      - D: Server-side compaction
      - stem: does not want client-side history bookkeeping

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-4-kien-truc-context-va-memory#don-ket-qua-tool-va-nen-hoi-thoai`
