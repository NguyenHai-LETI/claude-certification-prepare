  - id: ccdv-p-1.q0024
    exams:
      CCDV-P: D2
    stem: |-
      You are a site reliability engineer at HelioGrid Energy. The company operates a field-operations copilot that helps technicians diagnose inverter faults, draft work orders, and summarize sensor readings from solar sites. The service carries uptime and quality SLOs, is instrumented end to end, and your team leads incident response when quality or availability regresses.

      A provider incident ends, yet the copilot's error rate stays high for another 40 minutes. The request log shows HTTP 529 overloaded_error responses in waves at fixed intervals. Each wave is larger than the wave before it. Every client instance retries failures on the same deterministic backoff schedule with no retry cap.

      What is the most likely cause?
    options:
      - A provider-side rate limit reduction applied at the end of the incident
      - A connection pool that pins recovered clients to the failed endpoint
      - Queued batch jobs that drain into the interactive endpoint after recovery
      - Synchronized retries that rebuild the overload at each shared backoff interval
    answer:
      - D
    explanation: |-
      **Mọi client retry theo cùng một lịch backoff cố định, không giới hạn số lần, thì retry dồn lại thành từng đợt tự dựng lại quá tải**

      > 💡 Gặp **529 tới theo đợt đều nhau, đợt sau to hơn, cùng lịch backoff không jitter** thì chọn **Synchronized retries**: client retry đồng loạt tự dựng lại quá tải.

      **Đề hỏi gì.** Sự cố phía nhà cung cấp đã hết mà tỉ lệ lỗi của copilot vẫn cao thêm 40 phút. Log cho thấy **529 overloaded_error tới theo từng đợt cách đều nhau, đợt sau to hơn đợt trước**. Mọi client **retry theo cùng một lịch backoff cố định, không giới hạn số lần**.

      **Vì sao đúng (D).** Khi mọi client dùng cùng một lịch backoff không có ngẫu nhiên, các request hỏng cùng lúc sẽ được gửi lại cùng lúc, đúng ở mỗi mốc backoff. Mỗi đợt như vậy lại làm API quá tải và sinh thêm request hỏng, và vì không giới hạn số lần retry nên số request gửi lại cứ cộng dồn. Đó là lý do lỗi tới theo đợt đều nhau và đợt sau to hơn. Cách chữa là thêm jitter và đặt giới hạn số lần retry.

      **Vì sao sai**

      - A: Nhà cung cấp hạ rate limit sẽ cho lỗi 429, không phải 529 overloaded_error. Rate limit thấp hơn cũng không giải thích được các đợt cách đều nhau và lớn dần.
      - B: Connection pool dính vào endpoint hỏng thì lỗi kéo dài liên tục, không tới theo từng đợt đúng nhịp backoff và lớn dần như log cho thấy.
      - C: Đề không nhắc tới batch job nào. Job dồn về cũng không tạo ra các đợt cách đều nhau theo đúng một lịch cố định.

      **Kiến thức liên quan.** SDK chính thức của Anthropic tự gửi lại các lỗi tạm thời như mất kết nối, 429 hay 5xx. Mặc định SDK thử lại hai lần, dùng exponential backoff, và nếu có `retry-after` thì chờ ít nhất số giây đó.

      **Từ khoá**

      - D: Synchronized retries
      - stem: same deterministic backoff schedule with no retry cap

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-1-do-tin-cay-dich-vu-claude#retry-va-backoff-sdk-ramp-limit-va-stream-bi-ngat`
