  - id: ccdv-p-1.q0027
    exams:
      CCDV-P: D2
    stem: |-
      You are a platform engineer at Ironhaven Manufacturing. The company exposes maintenance manuals, parts inventory, and work-order tools to Claude agents through remote MCP servers used by plant engineering teams. Your team owns MCP deployment and authentication, tool catalog governance, agent identity, and the managed configuration that plant teams inherit. Changes must roll out to the fleet without breaking running integrations.

      As part of the stateless migration you review the fleet's authentication code. The old code validated an agent's access token once, during the initialization handshake, and trusted every later request on that connection. The new transport has no handshake, and any replica answers any request from any agent.

      Which authentication design should you use?
    options:
      - Token validation on every request, with the credential carried in the request itself
      - An allowlist of plant network addresses checked at the gateway in place of tokens
      - A session token issued after the first authenticated request and honored by every replica
      - Token validation only on requests that invoke tools that modify work orders
    answer:
      - A
    explanation: |-
      **MCP không còn session thì mỗi request phải mang credential và được kiểm token ở bất kỳ replica nào nhận nó**

      > 💡 Gặp **không còn bước bắt tay, replica nào cũng nhận request nào** thì chọn **Token validation on every request**: credential đi theo từng request.

      **Đề hỏi gì.** Code cũ **chỉ kiểm token một lần lúc bắt tay khởi tạo** rồi tin mọi request sau trên cùng kết nối. Transport mới **không có bước bắt tay**, và **replica nào cũng trả lời request nào của agent nào**.

      **Vì sao đúng (A).** Không còn bắt tay thì không còn thời điểm nào để kiểm một lần rồi tin về sau, và không còn kết nối nào gắn với một agent đã được kiểm. Request nào cũng có thể rơi vào replica nào, nên mỗi request phải tự mang access token và replica nhận nó phải kiểm token ngay lúc đó. MCP server lúc này đóng đúng vai resource server: kiểm token mà client gửi kèm trên từng request.

      **Vì sao sai**

      - B: Allowlist địa chỉ mạng của nhà máy chỉ cho biết request đến từ đâu, không cho biết agent nào gọi hay được làm gì. Máy nào trong mạng nhà máy cũng qua được, kể cả agent không được phép.
      - C: Session token cấp sau request đầu là dựng lại đúng thứ trạng thái mà transport mới đã bỏ, và mọi replica phải chia sẻ trạng thái đó. Server vẫn phải kiểm token trên từng request, chỉ là thêm một loại token nữa phải quản lý.
      - D: Chỉ kiểm token khi gọi tool sửa lệnh công việc thì mọi request đọc sổ tay và tồn kho đều không được xác thực, ai gọi tới cũng đọc được.

      **Kiến thức liên quan.** Từ bản spec MCP 2026-07-28, giao thức bỏ hẳn session. Session ở đây là trạng thái server giữ cho từng client giữa các request, khác với session của Managed Agents ở cuối bài. Không còn bước bắt tay `initialize` lúc đầu, cũng không còn header `Mcp-Session-Id`, và mỗi request tự ghi protocol version của nó.

      **Từ khoá**

      - A: on every request
      - stem: any replica answers any request from any agent

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-3-mcp-production-va-quan-ly-thay-doi#dua-mcp-server-len-mang-va-xac-thuc`
