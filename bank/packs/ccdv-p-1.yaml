    exams:
      CCDV-P: D7
    stem: |-
      You are a senior software engineer at Horizon Crest Hospitality. The company operates a guest concierge agent across its properties in Lisbon, Osaka, and Vancouver, with property-level configuration and a shared platform team. The concierge answers property questions, coordinates requests with booking and housekeeping tools, and must stay within tight latency and cost budgets in every region.

      An auditor traces one unauthorized housekeeping schedule change through the concierge stack. The platform audit shows the Vancouver instance identity on the tool call, and the MCP server log shows the matching request. The housekeeping database records the write from a single database account that every property MCP server shares. The final write must become attributable to the acting workload.

      What should you recommend?
    options:
      - Give each property MCP server its own database credential and record the account on every write
      - Record the property name in a comment column on each housekeeping write
      - Correlate database writes to tool calls with request timestamps during incident reviews
      - Enable verbose request logging on each MCP server and retain the logs for one year
    answer:
      - A
    explanation: |-
      **Muốn bản ghi cuối cùng truy được về workload đã làm, mỗi MCP server phải ghi vào DB bằng credential riêng**

      > 💡 Gặp **một tài khoản DB mà mọi server dùng chung** thì chọn **its own database credential**: mỗi workload một credential thì bản ghi tự nói ai đã ghi.

      **Đề hỏi gì.** Kiểm toán lần theo một lần đổi lịch buồng phòng trái phép. Audit của platform ghi danh tính instance Vancouver, log MCP server có request khớp, nhưng database ghi lệnh ghi từ **một tài khoản DB mà mọi MCP server của các khách sạn dùng chung**. Đề muốn bản ghi cuối cùng cũng chỉ ra được workload nào đã ghi.

      **Vì sao đúng (A).** Chuỗi bị đứt ở đúng chặng cuối: database chỉ thấy một tài khoản dùng chung, nên không biết lệnh ghi đến từ server của khách sạn nào. Cho mỗi MCP server một credential DB riêng thì chính database ghi được tài khoản nào đã ghi, và tài khoản đó ứng với đúng một workload. Bằng chứng nằm ngay trong bản ghi, không phải ghép đoán từ nơi khác.

      **Vì sao sai**

      - B: Tên khách sạn ghi vào cột ghi chú là dữ liệu do chính lệnh ghi tự khai. Server nào cầm tài khoản dùng chung cũng ghi được tên khách sạn nào tuỳ ý, nên database vẫn không biết thật ra ai đã ghi.
      - C: Ghép lệnh ghi với lệnh gọi tool theo thời điểm chỉ là suy đoán sau sự cố. Hai request gần giờ nhau là ghép nhầm, và database vẫn chỉ thấy một tài khoản chung.
      - D: Log chi tiết hơn ở MCP server và giữ lâu hơn không đổi được việc database chỉ thấy một tài khoản. Chặng giữa server và database vẫn không có danh tính riêng.

      **Kiến thức liên quan.** Danh tính của agent (**agent identity**) cần tách thành ba lớp, mỗi lớp trả lời một câu hỏi khác nhau. Có lúc tool cần biết cả agent nào đang gọi, chẳng hạn để agent báo cáo không tạo được đơn. Khi đó bạn cần danh tính của chính agent.

      **Từ khoá**

      - A: its own database credential
      - stem: a single database account that every property MCP server shares

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-3-dinh-danh-bi-mat-va-audit#agent-hanh-dong-nhan-danh-ai`
