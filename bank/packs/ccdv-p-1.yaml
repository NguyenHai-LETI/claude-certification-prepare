  - id: ccdv-p-1.q0042
    exams:
      CCDV-P: D1
    stem: |-
      You are a senior software engineer at Meridian Advisory Group. The firm operates a research copilot that runs multi-hour analysis jobs over public market and industry sources. Agents search, read, and synthesize documents, accumulate working notes, and produce cited briefs for consultants. Jobs run long enough to hit context limits, and the team is accountable for cost, accuracy, and citation quality.

      The team moves the copilot to a managed agent platform whose beta memory feature carries curated records across sessions. An engineer proposes loading each job's full working notes into shared memory before every session starts. Notes from one engagement must never steer analysis for a different engagement, and interrupted jobs must still resume cleanly.

      What should you recommend?
    options:
      - Disable the memory feature and rely on the session transcript to carry state across jobs.
      - Reserve shared memory for durable cross-job practices and keep each job's notes in its persisted workspace.
      - Store all notes in shared memory and tag each record with the engagement name for filtering.
      - Load the full notes of every active job into shared memory and clear them when each job closes.
    answer:
      - B
    explanation: |-
      **Memory dùng chung chỉ giữ cách làm bền qua nhiều job, ghi chú của từng job nằm trong workspace riêng**

      > 💡 Gặp **ghi chú không được lẫn giữa các hợp đồng** thì chọn **memory dùng chung chỉ cho cách làm bền, ghi chú để trong workspace của job**.

      **Đề hỏi gì.** Copilot chuyển sang nền tảng agent managed có tính năng memory (beta) mang bản ghi qua nhiều session. Một kỹ sư đề xuất **nạp cả ghi chú của mỗi job vào memory dùng chung** trước mỗi session. Ghi chú của một hợp đồng tư vấn **không bao giờ được ảnh hưởng tới hợp đồng khác**, và job bị ngắt vẫn phải chạy tiếp gọn gàng. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (B).** Memory dùng chung hợp với những thứ đúng cho mọi job, như cách làm đã chốt. Ghi chú làm việc của từng job để trong workspace đã lưu bền của chính job đó, nên job bị ngắt vẫn đọc lại được để chạy tiếp, còn ghi chú của hợp đồng này không bao giờ lọt vào phân tích của hợp đồng khác.

      **Vì sao sai**

      - A: Tắt memory thì mất luôn những cách làm bền đáng mang qua các job. Transcript của một session cũng không mang trạng thái sang job khác.
      - C: Gắn tên hợp đồng rồi lọc vẫn để mọi ghi chú nằm chung một chỗ mà agent đọc được. Chỉ cần lọc sai hay bỏ sót một lần là ghi chú lọt sang hợp đồng khác, trong khi đề đòi không bao giờ.
      - D: Nạp ghi chú của mọi job đang chạy vào memory dùng chung là đưa ghi chú của nhiều hợp đồng vào cùng một session, đúng điều đề cấm. Xoá khi job xong không cứu được lúc các job còn chạy song song.

      **Kiến thức liên quan.** Bảng tiến độ cho agent biết việc nào đã xong. Nhưng agent còn cần nhớ những cách làm đội đã chốt, và đó là việc của memory. Mỗi người dùng hay mỗi project dùng một store riêng.

      **Từ khoá**

      - B: Reserve shared memory for durable cross-job practices
      - stem: must never steer analysis for a different engagement

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-2-chay-ben-va-luu-trang-thai#memory-thu-agent-can-nho-qua-nhieu-session`
