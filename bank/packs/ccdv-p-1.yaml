    stem: |-
      You are a senior software engineer at Meridian Advisory Group. The firm operates a research copilot that runs multi-hour analysis jobs over public market and industry sources. Agents search, read, and synthesize documents, accumulate working notes, and produce cited briefs for consultants. Jobs run long enough to hit context limits, and the team is accountable for cost, accuracy, and citation quality.

      A two-engineer platform team maintains the copilot's execution infrastructure. On-call records for the quarter attribute 30 of 41 incidents to home-built checkpointing, state storage, and disconnection recovery rather than to prompt or model behavior. Multi-hour jobs must survive client disconnections and resume with progress intact. The team evaluates a managed agent harness that provides hosted execution, state management, and execution tracing.

      What should you recommend?
    options:
      - Hire an additional platform engineer and harden the home-built execution stack.
      - Adopt the managed harness and refocus the team on prompts, evaluation, and job quality.
      - Rebuild the checkpointing layer on the orchestration framework the team already operates.
      - Move state storage to a managed database and keep the remaining home-built components.
    answer:
      - B
    explanation: |-
      **Đội nhỏ tốn phần lớn sức cho hạ tầng tự dựng: chuyển sang harness managed để tập trung vào chất lượng job**

      > 💡 Gặp **phần lớn sự cố đến từ hạ tầng tự dựng** thì chọn **dùng harness managed**: đừng tự vận hành thứ người khác đã làm sẵn.

      **Đề hỏi gì.** Đội platform chỉ có **hai kỹ sư**. Trong quý, **30 trên 41 sự cố** đến từ phần checkpoint, lưu trạng thái và khôi phục khi mất kết nối do đội **tự dựng**, chứ không từ prompt hay model. Job nhiều giờ phải sống qua lúc client mất kết nối. Đội đang xét một harness managed có sẵn chạy hosted, quản lý trạng thái và trace. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (B).** Phần đang gây gần ba phần tư số sự cố chính là phần harness managed làm sẵn: chạy job ở phía server, giữ session và trạng thái, và có trace. Chuyển sang đó thì đội không phải tự giữ lịch sử, tự khôi phục khi mất kết nối, và hai kỹ sư dồn sức vào prompt, eval và chất lượng job, đúng chỗ tạo ra giá trị.

      **Vì sao sai**

      - A: Thuê thêm người để gia cố phần tự dựng vẫn giữ nguyên nguồn gây sự cố, chỉ thêm người để gánh nó.
      - C: Dựng lại lớp checkpoint trên framework đang dùng vẫn là đội tự viết và tự vận hành phần khó nhất, chỉ đổi chỗ đặt nó.
      - D: Chuyển riêng chỗ lưu trạng thái sang database managed vẫn để checkpoint và khôi phục khi mất kết nối nằm trong code tự dựng, mà các phần đó cũng nằm trong số sự cố.

      **Kiến thức liên quan.** Đội chọn Managed Agents cho nhánh "khác" vì cần session sống lâu mà không muốn tự vận hành sandbox. Chuyển sang đây, đội không còn phải tự giữ lịch sử, tự chạy các tool có sẵn (bash, đọc ghi file…) hay tự dựng sandbox.

      **Từ khoá**

      - B: Adopt the managed harness
      - stem: 30 of 41 incidents to home-built checkpointing

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-3-chon-kien-truc-khi-mo-rong#chon-harness-khi-he-lon-len`
