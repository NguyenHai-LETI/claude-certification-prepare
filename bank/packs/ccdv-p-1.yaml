  - id: ccdv-p-1.q0006
    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at Stonegate Development Partners. The firm processes construction contracts, permits, and inspection reports through an extraction service that feeds project dashboards. Throughput is bursty, accuracy is contractual, and the team runs online sampling and judge-based review to hold quality while controlling spend.

      Two expert annotators score sampled contract extractions on a single holistic completeness scale, and their Cohen's kappa is 0.31. A judge prompted with the same scale agrees with each annotator at a similar level. The team wants a release gate it can trust.

      What should you recommend?
    options:
      - Move the judge to the largest available model tier and rerun the calibration study.
      - Average the two annotators' scores and calibrate the judge against the averaged labels.
      - Split the rubric into criterion-level checks with explicit definitions, then recalibrate judge and annotators.
      - Replace both annotators with a single senior expert whose labels become the gold standard.
    answer:
      - C
    explanation: |-
      **Hai người chấm còn vênh nhau thì lỗi ở rubric: tách thành từng tiêu chí có định nghĩa rồi hiệu chỉnh lại**

      > 💡 Gặp **hai người chấm còn vênh nhau (kappa thấp)** thì chọn **tách rubric thành từng tiêu chí có định nghĩa**: sửa thước trước rồi mới đo judge.

      **Đề hỏi gì.** Hai chuyên gia chấm cùng một **thang "độ đầy đủ" chung chung**, và **Cohen's kappa giữa họ chỉ 0,31**. Judge dùng cùng thang đó khớp với mỗi người ở mức tương tự. Nhóm muốn một cổng release đáng tin. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (C).** Mức khớp giữa hai người chấm là mức trần của judge. Hai chuyên gia chỉ khớp ở kappa 0,31 nghĩa là chính họ hiểu thang điểm mỗi người một kiểu, nên judge không thể khớp hơn. Lỗi nằm ở rubric: một thang "đầy đủ" gộp nhiều thứ mà không định nghĩa thế nào là đủ. Tách thành từng tiêu chí riêng có định nghĩa rõ, rồi hiệu chỉnh lại cả người lẫn judge.

      **Vì sao sai**

      - A: Đổi sang model lớn hơn không sửa được thang điểm mơ hồ. Judge đang so với nhãn mà chính hai người chấm còn không thống nhất, nên model mạnh tới đâu cũng không có mốc đúng để khớp.
      - B: Lấy trung bình hai bộ nhãn đang vênh nhau chỉ tạo ra một bộ nhãn trung bình của hai cách hiểu khác nhau. Thang điểm vẫn mơ hồ, và judge được hiệu chỉnh theo một mốc không ai thật sự đồng ý.
      - D: Chỉ giữ một chuyên gia thì không còn thấy độ vênh, chứ thang điểm vẫn mơ hồ như cũ. Nhãn của một người trên một thang không định nghĩa rõ không thành chuẩn đáng tin.

      **Kiến thức liên quan.** Hai kỹ sư chấm độc lập trước. Mức khớp giữa hai người chấm (**inter-rater reliability**) thường được coi là mức trần, vì judge được so với nhãn của người. Nếu chính hai người còn chấm vênh nhau nhiều thì judge khó khớp với họ hơn thế. Khi đó lỗi nằm ở rubric hoặc ở chính ticket, và phải sửa những chỗ này trước.

      **Từ khoá**

      - C: criterion-level checks
      - stem: single holistic completeness scale | Cohen's kappa is 0.31

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-2-llm-as-judge#hieu-chinh-judge-voi-nhan-cua-nguoi`
