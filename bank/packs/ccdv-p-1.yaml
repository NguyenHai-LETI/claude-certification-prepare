  - id: ccdv-p-1.q0043
    exams:
      CCDV-P: D1
    stem: |-
      You are a senior software engineer at Meridian Advisory Group. The firm operates a research copilot that runs multi-hour analysis jobs over public market and industry sources. Agents search, read, and synthesize documents, accumulate working notes, and produce cited briefs for consultants. Jobs run long enough to hit context limits, and the team is accountable for cost, accuracy, and citation quality.

      Quarterly telemetry splits the copilot's jobs into two classes. Daily market summaries follow the same retrieval and drafting path on 98 percent of runs, carry 80 percent of job volume, and account for 70 percent of model spend. A fixed-workflow prototype runs a summary at a third of the agent's cost. Custom in-depth briefs branch unpredictably across sources, and consultants rate agent-written briefs above the earlier scripted drafts. Finance requires a 40 percent cut in model spend with no quality drop that consultants notice.

      What should you recommend?
    options:
      - Keep both job classes on the agent and route summary jobs to a smaller model tier.
      - Run both classes through the agent with a hard cap on turns for summary jobs.
      - Move both job classes to a deterministic workflow and accept the change in brief quality.
      - Migrate the market summaries to a fixed workflow and keep the agent for in-depth briefs.
    answer:
      - D
    explanation: |-
      **Tách theo loại job: việc đi một đường cố định chuyển sang workflow, việc rẽ nhánh khó đoán giữ agent**

      > 💡 Gặp **98% lần chạy đi cùng một đường** thì chọn **chuyển loại đó sang workflow, giữ agent cho loại rẽ nhánh**: workflow và agent dùng chung được trong một hệ.

      **Đề hỏi gì.** Bản tóm tắt thị trường hằng ngày **đi cùng một đường ở 98% lần chạy**, chiếm 80% số job và **70% chi phí model**, và bản prototype workflow cố định chỉ tốn **một phần ba** chi phí của agent. Bản phân tích chuyên sâu **rẽ nhánh khó đoán**, và chuyên viên chấm bản agent viết cao hơn bản soạn theo script trước đây. Tài chính đòi **giảm 40% chi phí** mà chuyên viên không thấy chất lượng giảm. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (D).** Tóm tắt hằng ngày gần như luôn đi một đường, nên để code đi đường đó thì rẻ hơn để agent tự tìm lại mỗi lần. Chuyển riêng loại này sang workflow cắt khoảng hai phần ba của 70% chi phí, tức gần 47%, vượt mức 40%. Bản phân tích chuyên sâu cần agent và đang được chấm cao, nên giữ nguyên để chất lượng không giảm.

      **Vì sao sai**

      - A: Giữ agent cho tóm tắt hằng ngày là vẫn trả tiền cho sự linh hoạt mà 98% lần chạy không dùng tới. Model nhỏ hơn có thể làm giảm chất lượng, và không có số liệu nào cho thấy cách này đạt mức giảm 40%.
      - B: Đặt trần số lượt có thể cắt ngang job trước khi xong, và agent vẫn phải tự chọn lại đúng một con đường ở mỗi lần chạy. Bản phân tích chuyên sâu cũng không được giảm chi phí.
      - C: Chuyển cả bản phân tích chuyên sâu sang workflow làm chất lượng giảm rõ, vì chuyên viên chấm bản agent viết cao hơn bản theo script. Đề không cho phép mức giảm chất lượng chuyên viên nhận ra.

      **Kiến thức liên quan.** Khi trace cho thấy đường đi cố định như vậy, để code đi đường đó thì rẻ và nhanh hơn để model tự tìm. Giữ agent cho việc đã có đường đi rõ ràng là trả tiền cho sự linh hoạt mà không ai dùng tới. Workflow và agent không loại trừ nhau.

      **Từ khoá**

      - D: Migrate the market summaries to a fixed workflow
      - stem: same retrieval and drafting path on 98 percent of runs

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-3-chon-kien-truc-khi-mo-rong#doc-so-lieu-truoc-khi-doi-kien-truc`
