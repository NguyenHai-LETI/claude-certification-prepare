    exams:
      CCDV-P: D3
    stem: |-
      You are a senior software engineer at Horizon Crest Hospitality. The company operates a guest concierge agent across its properties in Lisbon, Osaka, and Vancouver, with property-level configuration and a shared platform team. The concierge answers property questions, coordinates requests with booking and housekeeping tools, and must stay within tight latency and cost budgets in every region.

      A weekly review of 200 sampled traces surfaces four traces where the concierge confirms a housekeeping request that the housekeeping tool rejected. One teammate wants an immediate rewrite of the shared platform prompt; another calls the four traces incidental. You need to establish whether the pattern is systemic before anyone changes the fleet.

      What should you do next?
    options:
      - Rewrite the shared platform prompt now and watch next week's sample for the pattern.
      - Add the four traces to the regression eval suite and rely on the next scheduled run.
      - Query all stored traces for the rejection-then-confirmation signature and measure its rate for each property.
      - Log the four traces as known issues and revisit them if the pattern repeats in next week's sample.
    answer:
      - C
    explanation: |-
      **Muốn biết một mẫu lỗi có mang tính hệ thống không thì đo tần suất của nó trên toàn bộ trace và tách theo nhóm**

      > 💡 Gặp **vài trace lạ, cần biết có mang tính hệ thống không** thì chọn **Query all stored traces**: đo tần suất trên toàn bộ trace và tách theo nhóm.

      **Đề hỏi gì.** Rà 200 trace lấy mẫu thấy **4 trace** concierge xác nhận yêu cầu buồng phòng mà tool đã từ chối. Một người muốn sửa ngay prompt chung, người khác cho là chuyện lẻ. Đề cần **xác định mẫu này có mang tính hệ thống không** trước khi ai đổi gì cho cả hệ thống.

      **Vì sao đúng (C).** Bốn trên 200 trace không đủ để kết luận theo hướng nào. Thứ cần biết là tần suất: mẫu "tool từ chối rồi agent vẫn xác nhận" xảy ra bao nhiêu lần trên toàn bộ trace đã lưu, và có dồn vào khách sạn nào không. Truy vấn đúng chữ ký đó trên mọi trace rồi tính tỉ lệ theo từng khách sạn cho câu trả lời có số đo, trước khi động vào prompt dùng chung.

      **Vì sao sai**

      - A: Sửa prompt chung ngay là đổi cả hệ thống khi chưa biết mẫu lỗi có thật sự phổ biến không, và nếu nó chỉ dồn ở một khách sạn thì sửa chung là sửa sai chỗ.
      - B: Thêm bốn trace vào bộ regression giúp bắt lại đúng bốn ca đó về sau, nhưng không cho biết ngay bây giờ mẫu lỗi xảy ra thường tới mức nào.
      - D: Ghi nhận rồi chờ mẫu tuần sau là để số liệu tự tới chậm, trong khi trace đã lưu đủ để đo ngay. Mẫu 200 trace tuần sau cũng nhỏ y như tuần này.

      **Kiến thức liên quan.** Gặp một lỗi lẻ, Claude thường tự xoay xở được, chẳng hạn hỏi lại, xin lỗi hay chuyển khách cho nhân viên. Vì vậy span không báo `ERROR` và hội thoại nào nhìn cũng hợp lý, chỉ có tần suất là bất thường.

      **Từ khoá**

      - C: Query all stored traces
      - stem: establish whether the pattern is systemic

