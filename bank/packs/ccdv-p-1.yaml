  - id: ccdv-p-1.q0009
    exams:
      CCDV-P: D1
    stem: |-
      You work as a platform engineer at HarvestPeak Foods. The company runs scheduled agents that reconcile supplier quality reports, watch production telemetry, and file exception summaries before each shift. Runs are unattended, must fail safe, and escalate to a human when evidence is ambiguous. Long reconciliations checkpoint so that a restart never repeats a completed posting.

      A reconciliation run crashed overnight and the scheduler restarted it from the last checkpoint. The morning review finds one supplier exception summary posted twice, and the run log shows a single run identifier. Each posting call received a synchronous success response, and the run wrote checkpoints on a fixed time interval.

      What is the most likely cause?
    options:
      - The checkpoint file was corrupted when the crash interrupted a write.
      - The final posting completed after the last interval checkpoint and before the crash.
      - The scheduler started a second run before the first container stopped.
      - The completion webhook was redelivered and started a second posting.
    answer:
      - B
    explanation: |-
      **Checkpoint theo khoảng thời gian cố định thì bút toán ghi sau checkpoint cuối bị ghi lại khi khởi động lại**

      > 💡 Gặp **checkpoint theo khoảng thời gian cố định mà một bút toán bị ghi hai lần** thì chọn **bút toán xong sau checkpoint cuối, trước lúc crash**.

      **Đề hỏi gì.** Lượt đối soát bị crash, scheduler cho chạy lại từ checkpoint cuối, và sáng ra thấy **một bản tóm tắt ngoại lệ bị ghi hai lần**. Log chỉ có **một run ID**, mỗi lần ghi đều nhận **phản hồi thành công đồng bộ**, và checkpoint được ghi **theo khoảng thời gian cố định**. Đề hỏi nguyên nhân nhiều khả năng nhất.

      **Vì sao đúng (B).** Checkpoint ghi theo chu kỳ thời gian cố định chứ không theo từng việc, nên giữa hai lần checkpoint có thể có việc đã xong mà chưa được ghi lại. Bút toán cuối hoàn tất sau checkpoint cuối và trước lúc crash. Khi chạy lại từ checkpoint đó, run không biết bút toán đã ghi rồi nên ghi thêm lần nữa. Một run ID và phản hồi thành công đồng bộ loại được giả thuyết có run thứ hai hay lần ghi bị treo.

      **Vì sao sai**

      - A: Checkpoint hỏng thì run khó chạy lại được từ checkpoint, hoặc sẽ chạy lại từ đầu và ghi trùng nhiều bút toán. Ở đây chỉ trùng đúng một bút toán, khớp với khoảng trống sau checkpoint cuối.
      - C: Nếu scheduler khởi động một run thứ hai thì log sẽ có hai run ID. Log chỉ ghi một run ID.
      - D: Webhook gửi lại sẽ sinh thêm một lần ghi riêng ngoài run, nhưng mỗi lần ghi ở đây đều nhận phản hồi đồng bộ trong chính run đó. Không có chi tiết nào cho thấy webhook tham gia.

      **Kiến thức liên quan.** Checkpoint nên đặt ở ranh giới của một đơn vị việc. Ở đây một đơn vị là viết, so, commit và ghi tiến độ cho một báo cáo. Bị ngắt giữa chừng thì agent chỉ phải làm lại đúng đơn vị đó.

      **Từ khoá**

      - B: final posting completed after the last interval checkpoint
      - stem: checkpoints on a fixed time interval | single run identifier
      - case: a restart never repeats a completed posting

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-2-chay-ben-va-luu-trang-thai#checkpoint-de-agent-o-session-moi-biet-viec-da-toi-dau`
