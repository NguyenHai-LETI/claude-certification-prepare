  - id: ccdv-p-1.q0035
    exams:
      CCDV-P: D5
    stem: |-
      You work as a senior software engineer at EchoPoint Media Works. The company runs a production pipeline that summarizes wire feeds, drafts program notes, and tags an archive of transcripts. Volume is high, editors sample outputs for quality, and the team measures cost and quality movements on live traffic rather than waiting for offline suites.

      Before a pipeline-wide rollout, you compare two summarization prompt variants on live traffic. Each variant runs against its own 400-trace sample drawn on different days, and the newer variant scores 1.6 points higher. Repeated scoring of an unchanged baseline shows a run-to-run spread of 2.4 points from grader variation and infrastructure noise.

      What should you conclude?
    options:
      - The run-to-run spread shows the grader is unreliable and both variant scores are meaningless.
      - Drawing the two samples on different days removes traffic bias and validates the comparison.
      - The 1.6-point gap sits inside the measured noise band and does not demonstrate a quality difference.
      - The newer variant improves summary quality and the pipeline-wide rollout can proceed.
    answer:
      - C
    explanation: |-
      **Chênh lệch nhỏ hơn mức dao động đo được giữa các lần chấm thì chưa chứng minh bản nào tốt hơn**

      > 💡 Gặp **chênh 1,6 trong khi baseline dao động 2,4** thì chọn **nằm trong mức nhiễu, chưa chứng minh gì**. Chênh lệch phải vượt mức dao động mới tính.

      **Đề hỏi gì.** Hai bản prompt tóm tắt được so trên lưu lượng thật, **mỗi bản một mẫu 400 trace lấy ở ngày khác nhau**, và bản mới cao hơn **1,6 điểm**. Chấm lại nhiều lần một baseline không đổi gì cho thấy **dao động 2,4 điểm** giữa các lần, do grader và nhiễu hạ tầng. Đề hỏi nên kết luận gì.

      **Vì sao đúng (C).** Ngay cả khi không đổi gì, điểm đã lệch tới 2,4 giữa các lần chấm. Mức chênh 1,6 điểm nằm trong khoảng dao động đó, nên chưa cho thấy bản mới thật sự tốt hơn. Muốn kết luận thì phải so trên cùng điều kiện, như cùng mẫu, cùng môi trường và chấm nhiều lần, rồi xem chênh lệch có vượt khỏi mức nhiễu không.

      **Vì sao sai**

      - A: Dao động giữa các lần chấm không làm cả hai điểm vô nghĩa. Nó cho biết chênh lệch phải lớn hơn bao nhiêu mới đáng tin, tức là thước để đọc kết quả.
      - B: Lấy hai mẫu ở hai ngày khác nhau không khử được thiên lệch mà còn thêm một khác biệt nữa: lưu lượng mỗi ngày mỗi khác. Chênh lệch có thể đến từ ngày lấy mẫu chứ không từ prompt.
      - D: Mức chênh 1,6 điểm nhỏ hơn mức dao động 2,4 điểm của chính baseline, nên chưa đủ căn cứ để triển khai cho cả pipeline.

      **Kiến thức liên quan.** Sai lệch do hạ tầng có thể lớn hơn bạn nghĩ. Trong thử nghiệm của Anthropic trên một benchmark coding, chỉ đổi cấu hình tài nguyên của container đã làm điểm chênh 6 điểm phần trăm. Vì vậy, khi hai bản chỉ chênh nhau vài điểm, bạn chỉ nên tin con số nếu hai lần chạy dùng cùng một môi trường.

      **Từ khoá**

      - C: gap sits inside the measured noise band
      - stem: run-to-run spread of 2.4 points
      - case: measures cost and quality movements on live traffic

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-1-thiet-ke-he-thong-eval#cham-agent-khi-moi-lan-chay-ra-ket-qua-khac-nhau`
