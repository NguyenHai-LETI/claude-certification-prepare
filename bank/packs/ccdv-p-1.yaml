  - id: ccdv-p-1.q0026
    exams:
      CCDV-P: D7
    stem: |-
      You are a platform engineer at Ironhaven Manufacturing. The company exposes maintenance manuals, parts inventory, and work-order tools to Claude agents through remote MCP servers used by plant engineering teams. Your team owns MCP deployment and authentication, tool catalog governance, agent identity, and the managed configuration that plant teams inherit. Changes must roll out to the fleet without breaking running integrations.

      Plant teams ask you to add human approval to the work-order tool catalog. The catalog exposes `read_inventory`, `update_work_order_notes`, `dispatch_field_crew`, and `purge_completed_orders`. Note edits keep full version history, and dispatch sends a crew to a site immediately. Purged orders cannot be restored. Engineers already complain about confirmation fatigue.

      What should you recommend?
    options:
      - An approval gate on the purge tool only, with dispatch reviewed in a weekly audit
      - Approval gates on the dispatch and purge tools, with note edits logged for later review
      - Approval gates on every tool that writes data
      - Approval gates on all four tools in the catalog
    answer:
      - B
    explanation: |-
      **Đặt approval gate theo hồ sơ rủi ro: chỉ chặn hành động không đảo ngược được, để người duyệt không bị hỏi quá nhiều**

      > 💡 Gặp **tool không khôi phục được hoặc tác động ngay lập tức** thì chọn **dispatch and purge tools**: chỉ gate hành động không đảo ngược được.

      **Đề hỏi gì.** Catalog có bốn tool: đọc tồn kho, sửa ghi chú lệnh công việc (**có lịch sử version đầy đủ**), điều đội hiện trường (**gửi đội tới ngay lập tức**), và xoá lệnh đã xong (**không khôi phục được**). Kỹ sư đã than bị hỏi xác nhận quá nhiều.

      **Vì sao đúng (B).** Câu hỏi quyết định là hành động nào không đảo ngược được. Ghi chú có lịch sử version, sửa sai thì khôi phục được, nên ghi log để rà sau là đủ. Điều đội hiện trường thì đội đã đi, xoá lệnh thì mất hẳn, nên hai tool này cần người duyệt trước khi chạy. Chỉ đặt gate ở hai chỗ đó thì người duyệt ít bị hỏi và có lý do để đọc kỹ từng lần.

      **Vì sao sai**

      - A: Duyệt riêng tool xoá thì bỏ sót tool điều đội. Rà điều đội trong buổi audit hằng tuần là biết sau khi đội đã tới công trường, không ngăn được lần điều sai.
      - C: Gate trên mọi tool ghi dữ liệu thì cả việc sửa ghi chú, vốn khôi phục được, cũng phải chờ duyệt. Kỹ sư vốn đã mệt vì bị hỏi nhiều sẽ càng bấm đồng ý mà không đọc.
      - D: Gate trên cả bốn tool, kể cả tool chỉ đọc tồn kho, làm số lần hỏi tăng mạnh nhất. Người duyệt bị hỏi càng nhiều thì càng ít đọc kỹ, nên gate mất tác dụng ở đúng hai tool nguy hiểm.

      **Kiến thức liên quan.** Với Claude Code, Anthropic cũng thấy người dùng bấm đồng ý khoảng 93% số lần được hỏi quyền, và càng bị hỏi nhiều thì càng ít đọc kỹ. Tức là hỏi người trước mọi lệnh không phải một lớp bảo vệ thật.

      **Từ khoá**

      - B: dispatch and purge tools
      - stem: Purged orders cannot be restored

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-1-guardrail-luc-chay#xep-lop-theo-ho-so-rui-ro`
