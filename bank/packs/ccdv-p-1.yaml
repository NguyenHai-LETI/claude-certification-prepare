  - id: ccdv-p-1.q0014
    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at Pinnacle Learning Institute. The institute runs a course tutor grounded in its published curriculum and technical library. The tutor must cite its sources and decline to answer questions outside the specified curriculum and technical library. Evaluation suites and calibrated LLM judges enforce a quality bar before any prompt or model change ships. Retrieval quality and judge reliability are your team's responsibility.

      During a month of prompt iteration, the golden set pass rate rose from 82 percent to 100 percent. In the same month, an engineer copied 12 golden set questions into the prompt as worked citation examples, leaking test items into the system under test. Production reports of wrong citations stayed flat across the month.

      What should you do?
    options:
      - Raise the release threshold to a perfect score on the existing golden set.
      - Recalibrate the judge model against fresh human labels before the next release ships.
      - Quarantine the copied questions and rebuild a held-out set from unseen queries.
      - Add 12 fresh questions to the set and keep the copied ones for continuity.
    answer:
      - C
    explanation: |-
      **Điểm eval tăng vì ca eval lọt vào prompt: cách ly ca đã lộ và dựng lại tập held-out**

      > 💡 Gặp **ca eval bị chép vào prompt** thì chọn **cách ly ca đã lộ, dựng lại tập held-out**.

      **Đề hỏi gì.** Trong một tháng sửa prompt, tỉ lệ đạt golden set tăng **từ 82% lên 100%**. Cùng tháng đó một kỹ sư **chép 12 câu golden set vào prompt** làm ví dụ trích dẫn, tức đưa ca kiểm tra vào chính hệ thống đang bị kiểm. Báo trích dẫn sai trên production **không giảm**. Đề hỏi nên làm gì.

      **Vì sao đúng (C).** Ca đã nằm trong prompt thì trợ lý trả lời đúng vì đã thấy đáp án, nên điểm 100% không còn đo khả năng với câu hỏi mới. Production không cải thiện là bằng chứng điểm tăng không thật. Cách ly 12 câu đã lộ khỏi phần chấm, rồi dựng lại một tập held-out từ những câu hỏi chưa ai dùng khi chỉnh prompt.

      **Vì sao sai**

      - A: Đòi điểm tuyệt đối trên bộ eval đã bị lộ chỉ siết một con số đang bị thổi phồng. Bản nào giữ 12 ví dụ đó cũng dễ đạt, nên cổng không chặn được gì.
      - B: Judge không phải chỗ hỏng. Điểm tăng vì ca kiểm tra nằm trong prompt, nên hiệu chỉnh lại judge vẫn chấm trên một bộ eval đã lộ.
      - D: Giữ 12 câu đã lộ trong bộ chấm thì điểm vẫn bị thổi phồng. Thêm 12 câu mới chỉ pha loãng chứ không gỡ được chỗ lộ.

      **Kiến thức liên quan.** Lộ đáp án (contamination) là khi ca trong bộ eval đã lọt vào chỗ trợ lý nhìn thấy được, nên trợ lý đạt vì đã thấy đáp án chứ không vì giỏi hơn. Ca đã lộ không còn đo được khả năng xử lý câu hỏi mới.

      **Từ khoá**

      - C: Quarantine the copied questions
      - stem: copied 12 golden set questions into the prompt

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-1-thiet-ke-he-thong-eval#giu-bo-eval-con-dung-theo-thoi-gian`
