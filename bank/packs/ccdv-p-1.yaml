      CCDV-P: D7
    stem: |-
      You are a senior software engineer at Horizon Crest Hospitality. The company operates a guest concierge agent across its properties in Lisbon, Osaka, and Vancouver, with property-level configuration and a shared platform team. The concierge answers property questions, coordinates requests with booking and housekeeping tools, and must stay within tight latency and cost budgets in every region.

      Compliance requires a complete audit trail of every booking and housekeeping tool call the concierge makes, attributed to the acting agent instance. A teammate proposes the organization administrative audit feed as the only record source.

      What should you recommend?
    options:
      - Enable the administrative audit feed for every workspace and treat it as the tool-call record
      - Reconstruct tool activity each day from the organization usage and cost reports
      - Log each tool call with the agent identity in the concierge platform audit pipeline
      - Extend the administrative feed retention window and query it for tool-call events
    answer:
      - C
    explanation: |-
      **Audit log từng lệnh gọi tool phải do chính hệ thống agent ghi, kèm danh tính agent; feed quản trị của tổ chức không ghi lệnh gọi tool**

      > 💡 Gặp **feed audit quản trị làm nguồn duy nhất** cho lệnh gọi tool thì chọn **Log each tool call with the agent identity**: lệnh gọi tool phải do platform tự ghi.

      **Đề hỏi gì.** Compliance cần **audit trail đầy đủ của mọi lệnh gọi tool** đặt phòng và buồng phòng, gắn với instance agent đã gọi. Một đồng đội đề xuất lấy **feed audit quản trị của tổ chức** làm nguồn duy nhất.

      **Vì sao đúng (C).** Feed audit quản trị của tổ chức ghi các hoạt động xác thực và quản trị, như đăng nhập, đổi khoá hay đổi quyền, chứ không ghi từng lệnh gọi tool mà agent thực hiện. Chỉ platform concierge mới biết instance nào gọi tool nào với tham số gì, nên nó phải tự ghi mỗi lệnh gọi kèm danh tính agent vào pipeline audit của mình. Đó là chỗ duy nhất có đủ chuỗi từ agent tới lệnh gọi tool.

      **Vì sao sai**

      - A: Bật feed quản trị ở mọi workspace thì có thêm bản ghi quản trị, nhưng feed đó vốn không chứa lệnh gọi tool, nên vẫn không có thứ compliance cần.
      - B: Báo cáo usage và chi phí chỉ có số token và tiền theo model, workspace hay API key. Từ đó không dựng lại được lệnh gọi tool nào, do instance nào.
      - D: Giữ feed lâu hơn không làm nó có thêm loại sự kiện mới. Truy vấn tìm event lệnh gọi tool trong feed quản trị sẽ không ra gì.

      **Kiến thức liên quan.** **Compliance API** là API để tra hoạt động của tổ chức phục vụ kiểm tra tuân thủ. Phần Activity Feed của nó ghi các hoạt động xác thực và quản trị trong tổ chức.

      **Từ khoá**

      - C: Log each tool call with the agent identity
      - stem: the organization administrative audit feed as the only record source

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-3-dinh-danh-bi-mat-va-audit#audit-log-cho-hanh-dong-cua-agent`
