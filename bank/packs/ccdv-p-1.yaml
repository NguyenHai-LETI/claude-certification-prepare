  - id: ccdv-p-1.q0061
    exams:
      CCDV-P: D6
    stem: |-
      You work as a site reliability engineer at BrightCart Retail. The company runs a storefront shopping assistant on the Claude API and a nightly batch pipeline that enriches the product catalog. Traffic peaks are sharp, latency targets are strict, and the integration layer must degrade gracefully when limits or failures occur. The assistant holds no payment or identity data; it works over the public catalog and order-status tools.

      Daily spend for the BrightCart Retail storefront assistant doubled the day after a prompt template change shipped. Request volume, output length, and shopper traffic stayed flat. The usage report shows cache read input tokens near zero and uncached input tokens at twice the earlier level.

      What is the most likely cause?
    options:
      - The template change placed dynamic session content before the stable prompt prefix.
      - Shoppers write longer messages after a recent storefront layout change.
      - A retry loop in the integration layer sends each shopper request twice.
      - The template change doubled the length of the static system prompt.
    answer:
      - A
    explanation: |-
      **Cache đọc tụt về 0 ngay sau khi đổi template: nội dung động đứng trước phần prefix cố định**

      > 💡 Gặp **cache read về 0 ngay sau khi đổi template, lưu lượng không đổi** thì chọn **placed dynamic session content before the stable prompt prefix**: phần đổi theo request phải nằm cuối.

      **Đề hỏi gì.** Chi phí **gấp đôi** ngay ngày sau khi đổi template prompt. Số request, độ dài output và lượng người mua **không đổi**. Usage cho thấy **cache read gần 0** và **token input không cache gấp đôi**. Đề hỏi nguyên nhân.

      **Vì sao đúng (A).** Cache chỉ dùng lại được phần đầu prompt giống từng byte với request trước. Khi template đưa nội dung đổi theo session lên trước phần cố định, mỗi request khác nhau ngay từ đầu, nên phần cố định phía sau không còn đọc được từ cache. Đúng như báo cáo usage: token đọc từ cache về gần 0, và cùng lượng token đó chuyển thành token input không cache, tính đủ giá.

      **Vì sao sai**

      - B: Người mua viết dài hơn thì token input tăng, nhưng cache read không tụt về 0, vì phần đầu prompt vẫn giống nhau. Đề cũng cho lượng người mua không đổi.
      - C: Retry gửi mỗi request hai lần thì số request phải tăng gấp đôi, trong khi đề cho số request không đổi. Request gửi lại cũng vẫn đọc được cache của lần đầu.
      - D: System prompt tĩnh dài gấp đôi vẫn là phần cố định, nên vẫn được cache và đọc lại. Khi đó cache read phải tăng chứ không tụt về gần 0.

      **Kiến thức liên quan.** Cache so prompt từng byte theo thứ tự `tools`, rồi `system`, rồi `messages`. Chỉ cần một byte khác, toàn bộ phần từ chỗ đó trở về sau sẽ không đọc được từ cache.

      **Từ khoá**

      - A: placed dynamic session content before the stable prompt prefix
      - stem: cache read input tokens near zero

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `6-1-chi-phi-quy-mo-lon#chien-luoc-cache-va-cache-diagnostics`
