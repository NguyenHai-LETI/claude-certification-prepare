  - id: ccdv-p-1.q0046
    exams:
      CCDV-P: D1
    stem: |-
      You are a platform engineer at VectorTrail Logistics. The company runs a multi-agent system that coordinates shipment planning across road, rail, and sea. A supervisor agent delegates route planning, customs paperwork, and exception handling to worker agents that call carrier and tracking tools. The system serves live operations in Rotterdam, Singapore, and Chicago, and long-running jobs must survive restarts and model upgrades.

      Last night the supervisor agent delegated a Rotterdam rerouting task to the exception-handling worker. The worker cannot resolve the port closure and returns the task to the supervisor unfinished. The supervisor delegated the same task again with an identical brief, and the cycle repeated until morning. The cycle consumed the token budget that VectorTrail Logistics reserves for all live shipment operations.

      What should you recommend?
    options:
      - Move all rerouting work into the supervisor agent and retire the exception-handling worker.
      - Cap delegation attempts for each task in the supervisor and escalate capped tasks to an operator.
      - Have the supervisor rewrite the brief before each re-delegation of a returned task.
      - Upgrade the exception-handling worker to the newest Opus-tier generation and delegate the task again.
    answer:
      - B
    explanation: |-
      **Supervisor giao đi giao lại một việc không giải được: giới hạn số lần giao và chuyển cho người**

      > 💡 Gặp **giao lại cùng một việc mãi không dừng** thì chọn **cap delegation attempts** rồi chuyển cho người: giới hạn đặt bằng cấu hình, không trông vào agent tự dừng.

      **Đề hỏi gì.** Worker xử lý ngoại lệ không giải được vụ đóng cảng ở Rotterdam và trả việc về. Supervisor **giao lại với đúng brief cũ**, vòng lặp chạy suốt đêm và **tiêu hết ngân sách token** dành cho mọi hoạt động vận chuyển đang chạy. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (B).** Vòng lặp xảy ra vì không có gì buộc supervisor dừng lại: việc bị trả về thì nó lại giao đi lần nữa. Đặt giới hạn số lần giao cho từng việc ngay trong supervisor là chặn bằng cấu hình, nên vòng lặp không thể kéo dài cả đêm nữa. Việc chạm giới hạn được chuyển cho người điều hành, vì vụ đóng cảng là chuyện agent đã cho thấy không tự giải được.

      **Vì sao sai**

      - A: Dồn hết việc đổi tuyến về supervisor không làm vụ đóng cảng dễ giải hơn. Supervisor vẫn có thể thử mãi mà không có gì bắt nó dừng, và còn mất worker chuyên xử lý ngoại lệ.
      - C: Viết lại brief có thể giúp được vài lần, nhưng nếu việc vẫn không giải được thì supervisor vẫn giao lại mãi, chỉ là với các brief khác nhau. Vẫn không có giới hạn nào chặn vòng lặp, và không ai được báo.
      - D: Model mạnh hơn không bảo đảm giải được vụ đóng cảng. Nếu vẫn không giải được, vòng lặp chạy tiếp, lần này với model đắt hơn nên ngân sách cạn còn nhanh hơn.

      **Kiến thức liên quan.** Tuy vậy, lời dặn trong prompt chỉ định hướng, còn tạo bao nhiêu subagent vẫn là Claude tự quyết. Muốn chắc thì **đặt giới hạn bằng cấu hình, không chỉ bằng prompt**.

      **Từ khoá**

      - B: Cap delegation attempts
      - stem: delegated the same task again with an identical brief

