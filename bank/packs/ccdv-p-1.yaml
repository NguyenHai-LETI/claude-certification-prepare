  - id: ccdv-p-1.q0067
    exams:
      CCDV-P: D7
    stem: |-
      You are a senior software engineer at DriveSphere Mobility. The company operates an owner-support agent that reads vehicle manuals, warranty documents, and inbound owner messages, and can open service tickets and send responses. Inbound content is untrusted, the agent holds tool access with real side effects, and your team owns its guardrail stack and adversarial testing.

      A single policy filter with one global threshold reviews every drafted ticket action and every drafted owner response before release. Monthly telemetry shows the filter blocked 130 legitimate ticket actions and passed four responses that quoted internal repair notes. A blocked ticket action is retried without loss. A sent response cannot be recalled.

      What should you conclude?
    options:
      - The filter needs one stricter global threshold that blocks more traffic on both channels.
      - The four passed responses show the filter model needs retraining before any threshold change.
      - A stronger system prompt on response drafting should replace the filter on the response channel.
      - The threshold should be set for each channel, strict for responses and loose for ticket actions.
    answer:
      - D
    explanation: |-
      **Tinh chỉnh chặn nhầm và lọt lưới theo từng loại hành động, không dùng một ngưỡng chung**

      > 💡 Gặp **hai kênh có cái giá của sai khác nhau mà dùng chung một ngưỡng** thì chọn **set for each channel**: kênh không thu hồi được thì đặt chặt.

      **Đề hỏi gì.** Một bộ lọc **một ngưỡng chung** cho cả hành động ticket lẫn câu trả lời. Tháng qua nó **chặn nhầm 130 hành động ticket** và **để lọt 4 câu trả lời** có ghi chú sửa chữa nội bộ. Ticket bị chặn thì **thử lại không mất gì**, còn câu trả lời đã gửi thì **không thu hồi được**.

      **Vì sao đúng (D).** Hai kênh có cái giá của sai khác nhau. Chặn nhầm hành động ticket chỉ tốn một lần thử lại, còn để lọt một câu trả lời thì ghi chú nội bộ đã tới tay chủ xe và không thu hồi được. Một ngưỡng chung buộc hai kênh dùng cùng một điểm cân bằng, nên vừa chặn nhầm 130 việc không cần chặn vừa để lọt bốn câu trả lời. Đặt ngưỡng riêng thì kênh trả lời chặt để ít lọt, kênh ticket lỏng để ít chặn nhầm.

      **Vì sao sai**

      - A: Ngưỡng chung chặt hơn có thể bớt lọt câu trả lời, nhưng sẽ chặn nhầm còn nhiều hơn 130 hành động ticket, trong khi ở kênh ticket chặn nhầm mới là vấn đề.
      - B: Đề không cho thấy model của bộ lọc hỏng. Bốn câu lọt và 130 lần chặn nhầm là hệ quả của việc dùng một ngưỡng cho hai kênh có rủi ro khác nhau, nên chỉnh ngưỡng theo kênh là việc làm trước.
      - C: System prompt chỉ là lời dặn, model sơ suất hay bị lừa thì vẫn làm trái được. Bỏ bộ lọc ở đúng kênh không thu hồi được là bỏ đi lớp chặn quan trọng nhất.

      **Kiến thức liên quan.** Bộ lọc nào cũng có hai tỉ lệ kéo ngược nhau. Một là chặn nhầm (**false positive**), khi việc hợp lệ bị chặn. Hai là lọt lưới (**false negative**), khi việc nguy hiểm được cho qua. Tinh chỉnh (**false-positive/false-negative tuning**) là chọn điểm cân bằng riêng cho từng loại hành động.

      **Từ khoá**

      - D: set for each channel
      - stem: one global threshold | A sent response cannot be recalled

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-1-guardrail-luc-chay#tinh-chinh-chan-nham-va-lot-luoi`
