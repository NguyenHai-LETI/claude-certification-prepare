  - id: ccdv-p-1.q0049
    exams:
      CCDV-P: D1
    stem: |-
      You are a platform engineer at VectorTrail Logistics. The company runs a multi-agent system that coordinates shipment planning across road, rail, and sea. A supervisor agent delegates route planning, customs paperwork, and exception handling to worker agents that call carrier and tracking tools. The system serves live operations in Rotterdam, Singapore, and Chicago, and long-running jobs must survive restarts and model upgrades.

      The orchestrator replaced a worker container mid-job, and the replacement container resumed the interrupted session with its full transcript. The first resumed model turn requested the carrier booking tool, and the harness reported an unknown tool, which stopped the job. The original container connected the carrier and tracking tool servers when its agent process started. You need resumed jobs to run with every tool their transcripts already use.

      What should you do?
    options:
      - Strip the recorded calls to carrier tools from the transcript before the replacement resumes it.
      - Persist the tool connections inside the session transcript alongside the recorded turns.
      - Configure the replacement container to connect the same tool servers before it resumes a session.
      - Append a turn that lists the unavailable tools and directs the model to continue without them.
    answer:
      - C
    explanation: |-
      **Resume session trên container mới: transcript không mang theo kết nối tool, container mới phải tự nối lại**

      > 💡 Gặp **resume đủ transcript mà báo unknown tool** thì chọn **nối lại đúng các tool server trước khi resume**: transcript chỉ chép hội thoại.

      **Đề hỏi gì.** Container thay thế resume session với **đủ transcript**, nhưng lượt đầu tiên gọi tool đặt chỗ của hãng vận chuyển thì harness báo **tool không tồn tại**. Container cũ **nối tới các tool server lúc process agent khởi động**. Cần để job được resume chạy được với mọi tool mà transcript đã dùng.

      **Vì sao đúng (C).** Transcript chỉ ghi lại các lượt hội thoại, kể cả các lần gọi tool, chứ không mang theo kết nối tới tool server. Kết nối đó do process agent mở lúc khởi động, nên container mới phải tự mở lại đúng các server ấy trước khi resume. Có vậy thì khi model gọi tiếp tool đặt chỗ như trong transcript, harness mới có tool để chạy.

      **Vì sao sai**

      - A: Xoá các lần gọi tool khỏi transcript làm mất lịch sử của job, model không còn biết mình đã đặt chỗ những gì. Nó cũng không làm tool có lại, nên lần sau model cần tool đặt chỗ thì vẫn lỗi.
      - B: Kết nối tool là thứ đang sống trong process, không phải dữ liệu để ghi vào transcript. Transcript có lưu thêm gì thì container mới vẫn phải tự nối tới tool server.
      - D: Bảo model làm tiếp mà không có tool là bỏ phần việc cần tool đặt chỗ. Đề yêu cầu job được resume chạy với mọi tool nó đã dùng, chứ không phải chạy thiếu tool.

      **Kiến thức liên quan.** Transcript chỉ ghi prompt, các lần gọi tool, kết quả tool và câu trả lời. MCP server, tức chương trình chạy riêng cung cấp thêm tool cho agent, thì được cấu hình trong option của `query()` hoặc trong file `.mcp.json` ở thư mục dự án, chứ không nằm trong transcript. Vì vậy khi resume trên host mới, bạn phải có lại đúng cấu hình MCP server đó.

      **Từ khoá**

      - C: connect the same tool servers
      - stem: connected the carrier and tracking tool servers when its agent process started
      - case: long-running jobs must survive restarts

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-2-chay-ben-va-luu-trang-thai#luu-session-va-resume-tren-host-khac`
