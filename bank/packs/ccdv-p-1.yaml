questions:
  - id: ccdv-p-1.q0001
    exams:
      CCDV-P: D2
    stem: |-
      You are a senior software engineer at Stonegate Development Partners. The firm processes construction contracts, permits, and inspection reports through an extraction service that feeds project dashboards. Throughput is bursty, accuracy is contractual, and the team runs online sampling and judge-based review to hold quality while controlling spend.

      After dashboards show a batch of wrong extracted values, the team measures each pipeline stage on the failing queries. Retrieval recall inside the passage window is 0.94, and a replay that feeds the correct passages straight to the model reproduces the wrong values in 78 of 90 cases.

      What should you conclude?
    options:
      - The chunking stage splits the answers across passage boundaries.
      - The embedding stage fails to return the correct passages.
      - The generation stage produces the wrong values from correct passages.
      - The reranking stage demotes the correct passages below the window.
    answer:
      - C
    explanation: |-
      **Khoanh lỗi theo tầng: đưa thẳng đoạn văn đúng cho model mà vẫn sai thì lỗi ở tầng sinh câu trả lời**

      > 💡 Gặp **đưa thẳng đoạn văn đúng mà vẫn sai** thì chọn **generation stage**: tầng tìm đã làm đủ phần việc của nó.

      **Đề hỏi gì.** Dashboard hiện một loạt giá trị trích sai. Đội đo từng tầng trên các truy vấn hỏng: **recall trong cửa sổ đoạn văn là 0,94**, và khi **đưa thẳng đoạn văn đúng cho model**, model vẫn trả giá trị sai ở **78 trên 90** ca. Đề hỏi nên kết luận gì.

      **Vì sao đúng (C).** Recall 0,94 nghĩa là gần như lúc nào đoạn đúng cũng đã nằm trong cửa sổ đưa cho model. Phép thử đưa thẳng đoạn đúng vào model bỏ qua hẳn chunk, embedding và rerank, mà model vẫn sai 78 trên 90 ca. Vậy lỗi nằm ở tầng sinh câu trả lời: model có đúng tài liệu nhưng trích ra giá trị sai.

      **Vì sao sai**

      - A: Nếu chunk cắt đôi câu trả lời thì đưa thẳng đoạn văn đúng cho model sẽ hết lỗi. Ở đây đưa thẳng đoạn đúng mà model vẫn sai, nên lỗi không nằm ở cách chia chunk.
      - B: Recall 0,94 cho thấy bước tìm đã lấy về đoạn đúng gần như mọi lần, nên embedding không phải chỗ hỏng.
      - D: Rerank đẩy đoạn đúng xuống dưới cửa sổ thì recall trong cửa sổ đã thấp. Đề cho recall trong cửa sổ là 0,94, tức đoạn đúng vẫn nằm trong cửa sổ.

      **Kiến thức liên quan.** Muốn biết lỗi nằm ở đâu thì chẩn đoán theo từng tầng. Bạn đo riêng xem bước tìm có lấy được chunk đúng không, và đo riêng xem câu trả lời cuối có đúng không.

      **Từ khoá**

      - C: generation stage
      - stem: feeds the correct passages straight to the model

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-4-truy-xuat-va-grounding#chan-doan-theo-tung-tang-truoc-khi-sua`
