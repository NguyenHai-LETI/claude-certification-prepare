  - id: ccdv-p-1.q0051
    exams:
      CCDV-P: D2
    stem: |-
      You are a platform engineer at VectorTrail Logistics. The company runs a multi-agent system that coordinates shipment planning across road, rail, and sea. A supervisor agent delegates route planning, customs paperwork, and exception handling to worker agents that call carrier and tracking tools. The system serves live operations in Rotterdam, Singapore, and Chicago, and long-running jobs must survive restarts and model upgrades.

      The supervisor agent rejected three route plans because each plan failed JSON parsing. The delegation trace shows the route planning worker agent produced each plan in one turn. Each recorded worker response ends in the middle of an array. The trace records the same output token count for all three turns. The three requests cover routes with different numbers of stops.

      What is the most likely cause?
    options:
      - The supervisor agent dropped the end of each plan while reading the delegation result.
      - The carrier tool returned malformed data that corrupted each plan.
      - The configured output token ceiling is below the length of a complete route plan.
      - The route planning worker agent generated invalid array syntax in each plan.
    answer:
      - C
    explanation: |-
      **Ba output cùng dừng ở một số token: output chạm trần `max_tokens`**

      > 💡 Gặp **cùng một số token output, dừng giữa chừng** thì chọn **output token ceiling**: response đã chạm `max_tokens`.

      **Đề hỏi gì.** Supervisor bác ba kế hoạch tuyến vì không parse được JSON. Mỗi response của worker **dừng giữa một mảng**, và **cả ba lượt có cùng số token output** dù các tuyến có số điểm dừng khác nhau. Đề hỏi nguyên nhân nhiều khả năng nhất.

      **Vì sao đúng (C).** Ba kế hoạch dài ngắn khác nhau mà output dừng ở cùng một số token, lại dừng giữa một mảng. Con số trùng khít đó là dấu hiệu chạm trần token output đã cấu hình (`max_tokens`): model bị cắt khi viết tới trần chứ không tự kết thúc. Response kiểu này có `stop_reason` là `max_tokens`, và gửi lại y nguyên thì sẽ cụt ở chỗ cũ.

      **Vì sao sai**

      - A: Trace ghi lại response của worker, và chính response đó đã dừng giữa mảng. Vậy kế hoạch bị cụt ngay từ lúc worker viết ra, không phải lúc supervisor đọc.
      - B: Dữ liệu tool hỏng sẽ làm nội dung sai ở những chỗ khác nhau. Nó không giải thích được vì sao ba response dừng ở cùng một số token.
      - D: Nếu model viết sai cú pháp thì lỗi rơi vào chỗ bất kỳ, không phải lần nào cũng đúng một số token. Ở đây mảng không sai cú pháp mà bị cắt giữa chừng.

      **Kiến thức liên quan.** **`stop_reason`** là field trong response HTTP 200, cho biết vì sao model dừng viết. Lúc này request đã thành công về mặt HTTP, nhưng phải đọc field này mới biết câu trả lời dùng được hay không, có khi câu trả lời còn rỗng.

      **Từ khoá**

      - C: output token ceiling
      - stem: same output token count for all three turns

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-1-do-tin-cay-dich-vu-claude#phan-loai-truoc-khi-xu-ly`
