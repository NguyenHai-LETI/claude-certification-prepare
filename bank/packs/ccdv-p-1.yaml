  - id: ccdv-p-1.q0002
    exams:
      CCDV-P: D2
    stem: |-
      You are a senior software engineer at Stonegate Development Partners. The firm processes construction contracts, permits, and inspection reports through an extraction service that feeds project dashboards. Throughput is bursty, accuracy is contractual, and the team runs online sampling and judge-based review to hold quality while controlling spend.

      When a large contract packet arrives, the ingestion service fans out one extraction request for each document at unbounded concurrency. The first seconds of each burst succeed, then rate limit errors climb until the burst drains. Averaged across the day, utilization sits at 40 percent of every organization limit.

      What should you do?
    options:
      - Add a bounded queue that releases requests at the sustained refill rate of the limits.
      - Retry failed documents with jittered exponential backoff until each burst clears.
      - Shorten each document prompt and lower the token draw of a burst.
      - Request a tier increase sized to the peak concurrency of the largest packet.
    answer:
      - A
    explanation: |-
      **Lỗi rate limit chỉ xảy ra trong từng đợt dồn: xếp hàng đợi có giới hạn để giãn request ra**

      > 💡 Gặp **trung bình còn dư mà đợt dồn vẫn bị 429** thì chọn **bounded queue**: giãn tải ra chứ đừng xin thêm hạn mức hay retry.

      **Đề hỏi gì.** Mỗi bộ hồ sơ hợp đồng lớn làm dịch vụ bắn ra **mỗi tài liệu một request, không giới hạn số request chạy cùng lúc**. Vài giây đầu chạy được, sau đó lỗi rate limit tăng dần cho tới khi hết đợt, trong khi **tính trung bình cả ngày mới dùng 40%** mọi giới hạn của tổ chức. Đề hỏi nên làm gì.

      **Vì sao đúng (A).** Dùng trung bình 40% nghĩa là hạn mức cả ngày còn dư, cái hỏng là cả đợt request đổ vào cùng lúc. Rate limit đếm theo kiểu token bucket, hạn mức được đổ lại dần dần, nên một đợt dồn trong vài giây vẫn bị 429 dù tổng cả phút chưa vượt. Hàng đợi có giới hạn, nhả request theo đúng tốc độ hạn mức được đổ lại, làm đợt dồn giãn ra cho vừa với giới hạn, và không request nào phải chịu lỗi rồi gửi lại.

      **Vì sao sai**

      - B: Retry có jitter giúp các client không gửi lại cùng một lúc, nhưng request vẫn đổ vào không giới hạn. Mỗi đợt vẫn đâm vào giới hạn, còn các lần gửi lại chỉ cộng thêm tải đúng lúc API đang báo chậm lại.
      - C: Rút ngắn prompt làm mỗi request nhẹ hơn một chút, nhưng số request bắn ra cùng lúc vẫn không giới hạn. Đợt dồn vẫn vượt giới hạn, nhất là giới hạn số request mỗi phút, vốn không phụ thuộc độ dài prompt.
      - D: Cả ngày mới dùng 40% hạn mức, nên xin tier cao hơn theo đỉnh của bộ hồ sơ lớn nhất là trả tiền cho hạn mức gần như bỏ không. Bộ hồ sơ lớn hơn lần sau vẫn vượt, vì request vẫn không bị giới hạn số chạy cùng lúc.

      **Kiến thức liên quan.** Cache giúp tăng thông lượng, nhưng chưa giải quyết được chuyện việc không gấp chen vào việc gấp. Để làm việc đó cần hàng đợi (**queueing**) và **backpressure**, tức khi phía sau đã quá tải thì phía trước phải chậm lại hoặc từ chối, thay vì đẩy thêm việc. Claude API không có sẵn hàng đợi.

      **Từ khoá**

      - A: bounded queue
      - stem: Averaged across the day, utilization sits at 40 percent
      - case: Throughput is bursty

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-2-quy-mo-va-thong-luong#hang-doi-va-backpressure`
