  - id: ccdv-p-1.q0016
    exams:
      CCDV-P: D2
    stem: |-
      You are a senior software engineer at Pinnacle Learning Institute. The institute runs a course tutor grounded in its published curriculum and technical library. The tutor must cite its sources and decline to answer questions outside the specified curriculum and technical library. Evaluation suites and calibrated LLM judges enforce a quality bar before any prompt or model change ships. Retrieval quality and judge reliability are your team's responsibility.

      Quality sampling shows the tutor answers fluently from model knowledge when retrieval returns no relevant passage. Students cannot distinguish these ungrounded answers from grounded ones.

      What should you do?
    options:
      - Lower the sampling temperature when retrieval scores are weak.
      - Add a system-prompt instruction that forbids answering without sources.
      - Enable structured citations and decline questions that no retrieved passage supports.
      - Fine-tune the model to refuse questions outside the curriculum.
    answer:
      - C
    explanation: |-
      **Trả lời không có căn cứ trông giống trả lời có căn cứ: bật citations và từ chối khi không đoạn nào làm căn cứ**

      > 💡 Gặp **học viên không phân biệt được câu có căn cứ** thì chọn **structured citations kèm từ chối khi không có đoạn làm căn cứ**.

      **Đề hỏi gì.** Khi bước truy xuất không lấy được đoạn liên quan, trợ lý vẫn **trả lời trôi chảy từ kiến thức của model**, và học viên **không phân biệt được** câu trả lời này với câu có căn cứ. Đề hỏi nên làm gì.

      **Vì sao đúng (C).** Cần hai thứ cùng lúc. Citations gắn vào mỗi nhận định một đoạn trích nguyên văn từ tài liệu, nên học viên thấy ngay câu nào có nguồn. Còn khi không đoạn nào làm căn cứ cho câu trả lời, trợ lý phải nói là không đủ thông tin thay vì tự viết ra. Cách này cũng khớp với yêu cầu của học viện là phải dẫn nguồn và từ chối câu ngoài tài liệu.

      **Vì sao sai**

      - A: Giảm temperature chỉ làm câu trả lời bớt ngẫu nhiên, không làm nó bám vào tài liệu. Câu trả lời từ kiến thức của model vẫn trôi chảy và vẫn không có nguồn.
      - B: Một câu cấm trong system prompt giúp giảm phần nào, nhưng không cho học viên thấy câu nào có nguồn câu nào không. Model vẫn có thể trả lời không căn cứ, và không ai nhận ra.
      - D: Fine-tune để từ chối câu ngoài chương trình không giải quyết câu trong chương trình mà truy xuất hụt. Học viên vẫn không có trích dẫn để phân biệt câu có căn cứ.

      **Kiến thức liên quan.** Grounding là những cách buộc câu trả lời bám vào tài liệu thay vì để Claude tự nghĩ ra. Có ba việc cần làm, là kèm trích dẫn nguồn cho mỗi nhận định (**source citation**), nói rõ khi tài liệu không đủ để trả lời (**uncertainty declaration**), và có tín hiệu cho biết câu trả lời đáng tin tới đâu (**confidence signals**).

      **Từ khoá**

      - C: structured citations
      - stem: cannot distinguish these ungrounded answers from grounded ones
      - case: must cite its sources

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-4-truy-xuat-va-grounding#grounding-buoc-cau-tra-loi-bam-vao-tai-lieu`
