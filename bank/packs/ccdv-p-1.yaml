    exams:
      CCDV-P: D7
    stem: |-
      You are a senior software engineer at DriveSphere Mobility. The company operates an owner-support agent that reads vehicle manuals, warranty documents, and inbound owner messages, and can open service tickets and send responses. Inbound content is untrusted, the agent holds tool access with real side effects, and your team owns its guardrail stack and adversarial testing.

      An adversarial test embedded an instruction in an owner message, and the agent quoted warranty records back to the sender. The team plans a split design. A reading component ingests untrusted messages and holds no tools. A tool-holding component receives only a structured summary with fixed fields validated against enumerations and length limits, and never reads raw messages. Leadership asks which property of the split closes the demonstrated exploit path.

      What should you conclude?
    options:
      - Injected instructions no longer share context with a component that can invoke tools.
      - The reading component now detects and removes each injected instruction.
      - Injected text no longer enters any model context in the pipeline.
      - The structured summary can no longer carry attacker-influenced content.
    answer:
      - A
    explanation: |-
      **Tách việc đọc khỏi việc làm: chỉ dẫn độc không còn nằm chung context với thành phần có tool**

      > 💡 Gặp **thành phần đọc không có tool, thành phần có tool không đọc tin gốc** thì chọn **no longer share context with a component that can invoke tools**.

      **Đề hỏi gì.** Agent bị lừa trích hồ sơ bảo hành gửi cho kẻ tấn công. Thiết kế mới: **thành phần đọc không có tool**, **thành phần có tool chỉ nhận bản tóm tắt** gồm các **trường cố định kiểm theo enum và độ dài**, không đọc tin nhắn gốc. Đề hỏi tính chất nào đóng được đường khai thác.

      **Vì sao đúng (A).** Đường khai thác cần chỉ dẫn độc nằm cùng context với một thành phần có tool gửi dữ liệu. Sau khi tách, thành phần đọc vẫn có thể bị lừa nhưng không có tool nào để làm theo. Thành phần có tool chỉ nhận vài trường cố định đã kiểm theo enum và độ dài, nên một đoạn chỉ dẫn tự do không lọt sang được. Thiết kế này không cần model phát hiện được injection, nó chặn bằng cấu trúc.

      **Vì sao sai**

      - B: Thiết kế không yêu cầu thành phần đọc phát hiện hay gỡ chỉ dẫn. Thành phần đọc vẫn có thể bị lừa, chỉ là nó không có tool nào để làm theo chỉ dẫn đó.
      - C: Chữ độc vẫn đi vào context của thành phần đọc, vì thành phần này đọc chính tin nhắn gốc. Đường khai thác đóng lại vì thành phần đó không có tool, chứ không phải vì chữ độc biến mất.
      - D: Kẻ tấn công vẫn có thể ảnh hưởng tới giá trị trong các trường, ví dụ khiến thành phần đọc chọn một giá trị khác trong enum. Thứ thiết kế chặn được là chỉ dẫn tự do, vì trường cố định đã kiểm enum và độ dài không chở được một câu lệnh.

      **Kiến thức liên quan.** **Tách việc đọc khỏi việc làm.** Agent đọc CV không có tool gửi email. Nó chỉ trả về vài field cố định như tên, kỹ năng và số năm kinh nghiệm, rồi một agent khác nhận các field đó và mới là agent được gửi email. Dòng chữ ẩn vì vậy không đi tới được agent có quyền gửi.

      **Từ khoá**

      - A: share context with a component that can invoke tools
      - stem: holds no tools | never reads raw messages
      - case: the agent holds tool access with real side effects

