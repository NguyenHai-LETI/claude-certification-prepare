    exams:
      CCDV-P: D2
    stem: |-
      You are a senior software engineer at Stonegate Development Partners. The firm processes construction contracts, permits, and inspection reports through an extraction service that feeds project dashboards. Throughput is bursty, accuracy is contractual, and the team runs online sampling and judge-based review to hold quality while controlling spend.

      Reviewers report that lookups quoting a permit number or a clause code return unrelated passages, while natural-language questions about the same documents succeed. The index retrieves through embeddings alone.

      What should you do?
    options:
      - Expand each lookup with generated paraphrases before embedding it.
      - Fine-tune the embedding model on the firm's contract documents.
      - Shrink chunks until each identifier occupies its own chunk.
      - Combine embedding retrieval with BM25 lexical matching and merge the ranked lists.
    answer:
      - D
    explanation: |-
      **Embedding kém với chuỗi phải khớp từng ký tự: thêm BM25 rồi gộp hai danh sách (hybrid search)**

      > 💡 Gặp **mã, số hiệu phải khớp đúng ký tự** thì chọn **BM25 cộng embedding (hybrid search)**.

      **Đề hỏi gì.** Câu tra cứu có **số giấy phép hay mã điều khoản** thì nhận về đoạn không liên quan, còn câu hỏi bằng lời thường về cùng tài liệu thì tìm đúng. Index hiện **chỉ tìm bằng embedding**. Đề hỏi nên làm gì.

      **Vì sao đúng (D).** Embedding giỏi nhận ra hai câu cùng nghĩa, nhưng một mã như số giấy phép không có "nghĩa" gì để so, nó phải khớp đúng từng ký tự. BM25 tìm theo từ khoá nên thấy ngay đoạn có đúng chuỗi đó. Chạy cả hai cách tìm rồi gộp hai danh sách xếp hạng (hybrid search) giữ được cả câu hỏi bằng lời lẫn câu tra mã.

      **Vì sao sai**

      - A: Sinh thêm câu diễn đạt lại rồi đem embed vẫn là tìm theo nghĩa. Một mã như số giấy phép không có cách diễn đạt khác, nên vẫn không khớp được đoạn chứa đúng mã đó.
      - B: Fine-tune model embedding trên hợp đồng của công ty tốn công mà vẫn không làm embedding giỏi khớp từng ký tự. Vấn đề nằm ở kiểu tìm, không ở dữ liệu huấn luyện.
      - C: Cắt chunk nhỏ tới mức mỗi mã một chunk làm mất hết ngữ cảnh quanh mã, mà embedding của chunk vẫn không khớp đúng chuỗi ký tự trong câu tra.

      **Kiến thức liên quan.** Embedding giỏi nhận ra hai câu cùng nghĩa dù viết khác chữ, nhưng kém với những chuỗi phải trùng từng ký tự như mã phụ tùng. **BM25** thì tìm theo từ khoá, nên thấy ngay chunk có đúng chuỗi "7716-203". Tìm kết hợp (**hybrid search**) chạy cả tìm bằng embedding lẫn BM25, rồi gộp hai danh sách kết quả và bỏ chunk trùng.

      **Từ khoá**

      - D: BM25 lexical matching
      - stem: quoting a permit number or a clause code

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-4-truy-xuat-va-grounding#hybrid-search-va-rerank`
