  - id: ccdv-p-1.q0064
    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at DriveSphere Mobility. The company operates an owner-support agent that reads vehicle manuals, warranty documents, and inbound owner messages, and can open service tickets and send responses. Inbound content is untrusted, the agent holds tool access with real side effects, and your team owns its guardrail stack and adversarial testing.

      The team grades a sample of individual agent messages for helpfulness, and the average grade held steady all quarter. In the same quarter re-opened service tickets rose 40 percent. You need a live metric that moves when the agent fails to resolve owner issues.

      Which metric should you use?
    options:
      - A word-overlap score between agent replies and approved response templates
      - A message-level helpfulness grade averaged across all sampled conversations
      - A conversation-level grade of issue resolution without a re-opened ticket
      - A retrieval precision score over the manual passages the agent cites
    answer:
      - C
    explanation: |-
      **Đo agent bằng kết quả của cả hội thoại, không bằng điểm từng tin nhắn**

      > 💡 Gặp **điểm từng tin nhắn đứng yên mà ticket mở lại tăng** thì chọn **conversation-level grade of issue resolution**: agent đo bằng việc có xong không.

      **Đề hỏi gì.** Điểm hữu ích **từng tin nhắn** giữ đều cả quý, nhưng **ticket mở lại tăng 40%**. Cần một chỉ số trên production **thay đổi khi agent không giải quyết được vấn đề** của chủ xe.

      **Vì sao đúng (C).** Agent được đánh giá bằng kết quả của cả việc, không phải bằng từng câu nói hay. Mỗi tin nhắn có thể lịch sự, hữu ích, mà vấn đề của chủ xe vẫn không xong, nên ticket bị mở lại. Chấm theo cả hội thoại xem vấn đề có được giải quyết không, và đối chiếu với việc ticket không bị mở lại, là chỉ số đi cùng chiều với thứ đội đang lo.

      **Vì sao sai**

      - A: Điểm trùng từ với mẫu trả lời chỉ đo câu chữ có giống mẫu không. Trả lời đúng mẫu mà vấn đề không xong thì điểm vẫn cao.
      - B: Đây chính là chỉ số đang dùng: điểm hữu ích từng tin nhắn đứng yên cả quý trong khi ticket mở lại tăng 40%. Lấy trung bình trên nhiều hội thoại hơn cũng không làm nó đo được việc có xong hay không.
      - D: Precision truy xuất chỉ đo các đoạn sách hướng dẫn được trích có đúng không. Agent có thể trích đúng tài liệu mà vẫn không giải quyết xong vấn đề của chủ xe.

      **Kiến thức liên quan.** Trên production thì không có đáp án để so, nên mỗi loại việc phải dựa vào tín hiệu riêng mà hệ thống tự thu được. Với agent, câu "Đã tạo phiếu đổi trả cho bạn" ở cuối hội thoại chưa phải kết quả. Kết quả là phiếu có trong hệ thống, đúng đơn và đúng lý do.

      **Từ khoá**

      - C: conversation-level grade of issue resolution
      - stem: re-opened service tickets rose 40 percent | average grade held steady

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-3-do-chat-luong-tren-production#chon-chi-so-theo-loai-viec`
