  - id: ccdv-p-1.q0062
    exams:
      CCDV-P: D6
    stem: |-
      You work as a site reliability engineer at BrightCart Retail. The company runs a storefront shopping assistant on the Claude API and a nightly batch pipeline that enriches the product catalog. Traffic peaks are sharp, latency targets are strict, and the integration layer must degrade gracefully when limits or failures occur. The assistant holds no payment or identity data; it works over the public catalog and order-status tools.

      Storefront traffic arrives in sharp evening peaks with quiet gaps between them. Dashboards show time to first token near four seconds for the first requests of each peak, then near 400 milliseconds for the remainder. Cache read counts start each peak at zero and climb within the first minute. The prompt prefix is stable and the breakpoint position stays fixed across the day.

      What should you conclude?
    options:
      - The cached prefix expires during the quiet gaps between peaks.
      - The storefront route needs a faster model tier during peaks.
      - Peak concurrency exceeds a rate limit and slows the first requests.
      - The breakpoint sits ahead of volatile content and never produces a cache write.
    answer:
      - A
    explanation: |-
      **TTFT cao chỉ ở đầu mỗi đỉnh, cache read bắt đầu từ 0: cache hết hạn trong khoảng vắng**

      > 💡 Gặp **chậm ở đầu mỗi đỉnh sau khoảng vắng, prefix và breakpoint không đổi** thì chọn **expires during the quiet gaps**: TTL mặc định của cache chỉ 5 phút.

      **Đề hỏi gì.** Lưu lượng đến theo **đỉnh gắt xen khoảng vắng**. Các request **đầu mỗi đỉnh** có TTFT gần **4 giây**, phần còn lại gần **400 mili giây**. Cache read **bắt đầu mỗi đỉnh ở 0** rồi tăng trong phút đầu. Prefix và breakpoint đều cố định. Đề hỏi kết luận.

      **Vì sao đúng (A).** Theo mặc định, cache chỉ sống 5 phút và được làm mới mỗi lần có request đọc nó. Trong một đỉnh, request đến liên tục nên cache luôn còn, TTFT chỉ khoảng 400 mili giây. Qua một khoảng vắng dài hơn thời gian sống đó, cache hết hạn, nên các request đầu của đỉnh sau phải tính lại cả prefix, TTFT lên gần bốn giây, và cache read bắt đầu lại từ 0 cho tới khi prefix được ghi lại vào cache.

      **Vì sao sai**

      - B: Model nhanh hơn không giải thích được vì sao chỉ các request đầu mỗi đỉnh chậm, còn phần sau của đỉnh đã nhanh. Chỗ khác nhau giữa hai nhóm request là có đọc được cache hay không.
      - C: Vượt rate limit thì request bị trả 429, không phải chậm rồi tự nhanh lại. Nếu do rate limit, phần giữa đỉnh đông nhất phải tệ nhất, chứ không phải nhanh hơn đầu đỉnh.
      - D: Nếu breakpoint không bao giờ ghi được cache thì cache read phải luôn là 0. Đề cho cache read tăng lên trong phút đầu mỗi đỉnh, tức cache vẫn được ghi và đọc.

      **Kiến thức liên quan.** Prompt caching lưu kết quả prefill của phần đầu prompt. Request sau có cùng phần đầu thì đọc lại thay vì tính lại, nên với prompt dài TTFT giảm rõ, ngoài chuyện rẻ hơn. Theo mặc định, cache chỉ sống 5 phút (gọi là TTL), tính từ lúc request bắt đầu.

      **Từ khoá**

      - A: expires during the quiet gaps
      - stem: quiet gaps between them | Cache read counts start each peak at zero
      - case: Traffic peaks are sharp

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `6-2-toi-uu-do-tre#dung-cache-de-prompt-dai-co-chu-dau-tien-som-hon`
