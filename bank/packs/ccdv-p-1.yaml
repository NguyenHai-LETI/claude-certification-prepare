  - id: ccdv-p-1.q0010
    exams:
      CCDV-P: D1
    stem: |-
      You work as a platform engineer at HarvestPeak Foods. The company runs scheduled agents that reconcile supplier quality reports, watch production telemetry, and file exception summaries before each shift. Runs are unattended, must fail safe, and escalate to a human when evidence is ambiguous. Long reconciliations checkpoint so that a restart never repeats a completed posting.

      The reconciliation agent runs as a loop of model turns and tool calls, and a host restart can stop the loop at any point. A resumed run must continue with its full history and must never repeat a completed posting.

      Which persistence design should you use?
    options:
      - The final assistant message of each cycle, with earlier tool calls re-run to rebuild results
      - The completed postings list alone, with the conversation restarted from the system prompt
      - Each turn's tool request logged before the call runs and its result after, in a durable log
      - The session identifier alone, with the conversation recalled from the model's memory on resume
    answer:
      - C
    explanation: |-
      **Resume vòng lặp agent không ghi lặp: log yêu cầu tool trước khi gọi và kết quả sau khi gọi vào nơi lưu bền**

      > 💡 Gặp **bị cắt ở bất kỳ chỗ nào mà không được ghi lặp** thì chọn **log yêu cầu tool trước khi gọi, log kết quả sau khi gọi**.

      **Đề hỏi gì.** Agent đối soát chạy thành vòng lặp lượt model và lượt gọi tool, và **host khởi động lại có thể cắt vòng lặp ở bất kỳ chỗ nào**. Lượt chạy được resume phải **giữ đủ lịch sử** và **không bao giờ ghi lại một bút toán đã ghi**. Đề hỏi nên lưu trạng thái theo thiết kế nào.

      **Vì sao đúng (C).** Bị cắt ở bất kỳ chỗ nào thì chỗ khó nhất là lúc một lần gọi tool đang chạy dở: không biết nó đã xong hay chưa. Ghi yêu cầu tool vào log bền trước khi gọi, và ghi kết quả ngay sau khi gọi xong, thì lúc resume nhìn log là biết lần gọi nào đã có kết quả, lần nào còn treo cần kiểm lại. Log có từng lượt nên cũng giữ được đủ lịch sử hội thoại.

      **Vì sao sai**

      - A: Chỉ lưu message cuối của mỗi vòng rồi chạy lại các lần gọi tool trước để dựng lại kết quả là đúng cách làm ghi lặp bút toán, vì lần gọi ghi bút toán sẽ chạy thêm lần nữa.
      - B: Danh sách bút toán đã ghi tránh được ghi lặp, nhưng khởi động lại hội thoại từ system prompt là mất hết lịch sử, trái với yêu cầu giữ đủ lịch sử.
      - D: Model không nhớ gì giữa các request. Chỉ giữ session ID mà không lưu transcript thì không có gì để nạp lại, lịch sử mất sạch.

      **Kiến thức liên quan.** Tool có side effect (làm thay đổi thứ gì đó bên ngoài) nên idempotent, nghĩa là gọi hai lần cũng cho kết quả như gọi một lần; đây là cách làm phổ biến chứ không phải tính năng có sẵn. Lý do là khi bị ngắt, bạn không biết lần gọi cuối đã chạy xong chưa.

      **Từ khoá**

      - C: logged before the call runs and its result after
      - stem: a host restart can stop the loop at any point

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `1-2-chay-ben-va-luu-trang-thai#checkpoint-de-agent-o-session-moi-biet-viec-da-toi-dau`
