  - id: ccdv-p-1.q0068
    exams:
      CCDV-P: D3
    stem: |-
      You are a senior software engineer at DriveSphere Mobility. The company operates an owner-support agent that reads vehicle manuals, warranty documents, and inbound owner messages, and can open service tickets and send responses. Inbound content is untrusted, the agent holds tool access with real side effects, and your team owns its guardrail stack and adversarial testing.

      DriveSphere Mobility signed a zero-data-retention agreement with the model provider, and the public privacy notice tells owners that support messages are not stored. A platform engineer then enabled full message capture on the agent spans, and owner messages now sit in the trace backend for 90 days. A privacy review asks whether the deployment honors the notice.

      What should you conclude?
    options:
      - The agreement limits retention at the provider only, and the span capture breaks the notice on the company side.
      - Span content counts as derived telemetry rather than stored messages, so the notice stays honored as written.
      - The agreement extends to downstream telemetry stores, and the trace backend inherits the zero-retention guarantee.
      - The capture stays acceptable while trace access remains restricted to the on-call group and its managers.
    answer:
      - A
    explanation: |-
      **ZDR chỉ ràng buộc nhà cung cấp; nội dung ghi vào trace của chính công ty vẫn là dữ liệu bị lưu**

      > 💡 Gặp **ZDR với nhà cung cấp cộng ghi nội dung vào trace của mình** thì chọn **limits retention at the provider only**: ZDR không đi theo dữ liệu về hệ thống của bạn.

      **Đề hỏi gì.** Công ty có **ZDR với nhà cung cấp model** và thông báo **tin nhắn hỗ trợ không được lưu**. Một kỹ sư bật **ghi toàn bộ nội dung** trên span, nên tin nhắn chủ xe nằm trong **trace backend 90 ngày**. Đề hỏi hệ thống còn đúng với thông báo không.

      **Vì sao đúng (A).** ZDR là cam kết của nhà cung cấp model: họ không giữ dữ liệu sau khi trả response. Nó không ràng buộc những gì chính công ty ghi lại. Khi span chứa toàn bộ tin nhắn và trace backend giữ 90 ngày, tin nhắn của chủ xe đang được lưu ngay trong hệ thống của công ty, trái với câu "tin nhắn hỗ trợ không được lưu" trong thông báo.

      **Vì sao sai**

      - B: Gọi là telemetry thì nội dung vẫn là nguyên văn tin nhắn của chủ xe, nằm trong backend 90 ngày. Thông báo hứa không lưu tin nhắn, không phân biệt lưu ở đâu hay dưới tên gì.
      - C: ZDR chỉ ràng buộc nhà cung cấp. Span đi từ ứng dụng tới backend của công ty, nằm ngoài thoả thuận, nên trace backend không được hưởng cam kết nào.
      - D: Giới hạn người xem chỉ bớt số người đọc được, tin nhắn vẫn bị lưu 90 ngày. Thông báo hứa không lưu, chứ không hứa ít người xem.

      **Kiến thức liên quan.** ZDR chỉ nói về việc Anthropic lưu dữ liệu. Giao xong, dữ liệu nằm ở nền tảng của bạn, theo quyền truy cập và thời hạn lưu của nền tảng đó.

      **Từ khoá**

      - A: limits retention at the provider only
      - stem: owner messages now sit in the trace backend for 90 days

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `3-1-telemetry-va-instrumentation#ghi-noi-dung-hay-chi-metadata-khi-co-zdr`
