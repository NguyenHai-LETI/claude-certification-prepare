  - id: ccdv-p-1.q0041
    exams:
      CCDV-P: D6
    stem: |-
      You are a senior software engineer at Meridian Advisory Group. The firm operates a research copilot that runs multi-hour analysis jobs over public market and industry sources. Agents search, read, and synthesize documents, accumulate working notes, and produce cited briefs for consultants. Jobs run long enough to hit context limits, and the team is accountable for cost, accuracy, and citation quality.

      Copilot jobs at Meridian Advisory Group call the model in sequence, and each call depends on the previous tool result. Agents read retrieved sources between calls for stretches that outlast the default cache lifetime. Job telemetry shows the 40,000-token instruction and tool prefix is written to cache 11 times in a typical job and read twice. Cache creation tokens account for 62 percent of job spend.

      What should you do?
    options:
      - Add a cache breakpoint after each tool result inside the job context.
      - Request the extended cache lifetime for the instruction and tool prefix.
      - Submit the copilot jobs through the Batch API on a nightly schedule.
      - Run the copilot jobs on a Haiku-tier model from start to finish.
    answer:
      - B
    explanation: |-
      **Khoảng nghỉ giữa các lượt dài hơn 5 phút làm prefix bị ghi cache lại nhiều lần: dùng cache 1 giờ**

      > 💡 Gặp **ghi cache nhiều, đọc ít vì khoảng nghỉ dài hơn 5 phút** thì chọn **cache 1 giờ**: cho prefix sống qua khoảng nghỉ.

      **Đề hỏi gì.** Job gọi model **tuần tự**, lượt sau chờ kết quả tool của lượt trước, và giữa các lượt agent đọc nguồn **lâu hơn thời gian sống mặc định của cache**. Prefix chỉ dẫn và tool **40.000 token bị ghi cache 11 lần, chỉ đọc 2 lần** mỗi job, và token ghi cache chiếm **62% chi phí**. Đề hỏi nên làm gì.

      **Vì sao đúng (B).** Cache mặc định sống 5 phút. Khoảng đọc nguồn giữa hai lượt dài hơn thế, nên prefix hết hạn và phải ghi lại gần như mỗi lượt. Ghi vào cache 1 giờ đắt hơn, gấp đôi giá input so với 1,25 lần của cache 5 phút. Nhưng chỉ cần mỗi khoảng đọc nguồn không quá 1 giờ thì prefix chỉ phải ghi một lần, các lượt sau đọc lại với giá rẻ, nên phần chi phí ghi cache (đang chiếm 62%) giảm mạnh.

      **Vì sao sai**

      - A: Thêm breakpoint sau mỗi kết quả tool chỉ tạo thêm chỗ ghi cache. Prefix vẫn hết hạn trong lúc agent đọc nguồn, nên vẫn bị ghi lại.
      - C: Mỗi lượt cần kết quả tool của lượt trước, nên đưa từng lượt qua Batch API thì mỗi lần gọi phải chờ batch xử lý xong mới đi tiếp được. Batch cũng không làm cache sống lâu hơn.
      - D: Đổi cả job sang model Haiku đánh đổi độ chính xác và chất lượng dẫn nguồn mà nhóm phải chịu trách nhiệm, trong khi chỗ lãng phí là prefix bị ghi cache lại.

      **Kiến thức liên quan.** Theo mặc định cache sống 5 phút, tính từ lúc request bắt đầu, và được làm mới mỗi lần có request đọc nó. Cache 1 giờ tốn tiền ghi hơn, 2 lần giá đầu vào so với 1,25 lần. Nó đáng dùng khi cứ khoảng 20 lượt lại có một lượt đến sau một khoảng nghỉ từ 5 phút tới 1 giờ, và ít khi nghỉ quá 1 giờ.

      **Từ khoá**

      - B: extended cache lifetime
      - stem: outlast the default cache lifetime

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `6-1-chi-phi-quy-mo-lon#chien-luoc-cache-va-cache-diagnostics`
