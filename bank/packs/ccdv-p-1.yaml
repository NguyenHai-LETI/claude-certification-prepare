  - id: ccdv-p-1.q0029
    exams:
      CCDV-P: D2
    stem: |-
      You are a platform engineer at Ironhaven Manufacturing. The company exposes maintenance manuals, parts inventory, and work-order tools to Claude agents through remote MCP servers used by plant engineering teams. Your team owns MCP deployment and authentication, tool catalog governance, agent identity, and the managed configuration that plant teams inherit. Changes must roll out to the fleet without breaking running integrations.

      A shared circuit breaker fronts the plant agents' model calls. It opens when unsuccessful responses in a rolling window cross a threshold. One team ships a prompt template that receives stop_reason refusal on most of its requests. The breaker opens, and every other team's agents lose model access.

      What should you recommend?
    options:
      - Raise the breaker threshold until refusal-heavy workloads no longer trip it
      - Count only rate limit, overload, and server errors toward the breaker, and handle refusals in each request path
      - Open the breaker for refusals only after a retry of the refused request also fails
      - Give each plant team a separate circuit breaker in front of the shared endpoint
    answer:
      - B
    explanation: |-
      **Circuit breaker chỉ đếm tín hiệu cho thấy dịch vụ có vấn đề; refusal là chuyện của chính request, không được làm mở breaker**

      > 💡 Gặp **refusal làm mở circuit breaker dùng chung** thì chọn **Count only rate limit, overload, and server errors**: refusal xử lý riêng trong từng request.

      **Đề hỏi gì.** Một circuit breaker dùng chung đứng trước lệnh gọi model của mọi agent nhà máy, mở khi số response không thành công vượt ngưỡng. Một đội ra prompt template bị **`stop_reason` refusal trên phần lớn request**. Breaker mở, và **agent của mọi đội khác mất quyền gọi model**.

      **Vì sao đúng (B).** Breaker sinh ra để ngắt đường gửi khi dịch vụ phía sau đang hỏng, như quá tải hay lỗi server. Refusal thì khác: endpoint vẫn chạy tốt, chỉ là prompt template của một đội bị từ chối, và gửi lại y nguyên cũng vẫn bị từ chối. Đếm refusal vào breaker dùng chung nên một đội làm sập cả nhà máy. Bỏ refusal ra khỏi tín hiệu của breaker, và xử lý nó ngay trong đường đi của từng request, như sửa prompt hay fallback sang model khác. Riêng lỗi rate limit (429) thì nên xử lý bằng cách gửi chậm lại chứ không để nó làm mở breaker, nên đáp án B là cách tốt nhất trong bốn đáp án, chưa phải thiết kế hoàn hảo.

      **Vì sao sai**

      - A: Nâng ngưỡng cho tới khi workload nhiều refusal không làm mở breaker thì breaker cũng chậm phản ứng với sự cố thật. Refusal vẫn bị đếm như lỗi dịch vụ.
      - C: Retry request bị refusal trên cùng model thường lại bị từ chối, nên điều kiện "retry cũng hỏng" gần như luôn đúng. Breaker vẫn mở, chỉ tốn thêm một lượt gửi.
      - D: Mỗi đội một breaker thì đội kia không bị kéo theo, nhưng breaker của đội có refusal vẫn mở và chặn cả những request lẽ ra trả lời được. Refusal vẫn bị coi là dấu hiệu dịch vụ hỏng.

      **Kiến thức liên quan.** Khi dùng circuit breaker với Claude, điều cần cân nhắc nhất là breaker nên đếm những lỗi nào. Mỗi cặp model và nền tảng nên có breaker riêng, và breaker chỉ đếm những tín hiệu cho thấy dịch vụ có vấn đề, là `529`, `500`, timeout và mất kết nối.

      **Từ khoá**

      - B: Count only rate limit, overload, and server errors
      - stem: stop_reason refusal on most of its requests

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-1-do-tin-cay-dich-vu-claude#circuit-breaker-va-graceful-degradation`
