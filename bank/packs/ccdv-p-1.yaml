  - id: ccdv-p-1.q0032
    exams:
      CCDV-P: D2
    stem: |-
      You work as a senior software engineer at EchoPoint Media Works. The company runs a production pipeline that summarizes wire feeds, drafts program notes, and tags an archive of transcripts. Volume is high, editors sample outputs for quality, and the team measures cost and quality movements on live traffic rather than waiting for offline suites.

      The wire summarization service reacts to rate limit errors only after they occur, and error bursts delay editor deadlines. The team wants the client to slow down before the organization reaches a limit. Every API response already flows into a shared metrics collector.

      Which signal should you use?
    options:
      - The token totals from each response usage block summed against the tier limit
      - The rate limit response headers that report remaining capacity and reset time
      - The count of rate limit errors across the trailing five minutes
      - The retry-after value carried on the most recent rate limit error
    answer:
      - B
    explanation: |-
      **Muốn client chậm lại trước khi chạm rate limit thì đọc header rate limit của mỗi response**

      > 💡 Gặp **giảm tốc trước khi chạm limit** thì chọn **rate limit response headers**: phần còn lại và giờ reset có sẵn ở mọi response. Đếm lỗi hay đọc `retry-after` đều là chuyện sau khi đã lỗi.

      **Đề hỏi gì.** Dịch vụ tóm tắt tin chỉ phản ứng **sau khi** đã bị lỗi rate limit, và các đợt lỗi làm trễ hạn của biên tập viên. Đội muốn client **giảm tốc trước khi organization chạm limit**, và mọi response đã đổ về một bộ thu số liệu chung. Đề hỏi nên dùng tín hiệu nào.

      **Vì sao đúng (B).** Mỗi response của API mang header `anthropic-ratelimit-*-remaining` và `anthropic-ratelimit-*-reset`, cho biết còn bao nhiêu request và token trước khi chạm limit, và bao giờ hạn mức được đổ đầy lại. Đây là con số chính API đang dùng để chặn, có ngay ở mọi response thành công, nên client thấy hạn mức cạn dần và giảm tốc được trước khi lỗi xảy ra.

      **Vì sao sai**

      - A: Tự cộng token trong `usage` rồi so với limit của tier chỉ là ước lượng. API đếm theo token bucket, đổ đầy lại liên tục chứ không theo từng phút, và token đọc từ cache không tính vào ITPM, nên tổng tự cộng lệch với phần hạn mức còn lại thật. Header đã báo sẵn con số đó.
      - C: Đếm lỗi rate limit trong năm phút gần nhất vẫn là phản ứng sau khi lỗi đã xảy ra, đúng điều đội muốn tránh.
      - D: `retry-after` chỉ có trên response đã bị lỗi rate limit. Nó cho biết nên chờ bao lâu để gửi lại, không giúp client chậm lại trước khi chạm limit.

      **Kiến thức liên quan.** Theo dõi header `anthropic-ratelimit-*-remaining` để giảm tốc trước khi chạm limit. Khi bị 429, chờ đúng số giây trong header `retry-after` rồi mới gửi lại.

      **Từ khoá**

      - B: response headers that report remaining capacity
      - stem: slow down before the organization reaches a limit

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-2-quy-mo-va-thong-luong#hang-doi-va-backpressure`
