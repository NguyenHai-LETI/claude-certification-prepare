  - id: ccdv-p-1.q0047
    exams:
      CCDV-P: D3
    stem: |-
      You are a platform engineer at VectorTrail Logistics. The company runs a multi-agent system that coordinates shipment planning across road, rail, and sea. A supervisor agent delegates route planning, customs paperwork, and exception handling to worker agents that call carrier and tracking tools. The system serves live operations in Rotterdam, Singapore, and Chicago, and long-running jobs must survive restarts and model upgrades.

      Customs paperwork jobs fail intermittently when worker agents call the carrier tools. The shipper documents inside those calls are commercially sensitive, and the compliance standard bars document text from the observability stack. On-call engineers still need to isolate which tool call failed and why.

      What should you do?
    options:
      - Record one success or failure flag for each finished job and page when the failure rate rises.
      - Record tool name, argument size, error class, latency, and retry count as attributes on every tool-call span.
      - Rerun failed jobs in a staging environment with synthetic documents when an incident review starts.
      - Capture complete request payloads for failed calls only and delete the records after each incident review.
    answer:
      - B
    explanation: |-
      **Gỡ lỗi tool call khi không được ghi nội dung tài liệu: ghi metadata của từng lần gọi làm thuộc tính span**

      > 💡 Gặp **cấm lưu nội dung mà vẫn phải gỡ lỗi** thì chọn **metadata trên từng span tool call**: tên tool, loại lỗi, độ trễ, số lần retry.

      **Đề hỏi gì.** Job giấy tờ hải quan thỉnh thoảng lỗi khi worker gọi tool của hãng vận chuyển. Quy chuẩn tuân thủ **cấm đưa chữ trong tài liệu vào hệ observability**, nhưng kỹ sư trực vẫn cần biết **lần gọi tool nào lỗi và vì sao**.

      **Vì sao đúng (B).** Tên tool, cỡ tham số, loại lỗi, độ trễ và số lần retry đều là metadata, không chứa chữ nào của tài liệu, nên không vi phạm quy chuẩn. Gắn chúng lên span của từng lần gọi tool thì kỹ sư trực lọc ra được đúng lần gọi lỗi, thấy lỗi thuộc loại gì, chậm ở đâu và đã retry mấy lần. Đó đúng là những gì cần để khoanh lỗi.

      **Vì sao sai**

      - A: Một cờ thành công hay thất bại cho cả job chỉ cho biết job hỏng, không cho biết lần gọi tool nào hỏng và vì sao. Kỹ sư trực vẫn phải đoán.
      - C: Chạy lại trên staging bằng tài liệu giả là việc làm sau khi đã lỡ, và lỗi lúc có lúc không chưa chắc tái hiện được với dữ liệu khác. Trong lúc sự cố đang diễn ra, đội vẫn không có dữ liệu để khoanh lỗi.
      - D: Ghi trọn payload của lần gọi lỗi là đưa chữ của tài liệu vào hệ observability, đúng điều quy chuẩn cấm. Xoá sau buổi review không xoá được việc đã lưu.

      **Kiến thức liên quan.** Mỗi destination và mỗi client SDK đều có một content mode, quyết định span có chứa prompt và response hay không. Chọn content mode cho đúng khi tổ chức có yêu cầu riêng tư chính là cấu hình ghi nội dung.

      **Từ khoá**

      - B: tool name, argument size, error class
      - stem: bars document text from the observability stack

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `3-1-telemetry-va-instrumentation#ghi-noi-dung-hay-chi-metadata-khi-co-zdr`
