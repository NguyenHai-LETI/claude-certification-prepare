  - id: ccdv-p-1.q0058
    exams:
      CCDV-P: D3
    stem: |-
      You work as a site reliability engineer at BrightCart Retail. The company runs a storefront shopping assistant on the Claude API and a nightly batch pipeline that enriches the product catalog. Traffic peaks are sharp, latency targets are strict, and the integration layer must degrade gracefully when limits or failures occur. The assistant holds no payment or identity data; it works over the public catalog and order-status tools.

      A canary carries five percent of assistant traffic on the newest model generation while the rest stays on the current one. After six hours the canary shows error rate and latency unchanged from the baseline, output length down 40 percent, and tool-call frequency doubled on the same query mix. Shopper complaints show nothing unusual.

      What should you do next?
    options:
      - Hold the canary at five percent and investigate the length and tool-call shifts against transcripts.
      - Increase the canary on schedule while error rate and latency hold at the baseline.
      - Raise the canary to half of traffic and monitor shopper complaints for a week.
      - Roll the canary back to zero and cancel the model migration for this quarter.
    answer:
      - A
    explanation: |-
      **Canary đổi model: lỗi và độ trễ vẫn xanh mà hành vi đổi mạnh thì giữ nguyên tỉ lệ và đọc transcript**

      > 💡 Gặp **lỗi và độ trễ xanh nhưng độ dài output và số lần gọi tool nhảy mạnh** thì chọn **Hold the canary at five percent**: giữ nguyên tỉ lệ, đọc transcript rồi mới quyết.

      **Đề hỏi gì.** Canary 5% chạy model mới được sáu giờ. **Tỉ lệ lỗi và độ trễ vẫn như baseline**, khiếu nại không có gì lạ, nhưng **output ngắn đi 40%** và **số lần gọi tool tăng gấp đôi** trên cùng tập truy vấn. Đề hỏi bước tiếp theo.

      **Vì sao đúng (A).** Lỗi và độ trễ chỉ cho biết request có chạy hay không, không cho biết câu trả lời còn tốt không. Output ngắn đi 40% và số lần gọi tool tăng gấp đôi trên cùng tập truy vấn là dấu hiệu hành vi của model đã đổi, dù chưa biết là tốt hay xấu. Giữ canary ở 5% để không mở rộng rủi ro, rồi đọc transcript xem câu trả lời ngắn có thiếu thông tin không và các lần gọi tool thêm có cần không. Có kết luận rồi mới quyết định tăng tiếp hay rút lại.

      **Vì sao sai**

      - B: Tăng canary theo lịch chỉ vì lỗi và độ trễ xanh là tin vào hai con số không đo chất lượng. Hai thay đổi lớn về hành vi còn chưa được giải thích mà model mới đã nhận thêm lưu lượng.
      - C: Nâng lên một nửa lưu lượng là đưa một thay đổi chưa hiểu tới rất nhiều người mua. Khiếu nại lại là tín hiệu đến muộn: tới lúc khiếu nại tăng thì chất lượng đã giảm từ lâu.
      - D: Chưa có bằng chứng model mới kém hơn, vì lỗi, độ trễ và khiếu nại đều bình thường. Rút về 0 và huỷ cả quý là bỏ cuộc trước khi tìm hiểu, trong khi canary 5% vốn đã giới hạn rủi ro.

      **Kiến thức liên quan.** Có những số có ngay trên mọi bài mà không phải chờ giáo viên chấm lại, như token đầu ra mỗi bài, độ dài nhận xét và band trung bình. Các số này không cho biết điểm chấm đúng hay sai. Nhưng nếu chúng nhảy đột ngột ngay sau khi đổi model thì đó là lý do để vào xem ngay, trước khi có số của giáo viên.

      **Từ khoá**

      - A: Hold the canary at five percent
      - stem: output length down 40 percent | tool-call frequency doubled

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `3-2-giam-sat-va-canh-bao#nhan-ra-chat-luong-giam-sau-khi-doi-model`
