  - id: ccdv-p-1.q0030
    exams:
      CCDV-P: D7
    stem: |-
      You are a platform engineer at Ironhaven Manufacturing. The company exposes maintenance manuals, parts inventory, and work-order tools to Claude agents through remote MCP servers used by plant engineering teams. Your team owns MCP deployment and authentication, tool catalog governance, agent identity, and the managed configuration that plant teams inherit. Changes must roll out to the fleet without breaking running integrations.

      After the fleet migration to workload identity federation, you archive the federation rule for a decommissioned conveyor-monitoring agent. The agent continues to make successful Claude API calls for eight more minutes and then starts to receive authentication errors. Nothing on the agent host changed during those minutes.

      What is the most likely cause?
    options:
      - An access token issued before the archive that stayed valid until its lifetime ended
      - Identity provider tokens that the issuer kept signing against the archived rule
      - A leftover static API key on the host that outranked the federation credentials
      - A local token renewal in the SDK that never contacted the exchange endpoint
    answer:
      - A
    explanation: |-
      **Archive federation rule không thu hồi token đã cấp: token cũ vẫn dùng được tới hết thời gian sống**

      > 💡 Gặp **archive rule xong vẫn chạy thêm vài phút rồi mới lỗi** thì chọn **An access token issued before the archive**: token cũ sống nốt tới hết hạn.

      **Đề hỏi gì.** Sau khi chuyển sang workload identity federation, bạn archive federation rule của một agent đã ngừng dùng. Agent **vẫn gọi Claude API thành công thêm tám phút rồi mới bắt đầu nhận lỗi xác thực**, và **không có gì trên máy agent thay đổi**.

      **Vì sao đúng (A).** Với WIF, SDK đổi JWT của IdP lấy một access token `sk-ant-oat01-` có thời gian sống, rồi tự làm mới trước khi hết hạn. Archive rule chặn các lần đổi token mới, nhưng token đã cấp trước đó vẫn dùng được tới khi hết hạn. Tám phút gọi thành công là phần đời còn lại của token đó. Tới lúc SDK cần token mới, lần đổi bị rule đã archive từ chối, nên lỗi xác thực bắt đầu.

      **Vì sao sai**

      - B: IdP có tiếp tục ký JWT thì cũng không sao, vì Anthropic chỉ đổi JWT lấy token khi có rule khớp. Rule đã archive thì các lần đổi đó bị từ chối ngay, không có chuyện thành công thêm tám phút.
      - C: Nếu còn một API key tĩnh được ưu tiên hơn WIF thì agent sẽ gọi thành công mãi, vì archive rule không đụng tới key đó. Ở đây lỗi bắt đầu sau tám phút, nên agent đang dùng token của WIF.
      - D: SDK không tự gia hạn token mà không gọi endpoint đổi token. Làm mới token nghĩa là đổi JWT lần nữa, và chính lần đổi đó bị từ chối sau khi rule bị archive.

      **Kiến thức liên quan.** Khi chạy, SDK đổi JWT của IdP lấy token `sk-ant-oat01-...` và tự làm mới trước khi hết hạn. Token này sống tối đa bằng giá trị nhỏ hơn trong hai giá trị, là `token_lifetime_seconds` của rule (mặc định 3.600 giây) và gấp đôi thời gian JWT gốc còn hiệu lực.

      **Từ khoá**

      - A: An access token issued before the archive
      - stem: continues to make successful Claude API calls for eight more minutes

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-3-dinh-danh-bi-mat-va-audit#workload-identity-federation-thay-khoa-tinh`
