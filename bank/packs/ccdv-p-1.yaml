  - id: ccdv-p-1.q0004
    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at Stonegate Development Partners. The firm processes construction contracts, permits, and inspection reports through an extraction service that feeds project dashboards. Throughput is bursty, accuracy is contractual, and the team runs online sampling and judge-based review to hold quality while controlling spend.

      Project dashboards log a correction whenever a reviewer edits an extracted field. The correction rate fell from four percent to 2.8 percent across the quarter, and a product manager proposes reporting the fall as a quality gain. In the same quarter two large clients moved to an export workflow that never shows fields for review.

      What should you do next?
    options:
      - Judge-grade a random sample from both ends of the quarter and compare measured accuracy directly.
      - Replace the correction rate with a count of service errors and extraction timeouts.
      - Report the fall as a quality gain and keep the correction rate as the primary metric.
      - Weight each correction by document value and report the weighted rate instead.
    answer:
      - A
    explanation: |-
      **Chỉ số ngầm giảm vì nhóm người dùng đổi, không phải vì chất lượng tăng: chấm trực tiếp độ chính xác để kiểm**

      > 💡 Gặp **chỉ số giảm đúng lúc một nhóm khách không còn được đo** thì chọn **chấm mẫu ngẫu nhiên ở hai đầu quý** rồi so độ chính xác thật.

      **Đề hỏi gì.** Tỉ lệ người duyệt phải sửa field giảm từ **4% xuống 2,8%**, và PM muốn báo đây là chất lượng tăng. Nhưng cùng quý đó **hai khách lớn chuyển sang luồng export không bao giờ hiện field cho người duyệt**, nên ở hai khách này không có cơ hội sửa nào. Đề hỏi nên làm gì tiếp.

      **Vì sao đúng (A).** Tỉ lệ sửa chỉ đo được ở những tài liệu người duyệt nhìn thấy. Hai khách lớn rời khỏi luồng duyệt thì số lượt sửa tự giảm, dù chất lượng trích có thể không đổi hoặc còn tệ hơn. Muốn biết chất lượng có tăng thật không, hãy lấy mẫu ngẫu nhiên ở đầu và cuối quý, cho judge chấm độ chính xác, rồi so thẳng hai con số. Cách này không phụ thuộc vào việc người dùng có thấy field hay không.

      **Vì sao sai**

      - B: Lỗi dịch vụ và timeout chỉ cho biết hệ thống có chạy hay không. Một field trích sai mà vẫn trả về thành công thì không hiện trong hai con số này.
      - C: Báo đây là chất lượng tăng thì bỏ qua đúng chi tiết làm con số đổi: hai khách lớn không còn đường nào để sửa field. Giữ tỉ lệ sửa làm chỉ số chính thì lần sau con số vẫn lệch như vậy.
      - D: Nhân mỗi lượt sửa với giá trị tài liệu vẫn chỉ đếm những tài liệu người duyệt nhìn thấy. Phần lưu lượng của hai khách lớn vẫn nằm ngoài chỉ số.

      **Kiến thức liên quan.** Trên lưu lượng thật không có đáp án chuẩn để so, nên mẫu lấy từ lưu lượng thật phải nhờ judge chấm. Judge chỉ có trong tay đầu vào của lượt đó, câu trả lời và rubric.

      **Từ khoá**

      - A: random sample from both ends of the quarter
      - stem: export workflow that never shows fields for review

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-3-do-chat-luong-tren-production#lay-mau-luu-luong-that`
