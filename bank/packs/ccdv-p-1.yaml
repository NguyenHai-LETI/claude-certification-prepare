  - id: ccdv-p-1.q0048
    exams:
      CCDV-P: D3
    stem: |-
      You are a platform engineer at VectorTrail Logistics. The company runs a multi-agent system that coordinates shipment planning across road, rail, and sea. A supervisor agent delegates route planning, customs paperwork, and exception handling to worker agents that call carrier and tracking tools. The system serves live operations in Rotterdam, Singapore, and Chicago, and long-running jobs must survive restarts and model upgrades.

      Cache reads on the supervisor planning calls drop to zero at unpredictable moments, and cost spikes follow each episode. The prompt assembles from static templates, tool definitions, and a customs context block, and the compliance standard bars storing assembled prompt text. The team cannot tell which segment differs between a cache hit and the following miss.

      What should you do?
    options:
      - Move the cache breakpoint to the end of the static templates and exclude the later segments.
      - Record a content hash of each prompt segment on every request and compare a hit against the following miss.
      - Log the full assembled prompt on every request and diff the stored texts after each episode.
      - Alert when `cache_read_input_tokens` falls to zero and treat every alert as a rollback signal.
    answer:
      - B
    explanation: |-
      **Tìm đoạn prompt làm trượt cache khi không được lưu nguyên prompt: so hash của từng đoạn**

      > 💡 Gặp **không được lưu prompt mà cần biết đoạn nào đổi** thì chọn **content hash của từng đoạn**, so lần trúng với lần trượt ngay sau.

      **Đề hỏi gì.** Số token đọc từ cache của các lần gọi lập kế hoạch **rơi về 0 lúc nào không biết**, kéo theo chi phí tăng vọt. Prompt ghép từ template tĩnh, định nghĩa tool và khối context hải quan, nhưng **không được lưu chữ của prompt đã ghép**, nên đội không biết đoạn nào khác nhau giữa lần trúng và lần trượt ngay sau.

      **Vì sao đúng (B).** Cache chỉ trúng khi phần đầu prompt giống từng byte, nên việc cần làm là biết đoạn nào đã đổi. Hash của từng đoạn cho biết đúng điều đó mà không chứa chữ nào của prompt, nên không vi phạm quy chuẩn. So hash của lần trúng với lần trượt ngay sau, đoạn nào có hash khác chính là đoạn làm trượt cache. Cache diagnostics của API cũng làm theo cách này, chỉ lưu hash chứ không lưu nội dung.

      **Vì sao sai**

      - A: Dời breakpoint lên sau template tĩnh chỉ làm bớt phần được cache, và đoán trước rằng lỗi nằm ở các đoạn sau. Nếu chính template hay định nghĩa tool đổi thì cache vẫn trượt, và đội vẫn chưa biết vì sao.
      - C: Ghi nguyên prompt đã ghép rồi so là cách đội không được dùng, vì quy chuẩn cấm lưu chữ của prompt.
      - D: Cảnh báo khi số token đọc từ cache về 0 chỉ báo lại điều đội đã biết. Nó không chỉ ra đoạn nào đổi, và rollback mỗi lần có cảnh báo thì chưa chắc lùi đúng thay đổi gây lỗi.

      **Kiến thức liên quan.** Prompt caching chỉ trúng khi phần đầu prompt giống từng byte với một request gần đây. Cache diagnostics chỉ ra chỗ hai request bắt đầu khác nhau.

      **Từ khoá**

      - B: content hash of each prompt segment
      - stem: bars storing assembled prompt text

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `3-1-telemetry-va-instrumentation#chan-doan-cache`
