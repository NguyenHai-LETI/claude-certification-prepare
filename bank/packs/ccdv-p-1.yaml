  - id: ccdv-p-1.q0056
    exams:
      CCDV-P: D8
    stem: |-
      You are a staff software engineer at Nexora Systems. The engineering organization runs a fleet of coding agents for migrations, refactors, code review, and CI incident first response. Agents work on isolated worktrees, run unattended on schedules, and operate under managed settings your team defines. Generation outpaces human review, and the verification pipeline is yours to engineer.

      Across three migration runs the team raised the fleet from four agents to eight and then to 16. Telemetry shows that merged changes stayed nearly flat, that review queue depth doubled on each run, and that the revert rate rose from two percent to nine percent. Another migration starts next week.

      What should you recommend?
    options:
      - Pause migrations until the review queue empties, then resume at the same fleet size.
      - Keep 16 agents and assign a second reviewer to every pull request.
      - Raise the fleet to 32 agents for the next migration.
      - Reduce the agent count and enlarge each agent's task along module boundaries.
    answer:
      - D
    explanation: |-
      **Thêm agent mà số thay đổi được merge không tăng: giảm số agent, giao mỗi agent phần việc lớn hơn theo module**

      > 💡 Gặp **thêm agent mà merge đứng yên, revert tăng** thì chọn **reduce the agent count**, mỗi agent một phần lớn hơn theo module.

      **Đề hỏi gì.** Qua ba đợt, đội tăng từ **4 lên 8 rồi 16 agent**. Số thay đổi được merge **gần như đứng yên**, hàng đợi review **dài gấp đôi sau mỗi đợt**, và tỉ lệ revert tăng **từ 2% lên 9%**. Đợt migration tới bắt đầu tuần sau.

      **Vì sao đúng (D).** Thêm agent không thêm được thay đổi nào lên main, chỉ thêm PR nằm chờ review và thêm revert. Việc đang bị chia quá nhỏ: mỗi agent một mẩu nhỏ, nhiều PR nhỏ chồng lên nhau, nên công điều phối và review vượt phần thời gian tiết kiệm được. Ít agent hơn, mỗi agent nhận trọn một module, thì ít PR hơn, ít đụng nhau hơn, và người review theo kịp.

      **Vì sao sai**

      - A: Dừng cho hàng đợi trống rồi chạy lại với 16 agent thì hàng đợi lại đầy như cũ, vì cách chia việc và số agent, gốc của vấn đề, vẫn chưa đổi.
      - B: Thêm người review thứ hai cho mọi PR làm hàng đợi dài thêm, trong khi review vốn đang là chỗ nghẽn. Nó cũng không chữa được chuyện việc bị chia quá nhỏ.
      - C: Số liệu ba đợt cho thấy thêm agent không làm tăng số thay đổi được merge mà chỉ tăng hàng đợi và revert. Lên 32 agent sẽ làm cả hai tệ hơn.

      **Kiến thức liên quan.** Hai agent sửa cùng một file thì bên sau ghi đè bên trước, hoặc để lại xung đột. Phần quá nhỏ thì công điều phối còn tốn hơn thời gian tiết kiệm được. Phần quá lớn thì agent chạy rất lâu mà giữa chừng không ai kiểm.

      **Từ khoá**

      - D: Reduce the agent count
      - stem: merged changes stayed nearly flat

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `8-1-chay-song-song-coding-agent#chia-viec-thanh-nhung-phan-doc-lap`
