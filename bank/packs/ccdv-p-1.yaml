    exams:
      CCDV-P: D6
    stem: |-
      You are a senior software engineer at Horizon Crest Hospitality. The company operates a guest concierge agent across its properties in Lisbon, Osaka, and Vancouver, with property-level configuration and a shared platform team. The concierge answers property questions, coordinates requests with booking and housekeeping tools, and must stay within tight latency and cost budgets in every region.

      One concierge route serves short questions about hours and amenities alongside complex itinerary planning across the three properties. A fixed configuration applies the same deep reasoning to every request, and hours questions wait behind reasoning depth they do not need. The platform team at Horizon Crest Hospitality wants short requests answered quickly while itinerary planning keeps its full reasoning depth on the same route.

      Which approach should you use?
    options:
      - Adaptive thinking that scales reasoning depth to the demands of each request
      - A shorter system prompt for the hours and amenities questions
      - One lower fixed effort level applied to the whole route
      - A trained classifier that routes short requests to a smaller model tier
    answer:
      - A
    explanation: |-
      **Cùng một route có cả câu ngắn lẫn việc cần suy luận sâu thì dùng adaptive thinking để độ sâu suy luận theo từng request**

      > 💡 Gặp **câu ngắn và việc khó chung một route, mỗi loại cần độ sâu khác nhau** thì chọn **Adaptive thinking**: model tự quyết nghĩ bao nhiêu cho từng request.

      **Đề hỏi gì.** Một route vừa trả lời câu ngắn về giờ mở cửa, tiện ích, vừa lập lịch trình phức tạp. Cấu hình cố định bắt mọi request suy luận sâu như nhau, nên câu hỏi giờ mở cửa phải chờ phần suy luận nó không cần. Đội muốn câu ngắn trả lời nhanh mà lịch trình **vẫn giữ đủ độ sâu suy luận, trên cùng route đó**.

      **Vì sao đúng (A).** Adaptive thinking để model tự đánh giá mỗi request cần nghĩ bao nhiêu. Câu hỏi giờ mở cửa gần như không cần nghĩ nên trả lời ngay, còn lập lịch trình qua ba khách sạn thì model vẫn nghĩ sâu. Một cấu hình cho cả route mà mỗi request nhận đúng độ sâu nó cần, không phải tách route hay dựng thêm bộ phân loại.

      **Vì sao sai**

      - B: Rút ngắn system prompt chỉ bớt vài token input. Độ sâu suy luận cố định vẫn áp cho mọi request, nên câu hỏi giờ mở cửa vẫn phải chờ như cũ.
      - C: Hạ effort cho cả route thì câu ngắn nhanh hơn, nhưng lập lịch trình cũng mất độ sâu suy luận, trái với yêu cầu giữ đủ độ sâu cho việc khó.
      - D: Huấn luyện bộ phân loại rồi chuyển câu ngắn sang model nhỏ hơn là thêm một hệ thống phải dựng, đo và bảo trì, lại tách request ra khỏi model của route. Đề muốn giải quyết ngay trên cùng route.

      **Kiến thức liên quan.** Với mỗi request, Claude tự xét độ khó rồi mới quyết định có nghĩ không và nghĩ bao nhiêu. Câu hỏi đơn giản có thể được trả lời ngay mà không có block thinking nào, còn việc nhiều bước thì Claude nghĩ kỹ hơn.

      **Từ khoá**

      - A: Adaptive thinking
      - stem: keeps its full reasoning depth on the same route
      - case: tight latency and cost budgets

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `6-2-toi-uu-do-tre#chinh-effort-cho-vua-do-tre`
