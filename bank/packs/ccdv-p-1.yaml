  - id: ccdv-p-1.q0037
    exams:
      CCDV-P: D4
    stem: |-
      You work as a senior software engineer at EchoPoint Media Works. The company runs a production pipeline that summarizes wire feeds, drafts program notes, and tags an archive of transcripts. Volume is high, editors sample outputs for quality, and the team measures cost and quality movements on live traffic rather than waiting for offline suites.

      An engineer deployed a prompt change directly to full production traffic, and summary quality dropped for six hours before rollback. The blameless postmortem asks for one action that addresses the systemic cause.

      What should you recommend?
    options:
      - Require a second engineer to approve each prompt change before it deploys to production.
      - Route every prompt change through an evaluation gate and a canary stage before full traffic.
      - Schedule a weekly review of production summary quality with the editors and the on-call.
      - Restrict prompt deployment permissions to the two most senior engineers.
    answer:
      - B
    explanation: |-
      **Postmortem không đổ lỗi: sửa nguyên nhân hệ thống bằng cổng eval và canary cho mọi thay đổi prompt**

      > 💡 Gặp **postmortem blameless, nguyên nhân hệ thống** thì chọn **cổng eval và canary**: sửa quy trình, không sửa người.

      **Đề hỏi gì.** Một kỹ sư đưa thay đổi prompt **thẳng lên toàn bộ production**, và chất lượng tóm tắt giảm suốt **sáu giờ** mới rollback. Postmortem theo tinh thần **blameless** yêu cầu một việc giải quyết **nguyên nhân hệ thống**. Đề hỏi nên đề xuất gì.

      **Vì sao đúng (B).** Nguyên nhân hệ thống là quy trình cho phép một thay đổi prompt đi thẳng tới toàn bộ lưu lượng mà không qua phép đo nào. Bắt mọi thay đổi prompt qua cổng eval rồi canary trên một phần nhỏ lưu lượng thì lỗi bị chặn ở eval, hoặc lộ ra ở canary khi mới ảnh hưởng ít người, chứ không phải sáu giờ trên toàn bộ.

      **Vì sao sai**

      - A: Thêm người duyệt vẫn dựa vào việc một người đọc prompt mà đoán được chất lượng. Không có phép đo nào, và thay đổi được duyệt vẫn đi thẳng lên toàn bộ lưu lượng.
      - C: Họp hằng tuần để xem chất lượng thì phát hiện chậm hơn nữa. Nó không chặn thay đổi nào trước khi lên production.
      - D: Chỉ cho hai kỹ sư lâu năm nhất deploy là quy lỗi cho người, trái tinh thần blameless. Người lâu năm deploy thẳng lên toàn bộ lưu lượng vẫn có thể gây đúng sự cố này.

      **Kiến thức liên quan.** Postmortem nên viết theo tinh thần không đổ lỗi (**blameless**), nghĩa là kể hệ thống đã chạy thế nào chứ không tìm xem ai sai. Thay đổi nào có thể làm giảm chất lượng thì cho chạy thử một thời gian (soak) rồi rollout dần.

      **Từ khoá**

      - B: evaluation gate and a canary stage
      - stem: addresses the systemic cause

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `4-2-xu-ly-su-co#bien-su-co-thanh-eval-canh-bao-va-postmortem`
