  - id: ccdv-p-1.q0003
    exams:
      CCDV-P: D5
    stem: |-
      You are a senior software engineer at Stonegate Development Partners. The firm processes construction contracts, permits, and inspection reports through an extraction service that feeds project dashboards. Throughput is bursty, accuracy is contractual, and the team runs online sampling and judge-based review to hold quality while controlling spend.

      Permit filings spike to 20 times baseline volume in the last three days of each month. The grading pipeline samples a fixed share of all documents, so burst-day permits dominate the graded set. Inspection reports carry five percent of volume under a contractual accuracy commitment, and a regression on them stayed invisible for six weeks.

      Which sampling plan should you use?
    options:
      - A stratified sample with daily grading quotas for each document type
      - A fixed percentage sample restricted to documents filed outside burst days
      - A fixed percentage of all documents with grades pooled for the month
      - A raised sampling percentage applied only during month-end burst days
    answer:
      - A
    explanation: |-
      **Lấy mẫu theo nhóm (stratified) để nhóm nhỏ mà quan trọng vẫn đủ ca chấm mỗi ngày**

      > 💡 Gặp **nhóm nhỏ có cam kết mà lỗi chìm hàng tuần** thì chọn **stratified sample**: mỗi nhóm có quota ca chấm riêng mỗi ngày.

      **Đề hỏi gì.** Giấy phép tăng **gấp 20 lần** vào ba ngày cuối tháng, và mẫu chấm lấy **một tỉ lệ cố định trên mọi tài liệu**, nên giấy phép ngày cao điểm chiếm gần hết mẫu. Biên bản nghiệm thu chỉ chiếm **5% lưu lượng nhưng có cam kết độ chính xác trong hợp đồng**, và một lần chất lượng tụt ở nhóm này kéo dài sáu tuần không ai thấy. Đề hỏi nên lấy mẫu thế nào.

      **Vì sao đúng (A).** Lấy mẫu theo nhóm đặt cho mỗi loại tài liệu một số ca phải chấm mỗi ngày. Biên bản nghiệm thu dù chỉ 5% lưu lượng vẫn có đủ ca để điểm của nó tụt là thấy ngay, còn ngày giấy phép tăng vọt cũng không chiếm hết mẫu nữa. Khi tính điểm chung, điểm mỗi nhóm được nhân với tỉ lệ thật của nhóm đó.

      **Vì sao sai**

      - B: Bỏ các ngày cao điểm ra khỏi mẫu thì giấy phép không chiếm hết mẫu nữa, nhưng vẫn là một tỉ lệ cố định chia đều, nên biên bản nghiệm thu vẫn chỉ có vài ca. Lỗi chỉ xảy ra trong ngày cao điểm thì lại không bao giờ được chấm.
      - C: Gộp điểm cả tháng còn làm lỗi chìm sâu hơn: vài ca biên bản nghiệm thu bị sai lẫn giữa hàng nghìn ca giấy phép, và phải hết tháng mới có điểm để xem.
      - D: Tăng tỉ lệ lấy mẫu vào ngày cao điểm chỉ làm giấy phép chiếm mẫu nhiều hơn nữa. Biên bản nghiệm thu, nhóm cần được chấm, không được thêm ca nào.

      **Kiến thức liên quan.** Lý do là lấy ngẫu nhiên đều trên toàn bộ lưu lượng thì nhóm nhỏ gần như không có mặt trong mẫu. Đội lấy mẫu theo nhóm (stratified). Mỗi việc và mỗi nhóm quan trọng, như hàng cồng kềnh hay khách hỏi bảo hành quá hạn, có ít nhất 40 ca trong mẫu mỗi ngày, và nhóm nào rủi ro cao thì lấy nhiều hơn nữa.

      **Từ khoá**

      - A: stratified sample
      - stem: carry five percent of volume
      - case: accuracy is contractual

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `5-3-do-chat-luong-tren-production#lay-mau-luu-luong-that`
