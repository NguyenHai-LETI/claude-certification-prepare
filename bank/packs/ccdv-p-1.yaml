  - id: ccdv-p-1.q0069
    exams:
      CCDV-P: D7
    stem: |-
      You are a senior software engineer at DriveSphere Mobility. The company operates an owner-support agent that reads vehicle manuals, warranty documents, and inbound owner messages, and can open service tickets and send responses. Inbound content is untrusted, the agent holds tool access with real side effects, and your team owns its guardrail stack and adversarial testing.

      A proposed autonomy policy lets the agent open service tickets and send replies with no review, and reserves human approval for warranty payout recommendations. Every action can fire while the agent reads untrusted owner messages beside warranty records. A security architect challenges the policy before sign-off.

      What should you conclude?
    options:
      - The unreviewed reply channel gives injected instructions a direct path to move warranty data out.
      - The policy fails only if the agent later gains code execution tools.
      - The main exposure is ticket volume rather than data leaving through replies.
      - The policy is sound once payout recommendations carry human review.
    answer:
      - A
    explanation: |-
      **Bộ ba nguy hiểm: đọc nội dung không tin cậy, chạm dữ liệu riêng tư và có kênh gửi ra ngoài không qua duyệt**

      > 💡 Gặp **đọc tin không đáng tin, cạnh dữ liệu riêng, gửi trả lời tự do** thì chọn **unreviewed reply channel**: đủ bộ ba là có đường rò.

      **Đề hỏi gì.** Chính sách cho agent **mở ticket và gửi trả lời không cần duyệt**, chỉ **duyệt đề xuất chi trả bảo hành**. Mọi hành động đều có thể xảy ra trong lúc agent **đọc tin nhắn không đáng tin cạnh hồ sơ bảo hành**. Đề hỏi kiến trúc sư bảo mật nên kết luận gì.

      **Vì sao đúng (A).** Agent có đủ ba thứ cùng lúc: đọc tin nhắn không đáng tin, chạm hồ sơ bảo hành là dữ liệu riêng tư, và gửi được câu trả lời ra ngoài mà không ai duyệt. Kẻ xấu chỉ cần cài một chỉ dẫn vào tin nhắn là agent có thể chép hồ sơ bảo hành vào câu trả lời gửi đi. Duyệt đề xuất chi trả không chặn được đường này, vì dữ liệu ra ngoài qua kênh trả lời.

      **Vì sao sai**

      - B: Không cần tool chạy code: kênh gửi trả lời đã là đường đưa dữ liệu ra ngoài. Chính sách đã hở ngay với bộ tool hiện tại.
      - C: Ticket thừa là phiền nhưng sửa được. Hồ sơ bảo hành đã gửi ra ngoài qua câu trả lời thì không lấy lại được, nên đó mới là rủi ro chính.
      - D: Duyệt đề xuất chi trả chỉ chặn đường mất tiền. Câu trả lời vẫn đi ra mà không qua duyệt, nên đường đưa dữ liệu bảo hành ra ngoài vẫn mở.

      **Kiến thức liên quan.** Nguy hiểm nhất là khi agent có đủ ba thứ cùng lúc. Agent vừa **truy cập dữ liệu riêng tư** (**private data access**), vừa **đọc đầu vào không tin cậy** (**untrusted input**), vừa có **kênh liên lạc ra ngoài** (**external communication**). Khi agent có đủ bộ ba, kẻ xấu chỉ cần cài một câu vào nội dung agent đọc là lấy được dữ liệu và gửi ra ngoài.

      **Từ khoá**

      - A: unreviewed reply channel
      - stem: untrusted owner messages beside warranty records
      - case: Inbound content is untrusted

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-2-phong-thu-tan-cong-agent#be-mat-tan-cong-va-bo-ba-nguy-hiem`
