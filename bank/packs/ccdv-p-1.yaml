  - id: ccdv-p-1.q0052
    exams:
      CCDV-P: D2
    stem: |-
      You are a staff software engineer at Nexora Systems. The engineering organization runs a fleet of coding agents for migrations, refactors, code review, and CI incident first response. Agents work on isolated worktrees, run unattended on schedules, and operate under managed settings your team defines. Generation outpaces human review, and the verification pipeline is yours to engineer.

      The fleet reaches the newest model generation through two provider platforms, with half of the agents on each. Feature configuration differs between the platforms: the reasoning mode, the structured-output surface, and default request limits each carry platform-specific settings. The migration plan runs its canary and quality gates on one platform, then cuts both halves over together. A reviewer flags the plan.

      What should you recommend?
    options:
      - Add a post-cutover monitoring window on the second platform with automatic rollback.
      - Run the canary and its gates separately on each platform before either half cuts over.
      - Consolidate both halves onto a single platform before the migration starts.
      - Cut over the gated platform first and copy its passing configuration to the second platform.
    answer:
      - B
    explanation: |-
      **Đổi model trên hai nền tảng có cấu hình khác nhau: chạy canary và cổng kiểm riêng trên từng nền tảng**

      > 💡 Gặp **hai nền tảng, mỗi bên một kiểu cấu hình** thì chọn **canary và gates separately on each platform**.

      **Đề hỏi gì.** Đội agent dùng model mới qua **hai nền tảng**, mỗi bên một nửa, và chế độ reasoning, cách lấy structured output, giới hạn request mặc định **đều có thiết lập riêng theo nền tảng**. Kế hoạch chỉ chạy canary và cổng kiểm **trên một nền tảng** rồi chuyển cả hai nửa cùng lúc. Reviewer cắm cờ kế hoạch.

      **Vì sao đúng (B).** Cùng một thiết lập chạy khác nhau trên mỗi nền tảng, nên canary qua ở nền tảng này không chứng minh gì cho nền tảng kia. Chạy canary và cổng kiểm riêng trên từng nền tảng thì lỗi cấu hình của nền tảng thứ hai lộ ra khi mới có một phần nhỏ traffic, trước khi nửa đó chuyển hẳn.

      **Vì sao sai**

      - A: Theo dõi sau khi chuyển và tự rollback nghĩa là để lỗi chạm vào cả nửa traffic rồi mới lùi. Cổng kiểm phải đứng trước lúc chuyển, không phải sau.
      - C: Gom về một nền tảng là đổi cả kiến trúc chỉ để khỏi phải kiểm thử, và bản thân việc đó là một đợt chuyển đổi rủi ro khác. Đề không yêu cầu bỏ một nền tảng.
      - D: Chép cấu hình đã qua từ nền tảng này sang nền tảng kia chính là bỏ qua khác biệt giữa hai nền tảng. Thiết lập đúng ở bên này có thể bị từ chối hoặc chạy khác ở bên kia.

      **Kiến thức liên quan.** Contract test phải chạy trên từng nền tảng vì cùng một thiết lập chạy khác nhau ở mỗi nơi. Giữ cấu hình khớp giữa các nền tảng nghĩa là biết trước những chỗ khác nhau đó.

      **Từ khoá**

      - B: gates separately on each platform
      - stem: platform-specific settings

