      - set-2
  - id: ccdv-p-1.q0034
    exams:
      CCDV-P: D6
    stem: |-
      You work as a senior software engineer at EchoPoint Media Works. The company runs a production pipeline that summarizes wire feeds, drafts program notes, and tags an archive of transcripts. Volume is high, editors sample outputs for quality, and the team measures cost and quality movements on live traffic rather than waiting for offline suites.

      EchoPoint Media Works plans to move the summarizer fleet from its current Sonnet-tier generation to the newest one next quarter. Finance asks for a spend forecast before the migration starts. The summarizer relies on cached prompt prefixes, and the newest generation tokenizes text differently.

      Which forecasting approach should you use?
    options:
      - Multiplying current token counts by the price ratio between the two generations
      - Running the forecast on the first full week of live traffic after the migration
      - Extrapolating the next quarter from the last two quarters of summarizer spend
      - Replaying sampled summarizer traffic on the new generation and measuring tokens and cache reads
    answer:
      - D
    explanation: |-
      **Dự báo chi phí khi đổi thế hệ model: chạy lại lưu lượng mẫu trên model mới và đo token thật**

      > 💡 Gặp **đổi thế hệ model, tách token khác** thì chọn **chạy lại lưu lượng mẫu trên model mới**: số token phải đo, không suy ra từ bảng giá.

      **Đề hỏi gì.** Công ty sắp chuyển cả đội tóm tắt sang thế hệ Sonnet mới nhất, và phòng tài chính cần dự báo chi phí **trước khi chuyển**. Bộ tóm tắt dựa vào **prefix được cache**, và thế hệ mới **tách token khác** thế hệ cũ. Đề hỏi nên dự báo theo cách nào.

      **Vì sao đúng (D).** Model khác thì chi phí mỗi việc khác hẳn. Thế hệ mới tách token khác nên cùng một đoạn chữ ra số token khác, và số token đọc từ cache của prefix cũng đổi theo. Chạy lại một mẫu lưu lượng thật trên thế hệ mới rồi đo token vào, token ra và token đọc cache là cách duy nhất có số thật trước khi chuyển.

      **Vì sao sai**

      - A: Nhân số token hiện tại với tỉ lệ giá ngầm cho rằng số token giữ nguyên. Đề nói rõ thế hệ mới tách token khác, nên chính số token đã đổi.
      - B: Đợi tuần đầu sau khi chuyển thì có số thật, nhưng phòng tài chính cần dự báo trước khi bắt đầu chuyển.
      - C: Ngoại suy từ hai quý trước chỉ kéo dài xu hướng của model cũ, bỏ qua cả giá mới lẫn cách tách token mới.

      **Kiến thức liên quan.** Không chỉ giá mỗi token đổi, số token cũng có thể đổi theo tokenizer, tức bộ tách chữ thành token của model. Các model từ Claude 4.7 trở đi dùng chung một tokenizer mới. Với tokenizer này, cùng một đoạn chữ cho ra nhiều token hơn các model trước đó, thường khoảng 30%, mức chênh cụ thể tuỳ nội dung. Khi dự báo cho một khối chuyển từ model cũ hơn 4.7 sang, bạn đếm lại token của prompt trên chính model mới, chứ đừng dùng số đã đo trên model cũ.

      **Từ khoá**

      - D: Replaying sampled summarizer traffic
      - stem: tokenizes text differently

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `6-1-chi-phi-quy-mo-lon#tinh-va-du-bao-chi-phi`
