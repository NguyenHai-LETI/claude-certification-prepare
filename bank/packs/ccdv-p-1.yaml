  - id: ccdv-p-1.q0053
    exams:
      CCDV-P: D8
    stem: |-
      You are a staff software engineer at Nexora Systems. The engineering organization runs a fleet of coding agents for migrations, refactors, code review, and CI incident first response. Agents work on isolated worktrees, run unattended on schedules, and operate under managed settings your team defines. Generation outpaces human review, and the verification pipeline is yours to engineer.

      Nexora Systems adds an AI reviewer for injection flaws to the fleet review pipeline. A platform engineer proposes enabling it immediately as a required merge check and argues that generation volume leaves no time for a trial period. You own the decision on how the reviewer enters the pipeline.

      What should you do next?
    options:
      - Post the reviewer findings as advisory comments and promote it to a merge check after one week without complaints
      - Have a second AI reviewer adjudicate the first reviewer findings and gate once the two models agree
      - Run the reviewer silently over pull requests that already merged and score its findings against blind human adjudication
      - Enable the reviewer as a required merge check and remove finding classes that draw complaints
    answer:
      - C
    explanation: |-
      **Đưa AI reviewer mới vào pipeline: chạy ngầm trên PR đã merge và chấm với kết luận của người trước khi cho chặn merge**

      > 💡 Gặp **AI reviewer mới mà muốn bật chặn merge ngay** thì chọn **chạy ngầm trên PR đã merge, chấm với người được làm mù**, rồi mới cho chặn.

      **Đề hỏi gì.** Nexora thêm **AI reviewer bắt lỗi injection**. Một kỹ sư muốn bật ngay làm **merge check bắt buộc**, vì cho rằng lượng code sinh ra không còn chỗ cho một đợt chạy thử. Bạn quyết định reviewer vào pipeline theo cách nào.

      **Vì sao đúng (C).** Trước khi cho reviewer chặn merge, phải đo xem nó báo đúng tới đâu. Chạy ngầm trên các PR đã merge không chặn ai và không làm chậm pipeline, nên lượng code lớn không phải lý do bỏ qua bước này. Chấm finding với kết luận của người được làm mù, tức người phân xử không thấy reviewer nói gì, cho ra con số thật về finding đúng, finding sai và lỗi bị sót. Có số đó rồi mới quyết có cho chặn merge hay không.

      **Vì sao sai**

      - A: Một tuần không ai phàn nàn chưa phải bằng chứng reviewer đúng. Lỗi bị sót không gây phàn nàn nào, và người đang quá tải review thì dễ lờ comment đi hơn là báo sai.
      - B: Hai AI reviewer đồng ý với nhau không có nghĩa là cả hai đúng, vì chúng có thể cùng sai một kiểu. Thước đo phải là kết luận của người, không phải của một model khác.
      - D: Bật chặn merge trước rồi bỏ dần loại finding bị phàn nàn là đo bằng độ phiền chứ không bằng độ đúng. Loại finding bị bỏ có thể chính là loại bắt được lỗi injection thật.

      **Kiến thức liên quan.** Chạy shadow mode là để thu dữ liệu cho bước tiếp theo, hiệu chỉnh với review của người (**calibration against human review before merge gating**). Nghĩa là trước khi giao quyền chặn merge, đội đo trên chính PR của mình xem reviewer báo đúng những lỗi mà người trong đội thật sự quan tâm tới mức nào.

      **Từ khoá**

      - C: Run the reviewer silently | blind human adjudication
      - stem: leaves no time for a trial period
      - case: the verification pipeline is yours to engineer

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `8-2-kiem-chung-va-ai-code-review#hieu-chinh-voi-review-cua-nguoi-truoc-khi-cho-chan-merge`
