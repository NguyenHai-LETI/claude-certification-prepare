  - id: ccdv-p-1.q0023
    exams:
      CCDV-P: D6
    stem: |-
      You are a senior software engineer at Horizon Crest Hospitality. The company operates a guest concierge agent across its properties in Lisbon, Osaka, and Vancouver, with property-level configuration and a shared platform team. The concierge answers property questions, coordinates requests with booking and housekeeping tools, and must stay within tight latency and cost budgets in every region.

      A guest request for an evening plan triggers three tool calls: a restaurant lookup, a spa availability check, and a weather lookup. A trace shows the integration runs the calls one after another, and each call takes one second of external wait. The tool phase contributes three seconds of a four-second response, and none of the lookups reads the output of another.

      What should you do?
    options:
      - Execute the calls concurrently and return each result in its own user message.
      - Merge the three lookups into one aggregate tool with a combined payload.
      - Add a cache breakpoint ahead of the property configuration block.
      - Execute the calls concurrently and return all three results in one user message.
    answer:
      - D
    explanation: |-
      **Tool không phụ thuộc nhau thì chạy cùng lúc, và gửi mọi tool_result về trong cùng một user message**

      > 💡 Gặp **tool không đọc kết quả của nhau mà bị chạy lần lượt** thì chọn **all three results in one user message**: chạy cùng lúc, gửi về chung một message.

      **Đề hỏi gì.** Yêu cầu lên kế hoạch buổi tối gọi ba tool: tra nhà hàng, xem lịch spa, tra thời tiết. Integration chạy **lần lượt từng cái**, mỗi cái chờ một giây, nên phần tool chiếm 3 trên 4 giây. **Không tool nào cần kết quả của tool khác.**

      **Vì sao đúng (D).** Ba tool chỉ đọc và không phụ thuộc nhau, nên code chạy chúng cùng lúc thì phần tool chỉ còn khoảng một giây. Sau đó gửi cả ba `tool_result` về trong cùng một user message, mỗi kết quả mang đúng `tool_use_id` của nó. Gửi chung như vậy là cách API yêu cầu, và cũng giữ cho Claude tiếp tục gọi tool song song ở các vòng sau.

      **Vì sao sai**

      - A: Chạy cùng lúc là đúng, nhưng gửi mỗi kết quả trong một user message riêng là sai cách. Lịch sử hội thoại kiểu đó dạy Claude rằng tool được gọi lần lượt, nên về sau nó sẽ gọi từng tool một.
      - B: Gộp ba lookup thành một tool tổng hợp nghĩa là phải viết lại tool, và ba lệnh gọi bên trong vẫn phải chạy song song mới nhanh. Vấn đề nằm ở cách harness chạy và gửi kết quả, không nằm ở số tool.
      - C: Cache breakpoint giúp phần prompt dài có chữ đầu tiên sớm hơn, nhưng ở đây ba giây là thời gian chờ tool bên ngoài, cache không rút được.

      **Kiến thức liên quan.** Code của bạn mới là bên chạy tool, và API không bắt chạy theo thứ tự nào. Tool chỉ đọc và không phụ thuộc nhau thì nên chạy cùng lúc, ví dụ bằng `asyncio.gather` hay `Promise.all`.

      **Từ khoá**

      - D: all three results in one user message
      - stem: none of the lookups reads the output of another

