  - id: ccdv-p-1.q0055
    exams:
      CCDV-P: D8
    stem: |-
      You are a staff software engineer at Nexora Systems. The engineering organization runs a fleet of coding agents for migrations, refactors, code review, and CI incident first response. Agents work on isolated worktrees, run unattended on schedules, and operate under managed settings your team defines. Generation outpaces human review, and the verification pipeline is yours to engineer.

      Finance compared the fleet cost dashboard against the monthly invoice and found the dashboard reports less than half of actual spend. The dashboard reads OpenTelemetry metrics that each agent session exports. Engineers enable telemetry by setting an environment variable in personal shell profiles. Scheduled agents launch from a runner that loads no shell profile, and three engineers who joined this quarter never set the variable.

      What should you do?
    options:
      - Scale the dashboard figures to match the invoice at the end of each month.
      - Remind engineers to set the variable in their shell profiles and track completion in a checklist.
      - Rebuild the dashboard from the scheduler job logs instead of the exported metrics.
      - Set the telemetry variables in the managed settings environment block that deploys to every machine.
    answer:
      - D
    explanation: |-
      **Telemetry thiếu vì mỗi người tự bật trong shell: đặt biến trong `env` của managed settings**

      > 💡 Gặp **telemetry bật trong shell từng người, runner không nạp profile** thì chọn **env của managed settings**.

      **Đề hỏi gì.** Dashboard chi phí chỉ thấy **chưa tới một nửa** số tiền trên hoá đơn. Telemetry được bật bằng biến môi trường **trong shell profile của từng người**, trong khi agent chạy theo lịch khởi động từ runner **không nạp shell profile**, và ba kỹ sư mới chưa bao giờ đặt biến đó.

      **Vì sao đúng (D).** Số liệu thiếu vì cách bật dựa vào từng người và từng shell, nên session nào không đi qua shell profile thì không gửi telemetry. Đặt các biến OpenTelemetry trong khối `env` của managed settings thì máy nào cũng nhận cấu hình, kể cả runner chạy agent theo lịch và máy của người mới. Nhờ vậy dashboard có đủ số liệu từ mọi session.

      **Vì sao sai**

      - A: Nhân số liệu cho khớp hoá đơn chỉ là sửa con số cuối cùng. Dashboard vẫn không biết phần tiền bị thiếu là của ai, của agent nào, nên không còn dùng để theo dõi chi phí được.
      - B: Nhắc từng người không chữa được runner chạy theo lịch, vì runner không nạp shell profile. Người mới vào sau cũng lại quên.
      - C: Log của scheduler chỉ có các job chạy theo lịch, không có session của kỹ sư, và thường không có số token hay chi phí. Dashboard vẫn thiếu.

      **Kiến thức liên quan.** Claude Code gửi telemetry (**telemetry**), tức số liệu sử dụng như token, chi phí và event, theo chuẩn OpenTelemetry tới một collector, là hệ thống công ty dựng để nhận số liệu. Các biến OpenTelemetry chỉ bật được telemetry khi đặt trong `env` của managed settings, trong user settings, hoặc trong shell của từng người.

      **Từ khoá**

      - D: managed settings environment block
      - stem: runner that loads no shell profile
      - case: operate under managed settings your team defines

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `8-4-cau-hinh-toan-to-chuc#telemetry-cho-ca-to-chuc`
