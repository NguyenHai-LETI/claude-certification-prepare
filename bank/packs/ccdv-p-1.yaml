  - id: ccdv-p-1.q0038
    exams:
      CCDV-P: D2
    stem: |-
      You work as a senior software engineer at EchoPoint Media Works. The company runs a production pipeline that summarizes wire feeds, drafts program notes, and tags an archive of transcripts. Volume is high, editors sample outputs for quality, and the team measures cost and quality movements on live traffic rather than waiting for offline suites.

      Program note drafting fails intermittently with rate limit errors that name the output token limit. Completions average 300 tokens, and hourly telemetry shows output token volume far below the limit for every hour of the day. The pipeline starts one draft for every story in a wire batch as soon as the batch arrives.

      What is the most likely cause?
    options:
      - The limiter refills capacity only at minute boundaries and rejects mid-minute traffic.
      - Cache reads on the shared drafting prefix count toward the output token limit.
      - The limiter reserves output capacity from the max_tokens value on each request.
      - The wire batch starts every draft at once and exceeds the limit within one minute.
    answer:
      - D
    explanation: |-
      **Lỗi OTPM lúc có lúc không dù tổng mỗi giờ thấp: cả batch cùng bắt đầu một lúc nên dồn trong một phút**

      > 💡 Gặp **tổng theo giờ thấp mà vẫn lỗi lúc có batch** thì chọn **cả batch bắt đầu một lúc**: số trung bình che mất đỉnh. `max_tokens` không tính vào OTPM.

      **Đề hỏi gì.** Việc soạn ghi chú chương trình **thỉnh thoảng** bị lỗi rate limit ghi rõ là **output token limit**. Mỗi bản soạn trung bình **300 token**, và telemetry **theo giờ** cho thấy lượng token output thấp xa limit ở mọi giờ. Pipeline **bắt đầu soạn cho mọi tin trong batch ngay khi batch về**. Đề hỏi nguyên nhân nhiều khả năng nhất.

      **Vì sao đúng (D).** Limit tính theo phút, và API còn có thể kiểm theo khoảng ngắn hơn, nên một đợt request dồn lại trong vài giây vẫn bị chặn dù tổng cả giờ rất thấp. Mỗi khi batch tin về, pipeline bắt đầu soạn mọi tin cùng lúc, nên token output dồn vào đúng một hai phút đó và vượt OTPM. Lỗi chỉ xảy ra lúc có batch, nên trông như lúc có lúc không, còn số trung bình theo giờ che mất đỉnh.

      **Vì sao sai**

      - A: API đếm theo token bucket: hạn mức được đổ đầy lại liên tục, không đợi tới đầu mỗi phút.
      - B: Token đọc từ cache là token input. Chúng không tính vào OTPM, và với hầu hết model cũng không tính vào ITPM.
      - C: Đây là cách đếm cũ. Hiện nay OTPM được đếm theo thời gian thực, chỉ tính số token model thật sự sinh ra, và `max_tokens` không tính vào OTPM. Con số 300 token mỗi bản dễ làm nghĩ tới chuyện giữ chỗ theo `max_tokens`, nhưng chỗ khác thường thật sự là cả batch bắt đầu cùng lúc.

      **Kiến thức liên quan.** API đếm theo kiểu **token bucket**. Hãy hình dung một cái xô được đổ đầy lại đều đặn từng chút, chứ không phải đầu mỗi phút mới đổ đầy một lần. Vì vậy, dù tổng cả phút chưa vượt, một đợt request dồn trong vài giây vẫn có thể bị 429. `max_tokens`, số token output tối đa bạn cho phép, không tính vào OTPM.

      **Từ khoá**

      - D: starts every draft at once
      - stem: starts one draft for every story in a wire batch as soon as the batch arrives

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `2-2-quy-mo-va-thong-luong#rang-buoc-nao-dang-chan-tai`
