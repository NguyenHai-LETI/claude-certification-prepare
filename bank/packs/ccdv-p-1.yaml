    exams:
      CCDV-P: D7
    stem: |-
      You are a platform engineer at Ironhaven Manufacturing. The company exposes maintenance manuals, parts inventory, and work-order tools to Claude agents through remote MCP servers used by plant engineering teams. Your team owns MCP deployment and authentication, tool catalog governance, agent identity, and the managed configuration that plant teams inherit. Changes must roll out to the fleet without breaking running integrations.

      A plant engineering team wants an agent that runs vendor diagnostic scripts and downloads public firmware notes. The workstation that hosts the agent can also reach the plant control network. You must let the agent execute scripts and fetch public web content while no executed script can reach the control network.

      Which approach should you use?
    options:
      - A network monitor that logs outbound connections and alerts the team after each run
      - A system prompt rule that lists the control network hosts as forbidden destinations
      - A review step where an engineer reads each script before the agent runs it
      - A sandboxed execution environment with filesystem limits and a network allowlist of approved hosts
    answer:
      - D
    explanation: |-
      **Cho agent chạy script và đọc web mà không chạm được mạng điều khiển: sandbox giới hạn filesystem và allowlist mạng**

      > 💡 Gặp **cho agent chạy code và đọc web nhưng không được chạm hệ thống nội bộ** thì chọn **sandboxed execution environment**: cô lập cả filesystem lẫn mạng.

      **Đề hỏi gì.** Agent cần chạy script chẩn đoán của nhà cung cấp và tải ghi chú firmware công khai, nhưng máy chạy agent **cũng tới được mạng điều khiển của nhà máy**. Yêu cầu là **không script nào chạy được tới mạng điều khiển**.

      **Vì sao đúng (D).** Yêu cầu là "không script nào tới được", tức phải chặn chắc chắn chứ không chỉ khuyên hay phát hiện sau. Sandbox chặn ở tầng hệ điều hành: script chỉ ghi được trong vùng filesystem cho phép, và mọi kết nối ra ngoài chỉ tới được các host trong allowlist, như trang ghi chú firmware. Mạng điều khiển không nằm trong allowlist nên script có bị lừa hay viết sai cũng không với tới được.

      **Vì sao sai**

      - A: Theo dõi rồi báo sau mỗi lần chạy chỉ cho biết script đã kết nối tới mạng điều khiển, lúc đó thiệt hại có thể đã xảy ra. Đề cần chặn trước.
      - B: Luật trong system prompt chỉ là lời dặn cho model, không ngăn được script tự mở kết nối. Script của nhà cung cấp cũng chẳng đọc system prompt.
      - C: Kỹ sư đọc từng script vừa chậm vừa dễ sót, nhất là script dài hay script tự tải thêm code khi chạy. Đọc kỹ cũng không tạo ra ranh giới mạng nào.

      **Kiến thức liên quan.** Sandbox (**sandboxing**) cho agent làm việc đó trong một vùng bị giới hạn. Dù định làm gì, agent cũng chỉ với tới được những thứ bên trong vùng đó.

      **Từ khoá**

      - D: sandboxed execution environment
      - stem: no executed script can reach the control network

      *Học lại (bài của khoá gốc, chưa có trong notes/):* `7-1-guardrail-luc-chay#sandbox-cho-agent-dung-tool-va-web-ma-khong-cham-production`
