    options:
      - "Clear goals, heuristics and constraints, specific enough to guide yet flexible enough to adapt"
      - "Team A's rules expanded further, so that each newly discovered case gets its own branch"
      - "Team B's prompt kept as is, with a higher effort setting so that the model fills in the gaps"
      - "Both prompts merged, so the agent receives Team A's rules together with Team B's guidance"
    answer: [A]
    explanation: "Anthropic gọi đây là \"right altitude\": vùng giữa hai lỗi phổ biến — hard-code logic phức tạp, giòn trong prompt để ép hành vi chính xác, hoặc hướng dẫn chung chung, mơ hồ không cho model tín hiệu cụ thể. System prompt nên đủ cụ thể để dẫn hành vi nhưng đủ linh hoạt để cung cấp heuristic mạnh. Mở rộng thêm nhánh làm prompt càng giòn. Tăng effort không bù được thông tin còn thiếu. Ghép hai prompt giữ nguyên cả hai lỗi và còn tạo mâu thuẫn. Nguồn: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
