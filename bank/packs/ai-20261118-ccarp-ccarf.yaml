  - id: AI-CCARP-025
    exams: { CCAR-P: D4 }
    stem: "A team can afford one of two eval plans for a contract-classification feature: 60 cases graded by senior lawyers each release, or 2,000 cases written as multiple-choice or exact-match checks that are graded automatically. Following Anthropic's eval design principles, which plan should they choose?"
    options:
      - "The 60 lawyer-graded cases, since human grading is the gold standard and outweighs any gain in volume"
      - "The 2,000 automatically graded cases, since more cases with slightly lower signal beat fewer hand-graded ones"
      - "Neither plan yet, since evals should wait until production traffic reveals the real task distribution"
      - "The 60 lawyer-graded cases, rerun on every release and then extrapolated to estimate accuracy at scale"
