  - id: AI-CCARP-014
    exams: { CCAR-P: D2 }
    stem: "A code-migration agent runs in a harness that automatically compacts context and lets the agent save progress files. Reviews show the agent often wraps up early with “remaining work left for a later session” as its context fills, even though the harness would let it continue. What is the MOST effective prompt change?"
    options:
      - "Tell the agent that context is compacted automatically, so it should save state and keep working"
      - "Ask the agent to make shorter tool calls, so that the context fills more slowly during migration"
      - "Remove the progress files from the harness, so the agent cannot see how much work is remaining"
      - "Lower the maximum output tokens, so each turn uses less space and the context window lasts longer"
    answer: [A]
    explanation: "Doc prompting best practices: các model có context awareness theo dõi phần ngân sách token còn lại. Nếu harness tự compact hoặc cho lưu context ra file (như Claude Code), hãy nói điều đó trong prompt; nếu không, Claude đôi khi tự kết thúc công việc khi gần giới hạn. Prompt mẫu của doc: context sẽ được compact tự động nên đừng dừng sớm vì lo ngân sách token; lưu tiến độ và trạng thái trước khi context làm mới. Rút ngắn tool call hay giảm max_tokens không đổi hành vi dừng sớm. Bỏ file tiến độ làm mất cơ chế nối giữa các cửa sổ context. Nguồn: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
    ref: lessons/22-thiet-ke-giai-phap.html#context-token
    status: active
    difficulty: hard
    tags: [context-awareness, long-running]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: AI-CCARP-015
    exams: { CCAR-P: D2 }
    stem: "After moving a coding assistant to a newer Claude model, latency rose sharply. Traces show the model now spawns subagents even for single-file edits and one-line grep lookups, although parallel subagents still help on large multi-repository audits. What is the BEST first change?"
    options:
      - "Remove the subagent tool entirely, so that every task runs in the main conversation"
      - "Add prompt guidance on when subagents are warranted and when to work directly instead"
      - "Roll back to the previous model, since newer models cannot be steered on delegation"
      - "Raise the effort level, so the model reasons longer before it decides to delegate"
    answer: [B]
    explanation: "Doc prompting best practices: model mới điều phối subagent một cách tự nhiên và có thể dùng quá mức, ví dụ spawn subagent để khám phá code khi một lệnh grep trực tiếp là đủ. Cách xử lý được khuyên là thêm hướng dẫn rõ: dùng subagent khi việc chạy song song được, cần context tách biệt hoặc là luồng độc lập không chia sẻ trạng thái; với việc đơn giản, tuần tự, sửa một file thì làm trực tiếp. Bỏ hẳn tool mất lợi ích ở các đợt audit lớn. Quay về model cũ là bỏ qua cách điều chỉnh bằng prompt. Tăng effort làm chậm thêm. Nguồn: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
    ref: lessons/22-thiet-ke-giai-phap.html#multi-agent
    status: active
    difficulty: medium
    tags: [subagents, model-migration]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: AI-CCARP-016
    exams: { CCAR-P: D3 }
    stem: "A team calls the Messages API and wants Claude to use an internal MCP server that runs locally over stdio and exposes tools, resources and prompts. They hoped the API's MCP connector would let them skip building an MCP client. What should the architect advise?"
    options:
      - "Run their own MCP client with the SDK helpers, since the connector cannot reach a local stdio server"
      - "Use the MCP connector as planned, since it proxies stdio servers and exposes all three MCP primitives"
      - "Use the MCP connector for tools and resources, and paste the server's prompts into the system prompt"
      - "Convert the server into a Claude Code plugin, since the Messages API cannot use MCP capabilities"
    answer: [A]
    explanation: "MCP connector cho phép gọi MCP server **từ xa** trực tiếp trong Messages API mà không cần tự viết MCP client: server phải được công khai qua HTTP (Streamable HTTP hoặc SSE); server stdio cục bộ không kết nối trực tiếp được. Đây là lý do chính, ổn định theo bản chất của connector. Ngoài ra, ở bản beta hiện tại connector chỉ hỗ trợ tool calls trong các tính năng của đặc tả MCP (giới hạn này có thể thay đổi). Khi cần server cục bộ, prompts, resources hoặc kiểm soát kết nối, doc khuyên tự quản MCP client và dùng helper của SDK để chuyển kiểu MCP sang kiểu Claude API. Connector không proxy stdio, nên dùng nó \"như dự định\" hay chỉ cho tools và resources đều không chạy với server này. Plugin Claude Code không phục vụ ứng dụng gọi API, và Messages API vẫn dùng được MCP. Nguồn: https://platform.claude.com/docs/en/agents-and-tools/mcp-connector"
