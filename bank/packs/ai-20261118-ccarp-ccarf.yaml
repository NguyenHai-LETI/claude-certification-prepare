    exams: { CCAR-P: D4, CCDV-F: D4 }
    stem: "An eval for a travel-booking agent checks that it calls `search_flights`, then `check_seat_map`, then `book_flight`, in exactly that order. Transcripts show the agent sometimes books the correct seat through a different valid sequence, and those runs are marked as failures. What should the team change?"
