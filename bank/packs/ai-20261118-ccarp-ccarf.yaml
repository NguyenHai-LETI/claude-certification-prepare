  - id: AI-CCARP-017
    exams: { CCAR-P: D3 }
    stem: "A company runs a stateful MCP server over Streamable HTTP on several nodes. After the initial OAuth login, the server treats any request carrying a valid session ID as authenticated, and asynchronous events are queued by session ID alone. A security review flags this. Which change follows the MCP security best practices?"
    options:
      - "Keep session-based authentication, but issue sequential session IDs so they are easier to audit"
      - "Verify authorization on every inbound request, and key queued session data to the authenticated user"
      - "Keep session-based authentication, but extend session lifetimes so users re-authenticate less often"
      - "Place session IDs in the tool descriptions, so that only the model knows which session is in use"
    answer: [B]
    explanation: "MCP security best practices (session hijacking): kẻ tấn công đoán hoặc lấy được session ID có thể mạo danh client hoặc chèn sự kiện độc vào hàng đợi chung. Server có authorization PHẢI xác minh mọi request đến và KHÔNG được dùng session để xác thực; session ID phải ngẫu nhiên an toàn, không đoán được; NÊN gắn session với thông tin riêng của người dùng, ví dụ khoá <user_id>:<session_id> với user ID lấy từ token chứ không do client cung cấp. ID tuần tự dễ đoán; kéo dài phiên mở rộng cửa sổ tấn công; đưa ID vào mô tả tool vừa vô nghĩa vừa làm lộ. Nguồn: https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices"
    ref: lessons/23-tich-hop.html#xac-thuc
    status: active
    difficulty: hard
    tags: [mcp-security, sessions]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: AI-CCARP-018
    exams: { CCAR-P: D3 }
    stem: "An MCP server for a document platform publishes every scope it supports (`files:*`, `db:*`, `admin:*`), and clients request all of them at first connect so users are never prompted again. Most sessions only search and read documents. What does the MCP security guidance recommend?"
    options:
      - "Keep requesting every scope, since one broad consent gives operators the clearest audit trail"
      - "Replace the separate scopes with one wildcard scope, so that consent screens become shorter"
      - "Keep requesting every scope, but rotate access tokens hourly so a stolen one expires quickly"
      - "Start with a minimal read-oriented scope set, and step up through targeted scope challenges"
    answer: [D]
    explanation: "MCP security best practices (scope minimization): token mang scope rộng nếu bị lộ cho phép truy cập lan rộng, khó thu hồi và làm audit log mất ý nghĩa. Khuyến nghị mô hình quyền tối thiểu, tăng dần: bộ scope ban đầu chỉ gồm thao tác khám phá, đọc rủi ro thấp; nâng quyền bằng thử thách WWW-Authenticate scope=\"…\" khi thao tác đặc quyền được dùng lần đầu. Lỗi thường gặp được nêu tên: công bố mọi scope trong scopes_supported, dùng scope wildcard hoặc omnibus, gom quyền trước để khỏi hỏi lại. Xoay vòng token không thu hẹp phạm vi thiệt hại khi token còn hiệu lực. Nguồn: https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices"
    ref: lessons/23-tich-hop.html#xac-thuc
    status: active
    difficulty: hard
    tags: [mcp-security, oauth-scopes]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: AI-CCARP-019
    exams: { CCAR-P: D3 }
    stem: "A company is building an internal AI desktop client that lets employees add local MCP servers through one-click install links. Security wants to reduce the risk that a malicious link runs a harmful startup command. Which TWO measures do the MCP security best practices call for? (Choose TWO.)"
    options:
      - "Show the exact command, unabridged, and require explicit user approval before running it"
      - "Run servers silently after install, so users are not distracted by technical prompts"
      - "Abbreviate long commands in the consent dialog, so users can read the main part quickly"
      - "Use an HTTP transport without any token for local servers, so they are easier to reach"
      - "Launch local servers in a sandbox with minimal default file system and network access"
    answer: [A, E]
    explanation: "MCP security best practices (local MCP server compromise): client hỗ trợ cấu hình một chạm PHẢI có cơ chế đồng ý trước khi chạy lệnh — hiển thị đúng lệnh sẽ chạy, đầy đủ không cắt bớt, nêu rõ đây là thao tác có thể nguy hiểm và yêu cầu người dùng chấp thuận; NÊN chạy server trong sandbox với quyền tối thiểu (hạn chế file system, mạng) và cho người dùng cấp thêm quyền khi cần. Chạy âm thầm hay rút gọn lệnh giúp kẻ tấn công che giấu lệnh độc. Server cục bộ nên dùng stdio, hoặc nếu dùng HTTP thì phải yêu cầu token hay IPC có giới hạn. Nguồn: https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices"
    ref: lessons/23-tich-hop.html#xac-thuc
    status: active
    difficulty: medium
