  - id: AI-CCARP-020
    exams: { CCAR-P: D3 }
    stem: "A SaaS company runs an MCP client on its own servers so customers can connect any remote MCP server by URL. During OAuth metadata discovery, a malicious server returns a `resource_metadata` URL pointing at `http://169.254.169.254/`. Which mitigation do the MCP security best practices recommend for this client?"
    options:
      - "Follow every discovery URL as given, but strip error details from the replies sent back to it"
      - "Require HTTPS, block private and link-local ranges, and route discovery through an egress proxy"
      - "Allow the URL only when the MCP server also presents a valid OAuth access token of its own"
      - "Hand-write a regex that rejects any URL containing the literal text 169.254 before fetching"
    answer: [B]
    explanation: "Đây là SSRF: khi khám phá OAuth, client lấy URL do server cung cấp (resource_metadata, authorization_servers, token_endpoint…), và server độc có thể trỏ tới IP nội bộ, endpoint metadata của cloud (169.254.169.254) hay localhost để đánh cắp credential. Khuyến nghị: bắt buộc HTTPS (trừ loopback khi dev), chặn dải private, loopback, link-local, áp kiểm tra tương tự cho đích redirect, dùng egress proxy, lưu ý DNS rebinding. Doc cảnh báo tránh tự viết kiểm tra IP vì kẻ tấn công lách bằng mã hoá octal, hex hay IPv6. Bỏ chi tiết lỗi chỉ giảm rò rỉ một phần; token của server không chứng minh URL an toàn. Nguồn: https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices"
    ref: lessons/23-tich-hop.html#xac-thuc
    status: active
    difficulty: hard
    tags: [mcp-security, ssrf]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: AI-CCARP-021
    exams: { CCAR-P: D3, CCAR-F: D2 }
    stem: "An enterprise assistant connects to MCP servers for Jira, Confluence and Slack. Each of the three servers exposes a tool named `search`, and the assistant often queries the wrong system. Following Anthropic's guidance on writing tools for agents, which change helps MOST?"
    options:
      - "Merge the three tools into one generic `search` tool that silently queries every connected system"
      - "Namespace the tools by service, such as `jira_search` and `confluence_search`, with clear descriptions"
      - "Reorder the tool list so that the most frequently used `search` tool always appears first"
      - "Remove the tool descriptions, so the assistant decides from the tool names and its own knowledge"
    answer: [B]
    explanation: "Writing tools for agents: khi agent có nhiều tool từ nhiều nguồn, namespacing — gom tool liên quan dưới tiền tố chung theo dịch vụ hoặc tài nguyên — giúp phân định ranh giới và giảm chọn nhầm; mô tả tool nên rõ như giải thích cho một nhân viên mới. Gộp thành một search truy vấn mọi hệ thống tốn token và trả kết quả lẫn lộn. Thứ tự tool không giải quyết sự mơ hồ về tên. Bỏ mô tả làm mất tín hiệu quan trọng nhất để chọn đúng tool. Nguồn: https://www.anthropic.com/engineering/writing-tools-for-agents"
    ref: lessons/04-tool-mcp.html#mo-ta-tool
    status: active
    difficulty: easy
    tags: [tool-design, namespacing]
    created: 2026-11-18
    reviewed: 2026-11-18
  - id: AI-CCARP-022
    exams: { CCAR-P: D3, CCAR-F: D2 }
    stem: "A support agent builds a customer view by calling `get_customer`, then `list_orders`, then `list_tickets`, then `get_notes`, passing IDs between the calls. The chain is slow, uses many tokens, and the agent often drops a step. What tool redesign does Anthropic's tool-writing guidance suggest?"
    options:
      - "Four additional granular tools, so that each call returns a smaller and simpler slice of data"
      - "A system prompt rule listing the four calls in order, repeated again at the end of the prompt"
      - "A raw SQL tool, so that the agent can write one query that joins every customer table at once"
      - "One `get_customer_context` tool that compiles the relevant recent information in a single call"
    answer: [D]
    explanation: "Writing tools for agents: tool nên gom các thao tác thường đi cùng nhau thành một tool có ý nghĩa ở mức công việc, ví dụ get_customer_context tổng hợp mọi thông tin gần đây và liên quan của khách thay vì nhiều lời gọi riêng lẻ; làm vậy giảm số bước, token và nguy cơ bỏ sót. Chia nhỏ thêm làm chuỗi dài hơn. Luật trong prompt không bảo đảm thứ tự. SQL thô cấp quyền quá rộng và đẩy gánh nặng hiểu schema sang agent. Nguồn: https://www.anthropic.com/engineering/writing-tools-for-agents"
    ref: lessons/04-tool-mcp.html#phan-bo-tool
    status: active
    difficulty: medium
    tags: [tool-design, consolidation]
