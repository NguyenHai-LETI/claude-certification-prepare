      - "It can add parallelism, but it brings harder result coordination, state consistency and error propagation"
      - "It is not possible, because the Claude API cannot serve several subagent requests at the same time"
      - "It mainly lowers token usage, because asynchronous subagents read less context than synchronous ones"
    answer: [B]
    explanation: "Anthropic mô tả: lead agent chạy subagent đồng bộ giúp điều phối đơn giản nhưng tạo nút thắt — lead không lái được subagent, subagent không phối hợp được, và cả hệ thống có thể bị chặn khi chờ một subagent. Thực thi bất đồng bộ cho thêm song song nhưng thêm thách thức về điều phối kết quả, nhất quán trạng thái và lan truyền lỗi giữa các subagent, nên đây là đánh đổi phải cân nhắc. Subagent có context riêng chứ không dùng chung; API phục vụ nhiều request song song bình thường; bất đồng bộ không phải kỹ thuật giảm token. Nguồn: https://www.anthropic.com/engineering/multi-agent-research-system"
