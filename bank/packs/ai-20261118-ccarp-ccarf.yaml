    reviewed: 2026-11-18
  - id: AI-CCARP-023
    exams: { CCAR-P: D3 }
    stem: "A team is building an internal agent that answers questions about a two-million-line monorepo that changes many times a day. One architect wants to start with an embedding index; another wants the agent to search with grep and file tools. Following Anthropic's Agent SDK guidance, what should they do FIRST?"
    options:
      - "Start with agentic search over the files, and add semantic search only if speed demands it"
      - "Start with an embedding index, since semantic search is more accurate and easier to maintain"
      - "Start with both at once, since agentic search alone cannot handle a repository of this size"
      - "Start with an embedding index, then remove file tools so the agent cannot bypass the index"
    answer: [A]
    explanation: "Bài về Claude Agent SDK: semantic search thường nhanh hơn agentic search nhưng kém chính xác hơn, khó bảo trì hơn và kém minh bạch hơn; khuyên bắt đầu bằng agentic search (grep, tool đọc file) và chỉ thêm semantic search khi cần tốc độ hoặc độ đa dạng truy vấn. Repo thay đổi liên tục càng làm index khó giữ đồng bộ. Dựng cả hai ngay từ đầu là phức tạp chưa cần thiết. Bỏ tool file làm mất khả năng đọc mã nguồn chính xác. Nguồn: https://claude.com/blog/building-agents-with-the-claude-agent-sdk"
