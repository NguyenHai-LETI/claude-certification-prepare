    explanation: "Doc prompting best practices (long context): với input lớn (20k+ token), đặt tài liệu dài gần đầu prompt, phía trên câu hỏi, hướng dẫn và ví dụ; đặt câu hỏi ở cuối có thể cải thiện chất lượng tới khoảng 30% trong thử nghiệm, nhất là với nhiều tài liệu phức tạp. Mỗi tài liệu nên bọc trong <document> với <source> và <document_content>. Lặp câu hỏi trước từng hợp đồng gây nhiễu. Tóm tắt trước làm mất chi tiết điều khoản. Tách thành nhiều request phá vỡ suy luận chéo giữa các hợp đồng mà đề bài cần. Nguồn: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
