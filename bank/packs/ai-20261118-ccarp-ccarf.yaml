  - id: AI-CCARP-027
    exams: { CCAR-P: D4 }
    stem: "A team adds web search to its research assistant and builds an eval in which every task requires searching. Scores rise, but after launch the assistant searches even for trivial questions it could answer directly, which adds latency. What was the main flaw in the eval design?"
    options:
      - "It used too many tasks, which encouraged the agent to rely on search more than necessary"
      - "It used code-based graders, which cannot detect whether a search was needed for a task"
      - "It tested only cases where the behavior should occur, not cases where it should not occur"
      - "It was run before launch, when real user questions were not yet available for testing"
    answer: [C]
